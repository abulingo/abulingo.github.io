<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abulingo - Aprende Inglés</title>

  <!-- Librerías -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Work+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icono.png" type="image/x-icon">

  <style>
    .pt-20 { padding-top: 5rem !important; }
    body { background-color: #f0f4f8; font-family: 'Work Sans', sans-serif; overflow-x: hidden; }
    .font-heading { font-family: 'Space Grotesk', sans-serif; }

    /* --- Diseño "Juicy" --- */
    .card-3d {
      background: white;
      border-radius: 24px;
      box-shadow: 0 10px 0 #cbd5e1, 0 10px 20px rgba(0,0,0,0.1);
      transition: transform 0.2s, box-shadow 0.2s;
      border: 2px solid #e2e8f0;
      position: relative;
      top: 0;
    }
    .btn-juice { transition: all 0.1s; border-bottom: 6px solid rgba(0,0,0,0.2); transform: translateY(0); }
    .btn-juice:active { transform: translateY(6px); border-bottom-width: 0; box-shadow: inset 0 6px 10px rgba(0,0,0,0.2); }

    .progress-track { background: #e2e8f0; height: 10px; border-radius: 99px; overflow: hidden; margin-top: 2px; }
    .progress-fill { background: linear-gradient(90deg, #FF7A00, #ffaa00); height: 100%; width: 0%; transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

    @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .animate-pop { animation: popIn 0.4s ease-out forwards; }

    @keyframes floatPoints { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-80px) scale(1.5); } }
    .floating-points { position: absolute; color: #fbbf24; font-weight: 900; font-size: 2.5rem; z-index: 100; animation: floatPoints 1s ease-out forwards; pointer-events: none; text-shadow: 0 4px 0 rgba(0,0,0,0.1); }

    .wrong-shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-8px, 0, 0); } 40%, 60% { transform: translate3d(8px, 0, 0); } }

    /* Modal genérico */
    .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.55); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 200; }

    /* Toast (avisos rápidos de recompensa) */
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
      background: #1e293b; color: #fff; font-weight: 700; padding: 10px 18px; border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25); z-index: 300; opacity: 0;
      transition: opacity .25s, transform .25s; pointer-events: none; max-width: 90vw; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Barra de herramientas superior */
    .tool-btn { transition: transform 0.15s; min-width: 44px; }
    .tool-btn:active { transform: scale(0.90); }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- BARRA SUPERIOR: logo · herramientas · club · perfil -->
  <header id="top-bar" class="fixed top-0 left-0 w-full bg-white/95 backdrop-blur border-b border-slate-200 z-50">
    <div class="max-w-3xl mx-auto flex items-center gap-1 px-3 h-14">
      <!-- Logo -->
      <a href="abulingo.html" class="font-heading font-bold text-lg sm:text-2xl shrink-0 mr-1 leading-none">Abulingo<span style="color:#FF7A00;">.</span></a>

      <!-- Herramientas -->
      <nav class="flex-1 flex items-center justify-around gap-0.5">
        <button data-tool="gramatica" class="tool-btn flex flex-col items-center justify-center px-2 py-1 rounded-lg text-slate-500 hover:bg-slate-100">

        </button>
        <button data-tool="club" class="tool-btn flex flex-col items-center justify-center px-2 py-1 rounded-lg text-slate-500 hover:bg-slate-100">
          <i class="fas fa-users text-base"></i><span class="hidden md:block text-[10px] font-bold leading-tight mt-0.5">Club</span>
        </button>
        <button data-tool="traductor" class="tool-btn flex flex-col items-center justify-center px-2 py-1 rounded-lg text-slate-500 hover:bg-slate-100">

        </button>
        <button data-tool="ia" class="tool-btn flex flex-col items-center justify-center px-2 py-1 rounded-lg text-white bg-gradient-to-br from-[#FF7A00] to-orange-600 shadow">

      <!-- Perfil -->
      <div class="relative shrink-0">
        <button id="profile-menu-button" class="block rounded-full ring-2 ring-transparent hover:ring-[#FF7A00] transition">
          <img id="user-avatar" src="icono.png" alt="Perfil" class="w-9 h-9 rounded-full object-cover bg-slate-100">
        </button>
        <div id="profile-menu-dropdown" class="hidden absolute right-0 mt-2 w-64 bg-white rounded-xl shadow-xl border border-slate-200 z-50 overflow-hidden">
          <div class="p-4 border-b">
            <h3 id="user-name-dropdown" class="font-bold text-slate-800">Cargando...</h3>
            <p id="user-email-dropdown" class="text-sm text-slate-500 truncate">...</p>
          </div>
          <div class="py-2 max-h-80 overflow-y-auto">
            <div class="flex items-center px-4 py-2 text-slate-700"><i class="fas fa-star w-6 text-yellow-500"></i><span><span id="user-points" class="font-bold">0</span> Puntos</span></div>
            <div class="flex items-center px-4 py-2 text-slate-700"><i class="fas fa-coins w-6 text-yellow-600"></i><span><span id="user-lingots" class="font-bold">0</span> Lingots</span></div>
            <a href="#" class="flex items-center px-4 py-2 text-slate-700 hover:bg-slate-100"><i class="fas fa-globe w-6 text-slate-500"></i><span>Ranking Global</span></a>
            <a href="#" class="flex items-center px-4 py-2 text-slate-700 hover:bg-slate-100"><i class="fas fa-people-group w-6 text-slate-500"></i><span>Ranking Equipo</span></a>
            <a href="#" class="flex items-center px-4 py-2 text-slate-700 hover:bg-slate-100"><i class="fas fa-signal w-6 text-slate-500"></i><span>Nivel</span></a>
            <a href="#" class="flex items-center px-4 py-2 text-slate-700 hover:bg-slate-100"><i class="fas fa-chart-line w-6 text-slate-500"></i><span>Progreso nivel</span></a>
            <a href="#" class="flex items-center px-4 py-2 text-slate-700 hover:bg-slate-100"><i class="fas fa-layer-group w-6 text-slate-500"></i><span>Mazo</span></a>
            <a href="soporte.html" class="flex items-center px-4 py-2 text-slate-700 hover:bg-slate-100"><i class="fas fa-headset w-6 text-slate-500"></i><span>Soporte</span></a>
            <a href="#" class="flex items-center px-4 py-2 text-slate-700 hover:bg-slate-100"><i class="fas fa-key w-6 text-slate-500"></i><span>Cambiar Contraseña</span></a>
          </div>
          <div class="py-2 border-t"><button id="logout-btn" class="w-full text-left flex items-center px-4 py-2 text-red-600 hover:bg-red-50"><i class="fas fa-sign-out-alt w-6"></i><span>Cerrar Sesión</span></button></div>
        </div>
      </div>
    </div>
  </header>

  <!-- HUD (compacto) -->
  <div class="w-full max-w-2xl mx-auto px-3 pt-16 pb-2 flex items-center justify-between gap-2">
    <div class="flex items-center gap-1.5 bg-white px-3 py-1.5 rounded-xl shadow-sm border border-slate-200">
      <i class="fas fa-star text-yellow-400 text-base"></i>
      <span id="user-points-display" class="font-black text-slate-700 text-base">0</span>
    </div>

    <div class="flex items-center gap-1.5 bg-white px-3 py-1.5 rounded-xl shadow-sm border border-slate-200" title="Días seguidos aprendiendo">
      <i class="fas fa-fire text-orange-500 text-base"></i>
      <span id="streak-days" class="font-black text-slate-700 text-base">0</span>
    </div>

    <button id="nivel-btn" class="flex items-center gap-1.5 bg-white px-3 py-1.5 rounded-xl shadow-sm border border-slate-200 hover:border-[#FF7A00] transition">
      <span class="text-[10px] font-bold text-slate-400 uppercase">Nivel</span>
      <span id="nivel-label" class="font-black text-[#FF7A00] text-sm">A1</span>
      <i class="fas fa-chevron-down text-slate-400 text-[10px]"></i>
    </button>

    <div class="flex-1 min-w-[80px]">
      <div class="flex justify-between text-[10px] font-bold text-slate-400 mb-0.5">
        <span>PROGRESO</span>
        <span id="progress-text">0%</span>
      </div>
      <div class="progress-track"><div id="main-progress" class="progress-fill"></div></div>
    </div>
  </div>

  <!-- Efectos de Sonido -->
  <audio id="snd-correct" src="https://assets.mixkit.co/sfx/preview/mixkit-unlock-game-notification-253.mp3"></audio>
  <audio id="snd-wrong" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-940.mp3"></audio>
  <audio id="snd-complete" src="https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3"></audio>

  <!-- Contenedor Principal -->
  <main id="app-container" class="w-full max-w-lg mx-auto px-4 flex-1 flex flex-col justify-start pb-8">
    <div class="text-center animate-pulse mt-10">
      <h1 class="text-3xl font-heading font-bold text-slate-400">Cargando experiencia...</h1>
      <i class="fas fa-circle-notch fa-spin text-4xl text-[#FF7A00] mt-4"></i>
    </div>
  </main>

  <!-- Raíz de modales -->
  <div id="modal-root"></div>

<script type="module">
  /* ============================================================
     1. CONFIGURACIÓN Y ESTADO
  ============================================================ */
  const SUPABASE_URL = 'https://eylwewhqeaaqkgcxhgyv.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5bHdld2hxZWFhcWtnY3hoZ3l2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMzAxODgsImV4cCI6MjA5OTkwNjE4OH0.Ji8huj-ny2VcMT5UQSjOuwUKz4k23quNS0fLk-gZr7A';

  // Enlace para la conversión a Pro (mismo que usa la landing)
  const PRO_UPGRADE_URL = 'https://wa.me/573163748711';

  // Algoritmo de memorización espaciada (tipo SM-2 simplificado)
  const SRS_INTERVALS_DAYS = [0.007, 1, 2, 4, 8, 15, 30, 60]; // días por nivel de SRS
  const EASE_DEFAULT = 2.5, EASE_MIN = 1.3, EASE_MAX = 3.0;
  const GRADUATED_LEVEL = SRS_INTERVALS_DAYS.length - 1; // al llegar aquí la palabra se considera dominada
  const SRS_SESSION_MAX = 30;   // máximo de palabras por sesión de "¡Toca repasar!"
  const DAILY_NEW_LIMIT = 50;   // máximo de palabras NUEVAS por día (evita saturar el cerebro)
  const DAILY_GOAL_POINTS = 60; // meta diaria de puntos → recompensa (1 lingot)
  const CEFR_ORDER = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
  const NIVELES_FIJOS = ['A1', 'A2', 'B1', 'B2']; // siempre visibles en el selector

  const ENCOURAGEMENTS = [
    { icon: '🚀', title: '¡Vas muy bien!', msg: 'Tu memoria se está fortaleciendo. Sigue así.' },
    { icon: '🔥', title: '¡Racha encendida!', msg: 'Cada acierto fija mejor las palabras en tu mente.' },
    { icon: '💪', title: '¡Imparable!', msg: 'Estás aprendiendo de forma efectiva. ¡No pares!' },
    { icon: '🌟', title: '¡Excelente trabajo!', msg: 'Vas por muy buen camino, sigue sumando.' }
  ];

  const { createClient } = supabase;
  const dbClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let userProfile = null;
  let flujo = null; // atajo a userProfile.flujo

  let sessionStreak = 0;      // racha de aciertos de la sesión (influye en SRS y puntos)
  let sessionCorrect = 0;     // aciertos totales de la sesión (para mensajes de ánimo)
  let lastMilestone = 0;

  // Caché de palabras del grupo actual
  let groupCache = { key: null, list: [], map: {} };
  // Sesión de repaso SRS transitoria
  let srsSession = null;
  // Sesión de repaso inicial (flashcards)
  let reviewList = [];

  const appContainer = document.getElementById('app-container');
  const toolsBar = document.getElementById('top-bar');

  /* ============================================================
     2. UTILIDADES GENERALES
  ============================================================ */
  const norm = (s) => (s || '').toString().trim().toLowerCase().replace(/[.,!?;:'"]/g, '');
  const todayStr = () => new Date().toISOString().slice(0, 10);
  const escapeHTML = (s) => (s || '').toString()
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  // Estado diario (límite de palabras nuevas + meta de puntos). Se reinicia cada día.
  function ensureDaily() {
    if (!flujo.daily || flujo.daily.date !== todayStr()) {
      flujo.daily = { date: todayStr(), newWords: 0, reviewed: 0, points: 0, goalShown: false };
    }
    if (!flujo.racha) flujo.racha = { days: 0, last: null, best: 0 };
  }

  // Racha de días consecutivos: se enciende con la primera actividad del día.
  function touchStreak() {
    ensureDaily();
    const hoy = todayStr();
    if (flujo.racha.last === hoy) return;
    const ayer = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    flujo.racha.days = (flujo.racha.last === ayer) ? (flujo.racha.days || 0) + 1 : 1;
    flujo.racha.last = hoy;
    flujo.racha.best = Math.max(flujo.racha.best || 0, flujo.racha.days);
    updateStreakUI();
    if (flujo.racha.days > 1) showToast(`🔥 ¡Racha de ${flujo.racha.days} días! No la rompas.`);
  }
  function updateStreakUI() {
    const el = document.getElementById('streak-days');
    if (el && flujo && flujo.racha) el.textContent = flujo.racha.days || 0;
  }

  let toastTimer = null;
  function showToast(msg, ms = 2600) {
    let t = document.getElementById('app-toast');
    if (!t) { t = document.createElement('div'); t.id = 'app-toast'; t.className = 'toast'; document.body.appendChild(t); }
    t.innerHTML = msg;
    requestAnimationFrame(() => t.classList.add('show'));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms);
  }

  function sortNiveles(arr) {
    return [...arr].sort((a, b) => {
      const ia = CEFR_ORDER.indexOf(a), ib = CEFR_ORDER.indexOf(b);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib) || String(a).localeCompare(String(b));
    });
  }
  function sortGroups(arr) {
    return [...arr].sort((a, b) => {
      const na = parseInt(String(a).replace(/\D/g, '')), nb = parseInt(String(b).replace(/\D/g, ''));
      if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
      return String(a).localeCompare(String(b));
    });
  }

  function playSound(type) {
    const id = type === 'correct' ? 'snd-correct' : (type === 'wrong' ? 'snd-wrong' : 'snd-complete');
    const el = document.getElementById(id);
    if (el) { el.currentTime = 0; el.play().catch(() => {}); }
  }

  // Reproduce el audio de la palabra; si no hay, usa síntesis de voz.
  window.playWordAudio = (word) => {
    if (word && word.audio) { new Audio(word.audio).play().catch(() => speak(word.ingles)); }
    else if (word) { speak(word.ingles); }
  };
  window.playAudioUrl = (url) => { if (url) new Audio(url).play().catch(() => {}); };

  // Síntesis de voz (Text-to-Speech) en inglés
  let ttsVoices = [];
  function loadVoices() { ttsVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
  if (window.speechSynthesis) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
  function pickEnglishVoice() {
    if (!ttsVoices.length) loadVoices();
    return ttsVoices.find(v => /en[-_]US/i.test(v.lang)) || ttsVoices.find(v => /^en/i.test(v.lang)) || null;
  }
  function speak(text, onend) {
    if (!window.speechSynthesis) { if (onend) onend(); return; }
    const u = new SpeechSynthesisUtterance(text);
    const v = pickEnglishVoice();
    if (v) u.voice = v;
    u.lang = 'en-US'; u.rate = 0.95;
    if (onend) u.onend = onend;
    window.speechSynthesis.speak(u);
  }
  function stopSpeaking() { if (window.speechSynthesis) window.speechSynthesis.cancel(); }

  function triggerConfetti() {
    if (window.confetti) confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#FF7A00', '#3b82f6', '#fbbf24'] });
  }
  function floatPoints(points) {
    const float = document.createElement('div');
    float.textContent = sessionStreak >= 3 ? `+${points} 🔥x${sessionStreak}` : `+${points}`;
    float.className = 'floating-points';
    float.style.left = '50%'; float.style.top = '25%';
    document.body.appendChild(float);
    setTimeout(() => float.remove(), 1000);
  }

  function updateProgressBar(pct) {
    document.getElementById('main-progress').style.width = `${Math.max(0, Math.min(100, pct))}%`;
    document.getElementById('progress-text').textContent = `${Math.round(Math.max(0, Math.min(100, pct)))}%`;
  }

  /* ============================================================
     3. MODALES
  ============================================================ */
  const modalRoot = document.getElementById('modal-root');

  function closeModal() { modalRoot.innerHTML = ''; stopSpeaking(); }

  // actions: [{ label, onClick, style }]
  function showModal({ icon, title, body, actions = [], dismissable = true, size = 'md' }) {
    const maxW = size === 'lg' ? 'max-w-lg' : 'max-w-sm';
    const actionsHTML = actions.map((a, i) =>
      `<button data-idx="${i}" class="modal-action w-full btn-juice ${a.style || 'bg-[#FF7A00] text-white'} font-bold py-3 rounded-xl text-lg">${a.label}</button>`
    ).join('');

    modalRoot.innerHTML = `
      <div class="modal-overlay">
        <div class="card-3d ${maxW} w-full p-7 text-center animate-pop relative">
          ${dismissable ? '<button id="modal-close" class="absolute top-3 right-4 text-slate-300 hover:text-slate-500 text-2xl">&times;</button>' : ''}
          ${icon ? `<div class="text-6xl mb-3">${icon}</div>` : ''}
          ${title ? `<h2 class="text-2xl font-heading font-bold text-slate-800 mb-2">${title}</h2>` : ''}
          <div class="text-slate-500 mb-6">${body || ''}</div>
          <div class="space-y-3">${actionsHTML}</div>
        </div>
      </div>`;

    if (dismissable) {
      document.getElementById('modal-close').onclick = closeModal;
      modalRoot.querySelector('.modal-overlay').addEventListener('click', (e) => {
        if (e.target.classList.contains('modal-overlay')) closeModal();
      });
    }
    actions.forEach((a, i) => {
      const btn = modalRoot.querySelector(`.modal-action[data-idx="${i}"]`);
      if (btn) btn.onclick = () => { if (a.onClick) a.onClick(); };
    });
  }

  function showEncouragement(next) {
    const e = ENCOURAGEMENTS[Math.floor(Math.random() * ENCOURAGEMENTS.length)];
    playSound('complete'); triggerConfetti();
    showModal({
      icon: e.icon, title: e.title, body: e.msg, dismissable: false,
      actions: [{ label: '¡Seguir! 💥', onClick: () => { closeModal(); next(); } }]
    });
  }

  function showProModal() {
    showModal({
      icon: '🔒',
      title: 'Función Pro',
      body: 'Este espacio está reservado para los usuarios <b>Pro</b>. Mejora tu plan para desbloquear gramática guiada, análisis de pronunciación y traductor inteligente.',
      actions: [
        { label: 'Ver planes Pro ✨', onClick: () => window.open(PRO_UPGRADE_URL, '_blank') },
        { label: 'Ahora no', style: 'bg-slate-100 text-slate-500', onClick: closeModal }
      ]
    });
  }

  /* ============================================================
     4. PERSISTENCIA (flujo + puntos + SRS)
  ============================================================ */
  async function updateUserFlow() {
    userProfile.flujo = flujo;
    const { error } = await dbClient.from('profiles').update({ flujo }).eq('id', currentUser.id);
    if (error) console.error('Error guardando flujo:', error.message);
  }

  async function addPoints(points) {
    if (!points) return;
    const newPts = (userProfile.points || 0) + points;
    userProfile.points = newPts;
    document.getElementById('user-points-display').textContent = newPts;
    const dd = document.getElementById('user-points'); if (dd) dd.textContent = newPts;
    floatPoints(points);

    // Meta diaria: al alcanzarla se gana 1 lingot (recompensa fija diaria).
    ensureDaily();
    flujo.daily.points = (flujo.daily.points || 0) + points;
    if (!flujo.daily.goalShown && flujo.daily.points >= DAILY_GOAL_POINTS) {
      flujo.daily.goalShown = true;
      const lingots = (parseFloat(userProfile.lingots) || 0) + 1;
      userProfile.lingots = lingots;
      const dl = document.getElementById('user-lingots'); if (dl) dl.textContent = lingots;
      dbClient.from('profiles').update({ lingots }).eq('id', currentUser.id).then(() => {});
      updateUserFlow();
      triggerConfetti();
      showToast(`🎯 ¡Meta diaria cumplida! <span class="text-yellow-400">+1 💎 Lingot</span>`, 3500);
    }

    const { error } = await dbClient.from('profiles').update({ points: newPts }).eq('id', currentUser.id);
    if (error) console.error('Error guardando puntos:', error.message);
  }

  /*
    Núcleo del algoritmo de memorización espaciada.
    Se guarda en flujo.srs (columna "flujo") y se replica en user_word_progress (durabilidad).
    Los PUNTOS influyen en el SRS: una racha alta añade un pequeño bono de "ease",
    lo que alarga el intervalo (repasas menos lo que ya dominas).
  */
  /*
    result: 'easy' | 'hard'  (tarjeta ✨ Repaso)  ·  'practice_correct' | 'practice_wrong' (ejercicios)
    opts.type: 'flashcard' | 'select_by_image' | 'write_by_audio'

    Regla de DOMINIO INMEDIATO: si la palabra se marcó "Fácil" en su primer repaso
    Y el primer intento de "Identifica la imagen" Y de "Escucha y escribe" fueron
    correctos (sin ningún fallo), se marca learned=true y NUNCA vuelve a "¡Toca repasar!".
    Las demás palabras siguen el ciclo SRS hasta graduarse en el intervalo máximo.
  */
  async function updateSRS(wordId, result, opts = {}) {
    ensureDaily();
    const key = String(wordId);
    const isNew = !flujo.srs[key];
    const s = flujo.srs[key] || { level: 0, ease: EASE_DEFAULT, reps: 0, lapses: 0, due: null, learned: false, easyFirst: false, first: {} };
    if (!s.first) s.first = {};
    if (isNew) flujo.daily.newWords = (flujo.daily.newWords || 0) + 1; // cuenta para el límite diario

    const ok = (result === 'easy' || result === 'correct' || result === 'practice_correct');
    const hard = (result === 'hard');
    const type = opts.type || null;

    // Registro del PRIMER intento por tipo (antes de tocar reps/lapses)
    if (type === 'flashcard' && s.reps === 0 && s.lapses === 0 && !s.easyFirst) {
      s.easyFirst = (result === 'easy');
    }
    if ((type === 'select_by_image' || type === 'write_by_audio') && s.first[type] === undefined) {
      s.first[type] = ok;
    }

    let points = 0;

    if (ok) {
      sessionStreak++;
      sessionCorrect++;
      flujo.stats.totalCorrect = (flujo.stats.totalCorrect || 0) + 1;
      const streakBonus = Math.min(sessionStreak * 0.02, 0.12); // la racha alarga el intervalo
      s.reps++;
      s.ease = Math.min(EASE_MAX, s.ease + (result === 'easy' ? 0.15 : 0.08) + streakBonus);
      s.level = Math.min(s.level + 1, SRS_INTERVALS_DAYS.length - 1);
      points = (result === 'easy' ? 12 : 10) + Math.min(sessionStreak, 8); // bono por racha
      if (Math.random() < 0.08) { points += 5; setTimeout(() => showToast('🎁 ¡Bonus sorpresa! +5 puntos extra'), 400); }
      playSound('correct'); triggerConfetti();
    } else if (hard) {
      s.reps++;
      s.ease = Math.max(EASE_MIN, s.ease - 0.15);
      // el nivel se mantiene
      points = 3;
    } else { // fallo
      sessionStreak = 0;
      flujo.stats.totalWrong = (flujo.stats.totalWrong || 0) + 1;
      s.lapses++;
      s.ease = Math.max(EASE_MIN, s.ease - 0.2);
      s.level = Math.max(0, s.level - 2); // retrocede 2 niveles (no castiga hasta cero: mejor experiencia)
      points = 0;
      playSound('wrong');
    }

    // ¿Dominio inmediato? Fácil a la primera + ambos ejercicios bien al primer intento + cero fallos.
    const word = groupCache.map[key];
    const requiereImagen = word ? !!word.imagen : true;
    const imagenOk = !requiereImagen || s.first.select_by_image === true;
    const audioOk = s.first.write_by_audio === true;
    if (!s.learned && s.easyFirst && imagenOk && audioOk && s.lapses === 0) {
      s.learned = true;
      setTimeout(() => showToast('🏅 ¡Palabra dominada a la primera! No volverá a repaso.'), 600);
    }
    // Graduación normal: alcanzó el intervalo máximo del SRS.
    if (!s.learned && s.level >= GRADUATED_LEVEL) {
      s.learned = true;
      setTimeout(() => showToast('🎓 ¡Palabra graduada! Ya vive en tu memoria a largo plazo.'), 600);
    }

    if (s.learned) {
      s.due = null; // dominada: fuera de "¡Toca repasar!" para siempre
    } else {
      const baseDays = SRS_INTERVALS_DAYS[s.level];
      const days = Math.max(0.005, baseDays * (s.ease / EASE_DEFAULT));
      s.due = new Date(Date.now() + days * 86400000).toISOString();
    }
    s.updated = new Date().toISOString();

    flujo.srs[key] = s;
    touchStreak();

    // Guardado principal en la columna flujo
    await updateUserFlow();
    if (points) await addPoints(points);

    // Réplica (no bloqueante) en la tabla dedicada. next_review_at es NOT NULL:
    // para palabras dominadas se guarda una fecha lejana.
    dbClient.from('user_word_progress').upsert({
      user_id: currentUser.id,
      word_id: wordId,
      srs_level: s.level,
      ease_factor: s.ease,
      next_review_at: s.due || '2099-12-31T00:00:00.000Z'
    }, { onConflict: 'user_id, word_id' }).then(({ error }) => {
      if (error) console.warn('user_word_progress (opcional):', error.message);
    });
  }

  /* ============================================================
     5. DATOS (palabras / niveles / grupos / repasos)
  ============================================================ */
  async function getNiveles() {
    /*
      ARREGLO "Sin contenido": la consulta anterior traía TODAS las filas de "palabras"
      y PostgREST corta en 1000, así que los niveles cuyas filas quedaban fuera del corte
      (p. ej. A1/A2) aparecían como vacíos. Ahora se cuenta por nivel con head:true
      (sin traer filas) y con fallback insensible a mayúsculas/minúsculas.
    */
    const candidatos = [...new Set([...NIVELES_FIJOS, ...CEFR_ORDER])];
    const conContenido = [];
    await Promise.all(candidatos.map(async (n) => {
      let { count, error } = await dbClient.from('palabras').select('id', { count: 'exact', head: true }).eq('nivel', n);
      if ((error || !count)) {
        // fallback: 'a1', 'A1 ', etc.
        const r2 = await dbClient.from('palabras').select('id', { count: 'exact', head: true }).ilike('nivel', n);
        count = r2.count; error = r2.error;
      }
      if (!error && (count || 0) > 0) conContenido.push(n);
    }));
    // Complemento: detectar niveles con nombres fuera del estándar CEFR (dentro del primer bloque de filas).
    const { data } = await dbClient.from('palabras').select('nivel').range(0, 999);
    (data || []).forEach(r => {
      const v = (r.nivel || '').trim();
      if (v && !conContenido.some(c => c.toLowerCase() === v.toLowerCase())) conContenido.push(v);
    });
    console.log('[getNiveles] niveles con contenido:', conContenido);
    return sortNiveles(conContenido);
  }
  async function getGroups(nivel) {
    let { data, error } = await dbClient.from('palabras').select('grupo').eq('nivel', nivel).range(0, 9999);
    if (!error && !(data || []).length) {
      ({ data, error } = await dbClient.from('palabras').select('grupo').ilike('nivel', nivel).range(0, 9999));
    }
    if (error) { console.error(`[getGroups ${nivel}] ❌`, error.message, error); return []; }
    const set = sortGroups([...new Set((data || []).map(r => (r.grupo || '').trim()).filter(Boolean))]);
    console.log(`[getGroups ${nivel}] grupos:`, set);
    return set;
  }
  async function getGroupWords(nivel, group) {
    const key = `${nivel}|${group}`;
    if (groupCache.key === key && groupCache.list.length) return groupCache.list;
    let { data, error } = await dbClient.from('palabras').select('*').eq('nivel', nivel).eq('grupo', group).range(0, 9999);
    if (!error && !(data || []).length) {
      ({ data, error } = await dbClient.from('palabras').select('*').ilike('nivel', nivel).ilike('grupo', group).range(0, 9999));
    }
    if (error) { console.error(`[getGroupWords ${key}] ❌`, error.message, error); return []; }
    const list = data || [];
    console.log(`[getGroupWords ${key}] palabras:`, list.length, list.map(w => w.ingles));
    groupCache = { key, list, map: Object.fromEntries(list.map(w => [String(w.id), w])) };
    return list;
  }

  // Sonda de diagnóstico: cuántas filas de "palabras" ve realmente el cliente.
  async function probeContent() {
    const { count, error } = await dbClient.from('palabras').select('id', { count: 'exact', head: true });
    if (error) { console.error('[probeContent] ❌ No se pudo leer "palabras":', error.message, error); return { ok: false, count: 0 }; }
    console.log('[probeContent] ✅ filas visibles en "palabras":', count);
    return { ok: true, count: count || 0 };
  }

  // Palabras cuyo próximo repaso ya venció (SRS), limitadas al nivel actual.
  // Excluye las dominadas (learned), prioriza las más difíciles/vencidas y
  // limita la sesión a SRS_SESSION_MAX (30) palabras.
  async function getDueReviews(nivel) {
    const now = Date.now();
    const dueIds = Object.entries(flujo.srs)
      .filter(([, v]) => !v.learned && v.due && new Date(v.due).getTime() <= now)
      .sort((a, b) => {
        const la = a[1].lapses || 0, lb = b[1].lapses || 0;
        if (lb !== la) return lb - la; // primero las que más cuestan
        return new Date(a[1].due) - new Date(b[1].due); // luego las más vencidas
      })
      .map(([id]) => parseInt(id))
      .filter(n => !isNaN(n))
      .slice(0, SRS_SESSION_MAX);
    if (!dueIds.length) return [];
    let { data } = await dbClient.from('palabras').select('*').eq('nivel', nivel).in('id', dueIds);
    if (!(data || []).length) {
      ({ data } = await dbClient.from('palabras').select('*').ilike('nivel', nivel).in('id', dueIds));
    }
    const orden = new Map(dueIds.map((id, i) => [id, i]));
    return (data || []).sort((a, b) => (orden.get(a.id) ?? 99) - (orden.get(b.id) ?? 99)).slice(0, SRS_SESSION_MAX);
  }

  /* ============================================================
     6. INICIALIZACIÓN DEL FLUJO (JSON columna "flujo")
  ============================================================ */
  function defaultGroupState() {
    return { review: { done: false, index: 0 }, practice: { done: false, queue: [], index: 0 }, completed: false, correct: 0, wrong: 0 };
  }
  function defaultFlujo(nivel) {
    return {
      version: 3,
      currentNivel: nivel,
      niveles: {},
      srs: {},
      stats: { totalCorrect: 0, totalWrong: 0, sessionsCompleted: 0 },
      daily: { date: todayStr(), newWords: 0, reviewed: 0, points: 0, goalShown: false },
      racha: { days: 0, last: null, best: 0 }
    };
  }

  async function ensureFlujo() {
    const baseNivel = (userProfile.nivel) || 'A1';

    // Migración: si viene el formato viejo (flowState) o no existe, se reinicia a v2.
    if (!flujo || !flujo.version || flujo.version < 2 || flujo.flowState) {
      const old = flujo || {};
      flujo = defaultFlujo(baseNivel);
      if (old.currentGroup) { /* se conserva el punto de partida como referencia */ }
      // Importa el SRS previo desde user_word_progress para no perder el progreso.
      const { data: prev } = await dbClient.from('user_word_progress').select('*').eq('user_id', currentUser.id);
      (prev || []).forEach(p => {
        flujo.srs[String(p.word_id)] = {
          level: p.srs_level || 0,
          ease: parseFloat(p.ease_factor) || EASE_DEFAULT,
          reps: p.srs_level || 0, lapses: 0,
          due: p.next_review_at || new Date().toISOString()
        };
      });
      await updateUserFlow();
    }
    if (!flujo.currentNivel) flujo.currentNivel = baseNivel;
    if (!flujo.srs) flujo.srs = {};
    if (!flujo.stats) flujo.stats = { totalCorrect: 0, totalWrong: 0, sessionsCompleted: 0 };
    // Migración suave v2 → v3 (sin perder progreso): agrega estado diario, racha y campos SRS nuevos.
    ensureDaily();
    Object.values(flujo.srs).forEach(s => {
      if (s.learned === undefined) s.learned = false;
      if (!s.first) s.first = {};
      if (s.easyFirst === undefined) s.easyFirst = false;
      // Palabras que ya alcanzaron el intervalo máximo se gradúan.
      if (!s.learned && (s.level || 0) >= GRADUATED_LEVEL) { s.learned = true; s.due = null; }
    });
    if (flujo.version < 3) { flujo.version = 3; await updateUserFlow(); }
  }

  async function ensureNivel(nivel) {
    if (!flujo.niveles[nivel]) flujo.niveles[nivel] = { currentGroup: null, grupos: {} };
    const n = flujo.niveles[nivel];
    const groups = await getGroups(nivel); // solo grupos que realmente tienen palabras
    if (!groups.length) { n.currentGroup = null; return n; } // nivel sin contenido

    // Validar el grupo guardado contra los grupos reales. Si es inválido o no existe,
    // elegimos el primer grupo aún no completado (o el primero disponible).
    if (!n.currentGroup || !groups.includes(n.currentGroup)) {
      const firstIncomplete = groups.find(g => !(n.grupos[g] && n.grupos[g].completed));
      n.currentGroup = firstIncomplete || groups[0];
    }
    if (!n.grupos[n.currentGroup]) n.grupos[n.currentGroup] = defaultGroupState();
    return n;
  }

  /* ============================================================
     7. CONTROLADOR DE FLUJO ÚNICO
     Prioridad: (1) repasos SRS vencidos  →  (2) repaso del grupo  →  (3) práctica  →  (4) siguiente grupo
  ============================================================ */
  async function runFlow() {
    toolsBar.classList.remove('hidden');
    console.groupCollapsed('%c[runFlow]', 'color:#FF7A00;font-weight:bold');
    console.log('flujo actual:', JSON.parse(JSON.stringify(flujo)));

    // Sonda: ¿el cliente puede leer la tabla "palabras"?
    const probe = await probeContent();
    if (probe.count === 0) {
      console.warn('La consulta a "palabras" devolvió 0 filas. Causa más probable: falta la política RLS de SELECT en la tabla "palabras".');
      console.groupEnd();
      return renderMessage('🔒', 'No se pueden leer las palabras',
        'La base de datos devolvió <b>0 palabras</b>. Si ya las cargaste, falta la política <b>RLS de SELECT</b> en la tabla <b>palabras</b>. Aplica el SQL de permisos y recarga.',
        'Reintentar', () => window.location.reload());
    }

    // Niveles que realmente tienen palabras cargadas.
    const niveles = await getNiveles();

    // Si el nivel guardado no tiene contenido, saltamos al primero que sí lo tenga.
    if (niveles.length && !niveles.includes(flujo.currentNivel)) {
      console.log(`[runFlow] "${flujo.currentNivel}" sin contenido → cambio a "${niveles[0]}"`);
      flujo.currentNivel = niveles[0];
      await updateUserFlow();
    }

    const nivel = flujo.currentNivel;
    document.getElementById('nivel-label').textContent = nivel;
    const n = await ensureNivel(nivel);
    console.log(`[runFlow] nivel=${nivel} · currentGroup=${n.currentGroup}`);

    // Nivel sin grupos con palabras: ofrecer cambiar de nivel.
    if (!n.currentGroup) {
      console.groupEnd();
      return renderMessage('📭', 'Nivel sin contenido',
        `No hay palabras cargadas para el nivel <b>${nivel}</b>. Elige otro nivel o carga palabras para este.`,
        'Elegir otro nivel', openNivelSelector);
    }

    // (1) Repasos espaciados vencidos
    const due = await getDueReviews(nivel);
    if (due.length) { console.log('[runFlow] repasos SRS vencidos:', due.length); console.groupEnd(); return startSrsReview(due); }

    // (2)/(3)/(4) Progresión por grupos
    const group = n.currentGroup;
    if (!n.grupos[group]) n.grupos[group] = defaultGroupState();
    const g = n.grupos[group];

    const words = await getGroupWords(nivel, group);
    if (!words.length) {
      console.groupEnd();
      return renderMessage('📭', 'Grupo sin contenido',
        `El grupo <b>${group}</b> del nivel <b>${nivel}</b> no tiene palabras.`,
        'Elegir otro nivel', openNivelSelector);
    }

    console.log(`[runFlow] estado grupo ${group}: review.done=${g.review.done} practice.done=${g.practice.done}`);
    console.groupEnd();

    if (!g.review.done) return renderReview(nivel, group, words);
    if (!g.practice.done) return renderPractice(nivel, group);
    return advanceGroup(nivel, group);
  }

  /* ============================================================
     8. PASO 1 — REPASO DEL GRUPO (flashcards de todas las palabras)
  ============================================================ */
  async function renderReview(nivel, group, words) {
    const g = flujo.niveles[nivel].grupos[group];
    reviewList = words;
    const i = g.review.index || 0;

    if (i >= reviewList.length) {
      g.review.done = true;
      await updateUserFlow();
      await addPoints(5);
      showEncouragement(() => runFlow());
      return;
    }

    const word = reviewList[i];

    // Límite diario: máximo DAILY_NEW_LIMIT palabras NUEVAS por día para no saturar el cerebro.
    ensureDaily();
    const esNueva = !flujo.srs[String(word.id)];
    if (esNueva && flujo.daily.newWords >= DAILY_NEW_LIMIT) {
      updateProgressBar(100);
      return renderMessage('🧠', '¡Cerebro a tope por hoy!',
        `Ya aprendiste <b>${DAILY_NEW_LIMIT} palabras nuevas</b> hoy: el máximo ideal para que tu memoria las fije bien.<br>Vuelve mañana por más, o refuerza lo aprendido con un repaso.`,
        'Repasar lo aprendido 🧠', async () => {
          const due = await getDueReviews(nivel);
          if (due.length) startSrsReview(due);
          else renderMessage('😴', 'Todo al día', 'No tienes repasos pendientes. ¡Descansa, mañana seguimos! 🌙');
        });
    }

    updateProgressBar((i / reviewList.length) * 100);
    appContainer.innerHTML = flashcardHTML(word, i + 1, reviewList.length);
    bindFlashcard(word, async (result) => {
      await updateSRS(word.id, result, { type: 'flashcard' }); // 'easy' | 'hard' (siembra el SRS)
      g.review.index = i + 1;
      await updateUserFlow();
      renderReview(nivel, group, words);
    });
  }

  function bindFlashcard(word, onRate) {
    setTimeout(() => playWordAudio(word), 350);
    const btnAudio = document.getElementById('btn-word-audio');
    if (btnAudio) btnAudio.onclick = (e) => { e.stopPropagation(); playWordAudio(word); };
    const btnP = document.getElementById('btn-show-phonetic');
    const txtP = document.getElementById('txt-phonetic');
    if (btnP && txtP) btnP.onclick = (e) => { e.stopPropagation(); btnP.classList.add('hidden'); txtP.classList.remove('hidden'); txtP.classList.add('animate-pop'); };
    document.getElementById('btn-easy').onclick = () => onRate('easy');
    document.getElementById('btn-hard').onclick = () => onRate('hard');
  }

  /* ============================================================
     9. PASO 2 — PRÁCTICA (audio→escribir  /  imagen→elegir)
  ============================================================ */
  async function buildPracticeQueue(nivel, group) {
    const words = await getGroupWords(nivel, group);
    const englishPool = words.map(w => w.ingles);

    const queue = words.map(w => {
      const canImage = !!w.imagen;
      // Si no hay imagen, forzamos "escribir por audio" (el audio tiene fallback por voz).
      const type = (canImage && Math.random() > 0.5) ? 'select_by_image' : 'write_by_audio';
      return {
        word_id: w.id,
        type,
        options: type === 'select_by_image' ? buildOptions(w.ingles, englishPool) : null
      };
    }).sort(() => Math.random() - 0.5);

    const g = flujo.niveles[nivel].grupos[group];
    g.practice = { done: false, queue, index: 0 };
    await updateUserFlow();
  }

  function buildOptions(correct, pool) {
    const distractors = pool.filter(x => x !== correct).sort(() => Math.random() - 0.5).slice(0, 3);
    return [correct, ...distractors].sort(() => Math.random() - 0.5);
  }

  async function renderPractice(nivel, group) {
    const g = flujo.niveles[nivel].grupos[group];

    // Cargamos las palabras reales del grupo primero.
    const words = await getGroupWords(nivel, group);
    const validIds = new Set(words.map(w => String(w.id)));

    // Construir la cola si no existe, o regenerarla si quedó obsoleta
    // (p. ej. word_id que ya no pertenecen a este grupo).
    const queueOk = g.practice.queue && g.practice.queue.length &&
      g.practice.queue.every(ex => validIds.has(String(ex.word_id)));
    if (!queueOk) {
      console.warn(`[renderPractice] cola inválida/obsoleta en ${nivel}/${group} → regenerando`);
      g.practice.index = 0;
      await buildPracticeQueue(nivel, group);
    }

    const q = g.practice.queue;
    const i = g.practice.index || 0;

    if (i >= q.length) {
      g.practice.done = true; g.completed = true;
      flujo.stats.sessionsCompleted++;
      await updateUserFlow();
      return groupCompleteScreen(nivel, group, g);
    }

    const ex = q[i];
    const word = groupCache.map[String(ex.word_id)];
    if (!word) { g.practice.index = i + 1; await updateUserFlow(); return renderPractice(nivel, group); }

    updateProgressBar((i / q.length) * 100);
    console.log(`[practica] ${i + 1}/${q.length} · ${ex.type} · ${word.ingles}`);

    const advance = async (isCorrect) => {
      const gg = flujo.niveles[nivel].grupos[group];
      if (isCorrect) gg.correct++; else gg.wrong++;
      gg.practice.index = i + 1;
      await updateSRS(word.id, isCorrect ? 'practice_correct' : 'practice_wrong', { type: ex.type });
      await updateUserFlow();
      // Mensaje de ánimo cada 5 aciertos
      if (isCorrect && sessionCorrect > 0 && sessionCorrect % 5 === 0 && sessionCorrect !== lastMilestone) {
        lastMilestone = sessionCorrect;
        setTimeout(() => showEncouragement(() => renderPractice(nivel, group)), 900);
      } else {
        setTimeout(() => renderPractice(nivel, group), isCorrect ? 1000 : 2000);
      }
    };

    if (ex.type === 'select_by_image') renderSelectImage(word, ex.options, advance);
    else renderWriteAudio(word, advance);
  }

  function renderSelectImage(word, options, advance) {
    const btns = options.map(opt => `
      <button class="option-btn btn-juice w-full bg-white border-2 border-slate-200 text-slate-600 font-bold text-base sm:text-lg py-3 rounded-xl hover:border-[#FF7A00] hover:text-[#FF7A00] transition mb-2" data-val="${opt}">${opt}</button>
    `).join('');

    appContainer.innerHTML = `
      <div class="card-3d p-4 sm:p-5 animate-pop text-center mt-1">
        <div class="bg-blue-100 text-blue-600 px-3 py-1 rounded-full text-xs font-bold uppercase mb-3 inline-block">👁️ Identifica la imagen</div>
        <div class="w-32 h-32 sm:w-40 sm:h-40 mx-auto bg-slate-50 rounded-2xl border-4 border-white shadow-lg overflow-hidden mb-4 p-2">
          <img src="${word.imagen}" class="w-full h-full object-contain" alt="">
        </div>
        <div class="flex flex-col gap-1">${btns}</div>
      </div>`;

    document.querySelectorAll('.option-btn').forEach(btn => {
      btn.onclick = (e) => {
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        const val = e.currentTarget.dataset.val;
        if (val === word.ingles) {
          e.currentTarget.className = 'w-full bg-green-500 text-white font-bold text-lg py-4 rounded-xl shadow-lg border-none transform scale-105 transition mb-3';
          e.currentTarget.innerHTML = `${val} <i class='fas fa-check ml-2'></i>`;
          advance(true);
        } else {
          e.currentTarget.className = 'w-full bg-red-500 text-white font-bold text-lg py-4 rounded-xl shadow-lg border-none wrong-shake mb-3';
          e.currentTarget.innerHTML = `${val} <i class='fas fa-times ml-2'></i>`;
          const correctBtn = Array.from(document.querySelectorAll('.option-btn')).find(b => b.dataset.val === word.ingles);
          if (correctBtn) correctBtn.classList.add('bg-green-100', 'text-green-600', 'border-green-300');
          advance(false);
        }
      };
    });
  }

  function renderWriteAudio(word, advance) {
    appContainer.innerHTML = `
      <div class="card-3d p-5 sm:p-6 animate-pop text-center mt-1">
        <div class="bg-pink-100 text-pink-600 px-3 py-1 rounded-full text-xs font-bold uppercase mb-4 inline-block">👂 Escucha y escribe</div>
        <button id="play-btn" class="w-20 h-20 sm:w-24 sm:h-24 bg-gradient-to-br from-[#FF7A00] to-orange-600 rounded-full shadow-xl shadow-orange-200 text-white text-3xl hover:scale-105 transition active:scale-95 mb-5 flex items-center justify-center mx-auto">
          <i class="fas fa-volume-up"></i>
        </button>
        <input type="text" id="input-word" class="w-full bg-slate-50 border-b-4 border-slate-200 text-center text-xl sm:text-2xl font-bold text-slate-700 p-3 focus:outline-none focus:border-[#FF7A00] transition rounded-t-xl mb-4" placeholder="Escribe en inglés..." autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="check-btn" class="w-full btn-juice bg-slate-800 text-white font-bold py-3 rounded-xl text-lg sm:text-xl shadow-lg">COMPROBAR</button>
        <div id="feedback-area" class="h-8 mt-3 text-lg"></div>
      </div>`;

    const input = document.getElementById('input-word');
    const checkBtn = document.getElementById('check-btn');
    setTimeout(() => playWordAudio(word), 300);
    document.getElementById('play-btn').onclick = () => { playWordAudio(word); input.focus(); };

    const check = () => {
      checkBtn.disabled = true;
      if (norm(input.value) === norm(word.ingles)) {
        input.classList.add('text-green-600', 'border-green-500');
        checkBtn.className = 'w-full bg-green-500 text-white font-bold py-4 rounded-xl shadow-lg';
        checkBtn.innerHTML = "¡EXCELENTE! <i class='fas fa-check'></i>";
        advance(true);
      } else {
        input.classList.add('text-red-500', 'wrong-shake', 'border-red-500');
        document.getElementById('feedback-area').innerHTML = `<span class="text-slate-400 text-sm">Correcto:</span> <span class="text-red-500 font-bold">${word.ingles}</span>`;
        advance(false);
      }
    };
    checkBtn.onclick = check;
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') check(); });
    input.focus();
  }

  /* ============================================================
     10. REPASO SRS (sesión de palabras vencidas)
  ============================================================ */
  function startSrsReview(words) {
    srsSession = { queue: words.slice(0, SRS_SESSION_MAX), index: 0, aciertos: 0 };
    renderMessage('🧠', '¡Toca repasar!',
      `Tienes <b>${srsSession.queue.length}</b> palabra(s) que tu memoria está a punto de olvidar. Vamos a reforzarlas.<br><span class="text-xs text-slate-400">(máximo ${SRS_SESSION_MAX} por sesión para no saturarte)</span>`,
      'Empezar repaso', () => nextSrsReview());
  }
  async function nextSrsReview() {
    if (!srsSession || srsSession.index >= srsSession.queue.length) {
      const aciertos = srsSession ? srsSession.aciertos : 0;
      const total = srsSession ? srsSession.queue.length : 0;
      srsSession = null;
      flujo.stats.sessionsCompleted = (flujo.stats.sessionsCompleted || 0) + 1;
      await updateUserFlow();
      playSound('complete'); triggerConfetti();
      showModal({
        icon: '🧠', title: '¡Repaso terminado!',
        body: `Has fortalecido tu memoria a largo plazo.<br><span class="text-green-600 font-bold">${aciertos}/${total} aciertos</span>`,
        dismissable: false,
        actions: [{ label: 'Continuar', onClick: () => { closeModal(); runFlow(); } }]
      });
      return;
    }
    const word = srsSession.queue[srsSession.index];
    updateProgressBar((srsSession.index / srsSession.queue.length) * 100);

    const s = flujo.srs[String(word.id)] || {};
    const esDebil = (s.lapses || 0) >= 3 || (s.level || 0) === 0; // le cuesta: mejor volver a estudiarla

    const avanzar = async (result, type, fueBien) => {
      await updateSRS(word.id, result, { type });
      ensureDaily();
      flujo.daily.reviewed = (flujo.daily.reviewed || 0) + 1;
      if (fueBien) srsSession.aciertos++;
      srsSession.index++;
      setTimeout(() => nextSrsReview(), fueBien ? 1000 : 2000);
    };

    // Mezcla de formatos: tarjeta ✨ Repaso, imagen o dictado.
    const r = Math.random();
    if (esDebil || r < 0.34) {
      // Tarjeta ✨ Repaso (flashcard) también dentro de "¡Toca repasar!"
      appContainer.innerHTML = flashcardHTML(word, srsSession.index + 1, srsSession.queue.length);
      bindFlashcard(word, (res) => avanzar(res, 'flashcard', res === 'easy'));
    } else if (word.imagen && r < 0.67) {
      const pool = (groupCache.list.length ? groupCache.list : srsSession.queue).map(w => w.ingles);
      renderSelectImage(word, buildOptions(word.ingles, pool.length >= 4 ? pool : [word.ingles, 'yes', 'no', 'time']),
        (ok) => avanzar(ok ? 'practice_correct' : 'practice_wrong', 'select_by_image', ok));
    } else {
      renderWriteAudio(word, (ok) => avanzar(ok ? 'practice_correct' : 'practice_wrong', 'write_by_audio', ok));
    }
  }

  /* ============================================================
     11. AVANCE DE GRUPO / NIVEL
  ============================================================ */
  function groupCompleteScreen(nivel, group, g) {
    playSound('complete'); triggerConfetti();
    // Cofre de recompensa: +1 lingot por completar el grupo.
    const lingots = (parseFloat(userProfile.lingots) || 0) + 1;
    userProfile.lingots = lingots;
    const dl = document.getElementById('user-lingots'); if (dl) dl.textContent = lingots;
    dbClient.from('profiles').update({ lingots }).eq('id', currentUser.id).then(() => {});
    showModal({
      icon: '🏆',
      title: '¡Grupo completado!',
      body: `Terminaste <b>${group}</b> del nivel <b>${nivel}</b>.<br><span class="text-green-600 font-bold">${g.correct} aciertos</span> · <span class="text-slate-400">${g.wrong} fallos</span><br><span class="text-yellow-600 font-bold text-lg">🎁 +1 💎 Lingot</span>`,
      dismissable: false,
      actions: [{ label: 'Siguiente 👉', onClick: () => { closeModal(); advanceGroup(nivel, group); } }]
    });
  }

  async function advanceGroup(nivel, group) {
    const groups = await getGroups(nivel);
    const idx = groups.indexOf(group);
    const next = groups[idx + 1];

    if (next) {
      flujo.niveles[nivel].currentGroup = next;
      if (!flujo.niveles[nivel].grupos[next]) flujo.niveles[nivel].grupos[next] = defaultGroupState();
      groupCache = { key: null, list: [], map: {} };
      await updateUserFlow();
      runFlow();
    } else {
      // Nivel terminado
      playSound('complete'); triggerConfetti();
      showModal({
        icon: '🎓',
        title: `¡Nivel ${nivel} completado!`,
        body: 'Dominaste todos los grupos de este nivel. ¿Subimos de nivel?',
        dismissable: false,
        actions: [
          { label: 'Elegir nivel', onClick: () => { closeModal(); openNivelSelector(); } },
          { label: 'Repasar lo aprendido', style: 'bg-slate-100 text-slate-500', onClick: () => { closeModal(); runFlow(); } }
        ]
      });
    }
  }

  /* ============================================================
     12. SELECTOR DE NIVEL
  ============================================================ */
  async function openNivelSelector() {
    const conContenido = await getNiveles(); // niveles que sí tienen palabras
    // Unimos los niveles fijos con cualquier otro detectado en la base de datos.
    const niveles = sortNiveles([...new Set([...NIVELES_FIJOS, ...conContenido])]);
    const current = flujo.currentNivel;

    const body = `<div class="grid grid-cols-2 gap-3 mt-2">${niveles.map(n => {
      const tiene = conContenido.includes(n);
      const activo = n === current;
      return `<button class="nivel-opt btn-juice ${activo ? 'bg-[#FF7A00] text-white' : (tiene ? 'bg-slate-100 text-slate-700' : 'bg-slate-50 text-slate-400')} font-black text-lg py-4 rounded-xl flex flex-col items-center gap-1" data-nivel="${n}">
        <span>${n}</span>
        <span class="text-[10px] font-bold uppercase ${activo ? 'text-white/80' : (tiene ? 'text-green-500' : 'text-slate-300')}">${tiene ? 'Disponible' : 'Sin contenido'}</span>
      </button>`;
    }).join('')}</div>`;

    showModal({ icon: '🎯', title: '¿Qué nivel quieres estudiar?', body, size: 'md' });

    modalRoot.querySelectorAll('.nivel-opt').forEach(btn => {
      btn.onclick = async () => {
        const nivel = btn.dataset.nivel;
        console.log('[nivel] seleccionado:', nivel);
        flujo.currentNivel = nivel;
        await ensureNivel(nivel);
        await updateUserFlow();
        await dbClient.from('profiles').update({ nivel }).eq('id', currentUser.id);
        userProfile.nivel = nivel;
        groupCache = { key: null, list: [], map: {} };
        closeModal();
        runFlow();
      };
    });
  }

  /* ============================================================
     13. CONVERSACIÓN CON IA (Edge Function + DeepSeek + Voz)
  ============================================================ */
  /*
    HABLAR IA — Chat conversacional.
    La persona chatea con "Abu" (tutor de inglés). Cada mensaje se envía a la Edge
    Function "generar-dialogo" con mode:"chat" y el historial reciente; la IA responde
    en inglés (adaptado al nivel) con traducción al español y corrige errores con tacto.
    Requiere actualizar la Edge Function con el archivo index.ts incluido junto a esta página.
  */
  let aiChat = []; // historial [{role:'user'|'assistant', content}]

  async function openAiDialogue() {
    const nivel = flujo.currentNivel;
    aiChat = [];

    showModal({
      icon: '🤖', title: 'Chat con Abu (IA)', size: 'lg', dismissable: true,
      body: `
        <div class="text-left">
          <p class="text-xs text-slate-400 mb-2 text-center">Escríbele en inglés. Abu te corrige con cariño y te traduce todo. 💬</p>
          <div id="ai-messages" class="max-h-72 overflow-y-auto pr-1 space-y-2 mb-3 min-h-[120px]"></div>
          <div class="flex gap-2">
            <input id="ai-input" type="text" placeholder="Escribe en inglés..." autocomplete="off" autocapitalize="off" spellcheck="false"
              class="flex-1 min-w-0 bg-slate-50 border-2 border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-[#FF7A00] text-slate-700 font-medium">
            <button id="ai-send" class="btn-juice bg-[#FF7A00] text-white font-bold px-4 py-2 rounded-xl shrink-0"><i class="fas fa-paper-plane"></i></button>
          </div>
          <div class="flex items-center justify-between mt-2">
            <label class="flex items-center gap-2 text-xs text-slate-400 font-bold cursor-pointer">
              <input id="ai-tts" type="checkbox" checked class="accent-[#FF7A00]"> Leer respuestas en voz alta
            </label>
            <button id="ai-stop" class="text-slate-400 hover:text-slate-600 text-xs font-bold"><i class="fas fa-stop mr-1"></i>Silenciar voz</button>
          </div>
        </div>`,
      actions: []
    });

    bindChat(nivel);

    // Saludo inicial de Abu (local, sin llamar a la IA)
    const saludo = {
      en: `Hi! I'm Abu 🤖 Let's practice your English (${nivel} level). How are you today?`,
      es: `¡Hola! Soy Abu. Practiquemos tu inglés (nivel ${nivel}). ¿Cómo estás hoy?`
    };
    addChatBubble('ai', saludo);
    aiChat.push({ role: 'assistant', content: saludo.en });
    if (document.getElementById('ai-tts')?.checked) speak(saludo.en);
  }

  function addChatBubble(role, msg) {
    const box = document.getElementById('ai-messages');
    if (!box) return null;
    const div = document.createElement('div');
    div.className = role === 'user' ? 'flex justify-end' : 'flex justify-start';
    div.innerHTML = role === 'user'
      ? `<div class="bg-[#FF7A00] text-white rounded-2xl rounded-br-sm px-4 py-2 max-w-[85%] font-medium">${escapeHTML(msg.en)}</div>`
      : `<div class="bg-slate-100 text-slate-800 rounded-2xl rounded-bl-sm px-4 py-2 max-w-[85%]">
           <div class="font-medium">${escapeHTML(msg.en)}</div>
           ${msg.es ? `<div class="text-xs text-slate-400 mt-1">${escapeHTML(msg.es)}</div>` : ''}
         </div>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return div;
  }

  function bindChat(nivel) {
    const input = document.getElementById('ai-input');
    const send = document.getElementById('ai-send');
    const stopBtn = document.getElementById('ai-stop');
    if (!input || !send) return;
    if (stopBtn) stopBtn.onclick = stopSpeaking;

    const enviar = async () => {
      const text = (input.value || '').trim();
      if (!text || send.disabled) return;
      input.value = '';
      addChatBubble('user', { en: text });
      aiChat.push({ role: 'user', content: text });

      const box = document.getElementById('ai-messages');
      const typing = document.createElement('div');
      typing.className = 'flex justify-start';
      typing.innerHTML = `<div class="bg-slate-100 text-slate-400 rounded-2xl rounded-bl-sm px-4 py-2 text-sm"><i class="fas fa-circle-notch fa-spin mr-1"></i> Abu está escribiendo...</div>`;
      if (box) { box.appendChild(typing); box.scrollTop = box.scrollHeight; }
      send.disabled = true;

      try {
        console.log('[IA chat] enviando', aiChat.length, 'mensajes · nivel', nivel);
        const { data, error } = await dbClient.functions.invoke('generar-dialogo', {
          body: { mode: 'chat', nivel, messages: aiChat.slice(-12) }
        });

        if (error) {
          let detalle = error.message || 'Error desconocido';
          try {
            if (error.context && typeof error.context.json === 'function') {
              const b = await error.context.json();
              console.error('[IA chat] error de la función:', b);
              detalle = b.detail || b.error || detalle;
            }
          } catch (e2) { console.warn('[IA chat] no se pudo leer error.context:', e2); }
          throw new Error(detalle);
        }

        let payload = data;
        if (typeof payload === 'string') { try { payload = JSON.parse(payload); } catch { /* abajo */ } }
        if (payload && payload.error) throw new Error(payload.detail || payload.error);

        const reply = payload?.reply || payload || {};
        const en = reply.en || reply.text || '';
        if (!en) throw new Error('La IA devolvió una respuesta vacía. Intenta de nuevo.');

        typing.remove();
        addChatBubble('ai', { en, es: reply.es || '' });
        aiChat.push({ role: 'assistant', content: en });
        if (document.getElementById('ai-tts')?.checked) speak(en);
      } catch (err) {
        console.error('[IA chat] excepción:', err);
        typing.remove();
        const errDiv = addChatBubble('ai', { en: '⚠️ I could not reply. Tap to retry.', es: String(err?.message || err) });
        if (errDiv) { errDiv.style.cursor = 'pointer'; errDiv.onclick = () => { errDiv.remove(); aiChat.pop(); input.value = text; enviar(); }; }
      } finally {
        send.disabled = false;
        input.focus();
      }
    };

    send.onclick = enviar;
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') enviar(); });
    setTimeout(() => input.focus(), 100);
  }


  function speakSequence(texts, i = 0) {
    if (i === 0) stopSpeaking();
    if (i >= texts.length) return;
    speak(texts[i], () => speakSequence(texts, i + 1));
  }

  /* ============================================================
     14. PANTALLAS AUXILIARES
  ============================================================ */
  function renderMessage(icon, title, html, actionLabel, onAction) {
    appContainer.innerHTML = `
      <div class="card-3d p-10 text-center animate-pop mt-6">
        <div class="text-6xl mb-4">${icon}</div>
        <h1 class="text-2xl font-heading font-bold text-slate-800 mb-2">${title}</h1>
        <p class="text-slate-500 mb-6">${html}</p>
        ${actionLabel ? `<button id="msg-action" class="btn-juice bg-[#FF7A00] text-white font-bold py-3 px-8 rounded-xl text-lg">${actionLabel}</button>` : ''}
      </div>`;
    if (actionLabel && onAction) document.getElementById('msg-action').onclick = onAction;
  }

  /* ============================================================
     15. BARRA SUPERIOR (Pro + IA + Club + Perfil)
  ============================================================ */
  document.querySelectorAll('#top-bar button[data-tool]').forEach(btn => {
    btn.onclick = () => {
      const tool = btn.dataset.tool;
      if (tool === 'ia') openAiDialogue();
      else showProModal(); // gramática / pronunciación / club / traductor
    };
  });
  document.getElementById('nivel-btn').onclick = openNivelSelector;

  // Menú de perfil (dropdown)
  const profileBtn = document.getElementById('profile-menu-button');
  const profileDropdown = document.getElementById('profile-menu-dropdown');
  profileBtn.onclick = (e) => { e.stopPropagation(); profileDropdown.classList.toggle('hidden'); };
  document.addEventListener('click', (e) => {
    if (!profileDropdown.contains(e.target) && !profileBtn.contains(e.target)) profileDropdown.classList.add('hidden');
  });
  document.getElementById('logout-btn').onclick = async () => {
    await dbClient.auth.signOut();
    window.location.href = 'index.html';
  };

  // Rellena los datos del menú de perfil
  function fillProfileMenu() {
    const nombre = (userProfile.full_name || 'Mi Perfil');
    document.getElementById('user-name-dropdown').textContent = nombre;
    document.getElementById('user-email-dropdown').textContent = currentUser.email || '';
    document.getElementById('user-points').textContent = userProfile.points || 0;
    document.getElementById('user-lingots').textContent = userProfile.lingots || 0;
  }

  /* ============================================================
     16. ARRANQUE
  ============================================================ */
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const { data: { session } } = await dbClient.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      currentUser = session.user;

      let { data: profile } = await dbClient.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();

      // Auto-reparación: si el perfil no existe todavía, lo creamos con los datos del registro.
      if (!profile) {
        const meta = currentUser.user_metadata || {};
        const { data: creado, error: upErr } = await dbClient
          .from('profiles')
          .upsert({
            id: currentUser.id,
            full_name: meta.full_name || null,
            phone: meta.phone || null,
            english_group: meta.english_group || null,
            nivel: meta.nivel || 'A1',
            updated_at: new Date().toISOString()
          }, { onConflict: 'id' })
          .select().single();

        if (upErr || !creado) {
          console.error('No se pudo crear/leer el perfil:', upErr);
          renderMessage('⚠️', 'Perfil no encontrado',
            'No pudimos crear tu perfil automáticamente. Probablemente faltan las políticas RLS de la tabla <b>profiles</b>. Aplica el SQL de configuración y vuelve a intentar.');
          return;
        }
        profile = creado;
      }

      userProfile = profile;
      flujo = userProfile.flujo;
      document.getElementById('user-points-display').textContent = userProfile.points || 0;
      fillProfileMenu();

      await ensureFlujo();
      updateStreakUI();
      await runFlow();
    } catch (e) {
      console.error(e);
      renderMessage('😵', 'Algo salió mal', 'Ocurrió un error al cargar tu sesión. Recarga la página.');
    }
  });
</script>
