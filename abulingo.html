      textoEscuchando: 'Escuchando… toca de nuevo para enviar'
    });
  }
  async function domEnviarAbu(text) {
    text = (text || '').trim();
    if (!text || !domChatSession) return;
    const cs = domChatSession;
    cs.count++;
    const esUltimo = cs.count >= cs.goal;
    const fixLocal = corregirLocal(text);
    domAddBubble('user', { en: text, fix: esUltimo ? fixLocal : '' });
    domAiChat.push({ role: 'user', content: text });
    const bar = document.getElementById('dom-abu-bar'); if (bar) bar.style.width = `${Math.min(100, (cs.count / cs.goal) * 100)}%`;
    const cnt = document.getElementById('dom-abu-count'); if (cnt) cnt.textContent = cs.count;
    await addPoints(6);
    touchStreak();

    // El ÚLTIMO mensaje de la charla debe ser el tuyo: al llegar a la meta
    // no se le pide una respuesta más a Abu, se cierra aquí mismo.
    if (esUltimo) { setTimeout(domFinAbu, 900); return; }

    const typing = document.createElement('div');
    typing.className = 'flex justify-start';
    typing.innerHTML = `<div class="bg-white border border-slate-200 text-slate-400 rounded-2xl rounded-bl-sm px-3.5 py-2 text-sm"><i class="fas fa-circle-notch fa-spin mr-1"></i> Abu escribe...</div>`;
    document.getElementById('dom-abu-messages')?.appendChild(typing);

    let reply = await callChatFunction({ mode: 'dominar_chat', nivel: cs.nivel, messages: domAiChat.slice(-8), frases: domChatFrases.slice(0, 10), turn: cs.count, goal: cs.goal });
    typing.remove();
    if (!reply) reply = abuFallback(text, []);
    if (!reply.fix && fixLocal) reply.fix = fixLocal;
    domAddBubble('ai', { en: reply.en, es: reply.es || '', fix: reply.fix || '' });
    domAiChat.push({ role: 'assistant', content: reply.en });
    domPintarSugerencias(reply.tips);
    speakAbu(reply.en);
  }
  async function domFinAbu() {
    const cs = domChatSession; if (!cs) return;
    domChatSession = null;
    await addPoints(DOM_PTS_ABU);
    const st = ensureSub(cs.nivel, cs.n);
    st.abuOk = true; st.paso = 'fin';
    await updateUserFlow();
    playSound('complete'); triggerConfetti();
    showModal({
      icon: '🦉', title: '¡Charla completada!',
      body: `Hablaste con Abu <b>${cs.count}</b> veces. <span class="text-yellow-600 font-bold">+${DOM_PTS_ABU} puntos</span>`,
      dismissable: false,
      actions: [{ label: 'Continuar 👉', onClick: () => { closeModal(); pasoDominar(cs.nivel); } }]
    });
  }

  /* ------------------------------------------------------------
     CIERRE DE SUBSECCIÓN — estadísticas, opción de repasar lo
     fallado y vuelta al centro de decisión (vocabulario / dominar).
  ------------------------------------------------------------ */
  function subDotsHTML(nivel, actual) {
    const d = ensureDominar(nivel);
    return Array.from({ length: DOMINAR_SUBS }, (_, i) => i + 1)
      .map(i => `<span class="sub-dot ${d.subs[i]?.completed ? 'hecha' : ''} ${i === actual ? 'actual' : ''}"></span>`).join('');
  }

  async function domSubseccionCompleta(nivel, n) {
    const d = ensureDominar(nivel);

    // Modo repaso: no se suman puntos de nuevo, no se toca "completado"
    // del nivel, y el puntero real de avance se restaura tal cual estaba.
    if (domRepasoActivo === n) {
      const st = ensureSub(nivel, n);
      domRepasoActivo = null;
      d.subseccionActual = domRepasoVolverA;
      await updateUserFlow();
      playSound('complete'); triggerConfetti();
      showModal({
        icon: '✅', title: '¡Repaso completo!',
        body: `Repasaste la subsección <b>${n}</b>. Tu progreso sigue en la subsección <b>${domRepasoVolverA}</b>.<br>
               <span class="block mt-1">Aciertos: <b class="text-green-600">${st.rondaAciertos || 0}</b> · Fallos: <b class="text-slate-400">${st.rondaFallos || 0}</b></span>`,
        dismissable: false,
        actions: [{ label: 'Volver 👉', onClick: () => { closeModal(); volverAlHub(); } }]
      });
      return;
    }

    const st = ensureSub(nivel, n);
    st.completed = true;
    await addPoints(DOM_PTS_SUBSECCION);
    const esUltima = n >= DOMINAR_SUBS;
    if (esUltima) d.completado = true;
    await updateUserFlow();

    playSound('complete'); triggerConfetti();
    showModal({
      icon: esUltima ? '🏆' : '✅',
      title: esUltima ? `¡Nivel ${nivel} dominado!` : `¡Subsección ${n}/${DOMINAR_SUBS} completa!`,
      body: `
        <div class="sub-dots mb-3">${subDotsHTML(nivel, n)}</div>
        <span class="block">Aciertos: <b class="text-green-600">${st.rondaAciertos || 0}</b> · Fallos: <b class="text-slate-400">${st.rondaFallos || 0}</b></span>
        <span class="block text-yellow-600 font-bold mt-1">+${DOM_PTS_SUBSECCION} puntos</span>
        ${esUltima ? '<span class="block mt-2 text-slate-500">Completaste las 32 subsecciones de este nivel. 🎉</span>' : ''}`,
      dismissable: false,
      actions: [
        ...(st.fallidos.length ? [{ label: `Repasar lo fallado (${st.fallidos.length})`, style: 'bg-slate-100 text-slate-500', onClick: () => { closeModal(); domRepasarFallidos(nivel, n); } }] : []),
        { label: 'Continuar 👉', onClick: async () => {
            closeModal();
            if (!esUltima) { d.subseccionActual = n + 1; await updateUserFlow(); }
            volverAlHub();
          } }
      ]
    });
  }

  function domRepasarFallidos(nivel, n) {
    const cont = dominarCache[nivel]; const item = cont?.plan?.[n];
    const st = ensureSub(nivel, n);
    const items = (st.fallidos || []).map(f => {
      const r = (item?.ronda || []).find(x => String(x.fila.id) === String(f.id));
      return r ? r.fila : null;
    }).filter(Boolean);
    if (!items.length) return domSubseccionCompleta(nivel, n);
    appContainer.innerHTML = `
      <div class="card-3d p-4 sm:p-5 animate-pop mt-1">
        <span class="bg-amber-100 text-amber-700 px-3 py-1 rounded-full text-xs font-bold uppercase mb-3 inline-block">🔁 Repasar lo fallado</span>
        <div class="space-y-2 mb-4">
          ${items.map((f, i) => `
            <button class="w-full text-left bg-slate-50 border border-slate-200 rounded-xl p-3 flex items-center justify-between gap-2 dom-repaso-item" data-i="${i}">
              <span><span class="font-bold text-slate-700 block">${escapeHTML(f.frase)}</span><span class="text-xs text-slate-400">${escapeHTML(f.traduccion || '')}</span></span>
              <i class="fas fa-volume-up text-[#FF7A00]"></i>
            </button>`).join('')}
        </div>
        <button id="dom-repaso-listo" class="w-full btn-juice bg-[#FF7A00] text-white font-bold py-3 rounded-xl text-lg">Ya las repasé 👉</button>
      </div>`;
    document.querySelectorAll('.dom-repaso-item').forEach(b => {
      b.onclick = () => reproducirAudioDom(items[parseInt(b.dataset.i)], 'frase');
    });
    document.getElementById('dom-repaso-listo').onclick = async () => {
      st.fallidos = [];
      await updateUserFlow();
      domSubseccionCompleta(nivel, n);
    };
  }

  function dominarSinContenido(nivel) {
    renderMessage('📭', 'Sin contenido todavía',
      `Aún no hay contenido de <b>Dominar</b> cargado para el nivel <b>${escapeHTML(nivel)}</b>.`,
      'Volver', volverAlHub);
  }

  /* ------------------------------------------------------------
     CENTRO DE DECISIÓN — "¿Vocabulario o Dominar?"
     Aparece: (a) cuando terminas el repaso+práctica de un grupo de
     vocabulario (reemplaza a lo que antes abría practica.html), y
     (b) cada vez que terminas una subsección de Dominar. Desde aquí
     se retoma exactamente donde quedó cada camino.
  ------------------------------------------------------------ */
  function volverAlHub() {
    const nivel = flujo.currentNivel;
    const group = flujo.niveles[nivel]?.currentGroup || null;
    mostrarEleccionVocabularioODominar(nivel, group);
  }

  function mostrarEleccionVocabularioODominar(nivel, group) {
    toolsBar.classList.remove('hidden');
    updateProgressBar(70);
    const d = flujo.dominar?.[nivel];
    const hayAvanceDominar = d && (d.subseccionActual > 1 || Object.keys(d.subs || {}).length);
    appContainer.innerHTML = `
      <div class="card-3d p-6 text-center animate-pop mt-4">
        <div class="text-5xl mb-3">🚀</div>
        <h2 class="font-heading font-bold text-slate-800 text-xl mb-2">¿Qué quieres hacer ahora?</h2>
        <p class="text-slate-500 mb-5">${group ? `Ya terminaste el repaso y la práctica de <b>${escapeHTML(group)}</b>. ` : ''}Elige por dónde seguir:</p>
        <div class="space-y-3">
          <button id="dom-ir-vocab" class="w-full btn-juice bg-white border-2 border-slate-200 text-slate-700 font-bold py-4 rounded-xl text-left px-5">
            <span class="block text-lg">📚 Seguir con Vocabulario</span>
            <span class="block text-xs font-normal text-slate-400 mt-0.5">Continúa con el siguiente grupo de palabras</span>
          </button>
          <button id="dom-ir-dominar" class="w-full btn-juice bg-[#FF7A00] text-white font-bold py-4 rounded-xl text-left px-5">
            <span class="block text-lg">🏆 Dominar</span>
            <span class="block text-xs font-normal text-orange-100 mt-0.5">${hayAvanceDominar ? `Sigue en la subsección ${d.subseccionActual}/${DOMINAR_SUBS}` : `Frases, videos y conversaciones del nivel ${escapeHTML(nivel)}`}</span>
          </button>
        </div>
      </div>`;
    document.getElementById('dom-ir-vocab').onclick = async () => {
      const g = group && flujo.niveles[nivel]?.grupos?.[group];
      if (g) { if (!g.pract2) g.pract2 = { done: false }; g.pract2.done = true; await updateUserFlow(); }
      runFlow();
    };
    document.getElementById('dom-ir-dominar').onclick = () => iniciarDominar(nivel);
  }

  async function iniciarDominar(nivel) {
    toolsBar.classList.remove('hidden');
    appContainer.innerHTML = `<div class="text-center animate-pulse mt-10"><i class="fas fa-circle-notch fa-spin text-4xl text-[#FF7A00]"></i></div>`;
    await cargarContenidoDominar(nivel);
    const d = ensureDominar(nivel);
    if (d.completado) return domNivelDominadoScreen(nivel);
    return domSubseccionIntro(nivel, d.subseccionActual);
  }

  function domSubseccionIntro(nivel, n) {
    // Plan Gratis: solo las primeras GRATIS_DOMINAR_SUBS subsecciones.
    if (esGratis() && n > GRATIS_DOMINAR_SUBS) {
      return renderMessage('🔒', 'Ya usaste tu Dominar gratis',
        `Con el plan <b>Gratis</b> puedes hacer las primeras <b>${GRATIS_DOMINAR_SUBS} subsecciones</b> de Dominar. Mejora tu plan para seguir con las ${DOMINAR_SUBS} subsecciones del nivel.`,
        'Ver planes ✨', () => openPlanesPro('gratis_limite_dominar'));
    }
    const d = ensureDominar(nivel);
    const hayAnteriores = n > 1 && Object.keys(d.subs).some(k => parseInt(k) < n && d.subs[k]?.completed);
    appContainer.innerHTML = `
      <div class="card-3d p-6 text-center animate-pop mt-4">
        <span class="bg-orange-100 text-[#FF7A00] px-3 py-1 rounded-full text-xs font-bold uppercase mb-3 inline-block">🏆 Dominar · ${escapeHTML(nivel)}</span>
        <h2 class="font-heading font-bold text-slate-800 text-xl mb-2">Subsección ${n} de ${DOMINAR_SUBS}</h2>
        <div class="sub-dots mb-4">${subDotsHTML(nivel, n)}</div>
        <p class="text-slate-500 text-sm mb-5">📖 Lectura · 👂 Escucha · 🧩 Frases${n % 2 === 0 ? ' · 🎬 Video · 🎭 Conversación' : ''} · 🦉 Abu</p>
        <button id="dom-empezar-sub" class="w-full btn-juice bg-[#FF7A00] text-white font-bold py-3 rounded-xl text-lg">Empezar 👉</button>
        ${hayAnteriores ? '<button id="dom-ver-anteriores" class="w-full mt-2 btn-juice bg-slate-100 text-slate-600 font-bold text-sm py-2.5 rounded-xl">📚 Repasar una subsección anterior</button>' : ''}
        <button id="dom-volver-hub" class="w-full mt-2 text-slate-400 font-bold text-sm py-2">Volver</button>
      </div>`;
    document.getElementById('dom-empezar-sub').onclick = () => pasoDominar(nivel);
    const btnAnt = document.getElementById('dom-ver-anteriores');
    if (btnAnt) btnAnt.onclick = () => domVerAnteriores(nivel);
    document.getElementById('dom-volver-hub').onclick = volverAlHub;
  }

  /* ------------------------------------------------------------
     REPASAR UNA SUBSECCIÓN ANTERIOR
     Deja volver a estudiar cualquier subsección ya completada sin
     perder el avance real (subseccionActual). Reutiliza TODO el motor
     normal de pasoDominar/domBindPie: solo se reinicia el estado
     efímero de esa subsección (paso, rondaIdx, etc.) — "completed"
     nunca se toca — y al terminar se restaura el puntero real.
  ------------------------------------------------------------ */
  let domRepasoActivo = null;   // subsección (n) que se está repasando, o null
  let domRepasoVolverA = null;  // subseccionActual real, para restaurarla al terminar

  function domVerAnteriores(nivel) {
    const d = ensureDominar(nivel);
    const hechas = [];
    for (let i = 1; i < d.subseccionActual; i++) if (d.subs[i]?.completed) hechas.push(i);
    showModal({
      icon: '📚', title: 'Secciones anteriores', size: 'lg',
      body: hechas.length
        ? `<p class="text-slate-500 text-sm mb-3 text-center">Elige una subsección ya completada para repasarla. Tu progreso actual (subsección ${d.subseccionActual}) no se pierde.</p>
           <div class="grid grid-cols-4 gap-2">${hechas.map(i => `<button class="dom-sub-ant btn-juice bg-slate-100 text-slate-700 font-black py-2.5 rounded-xl" data-n="${i}">${i}</button>`).join('')}</div>`
        : `<p class="text-slate-400 text-center py-4">Todavía no has completado ninguna subsección para repasar.</p>`,
      actions: [{ label: 'Cerrar', style: 'bg-slate-100 text-slate-500', onClick: closeModal }]
    });
    document.querySelectorAll('.dom-sub-ant').forEach(b => {
      b.onclick = () => { const n = parseInt(b.dataset.n); closeModal(); domIniciarRepaso(nivel, n); };
    });
  }

  function domIniciarRepaso(nivel, n) {
    const d = ensureDominar(nivel);
    domRepasoActivo = n;
    domRepasoVolverA = d.subseccionActual;
    d.subseccionActual = n;   // el motor existente (pasoDominar) lee este valor
    const st = ensureSub(nivel, n);
    Object.assign(st, { paso: 'lee', rondaIdx: 0, rondaAciertos: 0, rondaFallos: 0, videoOk: null, conversarOk: null, abuOk: false, fallidos: [] });
    // "completed" NO se toca: sigue marcada como ya hecha pase lo que pase.
    pasoDominar(nivel);
  }

  function domNivelDominadoScreen(nivel) {
    appContainer.innerHTML = `
      <div class="card-3d p-8 text-center animate-pop mt-6">
        <div class="text-6xl mb-3">🏆</div>
        <h2 class="font-heading font-bold text-slate-800 text-xl mb-2">¡Ya dominaste el nivel ${escapeHTML(nivel)}!</h2>
        <p class="text-slate-500 mb-5">Completaste las 32 subsecciones de frases, videos y conversaciones.</p>
        <button id="dom-volver-hub2" class="w-full btn-juice bg-[#FF7A00] text-white font-bold py-3 rounded-xl text-lg">Volver</button>
      </div>`;
    document.getElementById('dom-volver-hub2').onclick = volverAlHub;
  }

  // Entrada libre desde la barra superior (botón "Práctica"): abre Dominar
  // directamente en el nivel actual, sin pasar por el grupo de vocabulario.
  function abrirDominarDesdeMenu() {

  /* ============================================================
     13.5. MENÚ DE PERFIL — Rankings · Progreso · Mazo · Soporte
  ============================================================ */
  const spinnerHTML = () => '<div class="w-10 h-10 border-4 border-[#FF7A00] border-t-transparent rounded-full animate-spin mx-auto my-6"></div>';

  function rankingListHTML(rows) {
    if (!rows.length) return '<p class="text-slate-400 text-center py-4">Aún no hay usuarios en el ranking.</p>';

      const yo = r.id === currentUser.id;

  // ---------- Ranking Global (por puntos) ----------
  async function openRankingGlobal() {

    }
    el.innerHTML = `<p class="text-xs text-slate-400 text-center mb-3">Los 20 mejores por puntos ⭐</p>` + rankingListHTML(data || []);

  // ---------- Ranking de Equipo (crear / unirse con código / competir) ----------
  /*
    Los equipos son privados: para entrar hace falta un código de 6 dígitos que
    genera Supabase al crear el equipo. Nadie puede listar equipos ajenos ni
    colarse sin código (ver abulingo-supabase.sql: RLS + unirse_por_codigo).
  */
  const soloDigitos = (t) => (t || '').toString().replace(/\D/g, '');

  async function openRankingEquipo() {
    showModal({ icon: '🛡️', title: 'Ranking de Equipo', size: 'lg', body: `<div id="eq-body" class="text-left">${spinnerHTML()}</div>`, actions: [] });
    const el = document.getElementById('eq-body');
    if (!el) return;

    if (!userProfile.equipo_id) return renderEquipoSetup(el);

    const { data: eq } = await dbClient.from('equipos')
      .select('id, nombre_equipo, codigo, creador_id')
      .eq('id', userProfile.equipo_id).maybeSingle();

    const { data: miembros, error } = await dbClient.from('ranking_publico')
      .select('id, full_name, points')
      .eq('equipo_id', userProfile.equipo_id)
      .order('points', { ascending: false })
      .limit(50);

    if (error) {
      el.innerHTML = `<p class="text-red-500 font-bold text-center">No se pudo leer tu equipo.</p>
        <p class="text-slate-400 text-xs text-center mt-2">${escapeHTML(error.message)}</p>`;
      return;
    }

    const soyCreador = !!(eq && eq.creador_id === currentUser.id);
    const totalPts = (miembros || []).reduce((a, m) => a + (m.points || 0), 0);

    el.innerHTML = `
      <div class="text-center mb-3">
        <span class="bg-orange-100 text-[#FF7A00] font-black px-4 py-1.5 rounded-full inline-block">🛡️ ${escapeHTML(eq?.nombre_equipo || 'Mi equipo')}</span>
        <p class="text-xs text-slate-400 mt-2">${(miembros || []).length} integrante(s) · <b>${totalPts}</b> puntos en total ⭐</p>
      </div>

      ${eq?.codigo ? `
        <div class="bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl p-3 mb-4 text-center">
          <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wide">Código para invitar</p>
          <div id="eq-codigo-txt" class="font-black text-3xl tracking-[0.35em] text-[#FF7A00] my-1.5 pl-[0.35em]">${escapeHTML(eq.codigo)}</div>
          <div class="flex flex-wrap gap-2 justify-center">
            <button id="eq-copiar" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-600 hover:border-[#FF7A00] hover:text-[#FF7A00] transition"><i class="fas fa-copy mr-1"></i>Copiar</button>
            <button id="eq-compartir" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-[#FF7A00] text-white hover:opacity-90 transition"><i class="fas fa-share-nodes mr-1"></i>Invitar</button>
            ${soyCreador ? `<button id="eq-regenerar" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-400 hover:text-red-500 hover:border-red-200 transition"><i class="fas fa-rotate mr-1"></i>Cambiar</button>` : ''}
          </div>
          <p class="text-[10px] text-slate-400 mt-2">Solo quien tenga este código puede entrar.</p>
        </div>` : ''}

      ${rankingListHTML(miembros || [])}
      <button id="eq-salir" class="mt-4 w-full text-center text-xs font-bold text-slate-400 hover:text-red-500 transition">Salir del equipo</button>`;

    const codigo = eq?.codigo || '';
    const copiar = async () => {
      try {
        await navigator.clipboard.writeText(codigo);
        showToast('📋 Código copiado: ' + codigo);
      } catch {
        showToast('Tu código es: <b>' + codigo + '</b>', 4000);
      }
    };
    const btnCopiar = document.getElementById('eq-copiar');
    if (btnCopiar) btnCopiar.onclick = copiar;

    const btnComp = document.getElementById('eq-compartir');
    if (btnComp) btnComp.onclick = async () => {
      const texto = `¡Únete a mi equipo "${eq?.nombre_equipo || ''}" en Abulingo! 🛡️\n\n` +
        `1. Entra a ${ABULINGO_URL}\n` +
        `2. Abre "Ranking de Equipo" en tu perfil\n` +
        `3. Escribe este código: ${codigo}\n\n` +
        `¡Te espero para aprender inglés juntos! 🔥`;
      if (navigator.share) {
        try { await navigator.share({ title: 'Abulingo', text: texto, url: ABULINGO_URL }); return; } catch { /* canceló */ }
      }
      try { await navigator.clipboard.writeText(texto); showToast('📋 Invitación copiada. ¡Pégala en WhatsApp!'); }
      catch { copiar(); }
    };

    const btnRegen = document.getElementById('eq-regenerar');
    if (btnRegen) btnRegen.onclick = async () => {
      btnRegen.disabled = true;
      const { data, error: e3 } = await dbClient.rpc('regenerar_codigo_equipo');
      btnRegen.disabled = false;
      if (e3) return showToast('⚠️ ' + e3.message);
      showToast('🔄 Código nuevo: <b>' + data + '</b>. El anterior ya no sirve.', 4000);
      openRankingEquipo();
    };

    const salir = document.getElementById('eq-salir');
    if (salir) salir.onclick = async () => {
      const { error: e2 } = await dbClient.from('profiles').update({ equipo_id: null }).eq('id', currentUser.id);
      if (e2) { showToast('⚠️ No se pudo salir: ' + e2.message); return; }
      userProfile.equipo_id = null;
      showToast('👋 Saliste del equipo.');
      openRankingEquipo();
    };
  }

  function renderEquipoSetup(el) {
    el.innerHTML = `
      <p class="text-slate-500 text-sm text-center mb-4">Compite con tus amigos: sumen puntos juntos y vean quién va adelante. 🏆</p>

      <div class="bg-orange-50 border-2 border-orange-200 rounded-xl p-3 mb-3">
        <p class="font-bold text-slate-700 text-sm mb-2 text-center">¿Te pasaron un código?</p>
        <div class="flex gap-2">
          <input id="eq-codigo" type="text" inputmode="numeric" maxlength="7" placeholder="······" autocomplete="off"
            class="flex-1 min-w-0 bg-white border-2 border-slate-200 rounded-xl px-3 py-2 text-center font-black text-xl tracking-[0.3em] text-slate-700 focus:outline-none focus:border-[#FF7A00]">
          <button id="eq-unirme" class="btn-juice bg-[#FF7A00] text-white font-bold px-4 py-2 rounded-xl shrink-0">Unirme</button>
        </div>
        <p class="text-[10px] text-slate-400 text-center mt-1.5">6 dígitos, sin espacios</p>
      </div>

      <div class="flex items-center gap-2 my-3">
        <div class="flex-1 h-px bg-slate-200"></div>
        <span class="text-[10px] font-bold text-slate-300 uppercase">o</span>
        <div class="flex-1 h-px bg-slate-200"></div>
      </div>

      <div class="bg-slate-50 border border-slate-200 rounded-xl p-3">
        <p class="font-bold text-slate-700 text-sm mb-2 text-center">Crea tu equipo</p>
        <div class="flex gap-2">
          <input id="eq-nombre" type="text" maxlength="40" placeholder="Nombre del equipo..."
            class="flex-1 min-w-0 bg-white border-2 border-slate-200 rounded-xl px-3 py-2 font-medium focus:outline-none focus:border-[#FF7A00]">
          <button id="eq-crear" class="btn-juice bg-slate-800 text-white font-bold px-4 py-2 rounded-xl shrink-0">Crear</button>
        </div>
        <p class="text-[10px] text-slate-400 text-center mt-1.5">Recibirás un código para invitar a quien quieras</p>
      </div>

      <p id="eq-error" class="text-red-500 text-xs font-bold mt-3 hidden text-center"></p>`;

    const setErr = (m) => { const p = document.getElementById('eq-error'); if (p) { p.innerHTML = m; p.classList.remove('hidden'); } };

    // ── Unirse con código ──
    const inputCod = document.getElementById('eq-codigo');
    const btnUnir = document.getElementById('eq-unirme');
    const unir = async () => {
      const codigo = soloDigitos(inputCod?.value);
      if (codigo.length !== 6) return setErr('El código son 6 dígitos. Revísalo con quien te invitó.');
      btnUnir.disabled = true;
      const { data, error } = await dbClient.rpc('unirse_por_codigo', { p_codigo: codigo });
      btnUnir.disabled = false;
      if (error) return setErr(escapeHTML(error.message));
      const fila = Array.isArray(data) ? data[0] : data;
      if (!fila) return setErr('Ese código no corresponde a ningún equipo.');
      userProfile.equipo_id = fila.equipo_id;
      triggerConfetti();
      showToast(`🛡️ ¡Bienvenido a ${escapeHTML(fila.nombre_equipo)}!`);
      openRankingEquipo();
    };
    if (btnUnir) btnUnir.onclick = unir;
    if (inputCod) inputCod.addEventListener('keypress', (e) => { if (e.key === 'Enter') unir(); });

    // ── Crear equipo ──
    const crear = document.getElementById('eq-crear');
    if (crear) crear.onclick = async () => {
      const nombre = (document.getElementById('eq-nombre')?.value || '').trim();
      if (!nombre) return setErr('Escribe un nombre para el equipo.');
      crear.disabled = true;
      // creador_id es obligatorio: es lo que autoriza el insert en la política RLS
      const { data: nuevo, error } = await dbClient.from('equipos')
        .insert({ nombre_equipo: nombre, creador_id: currentUser.id })
        .select('id, nombre_equipo, codigo').single();
      crear.disabled = false;
      if (error || !nuevo) {
        return setErr('No se pudo crear el equipo: ' + escapeHTML(error?.message || 'error desconocido') +
          '<br><span class="font-normal">Ejecuta <b>abulingo-supabase.sql</b> en el editor SQL de Supabase.</span>');
      }
      const { error: e2 } = await dbClient.from('profiles').update({ equipo_id: nuevo.id }).eq('id', currentUser.id);
      if (e2) return setErr('Equipo creado, pero no pudimos unirte: ' + escapeHTML(e2.message));
      userProfile.equipo_id = nuevo.id;
      triggerConfetti();
      showToast(`🛡️ Equipo creado · código <b>${nuevo.codigo}</b>`, 4000);
      openRankingEquipo();
    };
  }

  /* ---------- Progreso por nivel ----------
     Ahora lo pinta abu-menu.js: una sola vista con las CINCO áreas
     (palabras, frases, conversaciones, gramática y subsecciones de
     "Dominar"), idéntica en abulingo.html, gramatica.html y
     pronunciacion.html. renderProgresoNivel() se conserva abajo como
     respaldo por si abu-menu.js no cargó. */
  async function openProgresoNivel() {
    if (window.AbuMenu) {
      window.AbuMenu.actualizarCtx({ userProfile, flujo });
      return window.AbuMenu.progresoNivel();
    }
    showModal({ icon: '📈', title: 'Progreso por nivel', size: 'lg', body: `<div id="pg-body" class="text-left">${spinnerHTML()}</div>`, actions: [] });
    renderProgresoNivel(flujo.currentNivel);
  }

  async function renderProgresoNivel(nivel) {
    const el = document.getElementById('pg-body');
    if (!el) return;
    el.innerHTML = spinnerHTML();

    const conContenido = await getNiveles();
    const niveles = sortNiveles([...new Set([...NIVELES_FIJOS, ...conContenido])]);

    let { data } = await dbClient.from('palabras').select('id').eq('nivel', nivel).range(0, 9999);
    if (!(data || []).length) ({ data } = await dbClient.from('palabras').select('id').ilike('nivel', nivel).range(0, 9999));
    const ids = (data || []).map(r => String(r.id));

    const total = ids.length;
    const estudiadas = ids.filter(id => flujo.srs[id]).length;
    const dominadas = ids.filter(id => flujo.srs[id] && flujo.srs[id].learned).length;
    const ahora = Date.now();
    const pendientes = ids.filter(id => { const s = flujo.srs[id]; return s && !s.learned && s.due && new Date(s.due).getTime() <= ahora; }).length;
    const pctDom = total ? Math.round((dominadas / total) * 100) : 0;
    const pctEst = total ? Math.round((estudiadas / total) * 100) : 0;

    const grupos = await getGroups(nivel);
    const gCompletos = grupos.filter(g => flujo.niveles[nivel]?.grupos?.[g]?.completed).length;

    const chips = niveles.map(n => `
      <button class="pg-chip btn-juice ${n === nivel ? 'bg-[#FF7A00] text-white' : 'bg-slate-100 text-slate-600'} font-black text-sm px-4 py-2 rounded-xl" data-nivel="${n}">${n}</button>`).join('');

    el.innerHTML = `
      <div class="flex flex-wrap justify-center gap-2 mb-4">${chips}</div>
      ${total === 0 ? `<p class="text-slate-400 text-center py-4">El nivel <b>${nivel}</b> no tiene palabras cargadas todavía. 📭</p>` : `
      <div class="grid grid-cols-2 gap-2 mb-4">
        <div class="bg-slate-50 rounded-xl p-3 text-center"><div class="text-2xl font-black text-slate-700">${total}</div><div class="text-[10px] font-bold text-slate-400 uppercase">Palabras en el nivel</div></div>
        <div class="bg-blue-50 rounded-xl p-3 text-center"><div class="text-2xl font-black text-blue-600">${estudiadas}</div><div class="text-[10px] font-bold text-slate-400 uppercase">Ya estudiadas</div></div>
        <div class="bg-green-50 rounded-xl p-3 text-center"><div class="text-2xl font-black text-green-600">${dominadas}</div><div class="text-[10px] font-bold text-slate-400 uppercase">Dominadas 🏅</div></div>
        <div class="bg-orange-50 rounded-xl p-3 text-center"><div class="text-2xl font-black text-[#FF7A00]">${pendientes}</div><div class="text-[10px] font-bold text-slate-400 uppercase">Por repasar hoy</div></div>
      </div>
      <div class="mb-3">
        <div class="flex justify-between text-[10px] font-bold text-slate-400 mb-1"><span>DOMINADAS</span><span>${pctDom}% · te falta ${100 - pctDom}%</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${pctDom}%"></div></div>
      </div>
      <div class="mb-3">
        <div class="flex justify-between text-[10px] font-bold text-slate-400 mb-1"><span>ESTUDIADAS</span><span>${pctEst}% · te falta ${100 - pctEst}%</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${pctEst}%; background: linear-gradient(90deg,#3b82f6,#60a5fa);"></div></div>
      </div>
      <p class="text-center text-sm text-slate-500">Grupos completados: <b class="text-slate-700">${gCompletos} / ${grupos.length}</b> 📚 · Racha: <b class="text-orange-500">${flujo.racha?.days || 0} día(s)</b> 🔥</p>`}
      <div class="mt-4 pt-3 border-t border-slate-100 text-center">
        <div class="text-3xl font-black text-green-600">${Object.values(flujo.srs || {}).filter(s => s.learned).length}</div>
        <div class="text-[10px] font-bold text-slate-400 uppercase">Palabras dominadas en TODOS los niveles 🏅</div>
      </div>`;

    el.querySelectorAll('.pg-chip').forEach(b => { b.onclick = () => renderProgresoNivel(b.dataset.nivel); });
  }

  /* ---------- Certificados ----------
     Un certificado se desbloquea cuando TODAS las palabras del nivel
     están DOMINADAS (flujo.srs[id].learned === true). El modal muestra
     nivel por nivel cuántas palabras faltan y, cuando llegas al 100 %,
     habilita el botón para pedirlo por WhatsApp.                       */
  let certDisponibles = 0;

  async function getCertProgreso(nivel) {
    let { data } = await dbClient.from('palabras').select('id').eq('nivel', nivel).range(0, 9999);
    if (!(data || []).length) ({ data } = await dbClient.from('palabras').select('id').ilike('nivel', nivel).range(0, 9999));
    const ids = (data || []).map(r => String(r.id));
    const total = ids.length;
    const dominadas = ids.filter(id => flujo.srs[id] && flujo.srs[id].learned).length;
    return {
      nivel, total, dominadas,
      faltan: Math.max(0, total - dominadas),
      pct: total ? Math.round((dominadas / total) * 100) : 0,
      listo: total > 0 && dominadas >= total
    };
  }

  function certWhatsAppURL(nivel) {
    const nombre = (userProfile?.full_name || '').trim();
    const correo = (currentUser?.email || '').trim();
    const texto =
      `¡Hola Abulingo! 🎓\n\n` +
      `Ya dominé todas las palabras del nivel ${nivel} y quisiera solicitar mi certificado.\n\n` +
      `Nombre: ${nombre || '(escribe aquí tu nombre)'}\n` +
      `Correo: ${correo || '(escribe aquí tu correo)'}\n` +
      `Nivel: ${nivel}\n\n¡Gracias!`;
    return `${CERT_WHATSAPP_URL}?text=${encodeURIComponent(texto)}`;
  }

  async function openCertificados() {
    showModal({ icon: '🎓', title: 'Certificados', size: 'lg', body: `<div id="cert-body" class="text-left">${spinnerHTML()}</div>`, actions: [] });
    renderCertificados();
  }

  async function renderCertificados() {
    const el = document.getElementById('cert-body');
    if (!el) return;
    el.innerHTML = spinnerHTML();

    const conContenido = await getNiveles();
    const niveles = sortNiveles([...new Set([...NIVELES_FIJOS, ...conContenido])]);
    const datos = (await Promise.all(niveles.map(n => getCertProgreso(n)))).filter(d => d.total > 0);

    certDisponibles = datos.filter(d => d.listo).length;
    actualizarBadgeCertificados();

    if (!datos.length) {
      el.innerHTML = `<p class="text-slate-400 text-center py-4">Todavía no hay palabras cargadas para ningún nivel. 📭</p>`;
      return;
    }

    const tarjetas = datos.map(d => `
      <div class="rounded-2xl border-2 ${d.listo ? 'border-green-300 bg-green-50' : 'border-slate-200 bg-white'} p-4 mb-3">
        <div class="flex items-center justify-between mb-1.5">
          <span class="font-heading font-black text-lg text-slate-800">Nivel ${escapeHTML(d.nivel)}</span>
          ${d.listo
            ? `<span class="bg-green-500 text-white text-[10px] font-black px-2.5 py-1 rounded-full uppercase tracking-wide">🎓 Disponible</span>`
            : `<span class="text-xs font-black text-slate-400">${d.pct}%</span>`}
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${d.pct}%${d.listo ? '; background: linear-gradient(90deg,#16a34a,#4ade80)' : ''}"></div></div>
        <p class="text-sm mt-2 text-slate-500">
          ${d.listo
            ? `Dominaste las <b class="text-green-600">${d.total}</b> palabras del nivel. ¡Tu certificado te espera! 🎉`
            : `Dominadas <b class="text-slate-700">${d.dominadas}</b> de <b class="text-slate-700">${d.total}</b> · <b class="text-[#FF7A00]">te faltan ${d.faltan} palabra${d.faltan === 1 ? '' : 's'}</b> por dominar.`}
        </p>
        ${d.listo
          ? `<button class="cert-ask btn-juice bg-green-500 text-white font-bold py-2.5 rounded-xl w-full mt-3" data-nivel="${escapeHTML(d.nivel)}">Pedir certificado 📜</button>`
          : `<button class="cert-lock w-full mt-3 py-2.5 rounded-xl font-bold bg-slate-100 text-slate-400 cursor-not-allowed" disabled>🔒 Pedir certificado</button>`}
      </div>`).join('');

    el.innerHTML = `
      <p class="text-slate-500 text-sm text-center mb-4">
        Cuando tengas <b>todas las palabras de un nivel dominadas</b> 🏅 recibes tu <b>certificado de Abulingo</b> de ese nivel.
      </p>
      ${tarjetas}
      <p class="text-[11px] text-slate-400 text-center mt-3">
        Una palabra queda <b>dominada</b> cuando la marcas <b>Fácil</b> y aciertas sus ejercicios 👁️ y 👂, o cuando se gradúa 🎓 tras varios repasos correctos.
        Puedes seguir repasando palabras de niveles anteriores sin cambiar de nivel. 🔁
      </p>`;

    el.querySelectorAll('.cert-ask').forEach(b => {
      b.onclick = () => {
        triggerConfetti();
        window.open(certWhatsAppURL(b.dataset.nivel), '_blank', 'noopener');
      };
    });

  /* ============================================================
     13.6. MAZO — tu propio grupo de palabras, guardado en Supabase
     ------------------------------------------------------------
     · Las palabras viven en la tabla "mazo" (una fila por palabra,
       enlazada a "palabras" por word_id).
     · El avance vive en la tabla "mazo_flujo" (JSON), igual que
       "flujo" en profiles: puedes salirte y retomar donde ibas.
     · El Excel solo hace falta la primera vez. Después basta la M.
  ============================================================ */
  let mazoSession = null;
  let mazoCount = 0;

  // ---------- Lectura del mazo ----------
  async function cargarMazo() {
    const { data: filas, error } = await dbClient.from('mazo')
      .select('id, ingles, espanol, word_id')
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: true });
    if (error) { console.error('[mazo] no se pudo leer:', error.message); return { error, filas: [], words: [] }; }

    const ids = (filas || []).filter(f => f.word_id).map(f => f.word_id);
    let words = [];
    if (ids.length) {
      const { data } = await dbClient.from('palabras').select('*').in('id', ids);
      words = data || [];
    }

    // Mazos guardados antes de existir word_id: se buscan por nombre y se reparan solos.
    const sinId = (filas || []).filter(f => !f.word_id);
    if (sinId.length) {
      const halladas = await buscarPalabrasMazo(sinId.map(f => f.ingles));
      sinId.forEach(f => {
        const w = halladas.find(x => (x.ingles || '').toLowerCase() === (f.ingles || '').toLowerCase());
        if (w) {
          words.push(w);
          dbClient.from('mazo').update({ word_id: w.id }).eq('id', f.id).then(() => {});
        }
      });
    }

    // Mismo orden en que las cargó la persona
    const orden = new Map((filas || []).map((f, k) => [(f.ingles || '').toLowerCase(), k]));
    words.sort((a, b) => (orden.get((a.ingles || '').toLowerCase()) ?? 999) - (orden.get((b.ingles || '').toLowerCase()) ?? 999));
    return { filas: filas || [], words };
  }

  // Busca palabras del Excel en la tabla "palabras" (tolerante a mayúsculas).
  async function buscarPalabrasMazo(listaIngles) {
    const unicas = [...new Set(listaIngles.map(w => (w || '').toString().trim()).filter(Boolean))];
    if (!unicas.length) return [];
    const variantes = [...new Set(unicas.flatMap(w => [
      w, w.toLowerCase(), w.toUpperCase(),
      w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()
    ]))];
    const { data, error } = await dbClient.from('palabras').select('*').in('ingles', variantes);
    if (error) { console.error('[mazo] error buscando palabras:', error.message); return []; }
    const vistos = new Set(); const out = [];
    (data || []).forEach(w => {
      const k = (w.ingles || '').toLowerCase();
      if (!vistos.has(k)) { vistos.add(k); out.push(w); }
    });
    return out;
  }

  // ---------- Flujo del mazo (tabla mazo_flujo) ----------
  async function leerMazoFlujo() {
    const { data, error } = await dbClient.from('mazo_flujo').select('flujo')
      .eq('user_id', currentUser.id).maybeSingle();
    if (error) { console.warn('[mazo] flujo:', error.message); return null; }
    return data?.flujo || null;
  }
  function estadoMazo() {
    const ms = mazoSession;
    if (!ms) return { pendiente: false };
    return {
      pendiente: true,
      phase: ms.phase,
      index: ms.index,
      correct: ms.correct,
      wrong: ms.wrong,
      ids: ms.words.map(w => w.id),
      queue: (ms.queue || []).map(q => ({ id: q.word.id, type: q.type })),
      total: ms.words.length,
      updated: new Date().toISOString()
    };
  }
  function guardarMazoFlujo() {
    if (!currentUser) return;
    dbClient.from('mazo_flujo')
      .upsert({ user_id: currentUser.id, flujo: estadoMazo(), updated_at: new Date().toISOString() }, { onConflict: 'user_id' })
      .then(({ error }) => { if (error) console.warn('[mazo] no se pudo guardar el avance:', error.message); });
  }
  async function limpiarMazoFlujo() {
    await dbClient.from('mazo_flujo').delete().eq('user_id', currentUser.id);
  }

  // ---------- Insignia del botón "M" ----------
  async function refreshMazoBadge() {
    if (!currentUser) return 0;
    const { count } = await dbClient.from('mazo')
      .select('id', { count: 'exact', head: true }).eq('user_id', currentUser.id);
    mazoCount = count || 0;
    const b = document.getElementById('mazo-badge');
    if (b) {
      b.textContent = mazoCount > 99 ? '99+' : mazoCount;
      b.classList.toggle('hidden', mazoCount === 0);
      b.classList.toggle('flex', mazoCount > 0);
    }
    const m = document.getElementById('mazo-menu-count');
    if (m) m.textContent = mazoCount ? `${mazoCount} palabras` : '';
    return mazoCount;
  }

  // ---------- Botón "M": entra directo, sin Excel ----------
  async function abrirMazoRapido() {
    if (!currentUser) return;
    const { words, error } = await cargarMazo();
    if (error) { showToast('⚠️ No se pudo leer tu mazo.'); return openMazo(); }
    if (!words.length) {
      showToast('🃏 Tu mazo está vacío: carga un Excel una sola vez.');
      return openMazo();
    }
    const guardado = await leerMazoFlujo();
    if (guardado && guardado.pendiente && (guardado.index || 0) > 0) {
      const hechas = guardado.phase === 'practice' ? (guardado.total || words.length) + guardado.index : guardado.index;
      const totales = (guardado.total || words.length) * 2;
      return showModal({
        icon: '🃏', title: 'Tienes un mazo a medias',
        body: `Ibas en el paso <b>${Math.min(hechas, totales)}</b> de ${totales}. ¿Sigues donde lo dejaste?`,
        actions: [
          { label: 'Continuar 👉', onClick: () => { closeModal(); startMazoPractice(words, guardado); } },
          { label: 'Empezar de nuevo', style: 'bg-slate-100 text-slate-500', onClick: async () => { closeModal(); await limpiarMazoFlujo(); startMazoPractice(words); } }
        ]
      });

  }

  // ---------- Panel del mazo ----------

      ${huerfanas.length ? `<p class="text-[11px] text-amber-600 bg-amber-50 border border-amber-200 rounded-lg px-2 py-1.5 mb-3">${huerfanas.length} palabra(s) de tu mazo no están en la base de datos y no se pueden practicar: ${escapeHTML(huerfanas.slice(0, 4).map(f => f.ingles).join(', '))}${huerfanas.length > 4 ? '…' : ''}</p>` : ''}

  /* Carga bajo demanda de SheetJS. Devuelve true si quedó disponible.
     Se guarda la promesa para que dos clics seguidos no bajen el script
     dos veces. */
  let xlsxPromesa = null;
  function cargarXLSX() {
    if (window.XLSX) return Promise.resolve(true);
    if (xlsxPromesa) return xlsxPromesa;
    xlsxPromesa = new Promise((resolve) => {
      const sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      sc.onload = () => resolve(!!window.XLSX);
      sc.onerror = () => { xlsxPromesa = null; resolve(false); };
      document.head.appendChild(sc);
    });
    return xlsxPromesa;
  }

  // ---------- Carga del Excel: AÑADE, no reemplaza ----------
  async function procesarExcelMazo(file) {
    const status = document.getElementById('mz-status');
    const setSt = (html) => { if (status) status.innerHTML = html; };
    if (!file) return;
    /* El lector de Excel (900 KB) ya no se descarga con la página: solo se
       pide la primera vez que alguien carga un archivo en el Mazo, que es
       una acción poco frecuente. Así todo el mundo ahorra esos 900 KB. */
    if (!window.XLSX) {
      setSt('⏳ Preparando el lector de Excel...');
      const ok = await cargarXLSX();
      if (!ok) return setSt('⚠️ No se pudo cargar el lector de Excel. Revisa tu conexión e inténtalo otra vez.');
      setSt('');
    }

    try {
      setSt('⏳ Leyendo el archivo...');
      const wb = XLSX.read(await file.arrayBuffer());
      const hoja = wb.Sheets[wb.SheetNames[0]];
      const filas = XLSX.utils.sheet_to_json(hoja, { defval: '' });
      if (!filas.length) return setSt('❌ El Excel está vacío.');

      const clave = Object.keys(filas[0]).find(k => k.trim().toLowerCase().replace(/é/g, 'e') === 'ingles');
      if (!clave) return setSt('❌ El Excel debe tener una columna llamada <b>ingles</b>.');

      const lista = filas.map(f => (f[clave] || '').toString().trim()).filter(Boolean);
      if (!lista.length) return setSt('❌ La columna "ingles" está vacía.');

      setSt(`🔎 Buscando ${lista.length} palabra(s)...`);
      const halladas = await buscarPalabrasMazo(lista);
      if (!halladas.length) return setSt('❌ Ninguna de esas palabras existe en la base. Revisa la ortografía.');

      // Se añaden solo las que aún no están (el índice único de Supabase también lo impide)
      const { filas: yaGuardadas } = await cargarMazo();
      const existentes = new Set(yaGuardadas.map(f => (f.ingles || '').toLowerCase()));
      const nuevas = halladas.filter(w => !existentes.has((w.ingles || '').toLowerCase()));

      if (nuevas.length) {
        const { error: insErr } = await dbClient.from('mazo').insert(
          nuevas.map(w => ({ user_id: currentUser.id, ingles: w.ingles, espanol: w.espanol, word_id: w.id }))
        );
        if (insErr) {
          console.error('[mazo] insert:', insErr);
          return setSt('❌ No se pudo guardar: ' + escapeHTML(insErr.message) +
            '<br><span class="font-normal">Ejecuta <b>abulingo-supabase.sql</b> en Supabase.</span>');
        }
      }

      const repetidas = halladas.length - nuevas.length;
      const faltantes = lista.filter(l => !halladas.some(w => (w.ingles || '').toLowerCase() === l.toLowerCase()));
      await refreshMazoBadge();

      setSt(`✅ <b>${nuevas.length}</b> palabra(s) añadidas a tu mazo` +
        (repetidas ? ` · <span class="text-slate-400">${repetidas} ya estaban</span>` : '') +
        (faltantes.length ? ` · <span class="text-slate-400">${faltantes.length} no existen en la base</span>` : ''));

      const cont = document.getElementById('mz-actions');
      const { words } = await cargarMazo();
      if (cont) {
        cont.innerHTML = `
          <button id="mz-ahora" class="btn-juice bg-[#FF7A00] text-white font-bold py-2.5 rounded-xl w-full">🎯 Practicar ahora (${words.length})</button>
          <button id="mz-luego" class="mt-2 w-full text-xs font-bold text-slate-400 hover:text-slate-600">Guardar y estudiar después (botón M)</button>`;
        document.getElementById('mz-ahora').onclick = async () => { await limpiarMazoFlujo(); startMazoPractice(words); };
        document.getElementById('mz-luego').onclick = () => { closeModal(); showToast('🃏 Guardado. Toca la <b>M</b> cuando quieras estudiarlo.'); };
      }
    } catch (err) {
      console.error('[mazo] error leyendo el Excel:', err);
      setSt('❌ No se pudo leer el archivo. ¿Es un Excel válido (.xlsx, .xls o .csv)?');
    }
  }

  // ---------- Práctica del mazo (tarjetas → ejercicios) ----------
  function startMazoPractice(words, guardado = null) {
    closeModal();
    const lbl = document.getElementById('nivel-label');
    if (lbl) lbl.textContent = 'M';   // arriba se ve que estás en el mazo
    words.forEach(w => { groupCache.map[String(w.id)] = w; }); // para updateSRS e imágenes

    if (guardado && guardado.pendiente) {
      // Reanudar: mismo orden de palabras y misma cola de ejercicios
      const porId = new Map(words.map(w => [w.id, w]));
      const orden = (guardado.ids || []).map(id => porId.get(id)).filter(Boolean);
      const lista = orden.length ? orden : [...words];
      const pool = lista.map(w => w.ingles);
      const queue = (guardado.queue || [])
        .map(q => { const w = porId.get(q.id); return w ? { word: w, type: q.type,
          options: q.type === 'select_by_image' ? buildOptions(w.ingles, pool.length >= 4 ? pool : [w.ingles, 'yes', 'no', 'time']) : null } : null; })
        .filter(Boolean);
      mazoSession = {
        words: lista, phase: guardado.phase || 'review', index: guardado.index || 0,
        queue, correct: guardado.correct || 0, wrong: guardado.wrong || 0
      };
      showToast('🃏 Retomamos donde ibas.');
      return nextMazoStep();
    }

    mazoSession = { words: [...words].sort(() => Math.random() - 0.5), phase: 'review', index: 0, queue: [], correct: 0, wrong: 0 };
    guardarMazoFlujo();
    renderMessage('🃏', '¡Tu mazo personalizado!',
      `Vamos con <b>${words.length}</b> palabra(s) de tu mazo: primero tarjetas ✨ y luego ejercicios 👁️👂.<br>Su progreso también entra a tu memoria espaciada. 🧠<br><span class="text-xs text-slate-400">Si sales, retomas donde ibas.</span>`,
      '¡Empezar! 🚀', () => nextMazoStep());
  }

  async function nextMazoStep() {
    const ms = mazoSession;
    if (!ms) return runFlow();

    // Fase 1: tarjetas
    if (ms.phase === 'review') {
      if (ms.index >= ms.words.length) {
        ms.phase = 'practice'; ms.index = 0;
        const pool = ms.words.map(w => w.ingles);
        const opciones = (w) => buildOptions(w.ingles, pool.length >= 4 ? pool : [w.ingles, 'yes', 'no', 'time']);
        // También aquí: los dos ejercicios por palabra, para que puedan dominarse.
        const r1 = ms.words.filter(w => w.imagen).map(w => ({ word: w, type: 'select_by_image', options: opciones(w) }));
        const r2 = ms.words.map(w => ({ word: w, type: 'write_by_audio', options: null }));
        // Intercalado aleatorio 👁️/👂 (los dos ejercicios de una palabra no van pegados)
        ms.queue = mezclarEjercicios([...r1, ...r2]);
        guardarMazoFlujo();
        showEncouragement(() => nextMazoStep());
        return;
      }
      const w = ms.words[ms.index];
      updateProgressBar((ms.index / (ms.words.length * 2)) * 100);
      appContainer.innerHTML = flashcardHTML(w, ms.index + 1, ms.words.length);
      bindFlashcard(w, async (res) => {
        await updateSRS(w.id, res, { type: 'flashcard' });
        ms.index++;
        guardarMazoFlujo();
        nextMazoStep();
      }, ms.index + 1, ms.words.length);
      return;
    }

    // Fase 2: ejercicios
    if (ms.index >= ms.queue.length) {
      const c = ms.correct, f = ms.wrong, total = ms.words.length;
      mazoSession = null;
      await limpiarMazoFlujo();
      const lbl = document.getElementById('nivel-label');
      if (lbl) lbl.textContent = flujo.currentNivel;
      playSound('complete'); triggerConfetti();
      showModal({
        icon: '🃏', title: '¡Mazo completado!',
        body: `<span class="text-green-600 font-bold">${c} aciertos</span> · <span class="text-slate-400">${f} fallos</span> de ${total} palabras.<br>Ya entraron a tu ciclo de memoria espaciada. 🧠`,
        dismissable: false,
        actions: [
          { label: 'Practicar de nuevo 🔁', onClick: async () => { closeModal(); const { words } = await cargarMazo(); startMazoPractice(words); } },
          { label: 'Volver a mis lecciones', style: 'bg-slate-100 text-slate-500', onClick: () => { closeModal(); runFlow(); } }
        ]
      });
      return;
    }

    const ex = ms.queue[ms.index];
    updateProgressBar(((ms.words.length + ms.index) / (ms.words.length + ms.queue.length)) * 100);
    const avanzar = async (ok, type) => {
      if (ok) ms.correct++; else ms.wrong++;
      await updateSRS(ex.word.id, ok ? 'practice_correct' : 'practice_wrong', { type });
      ms.index++;
      guardarMazoFlujo();
      setTimeout(() => nextMazoStep(), ok ? 1000 : 2000);
    };
    if (ex.type === 'select_by_image') renderSelectImage(ex.word, ex.options, (ok) => avanzar(ok, 'select_by_image'));
    else renderWriteAudio(ex.word, (ok) => avanzar(ok, 'write_by_audio'));
  }

  /* ============================================================
     14. PANTALLAS AUXILIARES
  ============================================================ */
  function renderMessage(icon, title, html, actionLabel, onAction) {
    appContainer.innerHTML = `
      <div class="card-3d p-10 text-center animate-pop mt-6">
        <div class="text-6xl mb-4">${icon}</div>
        <h1 class="text-2xl font-heading font-bold text-slate-800 mb-2">${title}</h1>
        <p class="text-slate-500 mb-6">${html}</p>
        ${actionLabel ? `<button id="msg-action" class="btn-juice bg-[#FF7A00] text-white font-bold py-3 px-8 rounded-xl text-lg">${actionLabel}</button>` : ''}
      </div>`;
    if (actionLabel && onAction) document.getElementById('msg-action').onclick = onAction;
  }

  /* ============================================================
     14.9. CLUB DE CONVERSACIÓN  —  se dibuja en el <main>, no en modal
     ------------------------------------------------------------
     Cuatro pestañas:
       📅 Salas    → quedadas por Google Meet  (club_sesiones + club_participantes)
       🎭 Guiones  → conversaciones listas para actuar  (tabla "conversaciones")
       💬 Chat     → mensajes entre estudiantes        (club_mensajes)
       👥 En línea → quién está conectado ahora        (club_presencia)

     La tabla "conversaciones" ya existía: cada fila es un GUIÓN
     (titulo · conversacion · cantidad de papeles · nivel_ingles).
     El guion se parte por líneas "Rol: frase", se reparten los
     papeles como en una obra de teatro y el grupo se ve por Meet.

     El SQL de las tablas nuevas está en abulingo-club.sql.
  ============================================================ */
  const CLUB_MSG_MAX_LEN     = 400;   // largo máximo de un mensaje del chat
  const CLUB_MSG_POINTS      = 2;     // puntos por mensaje escrito en el club
  const CLUB_MSG_DAILY_MAX   = 10;    // mensajes que dan puntos al día
  const CLUB_JOIN_POINTS     = 10;    // puntos por apuntarte a una sala (1 vez al día)
  const CLUB_ONLINE_MIN      = 3;     // minutos para seguir contando como "en línea"
  const CLUB_LATIDO_MS       = 45000; // cada cuánto se refresca tu presencia
  const CLUB_TICK_MS         = 6000;  // cada cuánto se refresca la pestaña abierta
  const MEET_NUEVO_URL       = 'https://meet.google.com/new';

  let clubTab       = 'salas';     // 'salas' | 'guiones' | 'chat' | 'gente'
  let clubSala      = 'general';   // sala del chat: 'general' o un nivel
  let clubGuionOpen = null;        // id del guion que está desplegado
  let clubGuionRol  = {};          // { idGuion: 'rolElegido' } para resaltar tus frases
  let clubTimer     = null;
  let clubLatidoT   = null;
  let clubUltId     = 0;           // último id de mensaje pintado (para no re-scrollear)

  const clubActivo = () => !!document.getElementById('club-root');
  const miNivel    = () => flujo?.currentNivel || userProfile?.nivel || 'A1';
  const miNombre   = () => primerNombre(userProfile?.full_name, 'Estudiante');

  // "hace 2 min", "ayer 15:04"...
  function clubHora(iso) {
    if (!iso) return '';
    const d = new Date(iso), min = Math.round((Date.now() - d.getTime()) / 60000);
    if (min < 1) return 'ahora';
    if (min < 60) return `hace ${min} min`;
    if (d.toDateString() === new Date().toDateString()) return d.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
    return d.toLocaleString('es', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  }
  function clubCuando(iso) {
    if (!iso) return 'Sin hora fija';
    const d = new Date(iso);
    const hoy = d.toDateString() === new Date().toDateString();
    const txt = d.toLocaleString('es', { weekday: hoy ? undefined : 'short', day: hoy ? undefined : '2-digit', month: hoy ? undefined : 'short', hour: '2-digit', minute: '2-digit' });
    return (hoy ? 'Hoy ' : '') + txt;
  }
  const dtLocalValue = (d) => {
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  const nivelChip = (n, extra = '') =>
    `<span class="shrink-0 bg-orange-100 text-[#FF7A00] text-[10px] font-black px-2 py-0.5 rounded-full ${extra}">${escapeHTML(n || '—')}</span>`;
  const inicialHTML = (nombre) =>
    `<span class="shrink-0 w-8 h-8 rounded-full bg-gradient-to-br from-[#FF7A00] to-orange-600 text-white font-black flex items-center justify-center text-sm">${escapeHTML((nombre || '?').slice(0, 1).toUpperCase())}</span>`;

  // Mensaje de ayuda cuando falta una tabla o una política RLS.
  function clubErrorHTML(error, tabla) {
    return `<div class="text-center py-6">
      <p class="text-red-500 font-bold">No se pudo leer <b>${escapeHTML(tabla)}</b>.</p>
      <p class="text-slate-400 text-xs mt-2">${escapeHTML(error?.message || '')}</p>
      <p class="text-slate-400 text-xs mt-2">Ejecuta <b>abulingo-club.sql</b> en el editor SQL de Supabase: crea las tablas del Club y sus políticas RLS.</p>
    </div>`;
  }

  /* ---------- Guiones: JSON {personajes, escena, lineas:[...]} → papeles + frases ----------
     "conversacion" guarda JSON (mismo formato que ya usa el módulo Dominar,
     ver cargarContenidoDominar): { personajes:["Emily","Carlos"],
     escena:"...", lineas:[{speaker,en,es,audio,target_phrases}] }.
     "Tu papel" sale SIEMPRE de "personajes" (los nombres reales), nunca de
     la columna "cantidad" (que es solo un contador, no una lista). Se
     guarda una caché por guion para no volver a JSON.parse en cada pintada. */
  const guionParseCache = {};
  function parsearGuion(texto, cantidad, id) {
    const cacheKey = id != null ? String(id) : texto;
    if (guionParseCache[cacheKey]) return guionParseCache[cacheKey];

    let parsed = null;
    try { parsed = JSON.parse(texto); } catch { parsed = null; }

    let resultado;
    if (parsed && Array.isArray(parsed.lineas) && parsed.lineas.length) {
      const roles = Array.isArray(parsed.personajes) && parsed.personajes.length
        ? parsed.personajes.slice()
        : [...new Set(parsed.lineas.map(l => l.speaker).filter(Boolean))];
      const lineas = [];
      if (parsed.escena) lineas.push({ rol: null, texto: parsed.escena });
      parsed.lineas.forEach(l => {
        if (!l || !l.speaker || !l.en) return;
        lineas.push({ rol: l.speaker, texto: l.en, es: l.es || '', audio: l.audio || null });
      });
      resultado = { roles, lineas };
    } else {
      // Respaldo: formato viejo de texto plano "Rol: frase" por línea.
      const lineas = [], roles = [];
      (texto || '').replace(/\r/g, '').split('\n').map(l => l.trim()).filter(Boolean).forEach(l => {
        const m = l.match(/^([A-Za-zÁÉÍÓÚÑáéíóúñ0-9 .'-]{1,24}):\s*(.+)$/);
        if (m && m[1].trim().split(/\s+/).length <= 3) {
          const rol = m[1].trim();
          if (!roles.includes(rol)) roles.push(rol);
          lineas.push({ rol, texto: m[2].trim() });
        } else {
          lineas.push({ rol: null, texto: l });
        }
      });
      if (!roles.length) {
        const n = Math.max(2, parseInt(cantidad) || 2);
        for (let i = 0; i < n; i++) roles.push(`Papel ${String.fromCharCode(65 + i)}`);
      }
      resultado = { roles, lineas };
    }
    guionParseCache[cacheKey] = resultado;
    return resultado;
  }

  /* ---------- Presencia (quién está conectado) ---------- */
  async function clubLatido() {
    if (!currentUser) return;
    await dbClient.from('club_presencia').upsert({
      user_id: currentUser.id,
      nombre: miNombre(),
      nivel: miNivel(),
      visto_at: new Date().toISOString()
    }, { onConflict: 'user_id' });
  }
  async function clubSalirPresencia() {
    if (!currentUser) return;
    try { await dbClient.from('club_presencia').delete().eq('user_id', currentUser.id); } catch { /* da igual */ }
  }

  /* ---------- Entrada / salida de la sección ---------- */
  function openClub() {
    if (!puedeHerramientas()) return mostrarBloqueoPlan('El Club de conversación (guiones, salas y chat con otros estudiantes) es una función de los planes de pago.');
    closeModal();
    marcarHerramientaActiva('club'); // closeModal() limpia el estado activo, así que se marca DESPUÉS
    stopSpeaking();
    toolsBar.classList.remove('hidden');
    updateProgressBar(0);

    appContainer.innerHTML = `
      <div id="club-root" class="animate-pop mt-1">
        <div class="card-3d p-3 sm:p-4">
          <div class="flex items-center gap-2 mb-3">
            <span class="bg-blue-100 text-blue-600 px-2.5 py-1 rounded-full text-[11px] font-black uppercase shrink-0">👥 Club</span>
            <div class="flex-1 min-w-0">
              <p class="text-[11px] font-bold text-slate-400 leading-tight truncate">Practica inglés con otros estudiantes</p>
            </div>
            ${nivelChip(miNivel())}
            <button id="club-exit" title="Volver a mis lecciones" class="shrink-0 w-7 h-7 rounded-full text-slate-300 hover:text-slate-500 hover:bg-slate-100 transition">&times;</button>
          </div>

          <div class="no-bar flex gap-1.5 overflow-x-auto whitespace-nowrap mb-3">
            <button data-club-tab="salas"   class="club-tab btn-juice font-bold text-[11px] px-3 py-1.5 rounded-xl">📅 Salas</button>
            <button data-club-tab="guiones" class="club-tab btn-juice font-bold text-[11px] px-3 py-1.5 rounded-xl">🎭 Guiones</button>
            <button data-club-tab="chat"    class="club-tab btn-juice font-bold text-[11px] px-3 py-1.5 rounded-xl">💬 Chat</button>
            <button data-club-tab="gente"   class="club-tab btn-juice font-bold text-[11px] px-3 py-1.5 rounded-xl">👥 En línea</button>
          </div>

          <div id="club-body" class="text-left">${spinnerHTML()}</div>
        </div>

        <button id="club-back" class="w-full mt-3 text-center text-xs font-bold text-slate-400 hover:text-[#FF7A00] transition py-2">
          <i class="fas fa-arrow-left mr-1"></i> Volver a mis lecciones
        </button>
      </div>`;

    document.getElementById('club-exit').onclick = salirClub;
    document.getElementById('club-back').onclick = salirClub;
    appContainer.querySelectorAll('[data-club-tab]').forEach(b => {
      b.onclick = () => { clubTab = b.dataset.clubTab; clubPintarTabs(); clubRenderTab(); };
    });

    clubPintarTabs();
    clubRenderTab();

    clubLatido();
    clearInterval(clubLatidoT);
    clubLatidoT = setInterval(() => { clubActivo() ? clubLatido() : clearInterval(clubLatidoT); }, CLUB_LATIDO_MS);

    clearInterval(clubTimer);
    clubTimer = setInterval(() => {
      if (!clubActivo()) return clearInterval(clubTimer);
      if (document.hidden) return;
      if (clubTab === 'chat') clubCargarMensajes();
      else if (clubTab === 'gente') renderClubGente();
      else if (clubTab === 'salas' && !document.getElementById('club-form-sala')) renderClubSalas();
    }, CLUB_TICK_MS);
  }

  function salirClub() {
    clearInterval(clubTimer); clearInterval(clubLatidoT);
    clubSalirPresencia();
    stopSpeaking();
    marcarHerramientaActiva(null);
    runFlow();
  }

  function clubPintarTabs() {
    appContainer.querySelectorAll('[data-club-tab]').forEach(b => {
      const on = b.dataset.clubTab === clubTab;
      b.className = `club-tab btn-juice font-bold text-[11px] px-3 py-1.5 rounded-xl ${on ? 'bg-[#FF7A00] text-white' : 'bg-slate-100 text-slate-500'}`;
    });
  }

  function clubRenderTab() {
    if (clubTab === 'salas')   return renderClubSalas();
    if (clubTab === 'guiones') return renderClubGuiones();
    if (clubTab === 'chat')    return renderClubChat();
    return renderClubGente();
  }

  /* ============================================================
     CLUB · PESTAÑA "SALAS"  (quedadas por Meet con papeles repartidos)
  ============================================================ */
  async function renderClubSalas() {
    const el = document.getElementById('club-body');
    if (!el) return;
    if (!el.dataset.tab || el.dataset.tab !== 'salas') { el.dataset.tab = 'salas'; el.innerHTML = spinnerHTML(); }

    // Se muestran las salas abiertas y las que empezaron hace menos de 2 h.
    const desde = new Date(Date.now() - 2 * 3600000).toISOString();
    const { data: sesiones, error } = await dbClient.from('club_sesiones')
      .select('*')
      .eq('estado', 'abierta')
      .or(`inicia_at.gte.${desde},inicia_at.is.null`)
      .order('inicia_at', { ascending: true })
      .limit(40);
    if (error) { el.innerHTML = clubErrorHTML(error, 'club_sesiones'); return; }

    const ids = (sesiones || []).map(s => s.id);
    let participantes = [];
    if (ids.length) {
      const { data } = await dbClient.from('club_participantes').select('*').in('sesion_id', ids);
      participantes = data || [];
    }
    const porSesion = {};
    participantes.forEach(p => { (porSesion[p.sesion_id] = porSesion[p.sesion_id] || []).push(p); });

    const tarjetas = (sesiones || []).map(s => {
      const gente = porSesion[s.id] || [];
      const yo = gente.find(p => p.user_id === currentUser.id);
      const soyAnfitrion = s.anfitrion_id === currentUser.id;
      const lleno = gente.length >= (s.cupos || 2);
      const libres = Math.max(0, (s.cupos || 2) - gente.length);

      const listaGente = gente.length ? `
        <div class="flex flex-wrap gap-1.5 mt-2">
          ${gente.map(p => `
            <span class="inline-flex items-center gap-1 bg-white border border-slate-200 rounded-full pl-1 pr-2 py-0.5 text-[11px] font-bold text-slate-600">
              <span class="w-5 h-5 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-[10px] font-black">${escapeHTML((p.nombre || '?').slice(0, 1).toUpperCase())}</span>
              ${escapeHTML(primerNombre(p.nombre))}
              <span class="text-[9px] text-[#FF7A00] font-black">${escapeHTML(p.nivel || '')}</span>
              ${p.rol ? `<span class="text-[9px] text-slate-400">· ${escapeHTML(p.rol)}</span>` : ''}
            </span>`).join('')}
        </div>` : '<p class="text-[11px] text-slate-400 mt-2">Nadie se ha apuntado todavía. ¡Sé el primero! 🙌</p>';

      return `
        <div class="rounded-2xl border-2 ${yo ? 'border-orange-300 bg-orange-50' : 'border-slate-200 bg-white'} p-3 mb-2.5">
          <div class="flex items-start gap-2">
            <div class="flex-1 min-w-0">
              <p class="font-heading font-black text-slate-800 leading-tight">${escapeHTML(s.titulo)}</p>
              <p class="text-[11px] text-slate-400 mt-0.5">
                🕒 ${escapeHTML(clubCuando(s.inicia_at))} · 👤 ${escapeHTML(primerNombre(s.anfitrion_nombre))}
                · ${lleno ? '<b class="text-red-500">sin cupos</b>' : `<b class="text-green-600">${libres} cupo${libres === 1 ? '' : 's'}</b>`}
              </p>
            </div>
            ${nivelChip(s.nivel_ingles)}
          </div>
          ${s.notas ? `<p class="text-[11px] text-slate-500 mt-1.5 italic">“${escapeHTML(s.notas)}”</p>` : ''}
          ${listaGente}
          <div class="flex flex-wrap gap-1.5 mt-2.5">
            ${yo
              ? `<button class="cl-meet btn-juice bg-green-500 text-white font-bold text-[11px] px-3 py-1.5 rounded-xl" data-url="${escapeHTML(s.meet_url || '')}"><i class="fab fa-google mr-1"></i>Entrar al Meet</button>
                 <button class="cl-rol bg-white border border-slate-200 text-slate-600 font-bold text-[11px] px-3 py-1.5 rounded-xl hover:border-[#FF7A00]" data-id="${s.id}" data-conv="${s.conversacion_id || ''}">🎭 Mi papel${yo.rol ? `: ${escapeHTML(yo.rol)}` : ''}</button>
                 <button class="cl-salir text-slate-400 hover:text-red-500 font-bold text-[11px] px-2 py-1.5" data-id="${s.id}">Salir</button>`
              : `<button class="cl-unir btn-juice ${lleno ? 'bg-slate-200 text-slate-400' : 'bg-[#FF7A00] text-white'} font-bold text-[11px] px-3 py-1.5 rounded-xl" data-id="${s.id}" data-conv="${s.conversacion_id || ''}" ${lleno ? 'disabled' : ''}>${lleno ? 'Sala llena' : 'Unirme 🙋'}</button>`}
            ${s.conversacion_id ? `<button class="cl-guion bg-white border border-slate-200 text-slate-600 font-bold text-[11px] px-3 py-1.5 rounded-xl hover:border-[#FF7A00]" data-conv="${s.conversacion_id}">Ver guion 📜</button>` : ''}
            ${soyAnfitrion ? `<button class="cl-cerrar text-slate-400 hover:text-red-500 font-bold text-[11px] px-2 py-1.5 ml-auto" data-id="${s.id}">Cerrar sala</button>` : ''}
          </div>
        </div>`;
    }).join('');

    el.innerHTML = `
      <button id="cl-nueva" class="btn-juice bg-[#FF7A00] text-white font-bold w-full py-2.5 rounded-xl mb-3">➕ Crear una sala de práctica</button>
      ${tarjetas || `<div class="text-center py-6">
        <p class="text-4xl mb-2">📅</p>
        <p class="text-slate-500 font-bold">No hay salas abiertas ahora.</p>
        <p class="text-slate-400 text-xs mt-1">Crea una, elige un guion 🎭 y comparte tu enlace de Meet: los demás se apuntan y se reparten los papeles.</p>

    el.querySelectorAll('.cl-rol').forEach(b => b.onclick = () => clubElegirRol(parseInt(b.dataset.id), b.dataset.conv ? parseInt(b.dataset.conv) : null));
    el.querySelectorAll('.cl-guion').forEach(b => b.onclick = () => { clubTab = 'guiones'; clubGuionOpen = parseInt(b.dataset.conv); clubPintarTabs(); renderClubGuiones(); });
    el.querySelectorAll('.cl-meet').forEach(b => b.onclick = () => {
      const u = b.dataset.url;
      if (!u) return showToast('⚠️ Esta sala no tiene enlace de Meet todavía.');
      window.open(u, '_blank', 'noopener');
    });
  }

    };

    document.getElementById('cs-crear-meet').onclick = () => window.open(MEET_NUEVO_URL, '_blank', 'noopener');
    document.getElementById('cs-cancelar').onclick = () => { const b = document.getElementById('club-body'); if (b) b.dataset.tab = ''; renderClubSalas(); };
    document.getElementById('cs-guardar').onclick = async () => {
      const errEl = document.getElementById('cs-error');
      const setErr = (m) => { errEl.textContent = m; errEl.classList.remove('hidden'); };
      const t = (titulo.value || '').trim();
      const meet = (document.getElementById('cs-meet').value || '').trim();
      const fecha = document.getElementById('cs-fecha').value;
      const nCupos = parseInt(cupos.value) || 2;
      if (!t) return setErr('Ponle un título a tu sala.');
      if (nCupos < 2) return setErr('Una sala necesita al menos 2 cupos.');
      if (meet && !/^https?:\/\//i.test(meet)) return setErr('El enlace del Meet debe empezar por https://');

      const fila = {
        anfitrion_id: currentUser.id,
        anfitrion_nombre: miNombre(),
        conversacion_id: sel.value ? parseInt(sel.value) : null,
        titulo: t,
        nivel_ingles: document.getElementById('cs-nivel').value,
        cupos: nCupos,
        meet_url: meet || null,
        inicia_at: fecha ? new Date(fecha).toISOString() : null,
        notas: (document.getElementById('cs-notas').value || '').trim() || null,
        estado: 'abierta'
      };
      const { data, error } = await dbClient.from('club_sesiones').insert(fila).select().maybeSingle();
      if (error) return setErr('No se pudo crear: ' + error.message);

      // El anfitrión queda apuntado con el primer papel del guion.
      let rol = null;
      if (fila.conversacion_id) {
        const { data: c } = await dbClient.from('conversaciones').select('conversacion, cantidad').eq('id', fila.conversacion_id).maybeSingle();
        if (c) rol = parsearGuion(c.conversacion, c.cantidad, c.id).roles[0] || null;
      }
      await dbClient.from('club_participantes').insert({
        sesion_id: data.id, user_id: currentUser.id, nombre: miNombre(), nivel: miNivel(), rol
      });

      triggerConfetti();
      showToast('📅 ¡Sala creada! Comparte el enlace con el club.');
      const b = document.getElementById('club-body'); if (b) b.dataset.tab = '';
      renderClubSalas();
    };
  }

  async function clubUnirse(sesionId, convId) {
    const { data: s } = await dbClient.from('club_sesiones').select('cupos, titulo').eq('id', sesionId).maybeSingle();
    const { data: gente } = await dbClient.from('club_participantes').select('user_id, rol').eq('sesion_id', sesionId);
    const ocupados = gente || [];
    if (ocupados.some(p => p.user_id === currentUser.id)) return renderClubSalas();
    if (ocupados.length >= (s?.cupos || 2)) { showToast('😅 Alguien tomó el último cupo.'); return renderClubSalas(); }

    // Papel libre del guion (si la sala tiene uno).
    let rol = null;
    if (convId) {
      const { data: c } = await dbClient.from('conversaciones').select('conversacion, cantidad').eq('id', convId).maybeSingle();
      if (c) {
        const tomados = ocupados.map(p => p.rol).filter(Boolean);
        rol = parsearGuion(c.conversacion, c.cantidad, c.id).roles.find(r => !tomados.includes(r)) || null;
      }
    }
    const { error } = await dbClient.from('club_participantes')
      .insert({ sesion_id: sesionId, user_id: currentUser.id, nombre: miNombre(), nivel: miNivel(), rol });
    if (error) { showToast('⚠️ No se pudo entrar: ' + escapeHTML(error.message)); return; }

    ensureDaily();
    if ((flujo.daily.club.joins || 0) < 1) {
      flujo.daily.club.joins = 1;
      await updateUserFlow();
      await addPoints(CLUB_JOIN_POINTS);
    }
    triggerConfetti();
    showToast(rol ? `🎭 ¡Dentro! Tu papel es <b>${escapeHTML(rol)}</b>.` : '🙌 ¡Te apuntaste a la sala!');
    renderClubSalas();
  }

  async function clubSalirSala(sesionId) {
    await dbClient.from('club_participantes').delete().eq('sesion_id', sesionId).eq('user_id', currentUser.id);

     CLUB · PESTAÑA "GUIONES"  (tabla conversaciones)
  ============================================================ */
  let clubFiltroNivel = 'mi';   // 'mi' | 'todos' | nivel concreto

  async function renderClubGuiones() {
    const el = document.getElementById('club-body');
    if (!el) return;
    el.dataset.tab = 'guiones';
    el.innerHTML = spinnerHTML();

    let q = dbClient.from('conversaciones').select('*').order('nivel_ingles').order('titulo').limit(200);
    if (clubFiltroNivel === 'mi') q = q.ilike('nivel_ingles', miNivel());
    else if (clubFiltroNivel !== 'todos') q = q.ilike('nivel_ingles', clubFiltroNivel);
    const { data, error } = await q;
    if (error) { el.innerHTML = clubErrorHTML(error, 'conversaciones'); return; }

    const niveles = sortNiveles([...new Set([...NIVELES_FIJOS])]);
    const chip = (v, txt) => `<button data-filtro="${v}" class="cg-chip btn-juice ${clubFiltroNivel === v ? 'bg-[#FF7A00] text-white' : 'bg-slate-100 text-slate-500'} font-bold text-[11px] px-3 py-1.5 rounded-xl">${txt}</button>`;

    const tarjetas = (data || []).map(c => {
      const { roles, lineas } = parsearGuion(c.conversacion, c.cantidad, c.id);
      const abierto = clubGuionOpen === c.id;
      const miRol = clubGuionRol[c.id] || null;

      const cuerpo = !abierto ? '' : `
        <div class="mt-2 pt-2 border-t border-slate-100">
          <div class="flex flex-wrap gap-1.5 mb-2">
            <span class="text-[10px] font-black text-slate-400 uppercase self-center mr-1">Tu papel:</span>
            ${roles.map(r => `<button class="cg-rol text-[11px] font-bold px-2.5 py-1 rounded-lg border ${miRol === r ? 'bg-[#FF7A00] text-white border-[#FF7A00]' : 'bg-white text-slate-600 border-slate-200'}" data-id="${c.id}" data-rol="${escapeHTML(r)}">${escapeHTML(r)}</button>`).join('')}
          </div>
          <div class="bg-slate-50 rounded-xl border border-slate-100 p-2.5 max-h-72 overflow-y-auto space-y-1.5">
            ${lineas.map((l, i) => l.rol === null
              ? `<p class="text-[11px] text-slate-400 italic text-center">${escapeHTML(l.texto)}</p>`
              : `<div class="flex items-start gap-2 ${miRol && l.rol === miRol ? 'bg-orange-50 border border-orange-200' : 'bg-white border border-slate-100'} rounded-lg px-2 py-1.5">
                   <span class="shrink-0 text-[10px] font-black ${miRol && l.rol === miRol ? 'text-[#FF7A00]' : 'text-slate-400'} uppercase mt-0.5 w-14 truncate" title="${escapeHTML(l.rol)}">${escapeHTML(l.rol)}</span>
                   <span class="flex-1 text-sm text-slate-700 font-medium">${escapeHTML(l.texto)}</span>
                   <button class="cg-say shrink-0 text-slate-300 hover:text-[#FF7A00]" data-say="${escapeHTML(l.texto)}" data-audio="${escapeHTML(l.audio || '')}" title="Escuchar"><i class="fas fa-volume-up text-xs"></i></button>
                 </div>`).join('')}
          </div>
          <div class="flex flex-wrap gap-1.5 mt-2">
            <button class="cg-leer btn-juice bg-slate-100 text-slate-600 font-bold text-[11px] px-3 py-1.5 rounded-xl" data-id="${c.id}">🔊 Leer todo el guion</button>
            <button class="cg-sala btn-juice bg-[#FF7A00] text-white font-bold text-[11px] px-3 py-1.5 rounded-xl" data-id="${c.id}">📅 Crear sala con este guion</button>
          </div>
        </div>`;

      return `
        <div class="rounded-2xl border-2 ${abierto ? 'border-[#FF7A00]' : 'border-slate-200'} bg-white p-3 mb-2.5">
          <button class="cg-abrir w-full flex items-center gap-2 text-left" data-id="${c.id}">
            <span class="text-xl shrink-0">🎭</span>
            <span class="flex-1 min-w-0">
              <span class="block font-heading font-black text-slate-800 leading-tight truncate">${escapeHTML(c.titulo)}</span>
              <span class="block text-[11px] text-slate-400">${roles.length} papel${roles.length === 1 ? '' : 'es'} · ${lineas.filter(l => l.rol).length} frases</span>
            </span>
            ${nivelChip(c.nivel_ingles)}
            <i class="fas fa-chevron-${abierto ? 'up' : 'down'} text-slate-300 text-xs shrink-0"></i>
          </button>
          ${cuerpo}
        </div>`;
    }).join('');

    el.innerHTML = `
      <div class="no-bar flex gap-1.5 overflow-x-auto whitespace-nowrap mb-3">
        ${chip('mi', `⭐ Mi nivel (${miNivel()})`)}${chip('todos', 'Todos')}${niveles.map(n => chip(n, n)).join('')}

      ${tarjetas || `<div class="text-center py-6">

        <p class="text-slate-500 font-bold">No hay guiones para este filtro.</p>
