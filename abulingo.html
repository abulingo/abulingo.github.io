      </div>`}`;

    el.querySelectorAll('.cg-chip').forEach(b => b.onclick = () => { clubFiltroNivel = b.dataset.filtro; renderClubGuiones(); });
    el.querySelectorAll('.cg-abrir').forEach(b => b.onclick = () => {
      const id = parseInt(b.dataset.id);
      clubGuionOpen = clubGuionOpen === id ? null : id;
      stopSpeaking();
      renderClubGuiones();
    });
    el.querySelectorAll('.cg-rol').forEach(b => b.onclick = () => {
      const id = parseInt(b.dataset.id);
      clubGuionRol[id] = clubGuionRol[id] === b.dataset.rol ? null : b.dataset.rol;
      renderClubGuiones();
    });
    el.querySelectorAll('.cg-say').forEach(b => b.onclick = () => {
      stopSpeaking();
      if (b.dataset.audio) new Audio(b.dataset.audio).play().catch(() => speak(b.dataset.say));
      else speak(b.dataset.say);
    });
    el.querySelectorAll('.cg-leer').forEach(b => b.onclick = () => {
      const c = (data || []).find(x => x.id === parseInt(b.dataset.id));
      if (c) leerGuion(parsearGuion(c.conversacion, c.cantidad, c.id).lineas.filter(l => l.rol));
    });
    el.querySelectorAll('.cg-sala').forEach(b => b.onclick = async () => {
      clubTab = 'salas'; clubPintarTabs();
      await clubFormSala();
      const sel = document.getElementById('cs-conv');
      if (sel) { sel.value = b.dataset.id; sel.onchange(); }
    });
  }

  // Lee el guion completo, frase por frase, para ensayar la pronunciación.
  // Usa el audio real grabado de cada línea si existe; si no, cae a TTS.
  function leerGuion(lineas, i = 0) {
    if (!clubActivo() || i >= lineas.length) return stopSpeaking();
    const l = lineas[i];
    const siguiente = () => setTimeout(() => leerGuion(lineas, i + 1), 350);
    if (l.audio) {
      const a = new Audio(l.audio);
      a.onended = siguiente; a.onerror = () => speak(l.texto, siguiente);
      a.play().catch(() => speak(l.texto, siguiente));
    } else {
      speak(l.texto, siguiente);
    }
  }

  /* ============================================================
     CLUB · PESTAÑA "CHAT"  (mensajes entre estudiantes)

  function renderClubChat() {

    if (!el) return;
    el.dataset.tab = 'chat';

    const salas = ['general', ...NIVELES_FIJOS];
    const chips = salas.map(s => `
      <button data-sala="${s}" class="cc-sala btn-juice ${clubSala === s ? 'bg-[#FF7A00] text-white' : 'bg-slate-100 text-slate-500'} font-bold text-[11px] px-3 py-1.5 rounded-xl">

    el.innerHTML = `
      <div class="no-bar flex gap-1.5 overflow-x-auto whitespace-nowrap mb-2">${chips}</div>

      <div class="flex gap-2">

    el.querySelectorAll('.cc-sala').forEach(b => b.onclick = () => { clubSala = b.dataset.sala; renderClubChat(); });

  async function clubCargarMensajes() {
    const box = document.getElementById('cc-box');
    if (!box) return;
    const { data, error } = await dbClient.from('club_mensajes')
      .select('*').eq('sala', clubSala).order('id', { ascending: false }).limit(60);
    if (error) { box.innerHTML = clubErrorHTML(error, 'club_mensajes'); return; }

    const msgs = (data || []).slice().reverse();
    const maxId = msgs.length ? msgs[msgs.length - 1].id : 0;
    if (maxId === clubUltId && box.dataset.pintado === '1') return;   // nada nuevo
    const pegadoAbajo = box.scrollHeight - box.scrollTop - box.clientHeight < 60;

    box.innerHTML = msgs.length ? msgs.map(m => {
      const yo = m.user_id === currentUser.id;
      return `
        <div class="flex ${yo ? 'justify-end' : 'justify-start'} items-end gap-1.5">
          ${yo ? '' : inicialHTML(m.nombre)}
          <div class="${yo ? 'bg-[#FF7A00] text-white rounded-br-sm' : 'bg-white border border-slate-200 text-slate-800 rounded-bl-sm'} rounded-2xl px-3 py-2 max-w-[80%] shadow-sm">
            ${yo ? '' : `<div class="flex items-center gap-1.5 mb-0.5">
              <span class="text-[11px] font-black text-slate-600">${escapeHTML(primerNombre(m.nombre))}</span>
              ${nivelChip(m.nivel)}
            </div>`}
            <div class="font-medium leading-snug break-words">${escapeHTML(m.mensaje)}</div>
            <div class="flex items-center gap-2 mt-0.5">
              <span class="text-[9px] ${yo ? 'text-white/70' : 'text-slate-400'}">${escapeHTML(clubHora(m.created_at))}</span>
              <button class="cc-say text-[9px] ${yo ? 'text-white/70 hover:text-white' : 'text-slate-300 hover:text-[#FF7A00]'}" data-say="${escapeHTML(m.mensaje)}" title="Escuchar"><i class="fas fa-volume-up"></i></button>
              ${yo ? `<button class="cc-del text-[9px] text-white/70 hover:text-white ml-auto" data-id="${m.id}" title="Borrar"><i class="fas fa-trash"></i></button>` : ''}
            </div>
          </div>
        </div>`;
    }).join('') : `<p class="text-slate-400 text-center text-sm py-8">Todavía no hay mensajes en ${clubSala === 'general' ? 'la sala general' : 'la sala ' + clubSala}.<br>¡Saluda al club! 👋</p>`;

    box.dataset.pintado = '1';
    clubUltId = maxId;
    if (pegadoAbajo) box.scrollTop = box.scrollHeight;

    box.querySelectorAll('.cc-say').forEach(b => b.onclick = () => { stopSpeaking(); speak(b.dataset.say); });
    box.querySelectorAll('.cc-del').forEach(b => b.onclick = async () => {
      await dbClient.from('club_mensajes').delete().eq('id', parseInt(b.dataset.id)).eq('user_id', currentUser.id);
      box.dataset.pintado = '0';
      clubCargarMensajes();
    });
  }

  /* ---------- Filtro de contenido prohibido en el chat del Club ----------
     No se permite compartir redes/contacto ni números (ni en dígitos ni
     escritos), para evitar que los estudiantes se lleven la conversación
     fuera de la app. No se avisa al usuario: el mensaje simplemente NO
     se guarda (el input se limpia igual, como si se hubiera enviado). */
  const CLUB_PALABRAS_PROHIBIDAS = [
    'instagram', 'facebook', 'whatsapp', 'tiktok', 'telegram', 'snapchat',
    'twitter', 'gmail', 'hotmail', 'outlook', 'correo', 'email', 'e mail',
    'celular', 'telefono', 'numero'
  ];
  const CLUB_NUMEROS_TEXTO = [
    'cero', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez',
    'once', 'doce', 'trece', 'catorce', 'quince', 'dieciseis', 'diecisiete', 'dieciocho', 'diecinueve', 'veinte',
    'zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'
  ];
  function mensajeClubProhibido(texto) {
    if (/\d/.test(texto)) return true;                 // cualquier dígito
    const t = trSinAcentos(norm(texto));                 // minúsculas, sin puntuación ni tildes
    if (CLUB_PALABRAS_PROHIBIDAS.some(p => t.includes(p))) return true;
    const palabras = t.split(/\s+/).filter(Boolean);
    if (CLUB_NUMEROS_TEXTO.some(n => palabras.includes(n))) return true;
    return false;
  }

  async function clubEnviarMensaje() {
    const input = document.getElementById('cc-input');
    if (!input) return;
    const texto = (input.value || '').trim().slice(0, CLUB_MSG_MAX_LEN);
    if (!texto) return;
    input.value = '';
    input.focus();

    // Contenido prohibido: no se guarda ni se avisa, se comporta como si
    // se hubiera enviado con normalidad.
    if (mensajeClubProhibido(texto)) return;

    const { error } = await dbClient.from('club_mensajes').insert({
      user_id: currentUser.id, nombre: miNombre(), nivel: miNivel(), sala: clubSala, mensaje: texto
    });
    if (error) { showToast('⚠️ No se pudo enviar: ' + escapeHTML(error.message)); input.value = texto; return; }

    ensureDaily();
    if ((flujo.daily.club.msgs || 0) < CLUB_MSG_DAILY_MAX) {
      flujo.daily.club.msgs = (flujo.daily.club.msgs || 0) + 1;
      await updateUserFlow();
      await addPoints(CLUB_MSG_POINTS);
    }
    const box = document.getElementById('cc-box'); if (box) box.dataset.pintado = '0';
    clubCargarMensajes();
  }

  /* ============================================================
     15.5. TRADUCTOR — buscador español ⇄ inglés
     ------------------------------------------------------------
     Busca sobre la tabla "palabras" en LOS DOS SENTIDOS.

     El detalle importante: la columna "espanol" muchas veces trae
     VARIOS significados separados por comas, p. ej.
        ingles: "that"  ·  espanol: "ese, esa, eso, aquel, aquella, que"
     Un simple LIKE deja fuera a quien escribe "aquella" o "eso" y
     además ordena fatal (una coincidencia parcial pesa lo mismo que
     una exacta). Aquí cada significado se separa y se puntúa por
     separado, así que "aquella" encuentra "that" y sale de primero.

     También es insensible a acentos y mayúsculas ("mama" = "mamá"),
     tolera erratas ("hause" → "¿house?") y permite oír la palabra
     o mandarla al mazo sin salir del modal.
  ============================================================ */
  const TR_MAX_LOCAL = 8000;   // tope para cargar el diccionario en memoria
  const TR_MAX_RESULTS = 40;
  let trIndice = null;         // entradas preparadas (modo local)
  let trCarga = null;          // promesa de carga en curso
  let trModo = 'local';        // 'local' (todo en memoria) | 'remoto' (consulta por consulta)
  let trDir = 'auto';          // 'auto' | 'es' (escribo español) | 'en' (escribo inglés)
  let trUltimaBusqueda = 0;

  // Quita acentos SIN cambiar la longitud del texto (1 carácter → 1 carácter),
  // para poder resaltar la coincidencia sobre el texto original.
  const TR_MARCAS = new RegExp('[\\u0300-\\u036f]', 'g');   // tildes/diéresis ya separadas por NFD
  const trSinAcentos = (s) => (s || '').toString().normalize('NFD').replace(TR_MARCAS, '');
  const trHKey = (s) => trSinAcentos(s).toLowerCase();                  // conserva longitud
  const trKey = (s) => trHKey(s).replace(/[.,;:!?¡¿"'()[\]/|]/g, ' ').replace(/\s+/g, ' ').trim();

  // "ese, esa, eso; aquel / aquella" → ["ese","esa","eso","aquel","aquella"]
  const trPartes = (txt) => (txt || '').toString().split(/[,;/|]|\s+o\s+/i)
    .map(s => s.trim()).filter(Boolean);

  // Deja cada fila de "palabras" lista para buscar (se calcula UNA vez).
  function trPreparar(w) {
    const esPartes = trPartes(w.espanol);
    const enPartes = trPartes(w.ingles);
    return {
      w,
      esPartes: esPartes.length ? esPartes : [(w.espanol || '').trim()],
      enPartes: enPartes.length ? enPartes : [(w.ingles || '').trim()],
      esKeys: [...new Set([...esPartes.map(trKey), trKey(w.espanol)])].filter(Boolean),
      enKeys: [...new Set([...enPartes.map(trKey), trKey(w.ingles)])].filter(Boolean)
    };
  }

  // Puntuación de un término contra lo que escribió la persona.
  // Exacta > empieza por > palabra completa dentro de la frase > contiene.
  function trPuntajeTermino(termino, qk) {
    if (!termino || !qk) return 0;
    if (termino === qk) return 100;
    if (termino.startsWith(qk + ' ')) return 84;
    if (termino.startsWith(qk)) return 78;
    if (termino.includes(' ' + qk + ' ') || termino.endsWith(' ' + qk)) return 66;
    if (termino.includes(qk)) return 46;
    return 0;
  }

  function trEvaluar(e, qk) {
    let puntaje = 0, lado = null, largo = 0;
    const revisar = (keys, cual) => keys.forEach(t => {
      const p = trPuntajeTermino(t, qk);
      if (p > puntaje || (p === puntaje && p > 0 && t.length < largo)) {
        puntaje = p; lado = cual; largo = t.length;
      }
    });
    if (trDir === 'auto' || trDir === 'en') revisar(e.enKeys, 'en');
    if (trDir === 'auto' || trDir === 'es') revisar(e.esKeys, 'es');
    return { puntaje, lado, largo };
  }

  // Distancia de edición acotada: solo para sugerir "¿quisiste decir...?"
  function trDistancia(a, b, tope = 2) {
    if (Math.abs(a.length - b.length) > tope) return tope + 1;
    let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const fila = [i];
      let minFila = i;
      for (let j = 1; j <= b.length; j++) {
        const costo = a[i - 1] === b[j - 1] ? 0 : 1;
        fila[j] = Math.min(prev[j] + 1, fila[j - 1] + 1, prev[j - 1] + costo);
        if (fila[j] < minFila) minFila = fila[j];
      }
      if (minFila > tope) return tope + 1;   // corte temprano
      prev = fila;
    }
    return prev[b.length];
  }

  // ---------- Carga del diccionario ----------
  // PostgREST corta en 1000 filas, así que se pagina. Si la tabla es enorme
  // no se descarga: se pasa a modo "remoto" y cada búsqueda va al servidor.
  function trCargarDiccionario() {
    if (trIndice) return Promise.resolve(trIndice);
    if (trCarga) return trCarga;
    trCarga = (async () => {
      const { count, error: cErr } = await dbClient.from('palabras').select('id', { count: 'exact', head: true });
      if (cErr) { console.warn('[traductor] no se pudo contar "palabras":', cErr.message); trModo = 'remoto'; return null; }
      if ((count || 0) > TR_MAX_LOCAL) { trModo = 'remoto'; return null; }

      const COLS = 'id,ingles,espanol,fonetica,imagen,audio,nivel,grupo';
      const PAGINA = 1000;
      const filas = [];
      for (let desde = 0; ; desde += PAGINA) {
        let { data, error } = await dbClient.from('palabras').select(COLS).order('id').range(desde, desde + PAGINA - 1);
        if (error) {   // por si alguna columna no existe en este proyecto
          ({ data, error } = await dbClient.from('palabras').select('*').order('id').range(desde, desde + PAGINA - 1));
        }
        if (error) { console.warn('[traductor] carga:', error.message); trModo = 'remoto'; return null; }
        filas.push(...(data || []));
        if ((data || []).length < PAGINA) break;
      }
      trModo = 'local';
      trIndice = filas.map(trPreparar);
      console.log('[traductor] diccionario en memoria:', trIndice.length, 'palabras');
      return trIndice;
    })().catch(err => { console.warn('[traductor]', err); trModo = 'remoto'; return null; })
      .finally(() => { trCarga = null; });
    return trCarga;
  }

  // Búsqueda contra el servidor (tablas grandes o si falló la carga local).
  async function trBuscarRemoto(q) {
    const variantes = [...new Set([q, trSinAcentos(q)])]
      .map(s => s.replace(/[%,()*]/g, ' ').trim()).filter(Boolean);
    if (!variantes.length) return [];
    const campos = trDir === 'es' ? ['espanol'] : trDir === 'en' ? ['ingles'] : ['ingles', 'espanol'];
    const vistos = new Set(); const out = [];
    for (const v of variantes) {
      const filtro = campos.map(c => `${c}.ilike.%${v}%`).join(',');
      const { data, error } = await dbClient.from('palabras').select('*').or(filtro).limit(80);
      if (error) { console.warn('[traductor] búsqueda remota:', error.message); continue; }
      (data || []).forEach(w => { if (!vistos.has(w.id)) { vistos.add(w.id); out.push(trPreparar(w)); } });
    }
    return out;
  }

  // ---------- Resaltado ----------
  function trResaltar(texto, q) {
    const original = (texto || '').toString();
    const qh = trHKey(q).trim();
    if (!qh) return escapeHTML(original);
    const i = trHKey(original).indexOf(qh);
    if (i < 0) return escapeHTML(original);
    return escapeHTML(original.slice(0, i)) +
      `<mark class="bg-orange-100 text-[#FF7A00] rounded px-0.5">${escapeHTML(original.slice(i, i + qh.length))}</mark>` +
      escapeHTML(original.slice(i + qh.length));
  }

  // ---------- Modal ----------
  function openTraductor() {
    if (!puedeHerramientas()) return mostrarBloqueoPlan();
    trDir = 'auto';
    const chip = (dir, txt) => `<button data-dir="${dir}" class="tr-chip btn-juice ${dir === 'auto' ? 'bg-[#FF7A00] text-white' : 'bg-slate-100 text-slate-500'} font-bold text-[11px] px-3 py-1.5 rounded-xl">${txt}</button>`;

    showModal({
      icon: '🔤', title: 'Traductor', size: 'lg',
      body: `
        <div class="text-left">
          <p class="text-slate-400 text-xs text-center mb-3">Escribe en <b>español</b> o en <b>inglés</b>: encuentro la palabra en cualquiera de los dos sentidos.</p>
          <div class="relative mb-3">
            <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-300 text-sm"></i>
            <input id="tr-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
              placeholder="ej: aquella, house, correr…"
              class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl pl-10 pr-10 py-3 font-bold text-slate-700 focus:outline-none focus:border-[#FF7A00]">
            <button id="tr-clear" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-300 hover:text-slate-500 text-xl leading-none" title="Limpiar">&times;</button>
          </div>
          <div class="flex justify-center gap-1.5 mb-3">
            ${chip('auto', '🔎 Ambos')}
            ${chip('es', '🇪🇸 → 🇬🇧')}
            ${chip('en', '🇬🇧 → 🇪🇸')}
          </div>
          <div id="tr-results" class="min-h-[8rem] max-h-[46vh] overflow-y-auto"></div>
        </div>`,
      actions: []
    });

    const input = document.getElementById('tr-input');
    const cajaRes = document.getElementById('tr-results');
    const btnClear = document.getElementById('tr-clear');
    if (!input || !cajaRes) return;

    trPintarVacio(cajaRes, 'inicio');
    setTimeout(() => input.focus(), 120);
    // El diccionario se carga en segundo plano: al terminar se repinta el estado inicial
    // (para mostrar cuántas palabras hay) o se repite la búsqueda que ya haya escrito.
    trCargarDiccionario().then(() => {
      if (!document.getElementById('tr-input')) return;   // cerró el modal antes de terminar
      if (input.value.trim()) trBuscar(input.value);
      else trPintarVacio(cajaRes, 'inicio');
    });

    let temporizador = null;
    const lanzar = () => {
      btnClear.classList.toggle('hidden', !input.value);
      clearTimeout(temporizador);
      temporizador = setTimeout(() => trBuscar(input.value), 170);
    };
    input.addEventListener('input', lanzar);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); clearTimeout(temporizador); trBuscar(input.value); }
      if (e.key === 'Escape') closeModal();
    });
    btnClear.onclick = () => { input.value = ''; btnClear.classList.add('hidden'); input.focus(); trPintarVacio(cajaRes, 'inicio'); };

    // Cambio de sentido de búsqueda

  function trPintarVacio(caja, tipo, q = '') {

  async function trBuscar(texto) {

      if (r.puntaje > 0) hallados.push({ e, ...r });

      b.puntaje - a.puntaje ||

      <p class="text-[11px] font-bold text-slate-400 mb-2 px-1">

  function trItemHTML({ e, lado }, q) {

      try {

            .then(({ error }) => { if (error) console.error('No se pudo re-subir el respaldo:', error.message); });

      if (!flujo.ui?.tutorialSeen) {

      abrirDesdeURL();   // ?tool= / ?menu= al volver desde gramatica.html

      // Registra el contexto del módulo compartido: aquí solo lo usa

      window.AbuMenu?.init({

      console.error(e);
      renderMessage('😵', 'Algo salió mal', 'Ocurrió un error al cargar tu sesión. Recarga la página.');

      pixel_ratio: window.devicePixelRatio || null,
      profundidad_color: scr.colorDepth || null,
      orientacion: (scr.orientation && scr.orientation.type) ||
                   (window.innerWidth > window.innerHeight ? 'landscape' : 'portrait'),
      touch_points: nav.maxTouchPoints || 0,
      cpu_nucleos: nav.hardwareConcurrency || null,
      memoria_gb: nav.deviceMemory || null,
      bateria: bateria, cargando: cargando,

      // conexión
      conexion_tipo: conn.effectiveType || null,
      conexion_downlink: conn.downlink || null,
      conexion_rtt: conn.rtt || null,
      ahorro_datos: conn.saveData === undefined ? null : conn.saveData,

      carga_ms: carga,
      extra: {
        cookies: nav.cookieEnabled,
        dnt: nav.doNotTrack || null,
        pantalla_disponible: (scr.availWidth || 0) + 'x' + (scr.availHeight || 0),
        hora_local: new Date().toString(),
        pdf: nav.pdfViewerEnabled === undefined ? null : nav.pdfViewerEnabled,
        webdriver: nav.webdriver || false
      }
    };
    cacheDatos = d;
    return d;
  }

  /* ── envío ───────────────────────────────────────────────────────── */
  function enviar(payload, alSalir) {
    var cuerpo = JSON.stringify(payload);
    try {
      return fetch(FN, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: cuerpo,
        keepalive: !!alSalir
      }).then(function (r) { return r.json(); }).catch(function () { return null; });
    } catch (e) {
      if (navigator.sendBeacon) navigator.sendBeacon(FN, new Blob([cuerpo], { type: 'application/json' }));
      return Promise.resolve(null);
    }
  }

  /* ── registro de la visita ───────────────────────────────────────── */
  var listaEspera = [];
  async function iniciar() {
    var d = await recolectar();
    d.tipo = 'visita';
    var r = await enviar(d);
    if (r && r.visit_id) {
      visitId = r.visit_id;
      listaEspera.forEach(function (p) { p.visit_id = visitId; enviar(p); });
      listaEspera = [];
    }
  }

  /* ── clics ───────────────────────────────────────────────────────── */
  function clic(nombre, extra) {
    var u = usuario();
    var p = {
      tipo: 'clic',
      button_name: nombre,
      visit_id: visitId,
      visitor_id: visitorId,
      session_id: sessionId,
      user_id: u.id,
      path: location.pathname,
      device_type: cacheDatos ? cacheDatos.device_type : tipoDispositivo(navigator.userAgent),
      segundos: Math.round((Date.now() - t0) / 1000),
      texto: (extra && extra.texto) || null,
      destino: (extra && extra.destino) || null,
      extra: extra || {}
    };
    if (!visitId) { listaEspera.push(p); return; }   // espera a tener el id de la visita
    enviar(p);
  }

  // Cualquier elemento con data-track="nombre" se registra solo
  document.addEventListener('click', function (e) {
    clics++;
    var el = e.target && e.target.closest ? e.target.closest('[data-track]') : null;
    if (!el) return;
    clic(el.getAttribute('data-track'), {
      texto: (el.innerText || '').trim().slice(0, 80),
      destino: el.getAttribute('href') || null
    });
  }, true);

  // Scroll máximo
  window.addEventListener('scroll', function () {
    var h = document.documentElement.scrollHeight - window.innerHeight;
    if (h > 0) scrollMax = Math.max(scrollMax, Math.min(100, Math.round((window.scrollY / h) * 100)));
  }, { passive: true });

  // Al salir: duración, scroll y número de clics
  function cerrar() {
    if (cerrado || !visitId) return;
    cerrado = true;
    enviar({ tipo: 'cierre', visit_id: visitId, duracion_ms: Date.now() - t0, scroll_max: scrollMax, clics: clics }, true);
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') cerrar(); });
  window.addEventListener('pagehide', cerrar);

  window.AbuTrack = {
    clic: clic,
    vista: function (nombre) { clic('vista_' + nombre, { texto: nombre }); },
    datos: function () { return cacheDatos; },
    visitId: function () { return visitId; }
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})();
  </script>
</body>
