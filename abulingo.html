     "¿te gusta 'we'?", que además no tiene sentido con pronombres.
     Ahora es una conversación de verdad: reacciona a lo que escribió
     el estudiante, nunca repite pregunta y cada 3 turnos le pide usar
     una palabra del grupo en una frase.
  ------------------------------------------------------------ */
  const ABU_GUION = [
    { id: 'today',   en: "What did you do today?",             es: "¿Qué hiciste hoy?",                       tips: ['I worked.', 'I studied English.', 'Nothing special 😅'] },
    { id: 'family',  en: "Who do you live with?",              es: "¿Con quién vives?",                       tips: ['With my family.', 'I live alone.', 'With my friends.'] },
    { id: 'work',    en: "Do you work or study?",              es: "¿Trabajas o estudias?",                   tips: ['I work.', 'I study.', 'Both! 😅'] },
    { id: 'food',    en: "What food do you like?",             es: "¿Qué comida te gusta?",                   tips: ['I like pizza.', 'Rice and chicken.', 'Everything! 😄'] },
    { id: 'weekend', en: "What do you do on weekends?",        es: "¿Qué haces los fines de semana?",         tips: ['I rest at home.', 'I go out.', 'I see my family.'] },
    { id: 'city',    en: "Where are you from?",                es: "¿De dónde eres?",                         tips: ["I'm from Colombia.", 'From Bogotá.', 'A small town.'] },
    { id: 'why',     en: "Why do you learn English?",          es: "¿Por qué aprendes inglés?",               tips: ['For my job.', 'To travel ✈️', 'I like it.'] },
    { id: 'music',   en: "What music do you listen to?",       es: "¿Qué música escuchas?",                   tips: ['I like rock.', 'Reggaeton 🔥', 'All kinds.'] },
    { id: 'travel',  en: "Where do you want to travel?",       es: "¿A dónde quieres viajar?",                tips: ['To the USA.', 'To Europe.', 'Anywhere! 😄'] },
    { id: 'morning', en: "What time do you wake up?",          es: "¿A qué hora te levantas?",                tips: ['At six.', 'Very early 😴', 'Late on Sundays.'] },
    { id: 'pet',     en: "Do you have a pet?",                 es: "¿Tienes mascota?",                        tips: ['Yes, a dog 🐶', "No, I don't.", 'I want one!'] },
    { id: 'movie',   en: "What was the last movie you saw?",   es: "¿Cuál fue la última película que viste?", tips: ['A comedy.', "I don't remember 😅", 'A horror movie.'] },
    { id: 'friend',  en: "Tell me about your best friend.",    es: "Cuéntame de tu mejor amigo.",             tips: ['He is funny.', 'She is very kind.', 'We study together.'] },
    { id: 'dream',   en: "What is your dream job?",            es: "¿Cuál es el trabajo de tus sueños?",      tips: ['A doctor.', "I don't know yet.", 'Something with computers.'] },
    { id: 'plans',   en: "What are your plans for tomorrow?",  es: "¿Qué planes tienes para mañana?",         tips: ['I work.', 'I rest.', 'I study English.'] }
  ];

  const alAzar = (arr) => arr[Math.floor(Math.random() * arr.length)];

  /* ------------------------------------------------------------
     CORRECTOR LOCAL ✏️
     Garantiza que SIEMPRE haya corrección cuando el estudiante
     comete un error típico, aunque la Edge Function no responda
     (la IA corrige mejor, pero esto es la red de seguridad).
     Se muestra en la cajita ámbar "✏️" de la burbuja de Abu.
  ------------------------------------------------------------ */
  const CORRECCIONES_LOCALES = [
    { re: /\bi\s+(is|are)\b/i,                         fix: 'Se dice "I am", no "I is / I are".' },
    { re: /\bi\s+has\b/i,                              fix: 'Se dice "I have", no "I has".' },
    { re: /\b(he|she|it)\s+have\b/i,                   fix: 'Con he/she/it es "has", no "have".' },
    { re: /\b(he|she|it)\s+don'?t\b/i,                 fix: 'Con he/she/it es "doesn\'t", no "don\'t".' },
    { re: /\bi\s+am\s+agree\b/i,                       fix: 'Se dice "I agree" (sin "am").' },
    { re: /\bpeoples\b/i,                              fix: '"People" ya es plural: no lleva "s".' },
    { re: /\bmore\s+(better|worse|bigger|easier|faster)\b/i, fix: 'El comparativo va solo: "better", "bigger"... sin "more".' },
    { re: /\bfor\s+to\s+[a-z]/i,                       fix: 'Se dice "to + verbo", no "for to".' },
    { re: /\bdont\b/i,                                 fix: 'No olvides el apóstrofo: "don\'t".' },
    { re: /\bcant\b/i,                                 fix: 'No olvides el apóstrofo: "can\'t".' },
    { re: /\bdoesnt\b/i,                               fix: 'No olvides el apóstrofo: "doesn\'t".' },
    { re: /\bim\b/i,                                   fix: 'Se escribe "I\'m" (mayúscula y apóstrofo).' },
    { re: /(^|\s)i(\s|[,.!?]|$)/,                      fix: 'El pronombre "I" siempre va en mayúscula.' },
    { re: /\b(que|pero|porque|hola|gracias|bueno|entonces|también|tambien|estoy|tengo)\b/i, fix: 'Vi palabras en español: intenta escribirlo todo en inglés 😉' }
  ];
  function corregirLocal(texto) {
    const t = (texto || '').trim();
    if (!t) return '';
    const errores = [];
    for (const c of CORRECCIONES_LOCALES) {
      if (c.re.test(t)) errores.push(c.fix);
      if (errores.length >= 2) break;   // máximo 2 para no abrumar
    }
    return errores.join(' ');
  }

  // Reacción corta a lo último que escribió el estudiante (así se siente escuchado)
  function reaccionAbu(texto, usadas) {
    const t = (texto || '').toLowerCase().trim();
    if (usadas && usadas.length) return { en: `Perfect use of "${usadas[0]}"! 🎯`, es: `¡Perfecto uso de "${usadas[0]}"! 🎯` };
    if (/don'?t know|no s[eé]|idk|ni idea/.test(t))     return { en: 'No problem! 😄', es: '¡No pasa nada! 😄' };
    if (/hard|difficult|dif[ií]cil/.test(t))            return { en: "I know, but you're doing great! 💪", es: '¡Lo sé, pero lo haces muy bien! 💪' };
    if (/easy|f[aá]cil/.test(t))                        return { en: 'That’s the spirit! 🔥', es: '¡Ese es el ánimo! 🔥' };
    if (/^(yes|yeah|yep|sure|of course)/.test(t))       return { en: 'Great! 😄', es: '¡Genial! 😄' };
    if (/^(no|nope|not really|never)/.test(t))          return { en: 'Okay! 👌', es: '¡Está bien! 👌' };
    if (t.split(/\s+/).length >= 6)                     return { en: 'Wow, great sentence! 🔥', es: '¡Wow, gran frase! 🔥' };
    return alAzar([
      { en: 'Nice!', es: '¡Bien!' }, { en: 'Cool!', es: '¡Genial!' },
      { en: 'Love it!', es: '¡Me encanta!' }, { en: 'So good!', es: '¡Muy bien!' },
      { en: 'Awesome!', es: '¡Excelente!' }
    ]);
  }

  function abuFallback(textoUsuario = '', usadas = []) {
    const cs = chatSession;
    if (cs && !cs.guionUsado) cs.guionUsado = new Set();
    const hechas = cs?.guionUsado || new Set();
    const turno = cs?.count || 0;
    const r = reaccionAbu(textoUsuario, usadas);

    // Último mensaje: despedida, sin preguntas
    if (cs && turno >= cs.goal) {
      return {
        en: `${r.en} You did an amazing job today. See you soon! 👋`,
        es: `${r.es} Hiciste un trabajo increíble hoy. ¡Nos vemos pronto! 👋`,
        tips: ['Thank you! 😄', 'See you, Abu!', 'Bye bye 👋']
      };
    }

    /*
      Ya NO se le "ordena" al estudiante hacer una frase suelta
      ("Try a sentence with X 👀"): eso rompía el hilo de la charla.
      Ahora, cada 2 turnos, ABU MISMO usa una palabra pendiente dentro
      de una frase natural y hace una pregunta relacionada, invitando
      (no obligando) a responder con esa misma palabra. Las sugerencias
      rápidas incluyen una respuesta lista que la usa, para que el flujo
      de la conversación tenga sentido lógico.
    */
    if (cs && !cs.retadas) cs.retadas = new Set();
    const retadas = cs?.retadas || new Set();
    const sinUsar = chatWords.filter(w => !cs?.used.has(norm(w)));
    const libre = sinUsar.find(w => !retadas.has(norm(w))) || sinUsar[0];
    if (libre && turno > 0 && turno % 2 === 0) {
      retadas.add(norm(libre));
      const charla = alAzar([
        { en: `You know, I think learning English is never "${libre}" — it always surprises me 😄. What about you: is English "${libre}" for you?`,
          es: `¿Sabes? Creo que aprender inglés nunca es "${libre}", siempre me sorprende 😄. ¿Y tú? ¿El inglés es "${libre}" para ti?`,
          tips: [`Yes, it's very "${libre}" for me.`, `No, it's not "${libre}" at all.`, `Sometimes it feels "${libre}" 😅`] },
        { en: `Today my coffee was really "${libre}" ☕😄. Can you describe something in your day with the word "${libre}"?`,
          es: `Hoy mi café estuvo muy "${libre}" ☕😄. ¿Puedes describir algo de tu día con la palabra "${libre}"?`,
          tips: [`My morning was "${libre}".`, `My work is "${libre}" today.`, `Nothing "${libre}" today 😅`] },
        { en: `I love the word "${libre}" — I use it a lot when I talk about my week. How was your week? You can use "${libre}" in your answer 😉`,
          es: `Me encanta la palabra "${libre}", la uso mucho cuando hablo de mi semana. ¿Cómo estuvo tu semana? Puedes usar "${libre}" en tu respuesta 😉`,
          tips: [`My week was "${libre}"!`, `It was good, and very "${libre}".`, `A "${libre}" week, honestly.`] }
      ]);
      return {
        en: `${r.en} ${charla.en}`,
        es: `${r.es} ${charla.es}`,
        tips: charla.tips
      };
    }

    // Siguiente pregunta del guion que todavía no se haya hecho.
    // Una de las sugerencias siempre trae una palabra pendiente ya integrada.
    const pendientes = ABU_GUION.filter(q => !hechas.has(q.id));
    const sig = pendientes.length ? alAzar(pendientes) : ABU_GUION[turno % ABU_GUION.length];
    hechas.add(sig.id);
    const tips = [...sig.tips];
    if (libre) tips[tips.length - 1] = `It was "${libre}", I think 😄`;
    return { en: `${r.en} ${sig.en}`, es: `${r.es} ${sig.es}`, tips };
  }

  /*
    Respuestas sugeridas. Lo ideal viene de Abu (campo "tips"), pero si no
    llega se arman aquí leyendo qué tipo de pregunta hizo: así siempre hay
    algo que responder aunque falle la red.
  */
  function sugerenciasLocales(textoAbu) {
    const t = (textoAbu || '').toLowerCase();
    const libre = chatWords.filter(w => !chatSession?.used.has(norm(w)))[0];
    let base;
    // Las preguntas con wh- mandan sobre las de sí/no: "Why do you...?" no se
    // responde con "Yes, I do", aunque contenga "do you".
    if (/how are you|how do you feel|how is it going/.test(t))  base = ["I'm good! 😄", "A little tired.", "Great, thanks!"];
    else if (/\bwhy\b/.test(t))                            base = ['Because I like it.', "I don't know 😅", "It's fun!"];
    else if (/\bwhere\b/.test(t))                          base = ['At home.', 'In my city.', 'At school.'];
    else if (/\bwhen|what time\b/.test(t))                 base = ['Every day.', 'On weekends.', 'In the morning.'];
    else if (/\bhow (many|much|often|long)\b/.test(t))     base = ['Two or three.', 'A lot!', 'Not much.'];
    else if (/\bhow\b/.test(t))                            base = ['With my phone.', "It's easy!", "It's hard 😅"];
    else if (/\bwho\b/.test(t))                            base = ['My family.', 'My best friend.', 'My teacher.'];
    else if (/\bwhich\b/.test(t))                          base = ['The first one.', 'Both! 😄', "I'm not sure 🤔"];
    else if (/\bwhat.*(like|favou?rite|prefer)\b/.test(t)) base = ['I like it a lot.', 'Not really.', 'My favourite! 🔥'];
    else if (/\bwhat\b/.test(t))                           base = ['I like it.', "I'm not sure 🤔", 'Tell me more.'];
    else if (/\b(do|did|does|are|is|was|can|have|had|would|will) you\b/.test(t)) base = ['Yes, I do! 😄', "No, I don't.", 'Sometimes.'];
    else                                                    base = ['Yes! 😄', 'Really?', 'Tell me more.'];
    // Una sugerencia siempre es una FRASE COMPLETA que usa una palabra
    // pendiente del grupo, con sentido dentro de la conversación
    // (antes era "What about X?", que no la usaba de verdad).
    if (libre) {
      const conPalabra = alAzar([
        `For me, it's "${libre}".`,
        `I think it was "${libre}".`,
        `Honestly, quite "${libre}" 😄`
      ]);
      base = [...base.slice(0, 2), conPalabra];
    }
    return base;
  }

  function pintarSugerencias(tips) {
    const cont = document.getElementById('chat-quick');
    if (!cont) return;
    const lista = (Array.isArray(tips) ? tips : [])
      .map(t => String(t || '').trim()).filter(Boolean).slice(0, 3);
    const finales = lista.length >= 2 ? lista : sugerenciasLocales(tips);
    cont.innerHTML = finales.map(r =>
      `<button class="quick-reply shrink-0 text-[11px] font-bold px-2.5 py-1 rounded-full bg-slate-100 text-slate-500 hover:bg-orange-50 hover:text-[#FF7A00] transition" data-txt="${escapeHTML(r)}">${escapeHTML(r)}</button>`
    ).join('');
    const input = document.getElementById('ai-input');
    cont.querySelectorAll('.quick-reply').forEach(b => {
      b.onclick = () => { if (input) { input.value = b.dataset.txt || ''; input.focus(); } };
    });
  }

  /* ---------- Pantalla de la charla ---------- */
  async function startChatPractice(nivel, group, cuenta) {
    closeModal();
    stopSpeaking();
    domResetAudioCache(); // charla nueva → se descarta el audio real de la anterior
    const g = (group && flujo.niveles[nivel]?.grupos?.[group]) || null;
    chatWords = await getChatWords(nivel, group, 10);
    aiChat = [];
    chatSession = {
      nivel, group, counts: !!cuenta, goal: CHAT_GOAL,
      count: (cuenta && g?.chat?.count) ? g.chat.count : 0,
      used: new Set(), streak: 0
    };

    const chips = chatWords.map(w =>
      `<span class="word-chip shrink-0 text-[11px] font-bold px-2 py-1 rounded-full bg-white border border-slate-200 text-slate-500" data-word="${escapeHTML(norm(w))}">${escapeHTML(w)}</span>`
    ).join('');

    appContainer.innerHTML = `
      <div class="card-3d p-3 sm:p-4 animate-pop mt-1">

        <div class="flex items-center gap-2 mb-1.5">
          <span class="bg-purple-100 text-purple-600 px-2.5 py-1 rounded-full text-[11px] font-bold uppercase shrink-0">💬 Abu</span>
          <div class="flex-1 progress-track" style="margin-top:0"><div id="chat-bar" class="progress-fill" style="width:${(chatSession.count / CHAT_GOAL) * 100}%"></div></div>
          <span class="text-[11px] font-black text-slate-400 shrink-0"><span id="chat-count" class="text-[#FF7A00]">${chatSession.count}</span>/${CHAT_GOAL}</span>
          <button id="chat-exit" title="Salir" class="shrink-0 w-6 h-6 rounded-full text-slate-300 hover:text-slate-500 hover:bg-slate-100 transition text-sm">&times;</button>
        </div>

        <div id="ai-messages" class="chat-scroll h-[46vh] min-h-[220px] overflow-y-auto p-2 space-y-2 mb-2 bg-slate-50 rounded-xl border border-slate-100"></div>

        <div id="chat-quick" class="no-bar flex gap-1.5 overflow-x-auto whitespace-nowrap mb-2 min-h-[26px]"></div>

        <div class="flex gap-2">
          <input id="ai-input" type="text" placeholder="Escribe en inglés..." autocomplete="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="send"
            class="flex-1 min-w-0 bg-white border-2 border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-[#FF7A00] text-slate-700 font-medium">
          <button id="ai-send" class="btn-juice bg-[#FF7A00] text-white font-bold px-4 py-2 rounded-xl shrink-0"><i class="fas fa-paper-plane"></i></button>
        </div>

        ${chips ? `
        <div class="flex items-center gap-2 mt-2">
          <div id="chat-chips" class="no-bar flex-1 flex gap-1.5 overflow-x-auto whitespace-nowrap py-0.5">${chips}</div>
          <span class="text-[10px] font-bold text-slate-400 shrink-0"><span id="chat-usadas">0</span>/${chatWords.length}</span>
        </div>` : ''}
      </div>`;

    bindChatPractice();
    pintarProgresoChat();

    // Abu empieza DE UNA VEZ con una pregunta directa (sin discurso largo).
    // La instrucción de usar las palabras va en un toast breve, no en el mensaje.
    let saludo;
    if (chatWords.length) {
      const q = alAzar(ABU_GUION);
      chatSession.guionUsado = new Set([q.id]);
      saludo = { en: `Hi! I'm Abu 👋 ${q.en}`, es: `¡Hola! Soy Abu 👋 ${q.es}`, tips: q.tips };
      setTimeout(() => showToast('💡 Usa las palabras de abajo en tus respuestas: dan puntos extra.'), 800);
    } else {
      saludo = { en: `Hi! I'm Abu 👋 How are you today?`, es: `¡Hola! Soy Abu 👋 ¿Cómo estás hoy?` };
    }
    addChatBubble('ai', saludo);
    aiChat.push({ role: 'assistant', content: saludo.en });
    pintarSugerencias(saludo.tips || saludo.en);   // sugerencias acordes al saludo
    speakAbu(saludo.en);
  }

  function addChatBubble(role, msg) {
    const box = document.getElementById('ai-messages');
    if (!box) return null;
    const div = document.createElement('div');
    if (role === 'user') {
      div.className = 'flex justify-end';
      div.innerHTML = `<div class="bg-[#FF7A00] text-white rounded-2xl rounded-br-sm px-3.5 py-2 max-w-[85%] font-medium">${escapeHTML(msg.en)}</div>`;
    } else {
      div.className = 'flex justify-start items-end gap-1.5';
      div.innerHTML = `
        <div class="bg-white border border-slate-200 text-slate-800 rounded-2xl rounded-bl-sm px-3.5 py-2 max-w-[78%] shadow-sm">
          <div class="font-medium leading-snug">${escapeHTML(msg.en)}</div>
          ${msg.es ? `<div class="text-xs text-slate-400 mt-0.5 leading-snug">${escapeHTML(msg.es)}</div>` : ''}
          ${msg.fix ? `<div class="mt-1.5 text-[11px] font-bold text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-2 py-1 leading-snug">✏️ ${escapeHTML(msg.fix)}</div>` : ''}
        </div>
        <button data-say="${encodeURIComponent(msg.en || '')}" data-abu="1" title="Escuchar otra vez"
          class="say-btn shrink-0 w-8 h-8 rounded-full bg-white border border-slate-200 text-slate-400 hover:text-[#FF7A00] hover:border-[#FF7A00] active:scale-90 transition flex items-center justify-center">
          <i class="fas fa-volume-up text-[11px]"></i>
        </button>`;
    }
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return div;
  }

  // Marca las palabras objetivo usadas por primera vez y las devuelve.
  function marcarPalabrasUsadas(text) {
    if (!chatSession) return [];
    const t = ' ' + norm(text).replace(/\s+/g, ' ') + ' ';
    const nuevas = [];
    chatWords.forEach(w => {
      const k = norm(w);
      if (!k || chatSession.used.has(k)) return;
      if (t.includes(' ' + k + ' ')) {
        chatSession.used.add(k);
        nuevas.push(w);
        document.querySelectorAll('#chat-chips .word-chip').forEach(ch => {
          if (ch.dataset.word === k) ch.classList.add('used');
        });
      }
    });
    const cont = document.getElementById('chat-usadas');
    if (cont) cont.textContent = chatSession.used.size;
    return nuevas;
  }

  function pintarProgresoChat() {
    const cs = chatSession;
    if (!cs) return;
    const pct = Math.min(100, (cs.count / cs.goal) * 100);
    const bar = document.getElementById('chat-bar'); if (bar) bar.style.width = pct + '%';
    const num = document.getElementById('chat-count'); if (num) num.textContent = cs.count;
    updateProgressBar(pct);
  }

  function bindChatPractice() {
    const box = document.getElementById('ai-messages');
    const input = document.getElementById('ai-input');
    const send = document.getElementById('ai-send');
    if (!input || !send || !box) return;

    // Volver a escuchar cualquier mensaje de Abu (usa el audio real
    // cacheado/pedido a Google Cloud vía speakAbu; nunca la voz del
    // navegador de una — solo Abu tiene botón 🔊 en este chat).
    box.addEventListener('click', (e) => {
      const b = e.target.closest('[data-say]');
      if (!b) return;
      speakAbu(decodeURIComponent(b.dataset.say || ''));
    });

    const exit = document.getElementById('chat-exit');
    if (exit) exit.onclick = async () => {
      const cs = chatSession;
      stopSpeaking();
      if (cs?.counts && cs.group && flujo.niveles[cs.nivel]?.grupos?.[cs.group]) {
        flujo.niveles[cs.nivel].grupos[cs.group].chat.count = cs.count;   // se guarda el avance
        await updateUserFlow();
        showToast(`💬 Guardamos tu avance: ${cs.count}/${CHAT_GOAL} mensajes.`);
      }
      chatSession = null;
      runFlow();
    };

    const enviar = async (textoDirecto) => {
      const text = (textoDirecto ?? input.value ?? '').toString().trim();
      if (!text || send.disabled || !chatSession) return;
      input.value = '';
      addChatBubble('user', { en: text });
      aiChat.push({ role: 'user', content: text });

      /* ---- Recompensa inmediata (así el chat engancha) ---- */
      const cs = chatSession;
      cs.count++;
      cs.streak++;
      let pts = 3;
      const nuevas = marcarPalabrasUsadas(text);
      const fixLocal = corregirLocal(text);   // red de seguridad de correcciones
      if (nuevas.length) pts += 6 * nuevas.length;
      if (text.split(/\s+/).length >= 6) pts += 2;      // premio a frases largas
      pintarProgresoChat();

      // El avance del chat se guarda EN CADA MENSAJE (antes solo al salir con la X:
      // si recargabas a mitad de charla, el contador volvía a cero).
      if (cs.counts && cs.group && flujo.niveles[cs.nivel]?.grupos?.[cs.group]) {
        flujo.niveles[cs.nivel].grupos[cs.group].chat.count = cs.count;
      }
      await updateUserFlow();
      await addPoints(pts);
      touchStreak();
      if (nuevas.length) showToast(`🎯 ¡Usaste "${nuevas[0]}"! +${6 * nuevas.length} puntos`);
      else if (cs.count === Math.ceil(cs.goal / 2)) { triggerConfetti(); showToast('🔥 ¡Mitad del camino! Vas encendido.'); }
      else if (cs.goal - cs.count === 3) showToast('💪 ¡Solo 3 mensajes más!');

      const quick = document.getElementById('chat-quick');
      if (quick) quick.innerHTML = '';

      const typing = document.createElement('div');
      typing.className = 'flex justify-start';
      typing.innerHTML = `<div class="bg-white border border-slate-200 text-slate-400 rounded-2xl rounded-bl-sm px-3.5 py-2 text-sm"><i class="fas fa-circle-notch fa-spin mr-1"></i> Abu escribe...</div>`;
      box.appendChild(typing);
      box.scrollTop = box.scrollHeight;
      send.disabled = true;

      let reply = await callChatFunction({
        mode: 'chat',
        nivel: chatSession?.nivel || flujo.currentNivel,
        messages: aiChat.slice(-8),           // contexto suficiente para que la charla tenga hilo
        words: chatWords.slice(0, 8),
        used: [...cs.used],                    // palabras ya usadas → la IA se enfoca en las pendientes
        turn: cs.count,                        // Abu sabe si está empezando o cerrando
        goal: cs.goal
      });
      typing.remove();
      if (!reply) {
        reply = abuFallback(text, nuevas);
        // Aviso único: si sale, la Edge Function no está respondiendo.
        if (!chatModoLocalAvisado) {
          chatModoLocalAvisado = true;
          console.warn('[Abu] sin respuesta de la Edge Function → guion local. Revisa los logs de generar-dialogo en Supabase.');
          showToast('📴 Abu está respondiendo en modo básico.', 2600);
        }
      }

      // Corrección garantizada: si la IA no marcó nada pero el corrector
      // local detectó un error, se muestra igual la cajita ✏️.
      if (!reply.fix && fixLocal) reply.fix = fixLocal;

      addChatBubble('ai', { en: reply.en, es: reply.es || '', fix: reply.fix || '' });
      aiChat.push({ role: 'assistant', content: reply.en });
      pintarSugerencias(reply.tips && reply.tips.length ? reply.tips : reply.en);
      speakAbu(reply.en);
      send.disabled = false;
      input.focus();

      if (chatSession && chatSession.count >= chatSession.goal) setTimeout(finishChatPractice, 1100);
    };

    send.onclick = () => enviar();
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') enviar(); else sfx('type'); });
    setTimeout(() => input.focus(), 120);
  }

  async function finishChatPractice() {
    const cs = chatSession;
    if (!cs) return;
    chatSession = null;
    stopSpeaking();
    await addPoints(25);

    const g = (cs.group && flujo.niveles[cs.nivel]?.grupos?.[cs.group]) || null;
    if (cs.counts && g) {
      g.chat = { done: true, count: cs.count };
      g.completed = true;
      flujo.stats.sessionsCompleted = (flujo.stats.sessionsCompleted || 0) + 1;
      await updateUserFlow();
      return groupCompleteScreen(cs.nivel, cs.group, g);
    }
    playSound('complete'); triggerConfetti();
    showModal({
      icon: '💬', title: '¡Conversación completada!',
      body: `Enviaste <b>${cs.count} mensajes</b> y usaste <b class="text-green-600">${cs.used.size}</b> de tus palabras. <br><span class="text-yellow-600 font-bold">+25 puntos</span>`,
      dismissable: false,
      actions: [{ label: 'Continuar', onClick: () => { closeModal(); runFlow(); } }]
    });
  }


  /* ============================================================
     14. DOMINAR — frases, videos, textos y conversaciones
     ------------------------------------------------------------
     Reemplaza a practica.html (esa página se elimina; todo vive
     aquí). Cada nivel se reparte en 32 SUBSECCIONES fijas:

       · 📖 Lee y completa        → 1 por subsección (practica_textos,
         columna "orden" 1-32; hay exactamente 32 textos por nivel).
       · 🧩 Organiza / 👂 Escucha  → la tabla "frases" (ordenada por id)
         se reparte lo más parejo posible entre las subsecciones 1-31;
         la subsección 32 usa en su lugar, al azar, practica_frases
         y practica_escucha.
       · 🎬 Mira y completa + "Ahora, a conversar" → SOLO en las 16
         subsecciones pares (2,4,...,32), tomando practica_videos y
         conversaciones en orden; si el nivel tiene menos de 16 se
         repiten (p. ej. A2 con 13 videos repite los 3 primeros).
       · "Conversa con Abu" → 1 por subsección (las 32), charla con
         la misma función de IA que ya usa el chat de vocabulario.

     El avance vive en flujo.dominar[nivel] y se guarda con
     updateUserFlow() igual que el resto del flujo.
  ============================================================ */
  const DOMINAR_SUBS = 32;              // subsecciones totales por nivel (fijo)
  const DOMINAR_FRASES_BLOQUES = 31;    // 1..31 reciben trozos de "frases"; la 32 es especial
  const DOM_PTS_HUECO      = 5;
  const DOM_PTS_ORDEN      = 12;
  const DOM_PTS_LEE        = 15;
  const DOM_PTS_VIDEO      = 15;
  const DOM_PTS_CONVERSAR  = 20;
  const DOM_PTS_ABU        = 20;
  const DOM_PTS_SUBSECCION = 15;        // bono al completar toda la subsección
  const DOM_CHAT_GOAL      = 10;        // turnos de voz por "Conversa con Abu"

  let dominarCache = {};   // { [nivel]: { frases, practica_frases, practica_escucha, practica_videos, practica_textos, conversaciones, plan, cargado } }

  function defaultDominarNivelState() { return { subseccionActual: 1, subs: {}, completado: false }; }
  function ensureDominar(nivel) {
    if (!flujo.dominar) flujo.dominar = {};
    if (!flujo.dominar[nivel]) flujo.dominar[nivel] = defaultDominarNivelState();
    const d = flujo.dominar[nivel];
    if (!d.subs) d.subs = {};
    if (!d.subseccionActual) d.subseccionActual = 1;
    // Salvaguarda: si una sesión de "repaso de una subsección anterior" se
    // interrumpió (se cerró la pestaña) mientras subseccionActual apuntaba
    // temporalmente a esa subsección vieja, esto recupera el avance real:
    // si hay subsecciones MÁS ADELANTE ya completadas, el "siguiente
    // pendiente" real es después de la última completada, nunca antes.
    let maxSiguiente = 1;
    for (let i = 1; i <= DOMINAR_SUBS; i++) { if (d.subs[i]?.completed) maxSiguiente = Math.max(maxSiguiente, i + 1); }
    if (maxSiguiente > d.subseccionActual) d.subseccionActual = maxSiguiente;
    return d;
  }
  function defaultSubState() {
    return { paso: 'lee', rondaIdx: 0, rondaAciertos: 0, rondaFallos: 0,
              videoOk: null, conversarOk: null, abuOk: false, completed: false, fallidos: [] };
  }
  function ensureSub(nivel, n) {
    const d = ensureDominar(nivel);
    if (!d.subs[n]) d.subs[n] = defaultSubState();
    return d.subs[n];
  }
  const barajarDom = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };

  /* ------------------------------------------------------------
     CONTENIDO DESDE SUPABASE
  ------------------------------------------------------------ */
  async function traerTablaDominar(tabla, nivel, campoNivel = 'nivel') {
    const { data, error } = await dbClient.from(tabla).select('*').eq(campoNivel, nivel).order('id', { ascending: true }).range(0, 4999);
    if (error) { console.error(`[Dominar] no se pudo leer "${tabla}":`, error.message); return []; }
    return (data || []).filter(r => r.activo !== false);
  }

  async function cargarContenidoDominar(nivel) {
    if (dominarCache[nivel]?.cargado) return dominarCache[nivel];
    const [frases, practica_frases, practica_escucha, practica_videos, practica_textos, conversacionesRaw] = await Promise.all([
      traerTablaDominar('frases', nivel),
      traerTablaDominar('practica_frases', nivel),
      traerTablaDominar('practica_escucha', nivel),
      traerTablaDominar('practica_videos', nivel),
      traerTablaDominar('practica_textos', nivel),
      dbClient.from('conversaciones').select('*').eq('nivel_ingles', nivel).order('id', { ascending: true }).range(0, 999)
        .then(({ data, error }) => { if (error) console.error('[Dominar] no se pudo leer "conversaciones":', error.message); return data || []; })
    ]);
    practica_videos.sort((a, b) => (a.orden || 0) - (b.orden || 0));
    practica_textos.sort((a, b) => (a.orden || 0) - (b.orden || 0));
    const conversaciones = conversacionesRaw.map(c => {
      let parsed = null;
      try { parsed = JSON.parse(c.conversacion); } catch { parsed = null; }
      return { ...c, parsed };
    }).filter(c => c.parsed && Array.isArray(c.parsed.lineas) && c.parsed.lineas.length);

    const datos = { frases, practica_frases, practica_escucha, practica_videos, practica_textos, conversaciones, cargado: true };
    datos.plan = construirPlanDominar(datos);
    dominarCache[nivel] = datos;
    return datos;
  }

  /* ------------------------------------------------------------
     MOTOR DE REPARTO — arma las 32 subsecciones a partir del
     contenido ya cargado. Es una función pura: siempre da el mismo
     resultado para el mismo contenido (solo cambia el orden interno
     de cada ronda, que se vuelve a barajar cada vez que se entra).
  ------------------------------------------------------------ */
  function repartirParejo(lista, n) {
    const total = lista.length;
    const base = Math.floor(total / n), extra = total % n;
    const buckets = []; let idx = 0;
    for (let i = 0; i < n; i++) {
      const tam = base + (i < extra ? 1 : 0);
      buckets.push(lista.slice(idx, idx + tam));
      idx += tam;
    }
    return buckets;
  }
  function huecosCuantos(texto, base) {
    const n = String(texto || '').trim().split(/\s+/).filter(Boolean).length;
    return Math.max(1, Math.min(base, Math.max(1, n - 1) || 1));
  }
  function construirPlanDominar(datos) {
    const bloques = repartirParejo(datos.frases, DOMINAR_FRASES_BLOQUES); // subsecciones 1..31
    const plan = {};
    for (let n = 1; n <= DOMINAR_SUBS; n++) {
      const item = { n, lee: null, ronda: [], video: null, conversar: null };
      item.lee = datos.practica_textos.find(t => t.orden === n) || datos.practica_textos[n - 1] || null;

      // Orden fijo dentro de la ronda: primero TODO 👂 Escucha, luego TODO
      // 🧩 Organiza — así el "paso" de la subsección avanza 📖 → 👂 → 🧩.
      if (n <= DOMINAR_FRASES_BLOQUES) {
        const bloque = bloques[n - 1] || [];
        const escucha = [], orden = [];
        bloque.forEach((f, i) => {
          const fila = { id: `fr-${f.id}`, frase: f.fraseingles, traduccion: f.fraseespañol, huecos: [], audio_url: f.audio_url };
          (i % 2 === 0 ? orden : escucha).push({ tipo: i % 2 === 0 ? 'orden' : 'escucha', fila });
        });
        item.ronda = [...barajarDom(escucha), ...barajarDom(orden)];
      } else {
        const orden = datos.practica_frases.map(f => ({ tipo: 'orden', fila: { id: `pf-${f.id}`, frase: f.frase, traduccion: f.traduccion, huecos: [], audio_url: f.audio_url } }));
        const escucha = datos.practica_escucha.map(f => ({ tipo: 'escucha', fila: { id: `pe-${f.id}`, frase: f.frase, traduccion: f.traduccion, huecos: f.huecos || [], audio_url: f.audio_url } }));
        item.ronda = [...barajarDom(escucha).slice(0, 12), ...barajarDom(orden).slice(0, 12)];
      }

      if (n % 2 === 0) {
        const k = (n / 2) - 1;
        if (datos.practica_videos.length) item.video = datos.practica_videos[k % datos.practica_videos.length];
        if (datos.conversaciones.length) item.conversar = datos.conversaciones[k % datos.conversaciones.length];
      }
      plan[n] = item;
    }
    return plan;
  }

  /* ------------------------------------------------------------
     HUECOS — motor común de "completar palabras" (portado de
     practica.html, sin cambios de fondo).
  ------------------------------------------------------------ */
  function prepararHuecos(texto, huecos, cuantos) {
    const lineas = String(texto || '').replace(/\r/g, '').split('\n').map(l => l.trim()).filter(Boolean);
    const tokens = [];
    lineas.forEach((linea, li) => {
      let resto = linea, hablante = '';
      const m = linea.match(/^([A-Za-zÁÉÍÓÚÑáéíóúñ .]{1,18}):\s+(.*)$/);
      if (m) { hablante = m[1].trim(); resto = m[2]; }
      resto.split(/\s+/).filter(Boolean).forEach((p, i) => { tokens.push({ li, p, hablante: i === 0 ? hablante : '' }); });
    });
    const usados = new Set();
    const indices = [];
    (huecos || []).forEach(h => {
      const k = norm(h);
      if (!k) return;
      const i = tokens.findIndex((t, ix) => !usados.has(ix) && norm(t.p) === k);
      if (i >= 0) { usados.add(i); indices.push(i); }
    });
    // Relleno cuando faltan huecos por completar (o cuando la fila no trae
    // "huecos" explícitos, como en la tabla "frases"): antes esto fallaba
    // en frases de 1-2 palabras (ej. "So-so.") porque exigía que hubiera
    // MÁS palabras que huecos pedidos; con una frase de 1 palabra nunca
    // se llenaba nada y el ejercicio quedaba sin nada que escribir.
    // Ahora se toman, al azar, tantas palabras SIN USAR como se pueda
    // (hasta "objetivo"), preferiendo las de 3+ letras pero sin exigirlo.
    const objetivo = cuantos || indices.length;
    if (indices.length < objetivo) {
      const disponibles = tokens.map((t, i) => i).filter(i => !usados.has(i));
      const preferidas = disponibles.filter(i => norm(tokens[i].p).length >= 3);
      const candidatas = barajarDom(preferidas.length ? preferidas : disponibles);
      for (const i of candidatas) {
        if (indices.length >= objetivo) break;
        usados.add(i); indices.push(i);
      }
    }
    indices.sort((a, b) => a - b);
    return { lineas, tokens, indices };
  }
  function huecosHTML(prep, opts = {}) {
    const porLinea = {};
    prep.tokens.forEach((t, ix) => { (porLinea[t.li] = porLinea[t.li] || []).push({ t, ix }); });
    return Object.keys(porLinea).map(li => {
      const trozos = porLinea[li].map(({ t, ix }) => {
        const nombre = t.hablante ? `<span class="font-black text-[#FF7A00] mr-1">${escapeHTML(t.hablante)}:</span>` : '';
        const k = prep.indices.indexOf(ix);
        if (k === -1) return `${nombre}<span>${escapeHTML(t.p)}</span>`;
        const cola = (t.p.match(/[.,!?;:"']+$/) || [''])[0];
        const ancho = Math.max(4, norm(t.p).length + 1);
        return `${nombre}<input class="hueco" data-h="${k}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:${ancho}ch" placeholder="…">${escapeHTML(cola)}`;
      }).join(' ');
      return `<p class="${opts.clase || 'leading-loose text-slate-700 font-medium'}">${trozos}</p>`;
    }).join('');
  }
  function revisarHuecos(prep, raiz) {
    let ok = 0;
    prep.indices.forEach((ix, k) => {
      const inp = raiz.querySelector(`input.hueco[data-h="${k}"]`);
      if (!inp) return;
      const correcta = prep.tokens[ix].p.replace(/[.,!?;:]+$/, '');
      const bien = norm(inp.value) === norm(correcta);
      inp.disabled = true;
      inp.classList.add(bien ? 'ok' : 'mal');
      if (bien) ok++;
      else {
        if (!inp.value.trim()) inp.classList.remove('mal');
        const sol = document.createElement('span');
        sol.className = 'solucion';
        sol.innerHTML = ` ${escapeHTML(correcta)}`;
        inp.after(sol);
      }
    });
    return ok;
  }
  function enfocarPrimerHuecoDom() {
    const primero = document.querySelector('input.hueco');
    if (primero) setTimeout(() => primero.focus(), 250);
    document.querySelectorAll('input.hueco').forEach((inp, i, todos) => {
      inp.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') { sfx('type'); return; }
        e.preventDefault();
        if (todos[i + 1]) todos[i + 1].focus(); else document.getElementById('dom-check')?.click();
      });
    });
  }
  // Reproduce el audio real grabado si existe; si no, cae a la voz del navegador.
  function reproducirAudioDom(fila, campoTexto) {
    const url = fila?.audio_url;
    if (url) {
      stopSpeaking();
      const a = new Audio(url);
      a.play().catch(() => speak(fila[campoTexto] || ''));
      return a;
    }
    speak(fila[campoTexto] || '');
    return null;
  }

  /* ------------------------------------------------------------
     MOTOR DE FLUJO DE UNA SUBSECCIÓN
     paso: 'lee' → 'ronda' (🧩/👂) → 'video' (si par) → 'conversar'
           (si par) → 'abu' → completada
  ------------------------------------------------------------ */
  function domPintarFase(txt, pct) { updateProgressBar(pct); }

  async function pasoDominar(nivel) {
    stopSpeaking();
    const cont = await cargarContenidoDominar(nivel);
    const d = ensureDominar(nivel);
    const n = d.subseccionActual;
    const item = cont.plan[n];
    if (!item) return dominarSinContenido(nivel);
    const st = ensureSub(nivel, n);
    const pctBase = ((n - 1) / DOMINAR_SUBS) * 100;
    const pasoPct = { lee: 5, ronda: 35, video: 60, conversar: 75, abu: 90 }[st.paso] || 95;
    domPintarFase('DOMINAR', pctBase + (pasoPct / DOMINAR_SUBS));

    if (st.paso === 'lee') {
      if (item.lee) return domEjTexto(nivel, n, item.lee);
      st.paso = 'ronda'; await updateUserFlow(); return pasoDominar(nivel);
    }
    if (st.paso === 'ronda') {
      if (st.rondaIdx < item.ronda.length) {
        const r = item.ronda[st.rondaIdx];
        return r.tipo === 'orden' ? domEjOrden(nivel, n, r.fila) : domEjEscucha(nivel, n, r.fila);
      }
      st.paso = 'video'; await updateUserFlow(); return pasoDominar(nivel);
    }
    if (st.paso === 'video') {
      if (item.video) return domEjVideo(nivel, n, item.video);
      st.paso = 'conversar'; await updateUserFlow(); return pasoDominar(nivel);
    }
    if (st.paso === 'conversar') {
      if (item.conversar) return domIntroAhoraAConversar(nivel, n, item.conversar);
      st.paso = 'abu'; await updateUserFlow(); return pasoDominar(nivel);
    }
    if (st.paso === 'abu') return domIntroConversaAbu(nivel, n, item);
    return domSubseccionCompleta(nivel, n);
  }

  function domPieEjercicio() {
    return `<div class="mt-4"><div id="dom-msg" class="text-center font-bold text-sm mb-2 min-h-[1.25rem]"></div>
      <button id="dom-check" class="w-full btn-juice bg-slate-800 text-white font-bold py-3 rounded-xl text-lg shadow-lg">COMPROBAR</button></div>`;
  }
  function domBindPie(nivel, n, comprobar) {
    const btn = document.getElementById('dom-check');
    btn.onclick = () => {
      const r = comprobar();
      if (r === false) return;
      const perfecto = r.ok === r.total;
      playSound(perfecto ? 'correct' : 'wrong');
      if (perfecto) triggerConfetti();
      const msg = document.getElementById('dom-msg');
      msg.className = `text-center font-bold text-sm mb-2 min-h-[1.25rem] ${perfecto ? 'text-green-600' : 'text-slate-500'}`;
      msg.innerHTML = perfecto ? '🎉 ¡Perfecto!' : `Acertaste <b class="text-[#FF7A00]">${r.ok}</b> de ${r.total}. En verde está la respuesta.`;
      const pts = r.puntos ?? (r.ok * DOM_PTS_HUECO);
      if (pts > 0) addPoints(pts);
      btn.className = 'w-full btn-juice bg-[#FF7A00] text-white font-bold py-3 rounded-xl text-lg shadow-lg';
      btn.textContent = 'CONTINUAR 👉';
      btn.onclick = async () => {
        const st = ensureSub(nivel, n);
        st.rondaAciertos = (st.rondaAciertos || 0) + r.ok;
        st.rondaFallos = (st.rondaFallos || 0) + (r.total - r.ok);
        if (r.ok < r.total && r.tag) st.fallidos.push(r.tag);
        if (r.avanzaRonda) st.rondaIdx = (st.rondaIdx || 0) + 1;
        else st.paso = r.siguientePaso || st.paso;
        touchStreak();
        await updateUserFlow();
        pasoDominar(nivel);
      };
    };
  }

  /* 🧩 Organiza la frase */
  function domEjOrden(nivel, n, fila) {
    const palabras = String(fila.frase).trim().split(/\s+/);
    let mezcla = barajarDom(palabras);
    if (palabras.length > 2 && mezcla.join(' ') === palabras.join(' ')) mezcla = barajarDom(palabras);
    const elegidas = [];
    appContainer.innerHTML = `
      <div class="card-3d p-4 sm:p-5 animate-pop mt-1">
        <div class="flex items-center justify-between mb-3">
          <span class="bg-indigo-100 text-indigo-600 px-3 py-1 rounded-full text-xs font-bold uppercase">🧩 Organiza la frase</span>
          <button id="dom-say" class="w-9 h-9 rounded-full bg-slate-100 text-slate-400 hover:text-[#FF7A00]" title="Escuchar"><i class="fas fa-volume-up"></i></button>
        </div>
        <p class="text-slate-500 text-center font-medium mb-3">${escapeHTML(fila.traduccion || 'Ordena las palabras en inglés')}</p>
        <div id="dom-zona" class="zona-respuesta mb-3"></div>
        <div id="dom-banco" class="text-center"></div>
        ${domPieEjercicio()}
      </div>`;
    const zona = document.getElementById('dom-zona');
    const banco = document.getElementById('dom-banco');
    const pintar = () => {
      zona.innerHTML = elegidas.map((bi, pos) => `<button class="tk" data-pos="${pos}">${escapeHTML(mezcla[bi])}</button>`).join('');
      banco.innerHTML = mezcla.map((p, bi) => `<button class="tk ${elegidas.includes(bi) ? 'fantasma' : ''}" data-bi="${bi}">${escapeHTML(p)}</button>`).join('');
      zona.querySelectorAll('[data-pos]').forEach(b => b.onclick = () => { elegidas.splice(parseInt(b.dataset.pos), 1); pintar(); });
      banco.querySelectorAll('[data-bi]').forEach(b => b.onclick = () => {
        const bi = parseInt(b.dataset.bi); if (elegidas.includes(bi)) return;
        elegidas.push(bi); sfx('pop'); pintar();
      });
    };
    pintar();
    document.getElementById('dom-say').onclick = () => reproducirAudioDom(fila, 'frase');
    domBindPie(nivel, n, () => {
      if (elegidas.length < palabras.length) { showToast('Usa todas las palabras 😉', 1600); return false; }
      const armada = elegidas.map(i => mezcla[i]).join(' ');
      const bien = norm(armada) === norm(fila.frase);
      zona.innerHTML = `<div class="p-2 text-lg font-bold ${bien ? 'text-green-600' : 'text-red-500 wrong-shake'}">${escapeHTML(armada)}</div>
        ${bien ? '' : `<div class="p-2 text-base text-green-600 font-bold border-t border-slate-200">✔️ ${escapeHTML(fila.frase)}</div>`}`;
      banco.innerHTML = '';
      reproducirAudioDom(fila, 'frase');
      return { ok: bien ? 1 : 0, total: 1, puntos: bien ? DOM_PTS_ORDEN : 0, avanzaRonda: true, tag: { tipo: 'orden', id: fila.id } };
    });
  }

  /* 👂 Escucha y completa */
  function domEjEscucha(nivel, n, fila) {
    const prep = prepararHuecos(fila.frase, fila.huecos, huecosCuantos(fila.frase, 3));
    appContainer.innerHTML = `
      <div class="card-3d p-4 sm:p-5 animate-pop mt-1 text-center">
        <span class="bg-pink-100 text-pink-600 px-3 py-1 rounded-full text-xs font-bold uppercase mb-3 inline-block">👂 Escucha y completa</span>
        <button id="dom-play" class="w-20 h-20 bg-gradient-to-br from-[#FF7A00] to-orange-600 rounded-full shadow-xl shadow-orange-200 text-white text-3xl hover:scale-105 transition active:scale-95 my-4 flex items-center justify-center mx-auto">
          <i class="fas fa-volume-up"></i>
        </button>
        <div id="dom-huecos" class="bg-slate-50 border border-slate-100 rounded-xl p-3 text-[15px]">${huecosHTML(prep)}</div>
        ${domPieEjercicio()}
      </div>`;
    document.getElementById('dom-play').onclick = () => reproducirAudioDom(fila, 'frase');
    setTimeout(() => reproducirAudioDom(fila, 'frase'), 500);
    enfocarPrimerHuecoDom();
    domBindPie(nivel, n, () => {
      const raiz = document.getElementById('dom-huecos');
      const ok = revisarHuecos(prep, raiz);
      if (fila.traduccion) raiz.insertAdjacentHTML('beforeend', `<p class="text-xs text-slate-400 mt-2 border-t border-slate-200 pt-2">${escapeHTML(fila.traduccion)}</p>`);
      reproducirAudioDom(fila, 'frase');
      return { ok, total: prep.indices.length || 1, avanzaRonda: true, tag: { tipo: 'escucha', id: fila.id } };
    });
  }

  /* 📖 Lee y completa */
  function domEjTexto(nivel, n, fila) {
    const prep = prepararHuecos(fila.texto, fila.huecos, huecosCuantos(fila.texto, 4));
    const palabras = String(fila.texto).trim().split(/\s+/).length;
    appContainer.innerHTML = `
      <div class="card-3d p-4 sm:p-5 animate-pop mt-1">
        <div class="flex items-center justify-between mb-3">
          <span class="bg-emerald-100 text-emerald-600 px-3 py-1 rounded-full text-xs font-bold uppercase">📖 Lee y completa</span>
          <span class="text-[10px] font-bold text-slate-300">${palabras} palabras</span>
        </div>
        <h3 class="font-heading font-bold text-slate-800 text-lg mb-2">${escapeHTML(fila.titulo || '')}</h3>
        <div id="dom-huecos" class="bg-slate-50 border border-slate-100 rounded-xl p-3 text-[15px]">${huecosHTML(prep)}</div>
        <div class="flex items-center gap-3 mt-2">
          <button id="dom-say" class="text-[11px] font-bold text-slate-400 hover:text-[#FF7A00]"><i class="fas fa-volume-up mr-1"></i>Escuchar el texto</button>
        </div>
        ${domPieEjercicio()}
      </div>`;
    enfocarPrimerHuecoDom();
    document.getElementById('dom-say').onclick = () => reproducirAudioDom(fila, 'texto');
    setTimeout(() => reproducirAudioDom(fila, 'texto'), 500); // se reproduce solo, de una vez
    domBindPie(nivel, n, () => {
      const raiz = document.getElementById('dom-huecos');
      const ok = revisarHuecos(prep, raiz);
      if (fila.traduccion) raiz.insertAdjacentHTML('beforeend', `<details class="mt-2 border-t border-slate-200 pt-2"><summary class="text-[11px] font-bold text-slate-400 cursor-pointer">Ver la traducción</summary><p class="text-xs text-slate-500 mt-1">${escapeHTML(fila.traduccion)}</p></details>`);
      return { ok, total: prep.indices.length || 1, puntos: DOM_PTS_LEE, avanzaRonda: false, siguientePaso: 'ronda' };
    });
  }

  /* 🎬 Mira y completa — video real (video_url) con guion para completar */
  let domVideoActivo = null;
  function domEjVideo(nivel, n, fila) {
    const prep = prepararHuecos(fila.guion, fila.huecos, huecosCuantos(fila.guion, 3));
    const yt = (fila.youtube_id || '').trim();
    const pantalla = yt
      ? `<div class="overflow-hidden rounded-2xl border-4 border-slate-800"><iframe class="w-full aspect-video" src="https://www.youtube.com/embed/${encodeURIComponent(yt)}?rel=0" title="${escapeHTML(fila.titulo || '')}" frameborder="0" allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`
      : fila.video_url
        ? `<div class="overflow-hidden rounded-2xl border-4 border-slate-800 bg-black"><video id="dom-video" class="w-full aspect-video" src="${escapeHTML(fila.video_url)}" controls playsinline></video></div>`
        : `<div class="video-screen"><div class="video-emoji">🎬</div><div class="video-sub">Video no disponible</div></div>`;
    appContainer.innerHTML = `
      <div class="card-3d p-4 sm:p-5 animate-pop mt-1">
        <div class="flex items-center justify-between mb-3">
          <span class="bg-red-100 text-red-600 px-3 py-1 rounded-full text-xs font-bold uppercase">🎬 Mira y completa</span>
          <span class="text-[11px] font-bold text-slate-400 truncate ml-2">${escapeHTML(fila.titulo || '')}</span>
        </div>
        ${pantalla}
        <p class="text-[11px] font-bold text-slate-400 mt-3 mb-1">Completa las palabras que faltan en el guion:</p>
        <div id="dom-huecos" class="bg-slate-50 border border-slate-100 rounded-xl p-3 space-y-1">${huecosHTML(prep, { clase: 'leading-loose text-slate-700 font-medium text-[15px]' })}</div>
        ${domPieEjercicio()}
      </div>`;
    enfocarPrimerHuecoDom();
    const v = document.getElementById('dom-video');
    if (v) setTimeout(() => v.play().catch(() => {}), 400);
    domBindPie(nivel, n, () => {
      if (v) v.pause();
      const raiz = document.getElementById('dom-huecos');
      const ok = revisarHuecos(prep, raiz);
      if (fila.traduccion) raiz.insertAdjacentHTML('beforeend', `<details class="mt-2 border-t border-slate-200 pt-2"><summary class="text-[11px] font-bold text-slate-400 cursor-pointer">Ver la traducción</summary><p class="text-xs text-slate-500 whitespace-pre-line mt-1">${escapeHTML(fila.traduccion)}</p></details>`);
      return { ok, total: prep.indices.length || 1, puntos: DOM_PTS_VIDEO, avanzaRonda: false, siguientePaso: 'conversar' };
    });
  }

  /* ------------------------------------------------------------
     RECONOCIMIENTO DE VOZ (Web Speech API) — usado por "Ahora, a
     conversar" y "Conversa con Abu". Si el navegador no lo soporta
     (Firefox / algunos Safari viejos), se avisa y se deja continuar
     sin bloquear al usuario.
  ------------------------------------------------------------ */
  // Solo puede haber UN reconocedor vivo en toda la app: si quedó uno
  // abierto en otra pantalla, el navegador lanza InvalidStateError al
  // hacer start() y el micrófono "no hace nada".

  /* ------------------------------------------------------------
     RECONOCIMIENTO DE VOZ EN CELULAR — dos problemas reales

     1) DUPLICADOS ("me repite palabras"). En Chrome de Android,
        e.resultIndex no siempre avanza: llega en 0 una y otra vez,
        así que ir ACUMULANDO desde resultIndex vuelve a pegar
        finales ya pegados. Solución: en cada evento se REARMA el
        texto leyendo TODOS los resultados de la sesión, en vez de
        ir sumando. Lo dicho en sesiones anteriores (cuando el
        navegador corta solo por silencio) se guarda aparte.

     2) El micrófono es EXCLUSIVO en el celular: si MediaRecorder
        ya tomó el stream, el reconocimiento de voz falla con
        'audio-capture'. En el PC sí se pueden compartir, por eso
        allá funcionaba y aquí no.
  ------------------------------------------------------------ */
  const esMovilVoz = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  // Red de seguridad: si aun así se cuela un bloque repetido
  // ("how are you how are you"), se colapsa. Solo bloques de 2+
  // palabras o una misma palabra 3+ veces seguidas, para no dañar
  // repeticiones legítimas como "very very good" o "bye bye".
  function limpiarRepeticionesVoz(texto) {
    let p = (texto || '').trim().split(/\s+/).filter(Boolean);
    if (p.length < 2) return (texto || '').trim();

    // Bloques repetidos al final: "a b c a b c" → "a b c"
    let cambio = true;
    while (cambio) {
      cambio = false;
      for (let n = Math.floor(p.length / 2); n >= 2; n--) {
        const fin = p.slice(-n).join(' ').toLowerCase();
        const antes = p.slice(-2 * n, -n).join(' ').toLowerCase();
        if (fin && fin === antes) { p = p.slice(0, -n); cambio = true; break; }
      }
    }
    // Una misma palabra repetida 3+ veces seguidas se recorta a dos:
    // así "hello hello hello" se arregla pero "bye bye" queda intacto.
    const salida = [];
    for (const w of p) {
      const n = salida.length;
      if (n >= 2 && salida[n - 1].toLowerCase() === w.toLowerCase()
                 && salida[n - 2].toLowerCase() === w.toLowerCase()) continue;
      salida.push(w);
    }
    return salida.join(' ');
  }

  let recActivoGlobal = null;

  function crearReconocedorVoz(lang) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    const rec = new SR();
    rec.lang = lang || 'en-US';
    // En celular NO se usa continuous: Chrome de Android lo ignora y es
    // parte del problema de los duplicados. El reinicio de onend cubre
    // las pausas en ambos casos.
    rec.continuous = !esMovilVoz;
    rec.interimResults = true;  // así se va acumulando todo lo dicho
    rec.maxAlternatives = 1;
    return rec;
  }
  // Grabación con inicio/parada MANUAL: el usuario toca el micrófono para
  // empezar y lo vuelve a tocar para parar y enviar lo que dijo (antes se
  // detenía solo apenas detectaba una pausa, y a veces cortaba a mitad de
  // frase). onFinal(texto) se dispara una sola vez, al terminar de parar.
  function iniciarGrabacionVoz({ onFinal, onError, lang }) {
    // Mata cualquier grabación anterior que haya quedado viva.
    if (recActivoGlobal) { try { recActivoGlobal.abort(); } catch {} recActivoGlobal = null; }

    const rec = crearReconocedorVoz(lang);
    if (!rec) { onError && onError('no-soportado'); return null; }

    let previo = '';           // lo dicho en sesiones YA cerradas
    let sesion = '';           // lo de la sesión en curso (se rearma entero)
    const textoTotal = () => limpiarRepeticionesVoz((previo + ' ' + sesion).trim());
    let detenidoManual = false;
    let cerrado = false;       // onFinal/onError se disparan UNA sola vez
    const t0 = Date.now();
    const MAX_MS = 120000;     // tope duro de 2 min por grabación

    const cerrar = (fn, arg) => {
      if (cerrado) return;
      cerrado = true;
      if (recActivoGlobal === rec) recActivoGlobal = null;
      fn && fn(arg);
    };

    rec.onresult = (e) => {
      // Se REARMA desde cero con todos los resultados de esta sesión.
      // Nada de ir sumando: eso es lo que duplicaba en Android.
      let texto = '';
      for (let i = 0; i < e.results.length; i++) texto += e.results[i][0].transcript + ' ';
      sesion = texto.trim();
    };

    rec.onerror = (e) => {
      const err = e.error || 'error';
      // 'no-speech' y 'aborted' NO son fallas reales: llegan cuando hubo
      // un silencio o cuando tú mismo detuviste. Que decida onend.
      if (err === 'no-speech' || err === 'aborted') return;
      if (err === 'not-allowed' || err === 'service-not-allowed') {
        cerrar(onError, 'sin-permiso');
      } else if (!detenidoManual) {
        cerrar(onError, err);
      }
    };

    rec.onend = () => {
      if (cerrado) return;
      // Se cierra la sesión: lo suyo pasa a 'previo' y la siguiente
      // empieza limpia (e.results se reinicia en cada sesión).
      if (sesion) { previo = (previo + ' ' + sesion).trim(); sesion = ''; }
      if (detenidoManual) { cerrar(onFinal, textoTotal()); return; }
      // Chrome corta solo tras unos segundos de silencio aunque continuous
      // sea true: se reanuda sin perder lo dicho, para que el botón nunca
      // quede trabado en "stop" y las pausas no corten la frase.
      if (Date.now() - t0 < MAX_MS) {
        try { rec.start(); return; } catch {}
      }
      cerrar(onFinal, textoTotal());
    };

    rec.detener = () => {
      detenidoManual = true;
      try { rec.stop(); } catch { cerrar(onFinal, textoTotal()); }
    };

    try { rec.start(); } catch { cerrar(onError, 'no-inicio'); return null; }
    recActivoGlobal = rec;
    return rec;
  }
  // Coincidencia flexible: cuánto de lo esperado apareció en lo que dijiste.
  function coincideVoz(dicho, esperado) {
    const b = norm(esperado).split(' ').filter(Boolean);
    if (!b.length) return true;
    const setA = new Set(norm(dicho).split(' ').filter(Boolean));
    const coincid = b.filter(w => setA.has(w)).length;
    return (coincid / b.length) >= 0.6;
  }
  // Prende/apaga la UI del botón de micrófono con este patrón manual: un
  // solo listener que alterna entre "grabar" y "detener y enviar".
  function bindMicManual(btn, msg, { onFinal, onError, lang = 'en-US', textoEscuchando = 'Escuchando… toca de nuevo para enviar' }) {
    if (!btn) return;
    let grabacion = null;
    let watchdog = null;
    const decir = (t) => { if (msg) msg.textContent = t; };
    const avisarError = (err) => {
      onError && onError(err);
      // Mensajes claros para los dos casos que el usuario SÍ puede resolver.
      if (err === 'sin-permiso') decir('Bloqueaste el micrófono 🔒 — actívalo en el candado de la barra de direcciones');
      if (err === 'no-inicio') decir('El micrófono está ocupado — espera un segundo e inténtalo otra vez');
    };
    // "Se queda en Enviando..." — a veces, tras stop(), el navegador NO
    // dispara ni onend ni onerror (falla conocida en algunos Chrome /
    // Android). Sin este respaldo el botón queda trabado para siempre.
    // Si en WATCHDOG_MS no llegó ninguna respuesta, se resetea solo.
    const WATCHDOG_MS = 6000;
    const limpiarWatchdog = () => { if (watchdog) { clearTimeout(watchdog); watchdog = null; } };
    const resetBtn = () => { btn.classList.remove('escuchando'); btn.innerHTML = '<i class="fas fa-microphone"></i>'; };
    btn.onclick = () => {
      if (btn.disabled) return;
      if (grabacion) {
        decir('Enviando...');
        const g = grabacion;
        limpiarWatchdog();
        watchdog = setTimeout(() => {
          if (grabacion !== g) return; // ya se resolvió por las buenas
          grabacion = null;
          resetBtn();
          try { g.abort(); } catch {}
          avisarError('atascado');
        }, WATCHDOG_MS);
        g.detener();   // se llama DESPUÉS de armar el watchdog: si onend
                       // llega instantáneo, ya hay quién lo cancele.
        return;
      }
      grabacion = iniciarGrabacionVoz({
        lang,
        onFinal: (texto) => { limpiarWatchdog(); grabacion = null; resetBtn(); onFinal && onFinal(texto); },
        onError: (err) => { limpiarWatchdog(); grabacion = null; resetBtn(); avisarError(err); }
      });
      if (grabacion) { btn.classList.add('escuchando'); btn.innerHTML = '<i class="fas fa-stop"></i>'; decir(textoEscuchando); }
    };
  }

  /* ------------------------------------------------------------
     🎭 "AHORA, A CONVERSAR" — diálogo guiado en solitario.
     El usuario elige un personaje; las líneas de los DEMÁS se
     reproducen con el audio grabado, y las SUYAS las debe decir en
     voz alta (se comparan con el texto objetivo, sin bloquear el
     avance si el reconocimiento falla).
  ------------------------------------------------------------ */
  function domIntroAhoraAConversar(nivel, n, conv) {
    const p = conv.parsed || {};
    appContainer.innerHTML = `
      <div class="card-3d p-5 animate-pop mt-1 text-center">
        <span class="bg-purple-100 text-purple-600 px-3 py-1 rounded-full text-xs font-bold uppercase mb-3 inline-block">🎭 Ahora, a conversar</span>
        <h3 class="font-heading font-bold text-slate-800 text-lg mb-1">${escapeHTML(conv.titulo || '')}</h3>
        <p class="text-slate-500 text-sm mb-4">${escapeHTML(p.escena || '')}</p>
        <p class="text-[11px] font-bold text-slate-400 mb-2">Elige tu personaje:</p>
        <div id="dom-personajes" class="grid grid-cols-2 gap-2 mb-2">
          ${(p.personajes || []).map(per => `<button class="personaje-btn" data-per="${escapeHTML(per)}"><div class="text-2xl mb-1">🧑</div><div class="font-bold text-sm">${escapeHTML(per)}</div></button>`).join('')}
        </div>
        <p class="text-[11px] text-slate-400 mt-2">Dirás en voz alta las líneas de tu personaje; las demás las escucharás.</p>
      </div>`;
    document.querySelectorAll('#dom-personajes [data-per]').forEach(b => {
      b.onclick = () => domConversarIniciar(nivel, n, conv, b.dataset.per);
    });
  }

  /* Mismo formato de chat que "Conversa con Abu": las líneas se van
     acumulando como burbujas (con 🔊 para reescuchar y "Ver traducción"
     en las que no son tuyas); cuando te toca hablar aparece el micrófono
     debajo, como en la charla con Abu. */
  let domConvActual = null; // { conv, personaje } — para poder repetir la conversación al final
  function domConversarIniciar(nivel, n, conv, personaje) {
    stopSpeaking();
    domConvActual = { conv, personaje };
    const total = conv.parsed.lineas.length;
    appContainer.innerHTML = `
      <div class="card-3d p-3 sm:p-4 animate-pop mt-1">
        <div class="flex items-center gap-2 mb-2">
          <span class="bg-purple-100 text-purple-600 px-2.5 py-1 rounded-full text-[11px] font-bold uppercase shrink-0">🎭 ${escapeHTML(conv.titulo || '')}</span>
          <div class="flex-1 progress-track" style="margin-top:0"><div id="dom-conv-bar" class="progress-fill" style="width:0%"></div></div>
          <span class="text-[11px] font-black text-slate-400 shrink-0"><span id="dom-conv-count">0</span>/${total}</span>
        </div>
        <div id="dom-conv-messages" class="chat-scroll h-[42vh] min-h-[200px] overflow-y-auto p-2 space-y-2 mb-2 bg-slate-50 rounded-xl border border-slate-100"></div>
        <div id="dom-conv-turno" class="flex flex-col items-center gap-1.5"></div>
      </div>`;
    domConversarBind();
    domConversarPaso(nivel, n, conv, personaje, 0);
  }

  function domConversarBind() {
    const box = document.getElementById('dom-conv-messages');
    if (!box) return;
    box.addEventListener('click', (e) => {
      const say = e.target.closest('[data-say]');
      if (say) {
        stopSpeaking();
        if (say.dataset.audio) reproducirAudioDom({ audio_url: say.dataset.audio, texto: decodeURIComponent(say.dataset.say || '') }, 'texto');
        else speak(decodeURIComponent(say.dataset.say || ''));
        return;
      }
      const tr = e.target.closest('[data-toggle-tr]');
      if (tr) { const el = document.getElementById(tr.dataset.toggleTr); if (el) el.classList.toggle('hidden'); }
    });
  }

  // audioUrl: si viene, el botón 🔊 reproduce ESE audio real en vez de TTS
  // (para tus propios mensajes, es el audio de referencia de "conversaciones",
  // no una grabación de tu voz — de la tuya solo se guarda el texto).
  // objetivo: para tus mensajes, la frase que debías decir; queda visible
  // debajo de lo que se entendió, para poder comparar.
  function domConversarBubble(role, en, es, audioUrl, objetivo) {
    const box = document.getElementById('dom-conv-messages');
    if (!box) return;
    const idTr = 'dom-tr-' + Math.random().toString(36).slice(2, 9);
    const btnSay = `<button data-say="${encodeURIComponent(en)}" ${audioUrl ? `data-audio="${escapeHTML(audioUrl)}"` : ''} title="Escuchar" class="shrink-0 w-8 h-8 rounded-full bg-white border border-slate-200 text-slate-400 hover:text-[#FF7A00] hover:border-[#FF7A00] active:scale-90 transition flex items-center justify-center"><i class="fas fa-volume-up text-[11px]"></i></button>`;
    const div = document.createElement('div');
    if (role === 'user') {
      div.className = 'flex justify-end items-end gap-1.5';
      div.innerHTML = `${btnSay}<div class="bg-[#FF7A00] text-white rounded-2xl rounded-br-sm px-3.5 py-2 max-w-[75%] font-medium">
        ${objetivo ? `<div class="text-[13px] font-bold leading-snug">${escapeHTML(objetivo)}</div>` : ''}
        <div class="text-[10px] font-black text-orange-100 uppercase mt-1.5 pt-1.5 ${objetivo ? 'border-t border-white/25' : ''} mb-0.5">Dijiste</div>
        ${escapeHTML(en)}
        ${es ? `<button data-toggle-tr="${idTr}" class="block text-[10px] font-bold text-orange-100 underline mt-1">Ver traducción</button>
        <div id="${idTr}" class="hidden text-xs text-orange-100 mt-0.5 leading-snug">${escapeHTML(es)}</div>` : ''}
      </div>`;
    } else {
      div.className = 'flex justify-start items-end gap-1.5';
      div.innerHTML = `<div class="bg-white border border-slate-200 text-slate-800 rounded-2xl rounded-bl-sm px-3.5 py-2 max-w-[75%] shadow-sm">
        <div class="text-[10px] font-black text-purple-500 uppercase mb-0.5">${escapeHTML(role)}</div>
        <div class="font-medium leading-snug">${escapeHTML(en)}</div>
        ${es ? `<button data-toggle-tr="${idTr}" class="text-[10px] font-bold text-slate-400 underline mt-1">Ver traducción</button>
        <div id="${idTr}" class="hidden text-xs text-slate-400 mt-0.5 leading-snug">${escapeHTML(es)}</div>` : ''}
      </div>${btnSay}`;
    }
    box.appendChild(div); box.scrollTop = box.scrollHeight;
  }

  function domConversarPaso(nivel, n, conv, personaje, idx) {
    stopSpeaking();
    const lineas = conv.parsed.lineas;
    const bar = document.getElementById('dom-conv-bar'); if (bar) bar.style.width = `${Math.round((idx / lineas.length) * 100)}%`;
    const cnt = document.getElementById('dom-conv-count'); if (cnt) cnt.textContent = idx;
    if (idx >= lineas.length) return domConversarFin(nivel, n);
    const linea = lineas[idx];
    const esMio = linea.speaker === personaje;
    const turno = document.getElementById('dom-conv-turno');

    if (!esMio) {
      turno.innerHTML = `<div class="text-center text-slate-300"><i class="fas fa-volume-up fa-lg"></i></div>`;
      domConversarBubble(linea.speaker, linea.en, linea.es, linea.audio);
      const avanzar = () => domConversarPaso(nivel, n, conv, personaje, idx + 1);
      if (linea.audio) {
        const a = reproducirAudioDom({ audio_url: linea.audio, texto: linea.en }, 'texto');
        if (a) { a.onended = avanzar; a.onerror = () => setTimeout(avanzar, 1400); }
        else setTimeout(avanzar, Math.max(1400, linea.en.length * 55));
      } else {
        speak(linea.en);
        setTimeout(avanzar, Math.max(1400, linea.en.length * 55));
      }
      return;
    }

    turno.innerHTML = `
      <p class="text-[11px] font-black text-[#FF7A00] uppercase text-center px-4">Te toca — ${escapeHTML(personaje)}: "${escapeHTML(linea.en)}"</p>
      <button id="dom-conv-mic" class="mic-btn"><i class="fas fa-microphone"></i></button>
      <p id="dom-conv-mic-msg" class="text-xs font-bold text-slate-400 min-h-[1.2em] text-center px-4">Toca el micrófono para empezar a hablar</p>`;
    const micBtn = document.getElementById('dom-conv-mic');
    const msg = document.getElementById('dom-conv-mic-msg');
    bindMicManual(micBtn, msg, {
      onFinal: (texto) => {
        if (!texto) { msg.textContent = 'No escuché nada, intenta otra vez 🎙️'; return; }
        const bien = coincideVoz(texto, linea.en);
        playSound(bien ? 'correct' : 'wrong');
        // El 🔊 de esta burbuja reproduce el audio REAL de "conversaciones"
        // (linea.audio), no tu voz — de la tuya solo queda el texto.
        domConversarBubble('user', texto, linea.es || null, linea.audio || null, linea.en);
        msg.innerHTML = bien ? '<span class="text-green-600">✅ ¡Bien dicho!</span>' : '';
        // Atraso antes de reproducir el audio de referencia: si sonaba
        // pegado al efecto de acierto/error (playSound de arriba) se
        // sentía como si ambos audios se reprodujeran a la vez.
        setTimeout(() => {
          if (linea.audio) reproducirAudioDom({ audio_url: linea.audio, texto: linea.en }, 'texto'); else if (!bien) speak(linea.en);
        }, 700);
        setTimeout(() => domConversarPaso(nivel, n, conv, personaje, idx + 1), 2300);
      },
      onError: (err) => {
        if (err === 'no-soportado') {
          msg.innerHTML = `Tu navegador no reconoce voz. <button id="dom-conv-saltar" class="underline text-[#FF7A00] font-bold">Continuar</button>`;
          document.getElementById('dom-conv-saltar').onclick = () => domConversarPaso(nivel, n, conv, personaje, idx + 1);
        } else {
          msg.textContent = 'No te escuché bien, intenta otra vez 🎙️';
        }
      }
    });
  }

  // Al terminar: sin modal — botones fijos abajo para reescuchar toda la
  // conversación de nuevo o continuar cuando el usuario quiera.
  async function domConversarFin(nivel, n) {
    const st = ensureSub(nivel, n);
    if (!st.conversarOk) {
      await addPoints(DOM_PTS_CONVERSAR);
      st.conversarOk = true; st.paso = 'abu';
      await updateUserFlow();
      playSound('complete'); triggerConfetti();
    }
    domConversarMostrarFinal(nivel, n);
  }
  function domConversarMostrarFinal(nivel, n) {
    const turno = document.getElementById('dom-conv-turno');
    if (!turno) return pasoDominar(nivel);
    turno.innerHTML = `
      <p class="text-center text-sm font-bold text-green-600 mb-2">🎉 ¡Conversación terminada! <span class="text-yellow-600">+${DOM_PTS_CONVERSAR} puntos</span></p>
      <div class="flex gap-2 w-full">
        <button id="dom-conv-repetir" class="flex-1 btn-juice bg-white border-2 border-slate-200 text-slate-600 font-bold py-2.5 rounded-xl text-sm"><i class="fas fa-rotate-right mr-1"></i>Escuchar de nuevo</button>
        <button id="dom-conv-continuar" class="flex-1 btn-juice bg-[#FF7A00] text-white font-bold py-2.5 rounded-xl text-sm">Continuar 👉</button>
      </div>`;
    document.getElementById('dom-conv-repetir').onclick = () => domConversarReproducirTodo(nivel, n);
    document.getElementById('dom-conv-continuar').onclick = () => pasoDominar(nivel);
  }
  function domConversarReproducirTodo(nivel, n) {
    if (!domConvActual) return domConversarMostrarFinal(nivel, n);
    const lineas = domConvActual.conv.parsed.lineas;
    const turno = document.getElementById('dom-conv-turno');
    if (turno) turno.innerHTML = `<p class="text-center text-xs font-bold text-slate-400"><i class="fas fa-circle-notch fa-spin mr-1"></i>Reproduciendo de nuevo…</p>`;
    let i = 0;
    const paso = () => {
      if (i >= lineas.length) return domConversarMostrarFinal(nivel, n);
      const l = lineas[i];
      const avanzar = () => { i++; paso(); };
      if (l.audio) {
        const a = reproducirAudioDom({ audio_url: l.audio, texto: l.en }, 'texto');
        if (a) { a.onended = avanzar; a.onerror = () => setTimeout(avanzar, 1200); }
        else setTimeout(avanzar, Math.max(1200, l.en.length * 55));
      } else { speak(l.en); setTimeout(avanzar, Math.max(1200, l.en.length * 55)); }
    };
    paso();
  }

  /* ------------------------------------------------------------
     🦉 "CONVERSA CON ABU" — usa la MISMA función de IA que ya
     habla con Abu en el flujo de vocabulario (generar-dialogo,
     mode:'chat'), pero aquí solo se puede responder por voz y las
     3 sugerencias son para ESCUCHAR (no para copiar y pegar).
  ------------------------------------------------------------ */
  let domChatSession = null;
  let domAiChat = [];
  let domChatFrases = [];

  // Junta las frases que YA estudió en esta subsección (no palabras sueltas):
  // las de la ronda 🧩/👂 y las oraciones del texto de 📖 Lee y completa.
  // Esto es lo que se manda a la función de IA para que Abu arme una
  // conversación real con lo que el usuario acaba de practicar.
  function frasesEstudiadasDeSubseccion(item) {
    const frases = [];
    (item.ronda || []).forEach(r => { if (r.fila.frase) frases.push(r.fila.frase.trim()); });
    if (item.lee?.texto) {
      item.lee.texto.split(/(?<=[.!?])\s+/).forEach(s => { if (s.trim()) frases.push(s.trim()); });
    }
    return [...new Set(frases)].slice(0, 10);
  }

  function domIntroConversaAbu(nivel, n, item) {
    appContainer.innerHTML = `
      <div class="card-3d p-6 text-center animate-pop mt-1">
        <div class="text-5xl mb-3">🦉</div>
        <h3 class="font-heading font-bold text-slate-800 text-xl mb-2">Conversa con Abu</h3>
        <p class="text-slate-500 mb-4">Abu te va a preguntar algo usando lo que acabas de estudiar. <b>Solo puedes responder con tu voz</b>, en inglés.</p>
        <button id="dom-abu-empezar" class="btn-juice bg-[#FF7A00] text-white font-bold py-3 px-8 rounded-xl text-lg">Empezar 🎙️</button>
      </div>`;
    document.getElementById('dom-abu-empezar').onclick = () => domIniciarAbu(nivel, n, item);
  }

  // 👉 Para cambiar cuántos turnos dura "Conversa con Abu", edita
  // DOM_CHAT_GOAL más arriba (sección 14, junto a los demás DOM_PTS_*).
  function domIniciarAbu(nivel, n, item) {
    domChatFrases = frasesEstudiadasDeSubseccion(item);
    domAiChat = [];
    domChatSession = { nivel, n, count: 0, goal: DOM_CHAT_GOAL };
    domResetAudioCache(); // charla nueva → se descarta el audio real de la anterior
    appContainer.innerHTML = `
      <div class="card-3d p-3 sm:p-4 animate-pop mt-1">
        <div class="flex items-center gap-2 mb-2">
          <span class="bg-purple-100 text-purple-600 px-2.5 py-1 rounded-full text-[11px] font-bold uppercase shrink-0">🦉 Abu</span>
          <div class="flex-1 progress-track" style="margin-top:0"><div id="dom-abu-bar" class="progress-fill" style="width:0%"></div></div>
          <span class="text-[11px] font-black text-slate-400 shrink-0"><span id="dom-abu-count">0</span>/${DOM_CHAT_GOAL}</span>
        </div>
        <div id="dom-abu-messages" class="chat-scroll h-[40vh] min-h-[190px] overflow-y-auto p-2 space-y-2 mb-2 bg-slate-50 rounded-xl border border-slate-100"></div>
        <div id="dom-abu-quick" class="no-bar flex gap-1.5 overflow-x-auto whitespace-nowrap mb-3 min-h-[26px]"></div>
        <div class="flex flex-col items-center gap-1.5">
          <button id="dom-abu-mic" class="mic-btn"><i class="fas fa-microphone"></i></button>
          <p id="dom-abu-mic-msg" class="text-xs font-bold text-slate-400 min-h-[1.2em]">Toca el micrófono para responder</p>
        </div>
      </div>`;
    domBindAbu();
    const q = alAzar(ABU_GUION);
    const saludo = { en: `Hi! I'm Abu 👋 ${q.en}`, es: `¡Hola! Soy Abu 👋 ${q.es}`, tips: q.tips };
    domAddBubble('ai', saludo);
    domAiChat.push({ role: 'assistant', content: saludo.en });
    domPintarSugerencias(saludo.tips);
    speakAbu(saludo.en);
  }

  // Botón 🔊 (reescuchar) en cada burbuja — en las de Abu reproduce el
  // audio REAL ya obtenido de Google Cloud (cacheado en domAbuAudioCache,
  // ver speakAbu); en las tuyas usa la voz del navegador, ya que de tu
  // voz solo se guarda el texto reconocido, no el audio.
  // "Ver traducción" queda oculta hasta tocarla.
  function domAddBubble(role, msg) {
    const box = document.getElementById('dom-abu-messages');
    if (!box) return;
    const idTr = 'dom-tr-' + Math.random().toString(36).slice(2, 9);
    const btnSay = (texto, esAbu) => `<button data-say="${encodeURIComponent(texto)}" ${esAbu ? 'data-abu="1"' : ''} title="Escuchar" class="shrink-0 w-8 h-8 rounded-full bg-white border border-slate-200 text-slate-400 hover:text-[#FF7A00] hover:border-[#FF7A00] active:scale-90 transition flex items-center justify-center"><i class="fas fa-volume-up text-[11px]"></i></button>`;
    const div = document.createElement('div');
    if (role === 'user') {
      div.className = 'flex justify-end items-end gap-1.5';
      div.innerHTML = `${btnSay(msg.en, false)}<div class="bg-[#FF7A00] text-white rounded-2xl rounded-br-sm px-3.5 py-2 max-w-[78%] font-medium">
        ${escapeHTML(msg.en)}
        ${msg.fix ? `<div class="mt-1.5 text-[11px] font-bold text-amber-50 bg-black/15 rounded-lg px-2 py-1 leading-snug">✏️ ${escapeHTML(msg.fix)}</div>` : ''}
      </div>`;
    } else {
      div.className = 'flex justify-start items-end gap-1.5';
      div.innerHTML = `<div class="bg-white border border-slate-200 text-slate-800 rounded-2xl rounded-bl-sm px-3.5 py-2 max-w-[78%] shadow-sm">
        <div class="font-medium leading-snug">${escapeHTML(msg.en)}</div>
        ${msg.es ? `<button data-toggle-tr="${idTr}" class="text-[10px] font-bold text-slate-400 underline mt-1">Ver traducción</button>
        <div id="${idTr}" class="hidden text-xs text-slate-400 mt-0.5 leading-snug">${escapeHTML(msg.es)}</div>` : ''}
        ${msg.fix ? `<div class="mt-1.5 text-[11px] font-bold text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-2 py-1 leading-snug">✏️ ${escapeHTML(msg.fix)}</div>` : ''}
      </div>${btnSay(msg.en, true)}`;
    }
    box.appendChild(div); box.scrollTop = box.scrollHeight;
  }
  function domPintarSugerencias(tips) {
    const cont = document.getElementById('dom-abu-quick');
    if (!cont) return;
    const lista = (Array.isArray(tips) ? tips : []).map(t => String(t || '').trim()).filter(Boolean).slice(0, 3);
    cont.innerHTML = lista.map(r => `<button class="quick-reply shrink-0 text-[11px] font-bold px-2.5 py-1 rounded-full bg-slate-100 text-slate-500" data-txt="${escapeHTML(r)}">🔊 ${escapeHTML(r)}</button>`).join('');
    cont.querySelectorAll('.quick-reply').forEach(b => { b.onclick = () => speak(b.dataset.txt || ''); });
  }
  function domBindAbu() {
    // Delegación de clics dentro del chat: 🔊 reescuchar y "Ver traducción".
    const box = document.getElementById('dom-abu-messages');
    if (box) {
      box.addEventListener('click', (e) => {
        const say = e.target.closest('[data-say]');
        if (say) {
          const texto = decodeURIComponent(say.dataset.say || '');
          // Burbuja de Abu → reproduce el audio real (cacheado o, si hace
          // falta, recién pedido a Google Cloud). Burbuja tuya → siempre
          // voz del navegador, de tu voz solo se guardó el texto.
          if (say.dataset.abu) speakAbu(texto); else { stopSpeaking(); speak(texto); }
          return;
        }
        const tr = e.target.closest('[data-toggle-tr]');
        if (tr) { const el = document.getElementById(tr.dataset.toggleTr); if (el) el.classList.toggle('hidden'); }
      });
    }
    const mic = document.getElementById('dom-abu-mic');
    const msg = document.getElementById('dom-abu-mic-msg');
    if (!mic) return;
    bindMicManual(mic, msg, {
      onFinal: (texto) => {
        msg.textContent = 'Toca el micrófono para responder';
        if (texto) domEnviarAbu(texto); else msg.textContent = 'No escuché nada, intenta de nuevo 🎙️';
      },
      onError: (err) => {
        msg.textContent = err === 'no-soportado' ? 'Tu navegador no reconoce voz 😕' : 'No te escuché, intenta de nuevo';
      },
