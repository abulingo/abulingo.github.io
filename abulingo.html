  <style>
    /* ============================================================
       RENDIMIENTO · dos reglas que valen mucho en páginas largas
       ------------------------------------------------------------
       content-visibility: auto le dice al navegador que NO calcule
       el diseño ni pinte lo que está fuera de la pantalla hasta que
       te acerques. En listas de cientos de palabras, frases o temas
       de gramática es la diferencia entre pintar todo de golpe o
       pintar solo lo visible. contain-intrinsic-size le da una
       altura estimada para que la barra de scroll no salte.
    ============================================================ */
    .lista-larga > * {
      content-visibility: auto;
      contain-intrinsic-size: auto 72px;
    }
    /* Evita el "salto" de las imágenes mientras cargan */
    img { max-width: 100%; height: auto; }
    /* Respeta a quien tiene activado "reducir movimiento" en su sistema:
       menos animaciones = menos trabajo de pintado en equipos lentos. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

    // no depende del grupo/nivel en curso ni cierra la práctica actual.
    // Bloqueado para Gratis y Plus: es función de IA, solo Pro/Super Pro.

  let audioCtx = null;
  function getAudioCtx() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function tone(ctx, { freq = 600, freqEnd = null, dur = 0.06, type = 'sine', vol = 0.12, delay = 0 }) {
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, t0 + dur);
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function sfx(kind) {
    const ctx = getAudioCtx();
    if (!ctx) return;

      else if (kind === 'flip')  tone(ctx, { freq: 320, freqEnd: 620, dur: 0.10, type: 'sine', vol: 0.10 });

  let abuAudioActual = null;

  function domReproducirAudioBase64(audioContent, onend) {

    audio.onended = () => { abuAudioActual = null; if (onend) onend(); };
    audio.onerror = () => { abuAudioActual = null; if (onend) onend(); };

  async function speakAbu(text, onend) {
    stopSpeaking();
    if (abuAudioActual) { try { abuAudioActual.pause(); } catch {} abuAudioActual = null; }

    const cacheado = domAbuAudioCache.get(text);
    if (cacheado) { domReproducirAudioBase64(cacheado, onend); return; }

    if (puedeIA()) {
      try {
        const headers = await cabecerasIA();
        if (headers) {
          const resp = await fetch(`${SUPABASE_URL}/functions/v1/generar-audio-abu`, {
            method: 'POST', headers, body: JSON.stringify({ texto: text })
          });
          const payload = await resp.json().catch(() => null);
          if (resp.ok && payload?.audioContent) {
            domAbuAudioCache.set(text, payload.audioContent);
            domReproducirAudioBase64(payload.audioContent, onend);
            return;
          }
        }
      } catch (err) {
        console.warn('[Abu] audio real no disponible, uso voz del navegador:', err?.message || err);
      }
    }
    speak(text, onend);
  }

  // actions: [{ label, onClick, style }]
  function showModal({ icon, title, body, actions = [], dismissable = true, size = 'md' }) {
    sfx('pop');
    const maxW = size === 'lg' ? 'max-w-lg' : 'max-w-sm';
    const actionsHTML = actions.map((a, i) =>
      `<button data-idx="${i}" class="modal-action w-full btn-juice ${a.style || 'bg-[#FF7A00] text-white'} font-bold py-3 rounded-xl text-lg">${a.label}</button>`
    ).join('');

    modalRoot.innerHTML = `
      <div class="modal-overlay">
        <div class="card-3d ${maxW} w-full p-7 text-center animate-pop relative max-h-[90vh] flex flex-col">
          ${dismissable ? '<button id="modal-close" class="absolute top-3 right-4 text-slate-300 hover:text-slate-500 text-2xl z-10">&times;</button>' : ''}
          ${icon ? `<div class="text-6xl mb-3 shrink-0">${icon}</div>` : ''}
          ${title ? `<h2 class="text-2xl font-heading font-bold text-slate-800 mb-2 shrink-0">${title}</h2>` : ''}
          <div class="text-slate-500 mb-6 overflow-y-auto flex-1 min-h-0">${body || ''}</div>
          <div class="space-y-3 shrink-0">${actionsHTML}</div>
        </div>
      </div>`;

    if (dismissable) {
      document.getElementById('modal-close').onclick = closeModal;
      modalRoot.querySelector('.modal-overlay').addEventListener('click', (e) => {
        if (e.target.classList.contains('modal-overlay')) closeModal();
      });
    }
    actions.forEach((a, i) => {
      const btn = modalRoot.querySelector(`.modal-action[data-idx="${i}"]`);
      if (btn) btn.onclick = () => { if (a.onClick) a.onClick(); };
    });
  }

  function mostrarTutorial(alTerminar) {
    const finalizar = async () => {
      if (!flujo.ui) flujo.ui = {};
      flujo.ui.tutorialSeen = true;
      await updateUserFlow();
      closeModal();
      if (alTerminar) alTerminar();
    };
    const SEGUNDOS_POR_TARJETA = 10; // tiempo mínimo de lectura antes de poder avanzar
    let tutorialTimer = null;
    const paso = (i) => {
      clearInterval(tutorialTimer);
      const p = TUTORIAL_PASOS[i];
      const ultimo = i === TUTORIAL_PASOS.length - 1;
      const dots = TUTORIAL_PASOS.map((_, j) =>
        `<span class="inline-block w-2 h-2 rounded-full mx-0.5 ${j === i ? 'bg-[#FF7A00]' : 'bg-slate-200'}"></span>`).join('');
      const labelFinal = ultimo ? '¡Empezar a aprender! 🚀' : 'Siguiente 👉';
      showModal({
        icon: p.icon, title: p.title,
        body: `${p.body}<div class="mt-5">${dots}</div>`,
        dismissable: false,
        actions: [
          { label: `Espera ${SEGUNDOS_POR_TARJETA}s...`, style: 'bg-slate-200 text-slate-400', onClick: () => {} },
          // SE ELIMINA LO DE SALTARSE EL TUTORIAL
          //...(ultimo ? [] : [{ label: 'Saltar tutorial', style: 'bg-slate-100 text-slate-400', onClick: finalizar }])
        ]
      });
      // Obliga a quedarse SEGUNDOS_POR_TARJETA segundos en cada tarjeta:
      // el botón queda deshabilitado hasta que termina la cuenta regresiva.
      const btn = modalRoot.querySelector('.modal-action[data-idx="0"]');
      if (btn) {
        let restante = SEGUNDOS_POR_TARJETA;
        btn.disabled = true;
        btn.classList.add('cursor-not-allowed');
        tutorialTimer = setInterval(() => {
          restante--;
          if (restante <= 0) {
            clearInterval(tutorialTimer);
            btn.disabled = false;
            btn.classList.remove('bg-slate-200', 'text-slate-400', 'cursor-not-allowed');
            btn.classList.add('bg-[#FF7A00]', 'text-white');
            btn.textContent = labelFinal;
          } else {
            btn.textContent = `Espera ${restante}s...`;
          }
        }, 1000);
        btn.onclick = () => { if (!btn.disabled) { clearInterval(tutorialTimer); ultimo ? finalizar() : paso(i + 1); } };
      }
    };
    paso(0);
  }

  /* ------------------------------------------------------------
     LLAMADAS A LAS FUNCIONES EDGE DE IA
     El servidor ahora exige sesión real + plan pro/super_pro y lleva
     el cupo diario. Antes se mandaba la anon key como respaldo, que es
     un JWT válido del proyecto: con eso cualquiera podía gastar la API
     de DeepSeek sin siquiera tener cuenta.
  ------------------------------------------------------------ */
  async function cabecerasIA() {
    const { data: { session } } = await dbClient.auth.getSession();
    const token = session?.access_token;
    if (!token) return null;                       // sin sesión no se llama
    return {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${token}`
    };
  }

  // Traduce el rechazo del servidor a algo que el usuario entienda.
  // Devuelve true si ya se le avisó (para no mostrar además el error genérico).
  function manejarRechazoIA(payload) {
    switch (payload?.codigo) {
      case 'plan_requerido':
        mostrarBloqueoPlan('Las funciones con IA (tutor, chats con Abu y corrección de pronunciación) están reservadas para los planes <b>Pro</b> y <b>Super Pro</b>.');
        return true;
      case 'limite_diario':
        showToast(`🌙 Llegaste a tus ${payload.limite} usos de hoy de esta función. ¡Vuelve mañana!`, 3600);
        return true;
      case 'sin_sesion':
        showToast('Tu sesión expiró — vuelve a iniciar sesión 🔑', 3600);
        return true;
      default:
        return false;
    }
  }

  function ensureTutorAbu() {
    if (!flujo.tutorAbu) flujo.tutorAbu = { messages: [] };
    if (!Array.isArray(flujo.tutorAbu.messages)) flujo.tutorAbu.messages = [];
    return flujo.tutorAbu;
  }

  // Cuántos mensajes le mandaste hoy al tutor (se cuenta en la tabla
  // "tutor_mensajes", no en el flujo local, para que el límite no se
  // pueda saltar recargando la página).
  async function tutorMensajesHoy() {
    // La cuenta buena la lleva el servidor en la tabla "uso_ia": la función
    // Edge suma el crédito de forma atómica y devuelve el crédito cuando
    // DeepSeek falla. Aquí solo se LEE para pintar el "12/50 hoy".
    // El día se calcula en hora de Ecuador, igual que en el SQL.
    const dia = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Guayaquil' });
    const { data, error } = await dbClient.from('uso_ia')
      .select('conteo')
      .eq('user_id', currentUser.id).eq('funcion', 'tutor-abu').eq('dia', dia)
      .maybeSingle();
    if (error) { console.warn('[tutor-abu] no se pudo leer el consumo de hoy:', error.message); return 0; }
    return data?.conteo || 0;
  }
  let tutorAbuUsadosHoy = 0;

  function saludoTutorAbu() {
    const nivel = flujo?.currentNivel || 'A1';
    return `¡Hola! Soy Abu 🦉, tu tutor de inglés (nivel ${nivel}). Puedo ayudarte con:\n` +
      `• Dudas de gramática, vocabulario o pronunciación 📖\n` +
      `• La diferencia entre dos palabras o expresiones\n` +
      `• Cómo se dice algo en inglés\n` +
      `• Simular una conversación sobre un tema que tú elijas — solo dime de qué quieres hablar 🎤\n\n` +
      `Puedes escribirme o tocar el micrófono. ¿En qué te ayudo?`;
  }

    [micBtn, sendBtn].forEach(b => { if (!b) return; b.disabled = agotado; b.classList.toggle('opacity-40', agotado); });
  }

  function tutorAbuBubble(role, texto) {
    const box = document.getElementById('abu-tutor-messages');
    if (!box) return;
    const div = document.createElement('div');
    if (role === 'user') {
      div.className = 'flex justify-end';
      div.innerHTML = `<div class="bg-[#FF7A00] text-white rounded-2xl rounded-br-sm px-3.5 py-2 max-w-[85%] font-medium whitespace-pre-wrap">${escapeHTML(texto)}</div>`;
    } else {
      div.className = 'flex justify-start items-start gap-1.5';
      div.innerHTML = `
        <img src="icono.png" alt="Abu" class="w-6 h-6 rounded-full object-cover shrink-0 mt-0.5">
        <div class="bg-white border border-slate-200 text-slate-800 rounded-2xl rounded-bl-sm px-3.5 py-2 max-w-[80%] shadow-sm whitespace-pre-wrap font-medium leading-snug">${escapeHTML(texto)}</div>`;
    }
    box.appendChild(div); box.scrollTop = box.scrollHeight;
  }
  // Texto que se pinta cuando la función falla. Se guarda como constante
  // porque NO debe reenviarse a DeepSeek como si fuera algo que dijo Abu:
  // un historial lleno de "se me trabó la lengua" confunde al modelo y hace
  // que las siguientes respuestas salgan peor.
  const TUTOR_ABU_FALLBACK = 'Uy, se me trabó la lengua 😅 ¿me lo puedes preguntar de nuevo en un momento?';

  async function tutorAbuEnviar(texto) {
    if (tutorAbuUsadosHoy >= TUTOR_MSG_DAILY_MAX) {
      showToast('🌙 Llegaste a tus 50 mensajes de hoy con el Tutor. ¡Vuelve mañana!', 3200);
      actualizarLimiteTutorAbu();
      return;
    }
    const t = ensureTutorAbu();
    t.messages.push({ role: 'user', content: texto });
    tutorAbuBubble('user', texto);
    await updateUserFlow();

    // Ya no se cuenta desde el navegador (eso se rodeaba recargando la
    // página): el cupo lo descuenta la función Edge y viene de vuelta en
    // payload.uso. Se sube 1 provisional solo para que el badge reaccione.
    tutorAbuUsadosHoy++;
    actualizarLimiteTutorAbu();

    const box = document.getElementById('abu-tutor-messages');
    const typing = document.createElement('div');
    typing.className = 'flex justify-start items-center gap-1.5';
    typing.innerHTML = `<img src="icono.png" class="w-6 h-6 rounded-full object-cover shrink-0"><div class="bg-white border border-slate-200 text-slate-400 rounded-2xl rounded-bl-sm px-3.5 py-2 text-sm"><i class="fas fa-circle-notch fa-spin mr-1"></i> Abu escribe...</div>`;
    box?.appendChild(typing); if (box) box.scrollTop = box.scrollHeight;

    let respuesta = null;
    let rechazado = false;
    try {
      const headers = await cabecerasIA();
      if (!headers) throw new Error('sin sesión');
      const resp = await fetch(`${SUPABASE_URL}/functions/v1/tutor-abu`, {
        method: 'POST',
        headers,
        // Se manda solo conversación real: fuera el saludo de bienvenida y
        // fuera los mensajes de error de intentos anteriores.
        body: JSON.stringify({
          messages: t.messages
            .filter(m => m.content && m.content !== TUTOR_ABU_FALLBACK && !m.content.startsWith('¡Hola! Soy Abu'))
            .slice(-8),
          nivel: flujo?.currentNivel || 'A1'
        })
      });
      const payload = await resp.json().catch(() => null);
      // La función devuelve { reply: { es, en, text } }. Antes solo se leía
      // .text, así que cualquier respuesta buena se descartaba en silencio.
      const r = payload?.reply;
      if (resp.ok && r) {
        respuesta = (r.text || [r.es, r.en].filter(Boolean).join('\n\n') || '').trim();
      }
      // El cupo real lo manda el servidor.
      if (typeof payload?.uso?.usados === 'number') tutorAbuUsadosHoy = payload.uso.usados;
      if (payload?.codigo === 'limite_diario') tutorAbuUsadosHoy = payload.limite || TUTOR_MSG_DAILY_MAX;
      actualizarLimiteTutorAbu();

      if (!respuesta) {
        // Plan insuficiente, cupo agotado o sesión vencida: se avisa bonito
        // y no se pinta el mensaje de "se me trabó la lengua".
        rechazado = manejarRechazoIA(payload);
        console.warn('[Tutor Abu] HTTP', resp.status, payload);
        if (payload?.diag) console.warn('[Tutor Abu] diag:', payload.diag);
        if (payload?.comoArreglarlo) console.warn('[Tutor Abu] ' + payload.comoArreglarlo);
      }
    } catch (err) { console.warn('[Tutor Abu] fallo de red:', err?.message || err); }
    typing.remove();

    if (rechazado) return;   // el modal / toast ya explicó qué pasó
    if (!respuesta) respuesta = TUTOR_ABU_FALLBACK;
    t.messages.push({ role: 'assistant', content: respuesta });
    tutorAbuBubble('assistant', respuesta);
    await updateUserFlow();
  }

    · Al arrancar, si el respaldo local es MÁS RECIENTE que lo que hay

  function guardarFlujoLocal() {

  async function updateUserFlow() {

  async function addPoints(points) {

  /*
    Núcleo del algoritmo de memorización espaciada.
    Se guarda en flujo.srs (columna "flujo") y se replica en user_word_progress (durabilidad).
    Los PUNTOS influyen en el SRS: una racha alta añade un pequeño bono de "ease",
    lo que alarga el intervalo (repasas menos lo que ya dominas).
  */
  /*
    result: 'easy' | 'hard'  (tarjeta ✨ Repaso)  ·  'practice_correct' | 'practice_wrong' (ejercicios)
    opts.type: 'flashcard' | 'select_by_image' | 'write_by_audio'

    Regla de DOMINIO INMEDIATO: si la palabra se marcó "Fácil" en su primer repaso
    Y el primer intento de "Identifica la imagen" Y de "Escucha y escribe" fueron
    correctos (sin ningún fallo), se marca learned=true y NUNCA vuelve a "¡Toca repasar!".
    Las demás palabras siguen el ciclo SRS hasta graduarse en el intervalo máximo.
  */
  async function updateSRS(wordId, result, opts = {}) {
    ensureDaily();
    const key = String(wordId);
    const isNew = !flujo.srs[key];
    const s = flujo.srs[key] || { level: 0, ease: EASE_DEFAULT, reps: 0, lapses: 0, due: null, learned: false, easyFirst: false, first: {}, difficult: false, okStreak: 0 };
    if (!s.first) s.first = {};
    if (isNew) {
      flujo.daily.newWords = (flujo.daily.newWords || 0) + 1; // cuenta para el límite diario (tanda)
      flujo.daily.misionPalabras = (flujo.daily.misionPalabras || 0) + 1; // cuenta para la misión del día
      checkMisionDia();
    }

    // ── Contador de apariciones del día (evita "would" 4 veces en un día) ──
    if (s.day !== todayStr()) { s.day = todayStr(); s.shownToday = 0; }
    s.shownToday = (s.shownToday || 0) + 1;

    const ok = (result === 'easy' || result === 'correct' || result === 'practice_correct');
    const hard = (result === 'hard');
    const type = opts.type || null;

    // Registro del PRIMER intento por tipo (antes de tocar reps/lapses)
    if (type === 'flashcard' && s.reps === 0 && s.lapses === 0 && !s.easyFirst) {
      s.easyFirst = (result === 'easy');
    }
    if ((type === 'select_by_image' || type === 'write_by_audio') && s.first[type] === undefined) {
      s.first[type] = ok;
    }

    let points = 0;

    if (ok) {
      sessionStreak++;
      sessionCorrect++;
      flujo.stats.totalCorrect = (flujo.stats.totalCorrect || 0) + 1;
      const streakBonus = Math.min(sessionStreak * 0.02, 0.12); // la racha alarga el intervalo
      s.reps++;
      s.ease = Math.min(EASE_MAX, s.ease + (result === 'easy' ? 0.15 : 0.08) + streakBonus);
      s.level = Math.min(s.level + 1, SRS_INTERVALS_DAYS.length - 1);
      // Una DIFÍCIL deja de serlo tras varios aciertos seguidos.
      s.okStreak = (s.okStreak || 0) + 1;
      if (s.difficult && s.okStreak >= DIFFICULT_CLEAR_STREAK) {
        s.difficult = false;
        setTimeout(() => showToast('💪 ¡Le ganaste a una palabra difícil! Ya va a ritmo normal.'), 500);
      }
      points = (result === 'easy' ? 12 : 10) + Math.min(sessionStreak, 8); // bono por racha
      if (Math.random() < 0.08) { points += 5; setTimeout(() => showToast('🎁 ¡Bonus sorpresa! +5 puntos extra'), 400); }
      playSound('correct'); triggerConfetti();
    } else if (hard) {
      s.reps++;
      s.ease = Math.max(EASE_MIN, s.ease - 0.15);
      // el nivel se mantiene
      s.difficult = true;   // marcarla "Difícil" la mete al ciclo de refuerzo
      s.okStreak = 0;
      points = 3;
    } else { // fallo
      sessionStreak = 0;
      flujo.stats.totalWrong = (flujo.stats.totalWrong || 0) + 1;
      s.lapses++;
      s.ease = Math.max(EASE_MIN, s.ease - 0.2);
      s.level = Math.max(0, s.level - 2); // retrocede 2 niveles (no castiga hasta cero: mejor experiencia)
      s.difficult = true;   // fallar en cualquier práctica = necesita más repeticiones
      s.okStreak = 0;
      points = 0;
      playSound('wrong');
    }

    // ¿Dominio inmediato? Fácil a la primera + ambos ejercicios bien al primer intento + cero fallos.
    // opts.word llega desde el repaso SRS: esas palabras pueden ser de otro nivel
    // y por eso no están en groupCache (caché del grupo que estás estudiando).
    const word = opts.word || groupCache.map[key];
    const requiereImagen = word ? !!word.imagen : true;
    const imagenOk = !requiereImagen || s.first.select_by_image === true;
    const audioOk = s.first.write_by_audio === true;
    // El dominio inmediato exige además NO estar marcada como difícil.
    if (!s.learned && s.easyFirst && imagenOk && audioOk && s.lapses === 0 && !s.difficult) {
      s.learned = true;
      setTimeout(() => showToast('🏅 ¡Palabra dominada a la primera! No volverá a repaso.'), 600);
    }
    // Graduación normal: alcanzó el intervalo máximo del SRS.
    // Las DIFÍCILES no se gradúan hasta demostrar aciertos seguidos (deja de ser difícil).
    if (!s.learned && s.level >= GRADUATED_LEVEL && !s.difficult) {
      s.learned = true;
      setTimeout(() => showToast('🎓 ¡Palabra graduada! Ya vive en tu memoria a largo plazo.'), 600);
    }

    if (s.learned) {
      s.due = null; // dominada: fuera de "¡Toca repasar!" para siempre
    } else {
      const baseDays = SRS_INTERVALS_DAYS[s.level];
      let days = Math.max(0.005, baseDays * (s.ease / EASE_DEFAULT));
      // Las difíciles vuelven en la MITAD del tiempo: se repiten más
      // aunque hayas completado bien ✨, 👁️ y 👂.
      if (s.difficult) days = days * DIFFICULT_INTERVAL_FACTOR;

      let dueMs = Date.now() + days * 86400000;

      // Separación mínima para no ver la misma palabra en bucle:
      //  · fallo → mínimo 30 min · acierto normal → ~20 h (mañana)
      //  · acierto de una difícil → 4 h (puede reforzarse el mismo día, con tope)
      const gapMs = ok
        ? (s.difficult ? SRS_OK_DIFFICULT_GAP_H : SRS_OK_GAP_H) * 3600000
        : SRS_FAIL_GAP_MIN * 60000;
      dueMs = Math.max(dueMs, Date.now() + gapMs);

      // Tope diario: si ya apareció SRS_MAX_SHOWS_PER_DAY veces hoy,
      // se pospone hasta mañana en la mañana (aunque haya fallado).
      if ((s.shownToday || 0) >= SRS_MAX_SHOWS_PER_DAY) {
        const manana = new Date(); manana.setHours(24 + 7, 0, 0, 0); // mañana 7:00 am
        dueMs = Math.max(dueMs, manana.getTime());
      }
      s.due = new Date(dueMs).toISOString();
    }
    s.updated = new Date().toISOString();

    flujo.srs[key] = s;
    touchStreak();

    // Guardado principal en la columna flujo
    await updateUserFlow();
    if (points) await addPoints(points);

    // Réplica (no bloqueante) en la tabla dedicada. next_review_at es NOT NULL:
    // para palabras dominadas se guarda una fecha lejana.
    dbClient.from('user_word_progress').upsert({
      user_id: currentUser.id,
      word_id: wordId,
      srs_level: s.level,
      ease_factor: s.ease,
      next_review_at: s.due || '2099-12-31T00:00:00.000Z'
    }, { onConflict: 'user_id, word_id' }).then(({ error }) => {
      if (error) console.warn('user_word_progress (opcional):', error.message);
    });
  }

  /* ============================================================
     5. DATOS (palabras / niveles / grupos / repasos)
  ============================================================ */
  async function getNiveles() {
    /*
      ARREGLO "Sin contenido": la consulta anterior traía TODAS las filas de "palabras"
      y PostgREST corta en 1000, así que los niveles cuyas filas quedaban fuera del corte
      (p. ej. A1/A2) aparecían como vacíos. Ahora se cuenta por nivel con head:true
      (sin traer filas) y con fallback insensible a mayúsculas/minúsculas.
    */
    const candidatos = [...new Set([...NIVELES_FIJOS, ...CEFR_ORDER])];
    const conContenido = [];
    await Promise.all(candidatos.map(async (n) => {
      let { count, error } = await dbClient.from('palabras').select('id', { count: 'exact', head: true }).eq('nivel', n);
      if ((error || !count)) {
        // fallback: 'a1', 'A1 ', etc.
        const r2 = await dbClient.from('palabras').select('id', { count: 'exact', head: true }).ilike('nivel', n);
        count = r2.count; error = r2.error;
      }
      if (!error && (count || 0) > 0) conContenido.push(n);
    }));
    // Complemento: detectar niveles con nombres fuera del estándar CEFR (dentro del primer bloque de filas).
    const { data } = await dbClient.from('palabras').select('nivel').range(0, 999);
    (data || []).forEach(r => {
      const v = (r.nivel || '').trim();
      if (v && !conContenido.some(c => c.toLowerCase() === v.toLowerCase())) conContenido.push(v);
    });
    console.log('[getNiveles] niveles con contenido:', conContenido);
    return sortNiveles(conContenido);
  }
  async function getGroups(nivel) {
    let { data, error } = await dbClient.from('palabras').select('grupo').eq('nivel', nivel).range(0, 9999);
    if (!error && !(data || []).length) {
      ({ data, error } = await dbClient.from('palabras').select('grupo').ilike('nivel', nivel).range(0, 9999));
    }
    if (error) { console.error(`[getGroups ${nivel}] ❌`, error.message, error); return []; }
    const set = sortGroups([...new Set((data || []).map(r => (r.grupo || '').trim()).filter(Boolean))]);
    console.log(`[getGroups ${nivel}] grupos:`, set);
    return set;
  }
  // Plan Gratis: solo se pueden estudiar las primeras GRATIS_WORD_LIMIT
  // palabras del nivel A1 (Gratis además está fijo en A1, ver openNivelSelector).
  let gratisIdsCache = null;
  async function palabrasPermitidasGratisIds() {
    if (gratisIdsCache) return gratisIdsCache;
    const { data } = await dbClient.from('palabras').select('id').eq('nivel', 'A1').order('id', { ascending: true }).limit(GRATIS_WORD_LIMIT);
    gratisIdsCache = new Set((data || []).map(r => String(r.id)));
    return gratisIdsCache;
  }

  async function getGroupWords(nivel, group) {
    const key = `${nivel}|${group}`;
    if (groupCache.key === key && groupCache.list.length) return groupCache.list;
    let { data, error } = await dbClient.from('palabras').select('*').eq('nivel', nivel).eq('grupo', group).range(0, 9999);
    if (!error && !(data || []).length) {
      ({ data, error } = await dbClient.from('palabras').select('*').ilike('nivel', nivel).ilike('grupo', group).range(0, 9999));
    }
    if (error) { console.error(`[getGroupWords ${key}] ❌`, error.message, error); return []; }
    let list = data || [];
    let gratisLimitReached = false;
    if (esGratis()) {
      const antes = list.length;
      const ids = await palabrasPermitidasGratisIds();
      list = list.filter(w => ids.has(String(w.id)));
      gratisLimitReached = antes > 0 && list.length === 0;   // había contenido, pero quedó fuera del límite gratis
    }
    console.log(`[getGroupWords ${key}] palabras:`, list.length, list.map(w => w.ingles));
    list.gratisLimitReached = gratisLimitReached;
    groupCache = { key, list, map: Object.fromEntries(list.map(w => [String(w.id), w])) };
    return list;
  }

  // Sonda de diagnóstico: cuántas filas de "palabras" ve realmente el cliente.
  async function probeContent() {
    const { count, error } = await dbClient.from('palabras').select('id', { count: 'exact', head: true });
    if (error) { console.error('[probeContent] ❌ No se pudo leer "palabras":', error.message, error); return { ok: false, count: 0 }; }
    console.log('[probeContent] ✅ filas visibles en "palabras":', count);
    return { ok: true, count: count || 0 };
  }

  // Palabras cuyo próximo repaso ya venció (SRS), de TODOS LOS NIVELES.
  //
  // ⚠️ Antes esta consulta se limitaba al nivel actual (.eq('nivel', nivel)).
  //    Eso hacía que, al pasar de A1 a A2, los repasos pendientes de A1
  //    desaparecieran: seguían vencidos en el SRS, pero la consulta los
  //    descartaba y el usuario perdía esas palabras a medio dominar.
  //    Ahora se traen por ID sin filtrar por nivel, así sigues repasando
  //    A1 aunque estés estudiando A2 (sin tener que cambiar de nivel).
  //
  // Excluye las dominadas (learned), prioriza las más difíciles/vencidas y
  // limita la sesión a SRS_SESSION_MAX (30) palabras.
  // Cuántos repasos te quedan hoy (flujo.daily.reviewed se reinicia a
  // medianoche dentro de ensureDaily()).
  function repasosRestantesHoy() {
    ensureDaily();
    return Math.max(0, SRS_DAILY_MAX - (flujo.daily.reviewed || 0));
  }

  async function getDueReviews(nivel) {
    const cupo = repasosRestantesHoy();
    if (cupo <= 0) { console.log('[getDueReviews] cupo diario de repasos agotado'); return []; }
    const tope = Math.min(SRS_SESSION_MAX, cupo);
    const now = Date.now();
    const hoy = todayStr();
    const dueIds = Object.entries(flujo.srs)
      .filter(([, v]) => !v.learned && v.due && new Date(v.due).getTime() <= now)
      // Tope diario: una palabra ya vista SRS_MAX_SHOWS_PER_DAY veces hoy no vuelve a salir hoy.
      .filter(([, v]) => (v.day !== hoy) || ((v.shownToday || 0) < SRS_MAX_SHOWS_PER_DAY))
      .sort((a, b) => {
        const da = a[1].difficult ? 1 : 0, db = b[1].difficult ? 1 : 0;
        if (db !== da) return db - da; // primero las marcadas DIFÍCILES
        const la = a[1].lapses || 0, lb = b[1].lapses || 0;
        if (lb !== la) return lb - la; // luego las que más cuestan
        return new Date(a[1].due) - new Date(b[1].due); // luego las más vencidas
      })
      .map(([id]) => parseInt(id))
      .filter(n => !isNaN(n))
      .slice(0, tope);
    if (!dueIds.length) return [];
    const { data, error } = await dbClient.from('palabras').select('*').in('id', dueIds);
    if (error) { console.error('[getDueReviews] ❌', error.message, error); return []; }
    const orden = new Map(dueIds.map((id, i) => [id, i]));
    const lista = (data || []).sort((a, b) => (orden.get(a.id) ?? 99) - (orden.get(b.id) ?? 99)).slice(0, tope);
    const otros = [...new Set(lista.map(w => (w.nivel || '').trim()).filter(v => v && v.toLowerCase() !== (nivel || '').toLowerCase()))];
    if (otros.length) console.log('[getDueReviews] incluye repasos de otros niveles:', otros.join(', '));
    return lista;
  }

  /* ============================================================
     6. INICIALIZACIÓN DEL FLUJO (JSON columna "flujo")
  ============================================================ */
  function defaultGroupState() {
    return {
      review: { done: false, index: 0 },
      practice: { done: false, queue: [], index: 0 },
      dialogo: { done: false },          // 🎭 diálogo generado con las palabras del grupo (generar-dialogo)
      pract2: { done: false },           // 🚀 se marca al elegir "Vocabulario" en el centro de decisión (sección 14)
      chat: { done: false, count: 0 },   // 💬 hablar con Abu (del flujo de vocabulario)
      completed: false, correct: 0, wrong: 0
    };
  }
  function defaultFlujo(nivel) {
    return {
      version: 3,
      currentNivel: nivel,
      niveles: {},
      srs: {},
      stats: { totalCorrect: 0, totalWrong: 0, sessionsCompleted: 0 },
      daily: { date: todayStr(), newWords: 0, reviewed: 0, points: 0, goalShown: false, unlockAt: null },
      racha: { days: 0, last: null, best: 0 }
    };
  }

  async function ensureFlujo() {
    const baseNivel = (userProfile.nivel) || 'A1';

    // Migración: si viene el formato viejo (flowState) o no existe, se reinicia a v2.
    if (!flujo || !flujo.version || flujo.version < 2 || flujo.flowState) {
      const old = flujo || {};
      flujo = defaultFlujo(baseNivel);
      if (old.currentGroup) { /* se conserva el punto de partida como referencia */ }
      // El avance de gramatica.html vive en el mismo JSON: no se pierde al migrar.
      if (old.gram) flujo.gram = old.gram;
      if (old.ui) flujo.ui = old.ui;
      // Importa el SRS previo desde user_word_progress para no perder el progreso.
      const { data: prev } = await dbClient.from('user_word_progress').select('*').eq('user_id', currentUser.id);
      (prev || []).forEach(p => {
        flujo.srs[String(p.word_id)] = {
          level: p.srs_level || 0,
          ease: parseFloat(p.ease_factor) || EASE_DEFAULT,
          reps: p.srs_level || 0, lapses: 0,
          due: p.next_review_at || new Date().toISOString()
        };
      });
      await updateUserFlow();
    }
    if (!flujo.currentNivel) flujo.currentNivel = baseNivel;
    if (!flujo.srs) flujo.srs = {};
    if (!flujo.stats) flujo.stats = { totalCorrect: 0, totalWrong: 0, sessionsCompleted: 0 };
    // Migración suave v2 → v3 (sin perder progreso): agrega estado diario, racha y campos SRS nuevos.
    ensureDaily();
    Object.values(flujo.srs).forEach(s => {
      if (s.learned === undefined) s.learned = false;
      if (!s.first) s.first = {};
      if (s.easyFirst === undefined) s.easyFirst = false;
      // Campos nuevos del refuerzo de palabras difíciles y tope diario.
      if (s.difficult === undefined) s.difficult = (s.lapses || 0) >= 2; // las que ya costaban entran al refuerzo
      if (s.okStreak === undefined) s.okStreak = 0;
      if (s.shownToday === undefined) { s.shownToday = 0; s.day = null; }
      // Palabras que ya alcanzaron el intervalo máximo se gradúan (si no son difíciles).
      if (!s.learned && (s.level || 0) >= GRADUATED_LEVEL && !s.difficult) { s.learned = true; s.due = null; }
    });
    if (flujo.version < 3) { flujo.version = 3; await updateUserFlow(); }
  }

  async function ensureNivel(nivel) {
    if (!flujo.niveles[nivel]) flujo.niveles[nivel] = { currentGroup: null, grupos: {} };
    const n = flujo.niveles[nivel];
    const groups = await getGroups(nivel); // solo grupos que realmente tienen palabras
    if (!groups.length) { n.currentGroup = null; return n; } // nivel sin contenido

    // Validar el grupo guardado contra los grupos reales. Si es inválido o no existe,
    // elegimos el primer grupo aún no completado (o el primero disponible).
    if (!n.currentGroup || !groups.includes(n.currentGroup)) {
      const firstIncomplete = groups.find(g => !(n.grupos[g] && n.grupos[g].completed));
      n.currentGroup = firstIncomplete || groups[0];
    }
    if (!n.grupos[n.currentGroup]) n.grupos[n.currentGroup] = defaultGroupState();

    // Migración: grupos creados antes de existir la práctica de conversación.
    // Los que ya estaban completados NO tienen que repetir la charla.
    Object.values(n.grupos).forEach(g => {
      if (!g.chat) g.chat = g.completed ? { done: true, count: CHAT_GOAL } : { done: false, count: 0 };
      // Migración: la práctica de uso (practica.html) llegó después. Un grupo
      // ya terminado no vuelve atrás a hacerla.
      if (!g.pract2) g.pract2 = { done: !!g.completed };
      // Migración: el diálogo generado llegó después. Un grupo ya
      // terminado no vuelve atrás a generarlo.
      if (!g.dialogo) g.dialogo = { done: !!g.completed };
    });
    return n;
  }

  /* ============================================================
     7. CONTROLADOR DE FLUJO ÚNICO
     Prioridad: (1) repasos SRS vencidos  →  (2) repaso del grupo  →  (3) práctica  →  (4) siguiente grupo
  ============================================================ */
  async function runFlow() {
    toolsBar.classList.remove('hidden');
    console.groupCollapsed('%c[runFlow]', 'color:#FF7A00;font-weight:bold');
    console.log('flujo actual:', JSON.parse(JSON.stringify(flujo)));

    // Sonda: ¿el cliente puede leer la tabla "palabras"?
    const probe = await probeContent();
    if (probe.count === 0) {
      console.warn('La consulta a "palabras" devolvió 0 filas. Causa más probable: falta la política RLS de SELECT en la tabla "palabras".');
      console.groupEnd();
      return renderMessage('🔒', 'No se pueden leer las palabras',
        'La base de datos devolvió <b>0 palabras</b>. Si ya las cargaste, falta la política <b>RLS de SELECT</b> en la tabla <b>palabras</b>. Aplica el SQL de permisos y recarga.',
        'Reintentar', () => window.location.reload());
    }

    // Niveles que realmente tienen palabras cargadas.
    const niveles = await getNiveles();

    // Si el nivel guardado no tiene contenido, saltamos al primero que sí lo tenga.
    if (niveles.length && !niveles.includes(flujo.currentNivel)) {
      console.log(`[runFlow] "${flujo.currentNivel}" sin contenido → cambio a "${niveles[0]}"`);
      flujo.currentNivel = niveles[0];
      await updateUserFlow();
    }

    const nivel = flujo.currentNivel;
    document.getElementById('nivel-label').textContent = nivel;
    const n = await ensureNivel(nivel);
    console.log(`[runFlow] nivel=${nivel} · currentGroup=${n.currentGroup}`);

    // Nivel sin grupos con palabras: ofrecer cambiar de nivel.
    if (!n.currentGroup) {
      console.groupEnd();
      return renderMessage('📭', 'Nivel sin contenido',
        `No hay palabras cargadas para el nivel <b>${nivel}</b>. Elige otro nivel o carga palabras para este.`,
        'Elegir otro nivel', openNivelSelector);
    }

    // (1) Repasos espaciados vencidos
    const due = await getDueReviews(nivel);
    if (due.length) { console.log('[runFlow] repasos SRS vencidos:', due.length); console.groupEnd(); return startSrsReview(due); }

    // (2)/(3)/(4) Progresión por grupos
    const group = n.currentGroup;
    if (!n.grupos[group]) n.grupos[group] = defaultGroupState();
    const g = n.grupos[group];

    const words = await getGroupWords(nivel, group);
    if (!words.length) {
      console.groupEnd();
      if (words.gratisLimitReached) {
        return renderMessage('🔒', 'Ya usaste tus palabras gratis',
          `Con el plan <b>Gratis</b> puedes estudiar las primeras <b>${GRATIS_WORD_LIMIT} palabras</b> del nivel A1. Mejora tu plan para seguir aprendiendo sin límite.`,
          'Ver planes ✨', () => openPlanesPro('gratis_limite'));
      }
      return renderMessage('📭', 'Grupo sin contenido',
        `El grupo <b>${group}</b> del nivel <b>${nivel}</b> no tiene palabras.`,
        'Elegir otro nivel', openNivelSelector);
    }

    console.log(`[runFlow] estado grupo ${group}: review.done=${g.review.done} practice.done=${g.practice.done}`);
    console.groupEnd();

    if (!g.review.done) return renderReview(nivel, group, words);
    if (!g.practice.done) return renderPractice(nivel, group);
    // 🎭 Ya practicó las palabras: genera un diálogo corto con ellas
    // (generar-dialogo, modo original) y lo practica hablando o escribiendo.
    if (!g.dialogo || !g.dialogo.done) return introDialogoGrupo(nivel, group, words);
    // 🚀 Aquí elige si sigue con más Vocabulario o pasa a Dominar
    // (frases/videos/conversaciones, sección 14 más abajo). pract2.done
    // se marca al elegir "Vocabulario".
    if (!g.pract2 || !g.pract2.done) return mostrarEleccionVocabularioODominar(nivel, group);
    if (!g.chat || !g.chat.done) return chatPracticeIntro(nivel, group); // 💬 hablar con Abu
    return advanceGroup(nivel, group);
  }

  /* ------------------------------------------------------------
     🚀 PRÁCTICA DE USO
     Antes abría practica.html en una pestaña aparte; ahora, al
     terminar el repaso y la práctica de un grupo, se muestra el
     centro de decisión "Vocabulario o Dominar" (sección 14, más
     abajo: mostrarEleccionVocabularioODominar).
  ------------------------------------------------------------ */

  /* ------------------------------------------------------------
     Descanso entre tandas de palabras nuevas.
     Dice la hora exacta a la que se habilitan más palabras y va
     descontando el tiempo en vivo. Los repasos siguen disponibles.
  ------------------------------------------------------------ */
  let pauseTimer = null;
  function renderNewWordsPause(nivel) {
    ensureDaily();
    const unlockMs = flujo.daily.unlockAt ? new Date(flujo.daily.unlockAt).getTime() : Date.now();
    const hora = new Date(unlockMs).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
    const manana = new Date(unlockMs).toDateString() !== new Date().toDateString();

    renderMessage('🌙', 'Seguiremos más tarde',
      `Ya estudiaste <b>${NEW_WORDS_PER_TANDA} palabras nuevas</b> en esta tanda: es el máximo que tu memoria fija bien de una sola vez.<br>
       <span class="block mt-3 text-slate-600">Se habilitan más palabras <b class="text-[#FF7A00]">a las ${hora}${manana ? ' de mañana' : ''}</b></span>
       <span id="pause-countdown" class="block mt-1 text-sm font-bold text-slate-400">faltan ${fmtEspera(unlockMs - Date.now())}</span>
       <span class="block mt-3 text-xs text-slate-400">Mientras tanto puedes repasar lo aprendido: hasta ${SRS_DAILY_MAX} palabras al día. 🧠</span>`,
      'Repasar lo aprendido 🧠', async () => {
        const due = await getDueReviews(nivel);
        if (due.length) return startSrsReview(due);
        // Se distingue "no hay nada vencido" de "ya hiciste tus 30 de hoy":
        // antes decía "no tienes repasos pendientes" aunque sí los hubiera.
        if (repasosRestantesHoy() <= 0) {
          return renderMessage('✅', 'Repasos de hoy, completos',
            `Ya hiciste tus <b>${SRS_DAILY_MAX} repasos de hoy</b>. Lo que quede pendiente vuelve mañana: repasar de más no fija mejor la memoria. 🧠<br><span class="block mt-3 text-slate-500">A las <b>${hora}</b> te esperan palabras nuevas.</span>`);
        }
        renderMessage('😴', 'Todo al día',
          `No tienes repasos pendientes. Descansa: a las <b>${hora}</b> te esperan palabras nuevas. 🌙`);
      });

    // Cuenta atrás en vivo + recarga automática cuando se cumple el tiempo
    clearInterval(pauseTimer);
    pauseTimer = setInterval(() => {
      const el = document.getElementById('pause-countdown');
      if (!el) { clearInterval(pauseTimer); return; }
      const resta = unlockMs - Date.now();
      if (resta <= 0) {
        clearInterval(pauseTimer);
        showToast('🎉 ¡Ya puedes estudiar palabras nuevas!');
        ensureDaily();
        runFlow();
        return;
      }
      el.textContent = `faltan ${fmtEspera(resta)}`;
    }, 20000);
  }

  /* ============================================================
     8. PASO 1 — REPASO DEL GRUPO (flashcards de todas las palabras)
  ============================================================ */
  async function renderReview(nivel, group, words) {
    const g = flujo.niveles[nivel].grupos[group];
    reviewList = words;
    const i = g.review.index || 0;

    if (i >= reviewList.length) {
      g.review.done = true;
      await updateUserFlow();
      await addPoints(5);
      showEncouragement(() => runFlow());
      return;
    }

    const word = reviewList[i];

    // Límite por tanda: NEW_WORDS_PER_TANDA palabras NUEVAS y descanso de medio día.
    const esNueva = !flujo.srs[String(word.id)];
    if (esNueva && newWordsLocked()) {
      updateProgressBar(100);
      return renderNewWordsPause(nivel);
    }

    updateProgressBar((i / reviewList.length) * 100);
    appContainer.innerHTML = flashcardHTML(word, i + 1, reviewList.length);
    bindFlashcard(word, async (result) => {
      await updateSRS(word.id, result, { type: 'flashcard' }); // 'easy' | 'hard' (siembra el SRS)
      g.review.index = i + 1;
      await updateUserFlow();
      renderReview(nivel, group, words);
    }, i + 1, reviewList.length);
  }

  /* Etiqueta de nivel: solo aparece cuando la palabra viene de un nivel
     distinto al que estás estudiando (repaso pendiente de A1 mientras
     avanzas en A2, por ejemplo). Así sabes de dónde salió la palabra. */
  function nivelBadgeHTML(word) {
    const n = (word?.nivel || '').trim();
    const actual = (flujo?.currentNivel || '').trim();
    if (!n || n.toLowerCase() === actual.toLowerCase()) return '';
    return `<span class="bg-orange-100 text-[#FF7A00] px-2 py-1 rounded-full text-[10px] font-black uppercase tracking-widest" title="Repaso pendiente del nivel ${escapeHTML(n)}">🔁 ${escapeHTML(n)}</span>`;
  }

  /* Banner de incentivo con el avance de la Misión del día, para que se
     vea también mientras repasas vocabulario (no solo en el menú de
     perfil). Usa las MISMAS variables que updateMisionUI()/abrirMisionDia();
     el click se ata en bindFlashcard(). */
  function misionIncentivoHTML() {
    ensureDaily();
    const p = Math.min(flujo.daily.misionPalabras || 0, MISION_PALABRAS_DIA);
    const f = Math.min(flujo.daily.misionFrases || 0, MISION_FRASES_DIA);
    if (flujo.daily.misionCumplida) {
      return `<button id="mision-incentivo-flashcard" class="w-full flex items-center gap-2 bg-green-50 border-2 border-green-200 rounded-xl px-3 py-2 mb-3 text-left hover:border-green-300 transition">
        <span class="text-lg shrink-0">🎉</span>
        <span class="flex-1 min-w-0 text-[11px] font-bold text-green-700 leading-snug">¡Misión del día cumplida! Vuelve mañana por más.</span>
      </button>`;
    }
    const faltP = MISION_PALABRAS_DIA - p, faltF = MISION_FRASES_DIA - f;
    return `<button id="mision-incentivo-flashcard" class="w-full flex items-center gap-2 bg-orange-50 border-2 border-orange-200 rounded-xl px-3 py-2 mb-3 text-left hover:border-orange-300 transition">
      <span class="text-lg shrink-0">🎯</span>
      <span class="flex-1 min-w-0 text-[11px] font-bold text-orange-700 leading-snug">Te faltan <b>${faltP} palabras</b> y <b>${faltF} frases</b> para cumplir la misión de hoy</span>
    </button>`;
  }

          <button id="btn-word-audio" title="Escuchar pronunciación" class="absolute right-2 sm:right-3 top-1/2 -translate-y-1/2 w-11 h-11 sm:w-12 sm:h-12 shrink-0 rounded-full bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-400 hover:text-slate-600 text-base transition flex items-center justify-center">

        <!-- El significado en español también va OCULTO (como la fonética):

  /* Tarjeta mnemotécnica: aparece solo cuando el usuario marca una palabra
     como "Difícil" y esa palabra tiene datos en word.mnemotecnica
     ({ clave, emoji, escena }, columna jsonb de la tabla "palabras").
     Al tocar "Siguiente" se continúa el flujo normal (onRate('hard')). */
  function mnemonicCardHTML(word, pos, total) {
    const m = word.mnemotecnica || {};
    const clave = m.clave || `${(word.ingles || '').toUpperCase()} = ${(word.espanol || '').toUpperCase()}`;
    const emoji = m.emoji || '🧠';
    const escena = m.escena || 'Imagina esta palabra en una escena absurda y memorable.';
    return `
      <div class="card-3d p-4 sm:p-6 text-center relative animate-pop mt-1">
        <div class="flex items-center justify-between mb-2">
          <span class="bg-purple-100 text-purple-600 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-widest flex items-center gap-2">
            <i class="fas fa-brain brain-icon"></i> Mnemotecnia
          </span>
          <span class="text-xs font-bold text-slate-400">${pos} / ${total}</span>
        </div>

        <div class="relative flex items-center justify-center mb-2 min-h-[3.25rem] -mx-4 sm:-mx-6">
          <h1 class="text-4xl sm:text-5xl font-black font-heading text-[#8B5CF6] tracking-tight text-center px-14">${escapeHTML(word.ingles)}</h1>
          <button id="btn-word-audio" title="Escuchar pronunciación" class="absolute right-2 sm:right-3 top-1/2 -translate-y-1/2 w-11 h-11 sm:w-12 sm:h-12 shrink-0 rounded-full bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-400 hover:text-slate-600 text-base transition flex items-center justify-center">
            <i class="fas fa-volume-up"></i>
          </button>
        </div>

  // Marca una palabra como dominada de una vez (confirmación en la
  // tarjeta ✨ Repaso, primera vez que se ve). Reutiliza el mismo shape de
  // estado que usa updateSRS, así todo lo demás (progreso, certificados,
  // cola de práctica) la trata exactamente igual que una graduación normal.
  async function marcarDominadaManual(wordId) {
    ensureDaily();
    const key = String(wordId);
    if (!flujo.srs[key]) {
      flujo.srs[key] = { level: 0, ease: EASE_DEFAULT, reps: 0, lapses: 0, due: null, learned: false, easyFirst: false, first: {}, difficult: false, okStreak: 0 };
    }
    flujo.srs[key].learned = true;
    flujo.srs[key].level = GRADUATED_LEVEL;
    flujo.srs[key].due = null;
    await updateUserFlow();
  }

  /* ============================================================
     9. PASO 2 — PRÁCTICA (audio→escribir  /  imagen→elegir)
  ============================================================ */
  /*
    CADA palabra lleva SUS DOS ejercicios: 👁️ Identifica la imagen y 👂 Escucha y escribe.
    Esto es lo que permite marcarla como DOMINADA a la primera: updateSRS exige el
    primer intento correcto de AMBOS tipos (más "Fácil" en la tarjeta y cero fallos).
    Con un solo ejercicio por palabra ese requisito nunca se cumplía y casi nada
    llegaba a "dominada".
    Las palabras sin imagen solo llevan el de audio; para ellas el dominio no
    exige el ejercicio de imagen.
    Orden: primero la ronda de imágenes, después la de dictados. Así los dos
    ejercicios de una misma palabra quedan separados, que es como mejor se fija.
  */
  async function buildPracticeQueue(nivel, group) {
    const words = await getGroupWords(nivel, group);
    const englishPool = words.map(w => w.ingles);

    const ronda1 = [], ronda2 = [];
    words.forEach(w => {
      // Las palabras ya DOMINADAS (por ejemplo, confirmadas manualmente en
      // la tarjeta ✨ Repaso) no vuelven a aparecer en estos ejercicios.
      if (flujo.srs[String(w.id)]?.learned) return;
      if (w.imagen) {
        ronda1.push({ word_id: w.id, type: 'select_by_image', options: buildOptions(w.ingles, englishPool) });
      }
      // El audio tiene respaldo por voz del navegador, así que siempre se puede.
      ronda2.push({ word_id: w.id, type: 'write_by_audio', options: null });
    });
    // Ya NO va primero toda la ronda de imágenes y luego toda la de dictados:
    // los dos tipos se INTERCALAN al azar, cuidando que los dos ejercicios de
    // una misma palabra no queden pegados (así se fija mejor).
    const g = flujo.niveles[nivel].grupos[group];
    g.practice = { done: false, queue: mezclarEjercicios([...ronda1, ...ronda2]), index: 0 };
    await updateUserFlow();
  }

  /*
    Mezcla aleatoria de ejercicios evitando que la MISMA palabra
    aparezca dos veces seguidas (sus dos ejercicios quedan separados).
  */
  function mezclarEjercicios(lista) {
    const arr = [...lista];
    // Fisher–Yates
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    // Separar repetidos adyacentes (varias pasadas y sin crear nuevos choques)
    const idDe = (e) => String(e.word_id ?? e.word?.id ?? '');
    for (let pasada = 0; pasada < 4; pasada++) {
      let hubo = false;
      for (let i = 1; i < arr.length; i++) {
        if (idDe(arr[i]) !== idDe(arr[i - 1])) continue;
        // Buscar en cualquier posición un candidato que no genere nueva adyacencia
        const k = arr.findIndex((e, idx) => {
          if (idx === i || idx === i - 1) return false;
          if (idDe(e) === idDe(arr[i - 1])) return false;
          const prev = arr[idx - 1], next = arr[idx + 1];
          if (prev && idDe(prev) === idDe(arr[i])) return false;
          if (next && idx + 1 !== i && idDe(next) === idDe(arr[i])) return false;
          return true;
        });
        if (k !== -1) { [arr[i], arr[k]] = [arr[k], arr[i]]; hubo = true; }
      }
      if (!hubo) break;
    }
    return arr;
  }

  // Cuántos ejercicios debería tener el grupo con la regla de dos por palabra
  function tamanoEsperadoCola(words) {
    return words.length + words.filter(w => w.imagen).length;
  }

  function buildOptions(correct, pool) {
    const distractors = pool.filter(x => x !== correct).sort(() => Math.random() - 0.5).slice(0, 3);
    return [correct, ...distractors].sort(() => Math.random() - 0.5);
  }

  async function renderPractice(nivel, group) {
    const g = flujo.niveles[nivel].grupos[group];

    // Cargamos las palabras reales del grupo primero.
    const words = await getGroupWords(nivel, group);
    const validIds = new Set(words.map(w => String(w.id)));

    // Construir la cola si no existe, o regenerarla si quedó obsoleta
    // (p. ej. word_id que ya no pertenecen a este grupo).
    const colaCompleta = g.practice.queue && g.practice.queue.length >= tamanoEsperadoCola(words);
    const queueOk = g.practice.queue && g.practice.queue.length &&
      g.practice.queue.every(ex => validIds.has(String(ex.word_id))) &&
      // Colas viejas (una sola práctica por palabra): se rehacen si aún no empezó
      (colaCompleta || (g.practice.index || 0) > 0);
    if (!queueOk) {
      console.warn(`[renderPractice] cola inválida/obsoleta en ${nivel}/${group} → regenerando`);
      g.practice.index = 0;
      await buildPracticeQueue(nivel, group);
    }

    const q = g.practice.queue;
    const i = g.practice.index || 0;

    if (i >= q.length) {
      g.practice.done = true;
      await updateUserFlow();
      // Falta la última práctica: usar estas palabras hablando con Abu.
      return showEncouragement(() => runFlow());
    }

    const ex = q[i];
    const word = groupCache.map[String(ex.word_id)];
    if (!word) { g.practice.index = i + 1; await updateUserFlow(); return renderPractice(nivel, group); }

    updateProgressBar((i / q.length) * 100);
    console.log(`[practica] ${i + 1}/${q.length} · ${ex.type} · ${word.ingles}`);

    const advance = async (isCorrect) => {
      const gg = flujo.niveles[nivel].grupos[group];
      if (isCorrect) gg.correct++; else gg.wrong++;
      gg.practice.index = i + 1;
      await updateSRS(word.id, isCorrect ? 'practice_correct' : 'practice_wrong', { type: ex.type });
      await updateUserFlow();
      // Mensaje de ánimo cada 5 aciertos
      if (isCorrect && sessionCorrect > 0 && sessionCorrect % 5 === 0 && sessionCorrect !== lastMilestone) {
        lastMilestone = sessionCorrect;
        setTimeout(() => showEncouragement(() => renderPractice(nivel, group)), 900);
      } else {
        setTimeout(() => renderPractice(nivel, group), isCorrect ? 1000 : 2000);
      }
    };

    if (ex.type === 'select_by_image') renderSelectImage(word, ex.options, advance);
    else renderWriteAudio(word, advance);
  }

  function renderWriteAudio(word, advance) {

  /* ============================================================
     10. REPASO SRS (sesión de palabras vencidas)
  ============================================================ */
  function startSrsReview(words) {
    srsSession = { queue: words.slice(0, SRS_SESSION_MAX), index: 0, aciertos: 0 };
    const hechosHoy = (flujo?.daily?.reviewed || 0);
    // Los repasos ya NO se limitan al nivel actual: si quedaron palabras
    // pendientes de niveles anteriores, se avisa para que no sorprenda.
    const niveles = sortNiveles([...new Set(srsSession.queue.map(w => (w.nivel || '').trim()).filter(Boolean))]);
    const nivelActual = flujo?.currentNivel || '';
    const previos = niveles.filter(n => n.toLowerCase() !== nivelActual.toLowerCase());
    const aviso = previos.length
      ? `<span class="block mt-2 text-xs font-bold text-[#FF7A00]">Incluye palabras de ${previos.join(' · ')} que aún no dominas 🔁</span>`
      : '';
    renderMessage('🧠', '¡Toca repasar!',
      `Tienes <b>${srsSession.queue.length}</b> palabra(s) que tu memoria está a punto de olvidar. Vamos a reforzarlas.${aviso}<br><span class="text-xs text-slate-400">(hasta ${SRS_DAILY_MAX} repasos al día — hoy llevas ${hechosHoy}. Al terminar, listo: nada de otra ronda)</span>`,
      'Empezar repaso', () => nextSrsReview());
  }
  async function nextSrsReview() {
    if (!srsSession || srsSession.index >= srsSession.queue.length) {
      const aciertos = srsSession ? srsSession.aciertos : 0;
      const total = srsSession ? srsSession.queue.length : 0;
      srsSession = null;
      flujo.stats.sessionsCompleted = (flujo.stats.sessionsCompleted || 0) + 1;
      await updateUserFlow();
      playSound('complete'); triggerConfetti();
      showModal({
        icon: '🧠', title: '¡Repaso terminado!',
        body: `Has fortalecido tu memoria a largo plazo.<br><span class="text-green-600 font-bold">${aciertos}/${total} aciertos</span>`,
        dismissable: false,
        actions: [{ label: 'Continuar', onClick: () => { closeModal(); runFlow(); } }]
      });
      return;
    }
    const word = srsSession.queue[srsSession.index];
    updateProgressBar((srsSession.index / srsSession.queue.length) * 100);

    const s = flujo.srs[String(word.id)] || {};
    const esDebil = (s.lapses || 0) >= 3 || (s.level || 0) === 0; // le cuesta: mejor volver a estudiarla

    const avanzar = async (result, type, fueBien) => {
      await updateSRS(word.id, result, { type, word });
      ensureDaily();
      flujo.daily.reviewed = (flujo.daily.reviewed || 0) + 1;
      if (fueBien) srsSession.aciertos++;
      srsSession.index++;
      setTimeout(() => nextSrsReview(), fueBien ? 1000 : 2000);
    };

    /*
      Mezcla ALEATORIA de formatos dentro de "¡Toca repasar!":
      tarjeta ✨ Repaso, 👁️ Identifica la imagen y 👂 Escucha y escribe
      salen al azar (sin un orden fijo). Así el usuario también puede
      completar los ejercicios que le faltan para DOMINAR la palabra.
      Si la palabra está muy débil, la tarjeta tiene un poco más de
      probabilidad para volver a estudiarla, pero nunca es lo único.
    */
    const modos = ['flashcard', 'write_by_audio'];
    if (word.imagen) modos.push('select_by_image');
    let modo;
    if (esDebil && Math.random() < 0.5) modo = 'flashcard';
    else modo = modos[Math.floor(Math.random() * modos.length)];

    if (modo === 'flashcard') {
      appContainer.innerHTML = flashcardHTML(word, srsSession.index + 1, srsSession.queue.length);
      bindFlashcard(word, (res) => avanzar(res, 'flashcard', res === 'easy'), srsSession.index + 1, srsSession.queue.length);
    } else if (modo === 'select_by_image') {
      const pool = (groupCache.list.length ? groupCache.list : srsSession.queue).map(w => w.ingles);
      renderSelectImage(word, buildOptions(word.ingles, pool.length >= 4 ? pool : [word.ingles, 'yes', 'no', 'time']),
        (ok) => avanzar(ok ? 'practice_correct' : 'practice_wrong', 'select_by_image', ok));
    } else {
      renderWriteAudio(word, (ok) => avanzar(ok ? 'practice_correct' : 'practice_wrong', 'write_by_audio', ok));
    }
  }

  /* ============================================================
     11. AVANCE DE GRUPO / NIVEL
  ============================================================ */
  function groupCompleteScreen(nivel, group, g) {
    playSound('complete'); triggerConfetti();
    // Cofre de recompensa: +1 lingot por completar el grupo.
    const lingots = (parseFloat(userProfile.lingots) || 0) + 1;
    userProfile.lingots = lingots;
    const dl = document.getElementById('user-lingots'); if (dl) dl.textContent = lingots;
    dbClient.from('profiles').update({ lingots }).eq('id', currentUser.id).then(() => {});
    showModal({
      icon: '🏆',
      title: '¡Grupo completado!',
      body: `Terminaste <b>${group}</b> del nivel <b>${nivel}</b>.<br><span class="text-green-600 font-bold">${g.correct} aciertos</span> · <span class="text-slate-400">${g.wrong} fallos</span><br><span class="text-yellow-600 font-bold text-lg">🎁 +1 💎 Lingot</span>`,
      dismissable: false,
      actions: [{ label: 'Siguiente 👉', onClick: () => { closeModal(); advanceGroup(nivel, group); } }]
    });
  }

  async function advanceGroup(nivel, group) {
    const groups = await getGroups(nivel);
    const idx = groups.indexOf(group);
    const next = groups[idx + 1];

    if (next) {
      flujo.niveles[nivel].currentGroup = next;
      if (!flujo.niveles[nivel].grupos[next]) flujo.niveles[nivel].grupos[next] = defaultGroupState();
      groupCache = { key: null, list: [], map: {} };
      await updateUserFlow();
      runFlow();
    } else {
      // Nivel terminado
      playSound('complete'); triggerConfetti();
      // El certificado no se gana por terminar los grupos, sino por tener
      // TODAS las palabras del nivel dominadas. Aquí se le dice cuánto falta.
      const cert = await getCertProgreso(nivel);
      const notaCert = cert.listo
        ? `<span class="block mt-3 text-green-600 font-bold">🎓 ¡Dominaste las ${cert.total} palabras! Tu certificado del nivel ${nivel} ya está disponible.</span>`
        : `<span class="block mt-3 text-slate-500">Para tu <b>certificado del nivel ${nivel}</b> te faltan <b class="text-[#FF7A00]">${cert.faltan} palabra${cert.faltan === 1 ? '' : 's'}</b> por dominar. Puedes seguir repasándolas aunque cambies de nivel. 🔁</span>`;
      showModal({
        icon: '🎓',
        title: `¡Nivel ${nivel} completado!`,
        body: `Dominaste todos los grupos de este nivel. ¿Subimos de nivel?${notaCert}`,
        dismissable: false,
        actions: [
          { label: 'Elegir nivel', onClick: () => { closeModal(); openNivelSelector(); } },
          { label: cert.listo ? 'Pedir mi certificado 📜' : 'Ver certificados 🎓', style: 'bg-slate-100 text-slate-500', onClick: () => { closeModal(); openCertificados(); } },
          { label: 'Repasar lo aprendido', style: 'bg-slate-100 text-slate-500', onClick: () => { closeModal(); runFlow(); } }
        ]
      });
    }
  }

  /* ============================================================
     12. SELECTOR DE NIVEL
  ============================================================ */
  async function openNivelSelector() {
    if (esGratis()) return mostrarBloqueoPlan('En el plan <b>Gratis</b> solo puedes estudiar el nivel <b>A1</b>. Mejora tu plan para desbloquear A2, B1 y B2.');
    const conContenido = await getNiveles(); // niveles que sí tienen palabras
    // Unimos los niveles fijos con cualquier otro detectado en la base de datos.
    const niveles = sortNiveles([...new Set([...NIVELES_FIJOS, ...conContenido])]);
    const current = flujo.currentNivel;

    const body = `<div class="grid grid-cols-2 gap-3 mt-2">${niveles.map(n => {
      const tiene = conContenido.includes(n);
      const activo = n === current;
      return `<button class="nivel-opt btn-juice ${activo ? 'bg-[#FF7A00] text-white' : (tiene ? 'bg-slate-100 text-slate-700' : 'bg-slate-50 text-slate-400')} font-black text-lg py-4 rounded-xl flex flex-col items-center gap-1" data-nivel="${n}">
        <span>${n}</span>
        <span class="text-[10px] font-bold uppercase ${activo ? 'text-white/80' : (tiene ? 'text-green-500' : 'text-slate-300')}">${tiene ? 'Disponible' : 'Sin contenido'}</span>
      </button>`;
    }).join('')}</div>`;

    showModal({ icon: '🎯', title: '¿Qué nivel quieres estudiar?', body, size: 'md' });

    modalRoot.querySelectorAll('.nivel-opt').forEach(btn => {
      btn.onclick = async () => {
        const nivel = btn.dataset.nivel;
        console.log('[nivel] seleccionado:', nivel);
        flujo.currentNivel = nivel;
        await ensureNivel(nivel);
        await updateUserFlow();
        await dbClient.from('profiles').update({ nivel }).eq('id', currentUser.id);
        userProfile.nivel = nivel;
        groupCache = { key: null, list: [], map: {} };
        closeModal();
        runFlow();
      };
    });
  }

  /* ============================================================
     12.5. DIÁLOGO GENERADO CON LAS PALABRAS DEL GRUPO
     ------------------------------------------------------------
     Al terminar la práctica de un grupo, se genera (una sola vez,
     Edge Function "generar-dialogo" SIN "mode" — su modo original de
     diálogo ESL) un guion corto de 4-6 líneas con esas palabras. El
     usuario elige "Persona A" o "Persona B" y lo practica: puede
     responder hablando 🎙️ (con el mismo micrófono de arranque/parada
     manual) o escribiendo — a diferencia de "Conversa con Abu", que
     es solo por voz.
  ============================================================ */
  let domDialogoActual = null; // { data, nivel, group, personaje }

  async function generarDialogoGrupo(nivel, grupo, words) {
    try {
      const headers = await cabecerasIA();
      if (!headers) return null;
      const resp = await fetch(`${SUPABASE_URL}/functions/v1/generar-dialogo`, {
        method: 'POST',
        headers,
        body: JSON.stringify({ words, nivel, grupo })
      });
      const payload = await resp.json().catch(() => null);
      if (!resp.ok) manejarRechazoIA(payload);
      if (!resp.ok || !payload || !Array.isArray(payload.lines) || !payload.lines.length) return null;
      return payload;
    } catch (err) { console.warn('[Diálogo grupo]', err?.message || err); return null; }
  }

  async function introDialogoGrupo(nivel, group, words) {
    // Este paso usa la función Edge "generar-dialogo" (IA): en Gratis/Plus
    // se salta sin trabar el flujo, igual que cuando la IA falla o tarda.
    if (!puedeIA()) {
      const g = flujo.niveles[nivel]?.grupos?.[group];
      if (g) { if (!g.dialogo) g.dialogo = {}; g.dialogo.done = true; await updateUserFlow(); }
      return runFlow();
    }
    updateProgressBar(65);
    appContainer.innerHTML = `<div class="text-center animate-pulse mt-10"><i class="fas fa-circle-notch fa-spin text-4xl text-[#FF7A00]"></i><p class="text-slate-400 font-bold mt-3">Generando un diálogo con tus palabras...</p></div>`;
    const palabras = (words || []).map(w => w.ingles).filter(Boolean).slice(0, 8);
    const data = await generarDialogoGrupo(nivel, group, palabras);
    if (!data) {
      // No bloquea el flujo si la IA falla o tarda demasiado.
      const g = flujo.niveles[nivel]?.grupos?.[group];
      if (g) { if (!g.dialogo) g.dialogo = {}; g.dialogo.done = true; await updateUserFlow(); }
      return runFlow();
    }
    domDialogoActual = { data, nivel, group, personaje: null };
    const speakers = [...new Set(data.lines.map(l => l.speaker))];
    appContainer.innerHTML = `
      <div class="card-3d p-5 animate-pop mt-1 text-center">
        <span class="bg-teal-100 text-teal-600 px-3 py-1 rounded-full text-xs font-bold uppercase mb-3 inline-block">🎭 Diálogo con tus palabras</span>
        <h3 class="font-heading font-bold text-slate-800 text-lg mb-3">${escapeHTML(data.title || '')}</h3>
        <p class="text-[11px] font-bold text-slate-400 mb-2">Elige tu personaje:</p>
        <div id="dg-personajes" class="grid grid-cols-2 gap-2 mb-2">
          ${speakers.map(s => `<button class="personaje-btn" data-per="${escapeHTML(s)}"><div class="text-2xl mb-1">🧑</div><div class="font-bold text-sm">Persona ${escapeHTML(s)}</div></button>`).join('')}
        </div>
        <p class="text-[11px] text-slate-400 mt-2">Puedes responder hablando 🎙️ o escribiendo ⌨️.</p>
      </div>`;
    document.querySelectorAll('#dg-personajes [data-per]').forEach(b => {
      b.onclick = () => dgIniciar(b.dataset.per);
    });
  }

  function dgIniciar(personaje) {
    const info = domDialogoActual; if (!info) return;
    info.personaje = personaje;
    const total = info.data.lines.length;
    appContainer.innerHTML = `
      <div class="card-3d p-3 sm:p-4 animate-pop mt-1">
        <div class="flex items-center gap-2 mb-2">
          <span class="bg-teal-100 text-teal-600 px-2.5 py-1 rounded-full text-[11px] font-bold uppercase shrink-0">🎭 Diálogo</span>
          <div class="flex-1 progress-track" style="margin-top:0"><div id="dg-bar" class="progress-fill" style="width:0%"></div></div>
          <span class="text-[11px] font-black text-slate-400 shrink-0"><span id="dg-count">0</span>/${total}</span>
        </div>
        <div id="dg-messages" class="chat-scroll h-[40vh] min-h-[190px] overflow-y-auto p-2 space-y-2 mb-2 bg-slate-50 rounded-xl border border-slate-100"></div>
        <div id="dg-turno" class="flex flex-col items-center gap-1.5"></div>
      </div>`;
    dgBind();
    dgPaso(0);

  function dgBind() {
    const box = document.getElementById('dg-messages');
    if (!box) return;
    box.addEventListener('click', (e) => {
      const say = e.target.closest('[data-say]');
      if (say) { stopSpeaking(); speak(decodeURIComponent(say.dataset.say || '')); return; }
      const tr = e.target.closest('[data-toggle-tr]');
      if (tr) { const el = document.getElementById(tr.dataset.toggleTr); if (el) el.classList.toggle('hidden'); }
    });
  }

  function dgBubble(role, en, es) {
    const box = document.getElementById('dg-messages');
    if (!box) return;
    const idTr = 'dg-tr-' + Math.random().toString(36).slice(2, 9);
    const btnSay = `<button data-say="${encodeURIComponent(en)}" title="Escuchar" class="shrink-0 w-8 h-8 rounded-full bg-white border border-slate-200 text-slate-400 hover:text-[#FF7A00] hover:border-[#FF7A00] active:scale-90 transition flex items-center justify-center"><i class="fas fa-volume-up text-[11px]"></i></button>`;
    const div = document.createElement('div');
    if (role === 'user') {
      div.className = 'flex justify-end items-end gap-1.5';
      div.innerHTML = `${btnSay}<div class="bg-[#FF7A00] text-white rounded-2xl rounded-br-sm px-3.5 py-2 max-w-[75%] font-medium">
        ${escapeHTML(en)}
        ${es ? `<button data-toggle-tr="${idTr}" class="block text-[10px] font-bold text-orange-100 underline mt-1">Ver traducción</button>
        <div id="${idTr}" class="hidden text-xs text-orange-100 mt-0.5 leading-snug">${escapeHTML(es)}</div>` : ''}
      </div>`;
    } else {
      div.className = 'flex justify-start items-end gap-1.5';
      div.innerHTML = `<div class="bg-white border border-slate-200 text-slate-800 rounded-2xl rounded-bl-sm px-3.5 py-2 max-w-[75%] shadow-sm">
        <div class="text-[10px] font-black text-teal-500 uppercase mb-0.5">Persona ${escapeHTML(role)}</div>
        <div class="font-medium leading-snug">${escapeHTML(en)}</div>
        ${es ? `<button data-toggle-tr="${idTr}" class="text-[10px] font-bold text-slate-400 underline mt-1">Ver traducción</button>
        <div id="${idTr}" class="hidden text-xs text-slate-400 mt-0.5 leading-snug">${escapeHTML(es)}</div>` : ''}
      </div>${btnSay}`;
    }
    box.appendChild(div); box.scrollTop = box.scrollHeight;
  }

  function dgPaso(idx) {
    stopSpeaking();
    const info = domDialogoActual; if (!info) return;
    const lineas = info.data.lines;
    const bar = document.getElementById('dg-bar'); if (bar) bar.style.width = `${Math.round((idx / lineas.length) * 100)}%`;
    const cnt = document.getElementById('dg-count'); if (cnt) cnt.textContent = idx;
    if (idx >= lineas.length) return dgFin();
    const linea = lineas[idx];
    const esMio = linea.speaker === info.personaje;
    const turno = document.getElementById('dg-turno');

    if (!esMio) {
      turno.innerHTML = `<div class="text-center text-slate-300"><i class="fas fa-volume-up fa-lg"></i></div>`;
      dgBubble(linea.speaker, linea.en, linea.es);
      speak(linea.en);
      setTimeout(() => dgPaso(idx + 1), Math.max(1400, linea.en.length * 55));
      return;
    }

    turno.innerHTML = `
      <p class="text-[11px] font-black text-[#FF7A00] uppercase text-center px-4">Te toca: "${escapeHTML(linea.en)}"</p>
      <div class="flex items-center gap-2 w-full">
        <button id="dg-mic" class="mic-btn shrink-0" style="width:52px;height:52px;font-size:1.2rem"><i class="fas fa-microphone"></i></button>
        <input id="dg-input" type="text" placeholder="…o escribe aquí" autocomplete="off" class="flex-1 min-w-0 bg-white border-2 border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-[#FF7A00] text-slate-700 font-medium">
        <button id="dg-enviar" class="btn-juice bg-[#FF7A00] text-white font-bold px-3.5 py-2.5 rounded-xl shrink-0"><i class="fas fa-paper-plane"></i></button>
      </div>
      <p id="dg-msg" class="text-xs font-bold text-slate-400 min-h-[1.2em] text-center px-4">Habla 🎙️ o escribe tu línea</p>`;

    const input = document.getElementById('dg-input');
    const msg = document.getElementById('dg-msg');
    const enviarTexto = () => {
      const texto = (input.value || '').trim();
      if (!texto) return;
      input.value = '';
      dgResponder(idx, texto);
    };
    document.getElementById('dg-enviar').onclick = enviarTexto;
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') enviarTexto(); });

    const micBtn = document.getElementById('dg-mic');
    bindMicManual(micBtn, msg, {
      onFinal: (texto) => { if (texto) dgResponder(idx, texto); else msg.textContent = 'No escuché nada — habla de nuevo o escribe 🎙️'; },
      onError: (err) => { msg.textContent = err === 'no-soportado' ? 'Tu navegador no reconoce voz — escribe tu respuesta 😉' : 'No te escuché, intenta de nuevo'; },
      textoEscuchando: 'Escuchando… toca de nuevo para enviar'
    });
  }

  function dgResponder(idx, texto) {
    const info = domDialogoActual;
    const linea = info.data.lines[idx];
    playSound(coincideVoz(texto, linea.en) ? 'correct' : 'wrong');
    dgBubble('user', texto, linea.es || null);
    setTimeout(() => dgPaso(idx + 1), 900);
  }

  async function dgFin() {
    const info = domDialogoActual;
    const turno = document.getElementById('dg-turno');
    await addPoints(15);
    const g = flujo.niveles[info.nivel]?.grupos?.[info.group];
    if (g) { if (!g.dialogo) g.dialogo = {}; g.dialogo.done = true; await updateUserFlow(); }
    playSound('complete'); triggerConfetti();
    if (turno) {
      turno.innerHTML = `
        <p class="text-center text-sm font-bold text-green-600 mb-2">🎉 ¡Diálogo terminado! <span class="text-yellow-600">+15 puntos</span></p>
        <button id="dg-continuar" class="w-full btn-juice bg-[#FF7A00] text-white font-bold py-2.5 rounded-xl text-sm">Continuar 👉</button>`;
      document.getElementById('dg-continuar').onclick = () => runFlow();
    } else runFlow();
  }

  /* ============================================================
     13. HABLAR CON ABU — práctica de conversación (última misión)
     ------------------------------------------------------------
     Es una práctica más, como las tarjetas o los ejercicios: hay que
     enviar CHAT_GOAL mensajes para completarla y cerrar el grupo.
     Abu contesta corto, corrige al instante y usa las palabras que
     acabas de estudiar. Nunca se presenta como una IA: es Abu.
     Respuestas: Edge Function "generar-dialogo" (mode:"chat").
  ============================================================ */
  function chatPracticeIntro(nivel, group) {
    // Sin modal previo: la charla arranca de una vez.
    startChatPractice(nivel, group, true);
  }
  const CHAT_TIMEOUT_MS = 20000;   // con "thinking" desactivado la respuesta llega en 1-3 s
  let aiChat = [];                 // historial [{role:'user'|'assistant', content}]
  let chatWords = [];              // palabras objetivo de esta charla
  let chatSession = null;          // { nivel, group, counts, count, goal, used:Set, streak }
  let chatModoLocalAvisado = false; // para avisar una sola vez si falla la Edge Function

  // Últimas N palabras estudiadas (con registro SRS), ordenadas por fecha de estudio.
  async function getStudiedWords(max = 10) {
    const ids = Object.entries(flujo.srs)
      .sort((a, b) => new Date(b[1].updated || 0) - new Date(a[1].updated || 0))
      .slice(0, max)
      .map(([id]) => parseInt(id))
      .filter(n => !isNaN(n));
    if (!ids.length) return [];
    const { data, error } = await dbClient.from('palabras').select('id, ingles').in('id', ids);
    if (error) { console.warn('[Abu] no se pudieron leer palabras estudiadas:', error.message); return []; }
    const porId = new Map((data || []).map(w => [w.id, w.ingles]));
    return ids.map(id => porId.get(id)).filter(Boolean);
  }

  // Palabras objetivo: las del grupo que se acaba de practicar; si no hay, las últimas estudiadas.
  async function getChatWords(nivel, group, max = 10) {
    let list = [];
    if (nivel && group) {
      const words = await getGroupWords(nivel, group);
      list = words.map(w => w.ingles).filter(Boolean);
    }
    if (!list.length) list = await getStudiedWords(max);
    return [...new Set(list.map(w => String(w).trim()).filter(Boolean))].slice(0, max);
  }

  /*
    Llamada a la Edge Function. Reintenta una vez y, si aun así falla,
    devuelve null para que la charla continúe con una respuesta local
    (nunca se corta la práctica con "no pude responder").
  */
  async function callChatFunction(body, reintentos = 1) {
    // Plan Gratis/Plus: sin acceso a funciones Edge de IA. Se devuelve null
    // de una vez (sin llamar a la red) para que la charla siga con las
    // respuestas locales que ya existen como respaldo — la misma ruta que
    // se usa cuando la función Edge falla o tarda demasiado.
    if (!puedeIA()) return null;
    for (let intento = 0; intento <= reintentos; intento++) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), CHAT_TIMEOUT_MS);
      try {
        const headers = await cabecerasIA();
        if (!headers) { clearTimeout(timer); return null; }
        const resp = await fetch(`${SUPABASE_URL}/functions/v1/generar-dialogo`, {
          method: 'POST',
          headers,
          body: JSON.stringify(body),
          signal: controller.signal
        });
        let payload = null;
        try { payload = await resp.json(); } catch { /* respuesta no JSON */ }
        // Plan, cupo o sesión: se avisa y NO se reintenta, no tiene caso.
        if (payload?.codigo && manejarRechazoIA(payload)) { clearTimeout(timer); return null; }
        if (!resp.ok || payload?.error) {
          throw new Error(`${payload?.error || 'HTTP ' + resp.status}${payload?.motivo ? ' · ' + payload.motivo : ''}`);
        }
        const en = (payload?.reply?.en || '').trim();
        if (!en) throw new Error('respuesta vacía');
        return payload.reply;
      } catch (err) {
        console.warn(`[Abu] intento ${intento + 1}:`, err?.name === 'AbortError' ? 'tardó demasiado' : (err?.message || err));
        if (intento < reintentos) await new Promise(r => setTimeout(r, 500));
      } finally {
        clearTimeout(timer);
      }
    }
    return null;
  }

  /*
    Diagnóstico rápido. Abre la consola del navegador (F12) y escribe:
        await pingAbu()
    Te dice si la clave de DeepSeek existe, si responde y en cuántos ms.
  */
  window.pingAbu = async function () {
    const headers = await cabecerasIA();
    if (!headers) { console.warn('❌ Sin sesión: inicia sesión antes de hacer ping.'); return null; }
    const r = await fetch(`${SUPABASE_URL}/functions/v1/generar-dialogo`, {
      method: 'POST',
      headers,
      body: JSON.stringify({ mode: 'ping' })
    });
    const j = await r.json().catch(() => ({ error: 'respuesta no JSON', status: r.status }));
    console.log(j.ok ? '✅ Abu responde bien:' : '❌ Abu no responde:', j);
    return j;
  };

  /* ------------------------------------------------------------
     GUION LOCAL DE ABU
     Se usa cuando la Edge Function no contesta (sin conexión, API
     caída o clave vencida). Antes soltaba frases sueltas y repetía
