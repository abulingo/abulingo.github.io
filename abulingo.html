  /* ============================================================
     13.6. MAZO — tu propio grupo de palabras, guardado en Supabase
     ------------------------------------------------------------
     · Las palabras viven en la tabla "mazo" (una fila por palabra,
       enlazada a "palabras" por word_id).
     · El avance vive en la tabla "mazo_flujo" (JSON), igual que
       "flujo" en profiles: puedes salirte y retomar donde ibas.
     · El Excel solo hace falta la primera vez. Después basta la M.
  ============================================================ */
  let mazoSession = null;
  let mazoCount = 0;

  // ---------- Lectura del mazo ----------
  async function cargarMazo() {
    const { data: filas, error } = await dbClient.from('mazo')
      .select('id, ingles, espanol, word_id')
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: true });
    if (error) { console.error('[mazo] no se pudo leer:', error.message); return { error, filas: [], words: [] }; }

    const ids = (filas || []).filter(f => f.word_id).map(f => f.word_id);
    let words = [];
    if (ids.length) {
      const { data } = await dbClient.from('palabras').select('*').in('id', ids);
      words = data || [];
    }

    // Mazos guardados antes de existir word_id: se buscan por nombre y se reparan solos.
    const sinId = (filas || []).filter(f => !f.word_id);
    if (sinId.length) {
      const halladas = await buscarPalabrasMazo(sinId.map(f => f.ingles));
      sinId.forEach(f => {
        const w = halladas.find(x => (x.ingles || '').toLowerCase() === (f.ingles || '').toLowerCase());
        if (w) {
          words.push(w);
          dbClient.from('mazo').update({ word_id: w.id }).eq('id', f.id).then(() => {});
        }
      });
    }

    // Mismo orden en que las cargó la persona
    const orden = new Map((filas || []).map((f, k) => [(f.ingles || '').toLowerCase(), k]));
    words.sort((a, b) => (orden.get((a.ingles || '').toLowerCase()) ?? 999) - (orden.get((b.ingles || '').toLowerCase()) ?? 999));
    return { filas: filas || [], words };
  }

  // Busca palabras del Excel en la tabla "palabras" (tolerante a mayúsculas).
  async function buscarPalabrasMazo(listaIngles) {
    const unicas = [...new Set(listaIngles.map(w => (w || '').toString().trim()).filter(Boolean))];
    if (!unicas.length) return [];
    const variantes = [...new Set(unicas.flatMap(w => [
      w, w.toLowerCase(), w.toUpperCase(),
      w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()
    ]))];
    const { data, error } = await dbClient.from('palabras').select('*').in('ingles', variantes);
    if (error) { console.error('[mazo] error buscando palabras:', error.message); return []; }
    const vistos = new Set(); const out = [];
    (data || []).forEach(w => {
      const k = (w.ingles || '').toLowerCase();
      if (!vistos.has(k)) { vistos.add(k); out.push(w); }
    });
    return out;
  }

  // ---------- Flujo del mazo (tabla mazo_flujo) ----------
  async function leerMazoFlujo() {
    const { data, error } = await dbClient.from('mazo_flujo').select('flujo')
      .eq('user_id', currentUser.id).maybeSingle();
    if (error) { console.warn('[mazo] flujo:', error.message); return null; }
    return data?.flujo || null;
  }
  function estadoMazo() {
    const ms = mazoSession;
    if (!ms) return { pendiente: false };
    return {
      pendiente: true,
      phase: ms.phase,
      index: ms.index,
      correct: ms.correct,
      wrong: ms.wrong,
      ids: ms.words.map(w => w.id),
      queue: (ms.queue || []).map(q => ({ id: q.word.id, type: q.type })),
      total: ms.words.length,
      updated: new Date().toISOString()
    };
  }
  function guardarMazoFlujo() {
    if (!currentUser) return;
    dbClient.from('mazo_flujo')
      .upsert({ user_id: currentUser.id, flujo: estadoMazo(), updated_at: new Date().toISOString() }, { onConflict: 'user_id' })
      .then(({ error }) => { if (error) console.warn('[mazo] no se pudo guardar el avance:', error.message); });
  }
  async function limpiarMazoFlujo() {
    await dbClient.from('mazo_flujo').delete().eq('user_id', currentUser.id);
  }

  // ---------- Insignia del botón "M" ----------
  async function refreshMazoBadge() {
    if (!currentUser) return 0;
    const { count } = await dbClient.from('mazo')
      .select('id', { count: 'exact', head: true }).eq('user_id', currentUser.id);
    mazoCount = count || 0;
    const b = document.getElementById('mazo-badge');
    if (b) {
      b.textContent = mazoCount > 99 ? '99+' : mazoCount;
      b.classList.toggle('hidden', mazoCount === 0);
      b.classList.toggle('flex', mazoCount > 0);
    }
    const m = document.getElementById('mazo-menu-count');
    if (m) m.textContent = mazoCount ? `${mazoCount} palabras` : '';
    return mazoCount;
  }

  // ---------- Botón "M": entra directo, sin Excel ----------
  async function abrirMazoRapido() {
    if (!currentUser) return;
    const { words, error } = await cargarMazo();
    if (error) { showToast('⚠️ No se pudo leer tu mazo.'); return openMazo(); }
    if (!words.length) {
      showToast('🃏 Tu mazo está vacío: carga un Excel una sola vez.');
      return openMazo();
    }
    const guardado = await leerMazoFlujo();
    if (guardado && guardado.pendiente && (guardado.index || 0) > 0) {
      const hechas = guardado.phase === 'practice' ? (guardado.total || words.length) + guardado.index : guardado.index;
      const totales = (guardado.total || words.length) * 2;
      return showModal({
        icon: '🃏', title: 'Tienes un mazo a medias',
        body: `Ibas en el paso <b>${Math.min(hechas, totales)}</b> de ${totales}. ¿Sigues donde lo dejaste?`,
        actions: [
          { label: 'Continuar 👉', onClick: () => { closeModal(); startMazoPractice(words, guardado); } },
          { label: 'Empezar de nuevo', style: 'bg-slate-100 text-slate-500', onClick: async () => { closeModal(); await limpiarMazoFlujo(); startMazoPractice(words); } }
        ]
      });
    }
    startMazoPractice(words);
  }

  // ---------- Panel del mazo ----------
  async function openMazo() {
    showModal({ icon: '🃏', title: 'Mi Mazo', size: 'lg', body: `<div id="mz-body" class="text-left">${spinnerHTML()}</div>`, actions: [] });
    const el = document.getElementById('mz-body');
    if (!el) return;

    const { filas, words } = await cargarMazo();
    const tiene = words.length > 0;
    const huerfanas = filas.filter(f => !words.some(w => (w.ingles || '').toLowerCase() === (f.ingles || '').toLowerCase()));

    el.innerHTML = `
      ${tiene ? `
        <div class="bg-orange-50 border-2 border-orange-200 rounded-xl p-3 mb-3">
          <div class="flex items-center justify-between mb-2">
            <p class="font-bold text-slate-700 text-sm">Tu mazo · <b>${words.length}</b> palabra(s)</p>
            <button id="mz-vaciar" class="text-[10px] font-bold text-slate-400 hover:text-red-500 transition">Vaciar</button>
          </div>
          <div class="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto mb-3">
            ${words.map(w => `<span class="text-[11px] font-bold px-2 py-1 rounded-full bg-white border border-slate-200 text-slate-500 flex items-center gap-1">${escapeHTML(w.ingles)}<button class="mz-del text-slate-300 hover:text-red-500" data-w="${escapeHTML(w.ingles)}" title="Quitar">&times;</button></span>`).join('')}
          </div>
          <button id="mz-practicar" class="btn-juice bg-[#FF7A00] text-white font-bold py-2.5 rounded-xl w-full">🎯 Practicar mi mazo</button>
          <p class="text-[10px] text-slate-400 text-center mt-2">Atajo: el botón <b class="text-[#FF7A00]">M</b> de arriba lo abre directo.</p>
        </div>` : ''}

      ${huerfanas.length ? `<p class="text-[11px] text-amber-600 bg-amber-50 border border-amber-200 rounded-lg px-2 py-1.5 mb-3">${huerfanas.length} palabra(s) de tu mazo no están en la base de datos y no se pueden practicar: ${escapeHTML(huerfanas.slice(0, 4).map(f => f.ingles).join(', '))}${huerfanas.length > 4 ? '…' : ''}</p>` : ''}

      <div class="bg-slate-50 rounded-xl p-3 mb-3 text-sm text-slate-500 space-y-1">
        <p class="font-bold text-slate-700 mb-1">📋 ${tiene ? 'Añadir más palabras' : 'Crea tu mazo en 3 pasos'}</p>
        <p>1️⃣ Un Excel con una columna llamada <b class="text-slate-700">ingles</b>.</p>
        <p>2️⃣ Una palabra en inglés por fila (ej: <i>dog, house, water...</i>).</p>
        <p>3️⃣ Cárgalo: las palabras quedan <b>guardadas</b> y el Excel ya no hace falta nunca más. ✨</p>
      </div>

      <label class="block w-full text-center btn-juice bg-slate-800 text-white font-bold py-3 rounded-xl cursor-pointer">
        <i class="fas fa-file-excel mr-2"></i>${tiene ? 'Añadir palabras desde Excel' : 'Cargar Excel'}
        <input id="mz-file" type="file" accept=".xlsx,.xls,.csv" class="hidden">
      </label>
      <p id="mz-status" class="text-xs text-slate-500 font-bold mt-3 text-center min-h-[1rem]"></p>
      <div id="mz-actions" class="mt-3"></div>`;

    const btn = document.getElementById('mz-practicar');
    if (btn) btn.onclick = () => { closeModal(); abrirMazoRapido(); };

    const vaciar = document.getElementById('mz-vaciar');
    if (vaciar) vaciar.onclick = () => {
      showModal({
        icon: '🗑️', title: '¿Vaciar el mazo?',
        body: 'Se borran las <b>' + words.length + '</b> palabras guardadas. Tu progreso de memoria no se pierde.',
        actions: [
          { label: 'Sí, vaciar', style: 'bg-red-500 text-white', onClick: async () => {
              await dbClient.from('mazo').delete().eq('user_id', currentUser.id);
              await limpiarMazoFlujo();
              await refreshMazoBadge();
              closeModal(); showToast('🗑️ Mazo vacío.'); openMazo();
            } },
          { label: 'Cancelar', style: 'bg-slate-100 text-slate-500', onClick: () => openMazo() }
        ]
      });
    };

    el.querySelectorAll('.mz-del').forEach(b => {
      b.onclick = async () => {
        const palabra = b.dataset.w;
        await dbClient.from('mazo').delete().eq('user_id', currentUser.id).ilike('ingles', palabra);
        await refreshMazoBadge();
        showToast(`Quitada: ${escapeHTML(palabra)}`, 1500);
        openMazo();
      };
    });

    const fileInput = document.getElementById('mz-file');
    if (fileInput) fileInput.onchange = (e) => procesarExcelMazo(e.target.files[0]);
  }

  // ---------- Carga del Excel: AÑADE, no reemplaza ----------
  async function procesarExcelMazo(file) {
    const status = document.getElementById('mz-status');
    const setSt = (html) => { if (status) status.innerHTML = html; };
    if (!file) return;
    if (!window.XLSX) return setSt('⚠️ No se pudo cargar el lector de Excel. Revisa tu conexión y recarga.');

    try {
      setSt('⏳ Leyendo el archivo...');
      const wb = XLSX.read(await file.arrayBuffer());
      const hoja = wb.Sheets[wb.SheetNames[0]];
      const filas = XLSX.utils.sheet_to_json(hoja, { defval: '' });
      if (!filas.length) return setSt('❌ El Excel está vacío.');

      const clave = Object.keys(filas[0]).find(k => k.trim().toLowerCase().replace(/é/g, 'e') === 'ingles');
      if (!clave) return setSt('❌ El Excel debe tener una columna llamada <b>ingles</b>.');

      const lista = filas.map(f => (f[clave] || '').toString().trim()).filter(Boolean);
      if (!lista.length) return setSt('❌ La columna "ingles" está vacía.');

      setSt(`🔎 Buscando ${lista.length} palabra(s)...`);
      const halladas = await buscarPalabrasMazo(lista);
      if (!halladas.length) return setSt('❌ Ninguna de esas palabras existe en la base. Revisa la ortografía.');

      // Se añaden solo las que aún no están (el índice único de Supabase también lo impide)
      const { filas: yaGuardadas } = await cargarMazo();
      const existentes = new Set(yaGuardadas.map(f => (f.ingles || '').toLowerCase()));
      const nuevas = halladas.filter(w => !existentes.has((w.ingles || '').toLowerCase()));

      if (nuevas.length) {
        const { error: insErr } = await dbClient.from('mazo').insert(
          nuevas.map(w => ({ user_id: currentUser.id, ingles: w.ingles, espanol: w.espanol, word_id: w.id }))
        );
        if (insErr) {
          console.error('[mazo] insert:', insErr);
          return setSt('❌ No se pudo guardar: ' + escapeHTML(insErr.message) +
            '<br><span class="font-normal">Ejecuta <b>abulingo-supabase.sql</b> en Supabase.</span>');
        }
      }

      const repetidas = halladas.length - nuevas.length;
      const faltantes = lista.filter(l => !halladas.some(w => (w.ingles || '').toLowerCase() === l.toLowerCase()));
      await refreshMazoBadge();

      setSt(`✅ <b>${nuevas.length}</b> palabra(s) añadidas a tu mazo` +
        (repetidas ? ` · <span class="text-slate-400">${repetidas} ya estaban</span>` : '') +
        (faltantes.length ? ` · <span class="text-slate-400">${faltantes.length} no existen en la base</span>` : ''));

      const cont = document.getElementById('mz-actions');
      const { words } = await cargarMazo();
      if (cont) {
        cont.innerHTML = `
          <button id="mz-ahora" class="btn-juice bg-[#FF7A00] text-white font-bold py-2.5 rounded-xl w-full">🎯 Practicar ahora (${words.length})</button>
          <button id="mz-luego" class="mt-2 w-full text-xs font-bold text-slate-400 hover:text-slate-600">Guardar y estudiar después (botón M)</button>`;
        document.getElementById('mz-ahora').onclick = async () => { await limpiarMazoFlujo(); startMazoPractice(words); };
        document.getElementById('mz-luego').onclick = () => { closeModal(); showToast('🃏 Guardado. Toca la <b>M</b> cuando quieras estudiarlo.'); };
      }
    } catch (err) {
      console.error('[mazo] error leyendo el Excel:', err);
      setSt('❌ No se pudo leer el archivo. ¿Es un Excel válido (.xlsx, .xls o .csv)?');
    }
  }

  // ---------- Práctica del mazo (tarjetas → ejercicios) ----------
  function startMazoPractice(words, guardado = null) {
    closeModal();
    const lbl = document.getElementById('nivel-label');
    if (lbl) lbl.textContent = 'M';   // arriba se ve que estás en el mazo
    words.forEach(w => { groupCache.map[String(w.id)] = w; }); // para updateSRS e imágenes

    if (guardado && guardado.pendiente) {
      // Reanudar: mismo orden de palabras y misma cola de ejercicios
      const porId = new Map(words.map(w => [w.id, w]));
      const orden = (guardado.ids || []).map(id => porId.get(id)).filter(Boolean);
      const lista = orden.length ? orden : [...words];
      const pool = lista.map(w => w.ingles);
      const queue = (guardado.queue || [])
        .map(q => { const w = porId.get(q.id); return w ? { word: w, type: q.type,
          options: q.type === 'select_by_image' ? buildOptions(w.ingles, pool.length >= 4 ? pool : [w.ingles, 'yes', 'no', 'time']) : null } : null; })
        .filter(Boolean);
      mazoSession = {
        words: lista, phase: guardado.phase || 'review', index: guardado.index || 0,
        queue, correct: guardado.correct || 0, wrong: guardado.wrong || 0
      };
      showToast('🃏 Retomamos donde ibas.');
      return nextMazoStep();
    }

    mazoSession = { words: [...words].sort(() => Math.random() - 0.5), phase: 'review', index: 0, queue: [], correct: 0, wrong: 0 };
    guardarMazoFlujo();
    renderMessage('🃏', '¡Tu mazo personalizado!',
      `Vamos con <b>${words.length}</b> palabra(s) de tu mazo: primero tarjetas ✨ y luego ejercicios 👁️👂.<br>Su progreso también entra a tu memoria espaciada. 🧠<br><span class="text-xs text-slate-400">Si sales, retomas donde ibas.</span>`,
      '¡Empezar! 🚀', () => nextMazoStep());
  }

  async function nextMazoStep() {
    const ms = mazoSession;
    if (!ms) return runFlow();

    // Fase 1: tarjetas
    if (ms.phase === 'review') {
      if (ms.index >= ms.words.length) {
        ms.phase = 'practice'; ms.index = 0;
        const pool = ms.words.map(w => w.ingles);
        const opciones = (w) => buildOptions(w.ingles, pool.length >= 4 ? pool : [w.ingles, 'yes', 'no', 'time']);
        // También aquí: los dos ejercicios por palabra, para que puedan dominarse.
        const r1 = ms.words.filter(w => w.imagen).map(w => ({ word: w, type: 'select_by_image', options: opciones(w) }));
        const r2 = ms.words.map(w => ({ word: w, type: 'write_by_audio', options: null }));
        // Intercalado aleatorio 👁️/👂 (los dos ejercicios de una palabra no van pegados)
        ms.queue = mezclarEjercicios([...r1, ...r2]);
        guardarMazoFlujo();
        showEncouragement(() => nextMazoStep());
        return;
      }
      const w = ms.words[ms.index];
      updateProgressBar((ms.index / (ms.words.length * 2)) * 100);
      appContainer.innerHTML = flashcardHTML(w, ms.index + 1, ms.words.length);
      bindFlashcard(w, async (res) => {
        await updateSRS(w.id, res, { type: 'flashcard' });
        ms.index++;
        guardarMazoFlujo();
        nextMazoStep();
      });
      return;
    }

    // Fase 2: ejercicios
    if (ms.index >= ms.queue.length) {
      const c = ms.correct, f = ms.wrong, total = ms.words.length;
      mazoSession = null;
      await limpiarMazoFlujo();
      const lbl = document.getElementById('nivel-label');
      if (lbl) lbl.textContent = flujo.currentNivel;
      playSound('complete'); triggerConfetti();
      showModal({
        icon: '🃏', title: '¡Mazo completado!',
        body: `<span class="text-green-600 font-bold">${c} aciertos</span> · <span class="text-slate-400">${f} fallos</span> de ${total} palabras.<br>Ya entraron a tu ciclo de memoria espaciada. 🧠`,
        dismissable: false,
        actions: [
          { label: 'Practicar de nuevo 🔁', onClick: async () => { closeModal(); const { words } = await cargarMazo(); startMazoPractice(words); } },
          { label: 'Volver a mis lecciones', style: 'bg-slate-100 text-slate-500', onClick: () => { closeModal(); runFlow(); } }
        ]
      });
      return;
    }

    const ex = ms.queue[ms.index];
    updateProgressBar(((ms.words.length + ms.index) / (ms.words.length + ms.queue.length)) * 100);
    const avanzar = async (ok, type) => {
      if (ok) ms.correct++; else ms.wrong++;
      await updateSRS(ex.word.id, ok ? 'practice_correct' : 'practice_wrong', { type });
      ms.index++;
      guardarMazoFlujo();
      setTimeout(() => nextMazoStep(), ok ? 1000 : 2000);
    };
    if (ex.type === 'select_by_image') renderSelectImage(ex.word, ex.options, (ok) => avanzar(ok, 'select_by_image'));
    else renderWriteAudio(ex.word, (ok) => avanzar(ok, 'write_by_audio'));
  }

  /* ============================================================
     14. PANTALLAS AUXILIARES
  ============================================================ */
  function renderMessage(icon, title, html, actionLabel, onAction) {
    appContainer.innerHTML = `
      <div class="card-3d p-10 text-center animate-pop mt-6">
        <div class="text-6xl mb-4">${icon}</div>
        <h1 class="text-2xl font-heading font-bold text-slate-800 mb-2">${title}</h1>
        <p class="text-slate-500 mb-6">${html}</p>
        ${actionLabel ? `<button id="msg-action" class="btn-juice bg-[#FF7A00] text-white font-bold py-3 px-8 rounded-xl text-lg">${actionLabel}</button>` : ''}
      </div>`;
    if (actionLabel && onAction) document.getElementById('msg-action').onclick = onAction;
  }

  /* ============================================================
     15. BARRA SUPERIOR (Pro + IA + Club + Perfil)
  ============================================================ */
  document.querySelectorAll('#top-bar button[data-tool]').forEach(btn => {
    btn.onclick = () => {
      const tool = btn.dataset.tool;
      if (tool === 'ia') openAbuChat();
      else showProModal(); // gramática / pronunciación / club / traductor
    };
  });
  document.getElementById('nivel-btn').onclick = openNivelSelector;
  //document.getElementById('mazo-btn').onclick = abrirMazoRapido;

  // Menú de perfil (dropdown)
  const profileBtn = document.getElementById('profile-menu-button');
  const profileDropdown = document.getElementById('profile-menu-dropdown');
  profileBtn.onclick = (e) => {
    e.stopPropagation();
    profileDropdown.classList.toggle('hidden');
    ocultarPistaPerfil();   // ya entendió que aquí se abre el menú
  };

  // Globo de ayuda del avatar: se muestra una sola vez, hasta que lo abra.
  function ocultarPistaPerfil(guardar = true) {
    const hint = document.getElementById('profile-hint');
    if (hint) hint.classList.add('hidden');
    const caret = document.getElementById('profile-caret');
    if (caret) caret.classList.remove('menu-hint');
    if (guardar && flujo) {
      if (!flujo.ui) flujo.ui = {};
      if (!flujo.ui.menuHintSeen) { flujo.ui.menuHintSeen = true; updateUserFlow(); }
    }
  }
  function mostrarPistaPerfil() {
    if (flujo?.ui?.menuHintSeen) { ocultarPistaPerfil(false); return; }
    const hint = document.getElementById('profile-hint');
    if (!hint) return;
    setTimeout(() => hint.classList.remove('hidden'), 900);
    setTimeout(() => hint.classList.add('hidden'), 11000);   // no molesta para siempre
  }
  document.addEventListener('click', (e) => {
    if (!profileDropdown.contains(e.target) && !profileBtn.contains(e.target)) profileDropdown.classList.add('hidden');
  });

  // Opciones del menú de perfil
  document.querySelectorAll('[data-menu]').forEach(btn => {
    btn.onclick = () => {
      profileDropdown.classList.add('hidden');
      const m = btn.dataset.menu;
      if (m === 'ranking-global') openRankingGlobal();
      else if (m === 'ranking-equipo') openRankingEquipo();
      else if (m === 'progreso-nivel') openProgresoNivel();
      else if (m === 'mazo') openMazo();
      else if (m === 'soporte') openSoporte();
    };
  });
  document.getElementById('logout-btn').onclick = async () => {
    await dbClient.auth.signOut();
    window.location.href = 'index.html';
  };

  // Rellena los datos del menú de perfil
  function fillProfileMenu() {
    const nombre = (userProfile.full_name || 'Mi Perfil');
    document.getElementById('user-name-dropdown').textContent = nombre;
    document.getElementById('user-email-dropdown').textContent = currentUser.email || '';
    document.getElementById('user-points').textContent = userProfile.points || 0;
    document.getElementById('user-lingots').textContent = userProfile.lingots || 0;
  }

  /* ============================================================
     16. ARRANQUE
  ============================================================ */
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const { data: { session } } = await dbClient.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      currentUser = session.user;

      let { data: profile } = await dbClient.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();

      // Auto-reparación: si el perfil no existe todavía, lo creamos con los datos del registro.
      if (!profile) {
        const meta = currentUser.user_metadata || {};
        const { data: creado, error: upErr } = await dbClient
          .from('profiles')
          .upsert({
            id: currentUser.id,
            full_name: meta.full_name || null,
            phone: meta.phone || null,
            english_group: meta.english_group || null,
            nivel: meta.nivel || 'A1',
            updated_at: new Date().toISOString()
          }, { onConflict: 'id' })
          .select().single();

        if (upErr || !creado) {
          console.error('No se pudo crear/leer el perfil:', upErr);
          renderMessage('⚠️', 'Perfil no encontrado',
            'No pudimos crear tu perfil automáticamente. Probablemente faltan las políticas RLS de la tabla <b>profiles</b>. Aplica el SQL de configuración y vuelve a intentar.');
          return;
        }
        profile = creado;
      }

      userProfile = profile;
      flujo = userProfile.flujo;

      // Restauración anti-pérdida: si el respaldo local es más reciente que la
      // nube (p. ej. la recarga interrumpió el guardado), se usa el local y se
      // vuelve a subir. Así lo ya estudiado NO reaparece desde el inicio.
      try {
        const local = JSON.parse(localStorage.getItem(`abulingo_flujo_${currentUser.id}`) || 'null');
        const tLocal = new Date(local?.savedAt || 0).getTime();
        const tNube = new Date(flujo?.savedAt || 0).getTime();
        if (local && local.version && tLocal > tNube) {
          console.warn('[flujo] respaldo local más reciente que la nube → restaurando avance local');
          flujo = local;
          userProfile.flujo = local;
          dbClient.from('profiles').update({ flujo: local }).eq('id', currentUser.id)
            .then(({ error }) => { if (error) console.error('No se pudo re-subir el respaldo:', error.message); });
        }
      } catch { /* respaldo corrupto: se ignora */ }

      document.getElementById('user-points-display').textContent = userProfile.points || 0;
      fillProfileMenu();

      await ensureFlujo();
      updateStreakUI();
      refreshMazoBadge();      // insignia del botón "M"
      mostrarPistaPerfil();    // "toca tu foto" la primera vez

      // Tutorial de bienvenida: solo la primera vez que entra el usuario.
      if (!flujo.ui?.tutorialSeen) {
        mostrarTutorial(() => runFlow());
      } else {
        await runFlow();
      }
    } catch (e) {
      console.error(e);
      renderMessage('😵', 'Algo salió mal', 'Ocurrió un error al cargar tu sesión. Recarga la página.');
    }
  });
</script>
