  <style>
    /* ============================================================
       RENDIMIENTO · dos reglas que valen mucho en páginas largas
       ------------------------------------------------------------
       content-visibility: auto le dice al navegador que NO calcule
       el diseño ni pinte lo que está fuera de la pantalla hasta que
       te acerques. En listas de cientos de palabras, frases o temas
       de gramática es la diferencia entre pintar todo de golpe o
       pintar solo lo visible. contain-intrinsic-size le da una
       altura estimada para que la barra de scroll no salte.
    ============================================================ */
    .lista-larga > * {
      content-visibility: auto;
      contain-intrinsic-size: auto 72px;
    }
    /* Evita el "salto" de las imágenes mientras cargan */
    img { max-width: 100%; height: auto; }
    /* Respeta a quien tiene activado "reducir movimiento" en su sistema:
       menos animaciones = menos trabajo de pintado en equipos lentos. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

  /* ============================================================

  const SUPABASE_URL = 'https://eylwewhqeaaqkgcxhgyv.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5bHdld2hxZWFhcWtnY3hoZ3l2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMzAxODgsImV4cCI6MjA5OTkwNjE4OH0.Ji8huj-ny2VcMT5UQSjOuwUKz4k23quNS0fLk-gZr7A';

  const DAILY_GOAL_POINTS = 60;                    // meta diaria (igual que en el flujo de palabras)
  const CEFR_ORDER = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
  const NIVELES_FIJOS = ['A1', 'A2', 'B1', 'B2'];

  // ⚠️ Reemplaza por el link real de tu grupo o canal de WhatsApp.
  const WHATSAPP_COMUNIDAD_URL = 'https://chat.whatsapp.com/TU_ENLACE_AQUI';

  const { createClient } = supabase;
  const dbClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let userProfile = null;

  // Guardia de sesión "en vivo": la comprobación de DOMContentLoaded solo protege

  /* ============================================================
     2. UTILIDADES
  ============================================================ */
  const escapeHTML = (s) => (s || '').toString()
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const todayStr = () => new Date().toISOString().slice(0, 10);
  function primerNombre(nombre, porDefecto = 'Anónimo') {
    const limpio = (nombre || '').toString().replace(/\s+/g, ' ').trim();
    return limpio ? limpio.split(' ')[0] : porDefecto;
  }
  // Comparación tolerante para los ejercicios de escribir: ignora mayúsculas,
  // tildes de apóstrofo (’ vs '), puntuación final y espacios de más.
  const normEsc = (s) => (s || '').toString().toLowerCase()
    .replace(/[’´`]/g, "'").replace(/[.,!?;:¡¿"]/g, '').replace(/\s+/g, ' ').trim();

  let toastTimer = null;
  function showToast(msg, ms = 2600) {
    let t = document.getElementById('app-toast');
    if (!t) { t = document.createElement('div'); t.id = 'app-toast'; t.className = 'toast'; document.body.appendChild(t); }
    t.innerHTML = msg;
    sfx('toast');
    requestAnimationFrame(() => t.classList.add('show'));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms);
  }

  function sortNiveles(arr) {
    return [...arr].sort((a, b) => {
      const ia = CEFR_ORDER.indexOf(a), ib = CEFR_ORDER.indexOf(b);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib) || String(a).localeCompare(String(b));
    });
  }

  function playSound(type) {
    const id = type === 'correct' ? 'snd-correct' : (type === 'wrong' ? 'snd-wrong' : 'snd-complete');
    const el = document.getElementById(id);
    if (el) { el.currentTime = 0; el.play().catch(() => {}); }
  }

  /* Sonidos de interacción sintetizados (sin archivos externos) */
  let audioCtx = null;
  function getAudioCtx() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      return audioCtx;
    } catch { return null; }
  }
  function tone(ctx, { freq = 600, freqEnd = null, dur = 0.06, type = 'sine', vol = 0.12, delay = 0 }) {
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, t0 + dur);
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function sfx(kind) {
    const ctx = getAudioCtx();
    if (!ctx) return;
    try {
      if (kind === 'click')      tone(ctx, { freq: 880, freqEnd: 660, dur: 0.05, type: 'triangle', vol: 0.08 });
      else if (kind === 'flip')  tone(ctx, { freq: 320, freqEnd: 620, dur: 0.10, type: 'sine', vol: 0.10 });
      else if (kind === 'pop')   tone(ctx, { freq: 500, freqEnd: 900, dur: 0.08, type: 'sine', vol: 0.10 });

  let ttsVoices = [];

  /* ============================================================
     4. PERSISTENCIA EN SUPABASE
     ------------------------------------------------------------

     (la misma que usa abulingo.html), bajo la llave flujo.gram.
     Cada cambio: 1) respaldo inmediato en localStorage (síncrono)
                  2) subida a Supabase con reintento
                  3) indicador visible "Guardado ✓" / "⚠️ sin guardar"
  ============================================================ */
  const flujoLSKey = () => `abulingo_flujo_${currentUser?.id || 'anon'}`;
  function guardarFlujoLocal() {
    if (!flujo || !currentUser) return;
    try { localStorage.setItem(flujoLSKey(), JSON.stringify(flujo)); } catch { /* almacenamiento lleno */ }
  }
  window.addEventListener('pagehide', guardarFlujoLocal);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') guardarFlujoLocal(); });

  async function updateUserFlow() {
    if (!flujo || !currentUser) return;
    flujo.savedAt = new Date().toISOString();
    userProfile.flujo = flujo;
    guardarFlujoLocal();
    for (let intento = 0; intento < 2; intento++) {
      const { error } = await dbClient.from('profiles').update({ flujo }).eq('id', currentUser.id);
      if (!error) return true;
      console.error(`Error guardando flujo (intento ${intento + 1}):`, error.message);
      if (intento === 0) await new Promise(r => setTimeout(r, 600));
    }
    // Solo se avisa cuando falla: si todo va bien, el guardado es invisible.
    showToast('⚠️ No se pudo guardar en la nube. Tu avance quedó en este dispositivo.', 3500);
    return false;
  }

  /* Estructura base del flujo, idéntica a la de abulingo.html.
     Importa: el usuario puede entrar por CUALQUIERA de las dos páginas, así que
     aquí se crea el flujo igual que allí (incluida la importación del avance de
     user_word_progress). Si no, entrar primero por gramática dejaría el flujo a
     medias y abulingo.html no podría recuperar el progreso de las palabras. */
  async function ensureFlujoBase() {
    if (!flujo || !flujo.version || flujo.version < 2 || flujo.flowState) {
      const previo = flujo || {};
      flujo = {
        version: 3,
        currentNivel: previo.currentNivel || userProfile.nivel || 'A1',
        niveles: previo.niveles || {},
        srs: previo.srs || {},
        stats: previo.stats || { totalCorrect: 0, totalWrong: 0, sessionsCompleted: 0 },
        daily: previo.daily || { date: todayStr(), newWords: 0, reviewed: 0, points: 0, goalShown: false, unlockAt: null },
        racha: previo.racha || { days: 0, last: null, best: 0 }
      };
      if (previo.ui) flujo.ui = previo.ui;
      if (previo.gram) flujo.gram = previo.gram;
      const { data: prev } = await dbClient.from('user_word_progress').select('*').eq('user_id', currentUser.id);
      (prev || []).forEach(p => {
        const k = String(p.word_id);
        if (flujo.srs[k]) return;
        flujo.srs[k] = {
          level: p.srs_level || 0, ease: parseFloat(p.ease_factor) || 2.5,
          reps: p.srs_level || 0, lapses: 0, due: p.next_review_at || new Date().toISOString(),
          learned: false, first: {}, easyFirst: false, difficult: false, okStreak: 0
        };
      });
    }
    if (!flujo.currentNivel) flujo.currentNivel = userProfile.nivel || 'A1';
    if (!flujo.srs) flujo.srs = {};
    if (!flujo.niveles) flujo.niveles = {};
    if (!flujo.stats) flujo.stats = { totalCorrect: 0, totalWrong: 0, sessionsCompleted: 0 };
    ensureDaily();
  }

  function ensureDaily() {
    if (!flujo.daily) flujo.daily = { date: todayStr(), newWords: 0, reviewed: 0, points: 0, goalShown: false, unlockAt: null };
    if (flujo.daily.date !== todayStr()) {
      flujo.daily.date = todayStr();
      flujo.daily.points = 0;
      flujo.daily.reviewed = 0;
      flujo.daily.goalShown = false;
      flujo.daily.club = { msgs: 0, joins: 0 };
    }
    if (!flujo.racha) flujo.racha = { days: 0, last: null, best: 0 };
  }

  // Racha de días: se enciende con la primera actividad del día (también desde gramática).
  function touchStreak() {
    ensureDaily();
    const hoy = todayStr();
    if (flujo.racha.last === hoy) return;
    const ayer = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    flujo.racha.days = (flujo.racha.last === ayer) ? (flujo.racha.days || 0) + 1 : 1;
    flujo.racha.last = hoy;
    flujo.racha.best = Math.max(flujo.racha.best || 0, flujo.racha.days);
    updateStreakUI();
    if (flujo.racha.days > 1) showToast(`🔥 ¡Racha de ${flujo.racha.days} días! No la rompas.`);

  /* ------------------------------------------------------------
     ESTADO DE GRAMÁTICA (flujo.gram) — separado por NIVEL
       flujo.gram = {
         v: 3,
         cfg: { quizLen, autoEs },
         niveles: { A1: { topics: { '3.3': {stars,best,tries,seen,fav} }, errores: [] } }
       }
     Migraciones automáticas:
       v1 → v2: antes no se separaba por nivel (todo era A1).
       v2 → v3: los temas repetidos entre niveles se fusionaron en uno solo
                (ver GRAM_FUSIONAR); el avance del tema eliminado se pasa al
                tema base para que nadie pierda estrellas.
  ------------------------------------------------------------ */
  const GRAM_ORDEN = ['A1', 'A2', 'B1', 'B2'];
  const gramRank = (n) => { const i = GRAM_ORDEN.indexOf(n); return i < 0 ? 0 : i; };
  // Se rellena en gramFusionarNiveles(): { 'A2-21': { n: 'A1', id: '3.3' }, … }
  const GRAM_FUSION_DESTINO = {};

  function ensureGram() {
    if (!flujo.gram) flujo.gram = { v: 3, cfg: { quizLen: 15, autoEs: false }, niveles: {} };
    const g = flujo.gram;
    if (!g.cfg) g.cfg = { quizLen: 15, autoEs: false };
    // Las prácticas ahora son de 5, 10 o 15: los valores viejos (7) suben a 15.
    if (![5, 10, 15].includes(g.cfg.quizLen)) g.cfg.quizLen = 15;
    if (g.cfg.autoEs === undefined) g.cfg.autoEs = false;
    if (!g.niveles) g.niveles = {};
    // v1 → v2: lo que se estudió antes era todo A1
    if (!g.v || g.v < 2) {
      if (g.topics || g.errores) {
        g.niveles.A1 = { topics: g.topics || {}, errores: g.errores || [] };
        delete g.topics; delete g.errores;
      }
      g.v = 2;
    }
    // v2 → v3: rescatar el avance de los temas que ya no existen por sí solos
    if (g.v < 3) { gramMigrarFusion(g); g.v = 3; }
    /* Publica cuántos temas tiene cada nivel DESPUÉS de la fusión. Es el
       único sitio de la app que conoce ese número, y pronunciacion.html lo
       necesita para calcular el % de gramática dominada en su pantalla de
       Progreso. Se guarda en el mismo JSON del perfil (flujo.gram.totales). */
    const totales = g.totales || {};
    GRAM_ORDEN.forEach(n => {
      const cuantos = (GRAM_NIVELES[n]?.temas || []).length;
      // Si un nivel no llegó a cargar, se conserva el valor anterior (o el
      // aproximado) en vez de escribir un 0 que arruinaría el porcentaje.
      totales[n] = cuantos > 0 ? cuantos : (totales[n] || GRAM_TOTALES_APROX[n] || 0);
    });
    g.totales = totales;
    return gramProg(gramNivel());
  }

  /* Traslada estrellas, récords y favoritos de un tema fusionado a su tema base. */
  function gramMigrarFusion(g) {
    const dest = Object.entries(GRAM_FUSION_DESTINO);
    if (!dest.length) return;
    dest.forEach(([viejo, d]) => {
      GRAM_ORDEN.forEach(n => {
        const b = g.niveles?.[n];
        const src = b?.topics?.[viejo];
        if (!src) return;
        const dst = (g.niveles[d.n] = g.niveles[d.n] || { topics: {}, errores: [] });
        if (!dst.topics) dst.topics = {};
        const cur = dst.topics[d.id] || {};
        dst.topics[d.id] = {
          stars: Math.max(cur.stars || 0, src.stars || 0),
          best:  Math.max(cur.best  || 0, src.best  || 0),
          tries: (cur.tries || 0) + (src.tries || 0),
          seen:  !!(cur.seen || src.seen),
          fav:   !!(cur.fav  || src.fav)
        };
        delete b.topics[viejo];
      });
    });
    // Los errores guardados apuntan a un tema + índice: los de temas fusionados ya no encajan.
    GRAM_ORDEN.forEach(n => {
      const b = g.niveles?.[n];
      if (b?.errores) b.errores = b.errores.filter(d => !GRAM_FUSION_DESTINO[d.t]);
    });
  }

  // Nivel activo: el mismo que usa el flujo de palabras, para que ambas partes vayan sincronizadas.
  function gramNivel() { return flujo?.currentNivel || userProfile?.nivel || 'A1'; }

  /* Bolsa de progreso de un nivel concreto (no siempre es el nivel activo:
     una lección fusionada vive en el nivel donde se aprende por primera vez). */
  function gramProg(lvl) {
    const g = flujo.gram;
    const n = lvl || gramNivel();
    if (!g.niveles[n]) g.niveles[n] = { topics: {}, errores: [] };
    if (!g.niveles[n].topics) g.niveles[n].topics = {};
    if (!g.niveles[n].errores) g.niveles[n].errores = [];
    return g.niveles[n];
  }

  function gramT(id) {
    ensureGram();
    const N = gramProg(gramNivelDeTema(id));
    if (!N.topics[id]) N.topics[id] = { stars: 0, best: 0, tries: 0, seen: false, fav: false };
    return N.topics[id];
  }

  /* ---------- Micrófono del tutor (inicio/parada manual) ----------
     Escucha en ESPAÑOL: aquí el estudiante pregunta su duda, no
     practica inglés. Con 'en-US' el navegador devolvía basura fonética. */

  /* ------------------------------------------------------------
     RECONOCIMIENTO DE VOZ EN CELULAR — dos problemas reales

     1) DUPLICADOS ("me repite palabras"). En Chrome de Android,
        e.resultIndex no siempre avanza: llega en 0 una y otra vez,
        así que ir ACUMULANDO desde resultIndex vuelve a pegar
        finales ya pegados. Solución: en cada evento se REARMA el
        texto leyendo TODOS los resultados de la sesión, en vez de
        ir sumando. Lo dicho en sesiones anteriores (cuando el
        navegador corta solo por silencio) se guarda aparte.

     2) El micrófono es EXCLUSIVO en el celular: si MediaRecorder
        ya tomó el stream, el reconocimiento de voz falla con
        'audio-capture'. En el PC sí se pueden compartir, por eso
        allá funcionaba y aquí no.
  ------------------------------------------------------------ */
  const esMovilVoz = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  // Red de seguridad: si aun así se cuela un bloque repetido
  // ("how are you how are you"), se colapsa. Solo bloques de 2+
  // palabras o una misma palabra 3+ veces seguidas, para no dañar
  // repeticiones legítimas como "very very good" o "bye bye".
  function limpiarRepeticionesVoz(texto) {
    let p = (texto || '').trim().split(/\s+/).filter(Boolean);
    if (p.length < 2) return (texto || '').trim();

    // Bloques repetidos al final: "a b c a b c" → "a b c"
    let cambio = true;
    while (cambio) {
      cambio = false;
      for (let n = Math.floor(p.length / 2); n >= 2; n--) {
        const fin = p.slice(-n).join(' ').toLowerCase();
        const antes = p.slice(-2 * n, -n).join(' ').toLowerCase();
        if (fin && fin === antes) { p = p.slice(0, -n); cambio = true; break; }
      }
    }
    // Una misma palabra repetida 3+ veces seguidas se recorta a dos:
    // así "hello hello hello" se arregla pero "bye bye" queda intacto.
    const salida = [];
    for (const w of p) {
      const n = salida.length;
      if (n >= 2 && salida[n - 1].toLowerCase() === w.toLowerCase()
                 && salida[n - 2].toLowerCase() === w.toLowerCase()) continue;
      salida.push(w);
    }
    return salida.join(' ');
  }

  let tutorRecActivo = null;

  function tutorIniciarVoz({ onFinal, onError }) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { onError && onError('no-soportado'); return null; }
    if (tutorRecActivo) { try { tutorRecActivo.abort(); } catch {} tutorRecActivo = null; }

    const rec = new SR();
    rec.lang = 'es-MX';
    rec.continuous = !esMovilVoz;   // Android lo ignora y duplica
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    let previo = '', sesion = '', detenidoManual = false, cerrado = false;
    const textoTotal = () => limpiarRepeticionesVoz((previo + ' ' + sesion).trim());
    const t0 = Date.now(), MAX_MS = 120000;
    const cerrar = (fn, arg) => {
      if (cerrado) return;
      cerrado = true;
      if (tutorRecActivo === rec) tutorRecActivo = null;
      fn && fn(arg);
    };

    rec.onresult = (e) => {
      // Se rearma entero: acumular desde resultIndex duplica en Android.
      let texto = '';
      for (let i = 0; i < e.results.length; i++) texto += e.results[i][0].transcript + ' ';
      sesion = texto.trim();
    };
    rec.onerror = (e) => {
      const err = e.error || 'error';
      if (err === 'no-speech' || err === 'aborted') return;   // que decida onend
      if (err === 'not-allowed' || err === 'service-not-allowed') cerrar(onError, 'sin-permiso');
      else if (!detenidoManual) cerrar(onError, err);
    };
    rec.onend = () => {
      if (cerrado) return;
      if (sesion) { previo = (previo + ' ' + sesion).trim(); sesion = ''; }
      if (detenidoManual) { cerrar(onFinal, textoTotal()); return; }
      // Chrome corta solo tras un silencio aunque continuous sea true: se
      // reanuda para que el botón no quede trabado ni se corte la frase.
      if (Date.now() - t0 < MAX_MS) { try { rec.start(); return; } catch {} }
      cerrar(onFinal, textoTotal());
    };
    rec.detener = () => {
      detenidoManual = true;
      try { rec.stop(); } catch { cerrar(onFinal, textoTotal()); }
    };
    try { rec.start(); } catch { cerrar(onError, 'no-inicio'); return null; }
    tutorRecActivo = rec;
    return rec;
  }

  function tutorBindMic(btn, msg) {
    if (!btn) return;
    let grabacion = null, watchdog = null;
    const WATCHDOG_MS = 6000;
    const decir = (t) => { if (msg) msg.textContent = t; };
    const limpiar = () => { if (watchdog) { clearTimeout(watchdog); watchdog = null; } };
    const reset = () => { btn.classList.remove('escuchando'); btn.innerHTML = '<i class="fas fa-microphone"></i>'; };
    const fallo = (err) => {
      if (err === 'no-soportado') decir('Tu navegador no reconoce voz — escribe tu duda 😉');
      else if (err === 'sin-permiso') decir('Bloqueaste el micrófono 🔒 — actívalo en el candado de la barra de direcciones');
      else if (err === 'no-inicio') decir('El micrófono está ocupado — intenta otra vez');
      else decir('No te escuché, intenta de nuevo');
    };
    btn.onclick = () => {
      if (btn.disabled) return;
      if (grabacion) {
        decir('Enviando...');
        const g = grabacion;
        limpiar();
        // El watchdog se arma ANTES de detener: si onend llega instantáneo,
        // ya hay quien lo cancele (si no, el botón quedaba trabado).
        watchdog = setTimeout(() => {
          if (grabacion !== g) return;
          grabacion = null; reset();
          try { g.abort(); } catch {}
          fallo('atascado');
        }, WATCHDOG_MS);
        g.detener();
        return;
      }
      grabacion = tutorIniciarVoz({
        onFinal: (texto) => {
          limpiar(); grabacion = null; reset();
          if (texto) { decir(''); tutorAbuEnviar(texto); }
          else decir('No escuché nada, intenta de nuevo 🎙️');
        },
        onError: (err) => { limpiar(); grabacion = null; reset(); fallo(err); }
      });
      if (grabacion) {
        btn.classList.add('escuchando');
        btn.innerHTML = '<i class="fas fa-stop"></i>';
        decir('Escuchando… toca de nuevo para enviar');
      }
    };
  }

        return { en: `By ${y}, ${s[0]} will have ${v[0]}.`, es: `Para ${B2_YEARS_ES[y]}, ${s[1]} habrá ${v[1]}.` };
      },
    "B2-2.1": () => {
        const d = gPick(B2_DEDUC);
        return { en: `${d[0]}, so ${d[1]}.`, es: `${d[2]}, así que ${d[3]}.` };
      },
    "B2-2.2": () => {
        const a = gPick(B2_ACTS);
        return { en: `You should have ${a[0]}.`, es: `Deberías haber ${a[1]}.` };
      },
  };

  /* ============================================================
     6-ter. CONTENIDO DE GRAMÁTICA — ahora vive en Supabase
     ------------------------------------------------------------
     Los cuatro temarios (A1, A2, B1 y B2) ya NO están incrustados en
     este archivo. Antes sumaban unos 880 KB de JavaScript que el
     navegador tenía que descargar y PARSEAR en cada visita, aunque
     solo fueras a estudiar un tema. Ahora son cuatro JSON guardados
     en Supabase Storage (bucket privado "contenido") y se descargan
     después de pintar la página.

     · Acceso: el bucket es privado y su política solo deja leer a
       usuarios con plan plus, pro o super_pro (o staff). Se pide una
       URL firmada con createSignedUrl, que caduca.
     · Caché: lo descargado se guarda en Cache Storage, así que a
       partir de la segunda visita no hay ni una petición de red.
       Para publicar contenido nuevo, sube el archivo y sube el número
       de GRAM_CONTENIDO_VERSION: eso invalida la caché de todos.
     · Se descargan LOS CUATRO niveles, no solo el tuyo, porque la
       fusión de temas duplicados cruza niveles (un tema de B1 se
       funde dentro de su base de A1) y necesita verlos todos.

     Las funciones `gen` de cada tema —las que generan ejercicios
     infinitos— no caben en un JSON, así que viven aquí abajo en
     GRAM_GEN y se vuelven a enganchar por id al cargar.
  ============================================================ */
  const GRAM_BUCKET = 'contenido';
  const GRAM_RUTA = (n) => `gramatica/${n}.json`;
  const GRAM_CONTENIDO_VERSION = 'v1';   // ⬅️ súbelo al publicar contenido nuevo
  const GRAM_CACHE = 'abu-gramatica';

  let gramContenidoListo = false;

  /* Cuántos temas tiene cada nivel DESPUÉS de la fusión. Se usa para el
     porcentaje de "Progreso nivel" mientras el contenido aún no ha llegado;
     en cuanto carga, gramCargarContenido() escribe los valores reales. */
  const GRAM_TOTALES_APROX = { A1: 50, A2: 24, B1: 53, B2: 75 };

  async function gramLeerNivel(nivel) {
    const clave = `/${GRAM_CACHE}/${nivel}-${GRAM_CONTENIDO_VERSION}.json`;

    // 1) ¿Ya lo tenemos guardado de una visita anterior?
    try {
      const cache = await caches.open(GRAM_CACHE);
      const guardado = await cache.match(clave);
      if (guardado) return await guardado.json();
    } catch { /* el navegador puede no tener Cache Storage: seguimos */ }

    // 2) URL firmada (el bucket es privado; la política comprueba el plan)
    const { data, error } = await dbClient.storage
      .from(GRAM_BUCKET)
      .createSignedUrl(GRAM_RUTA(nivel), 3600);
    if (error || !data?.signedUrl) {
      console.error(`[gramática] no se pudo firmar ${nivel}:`, error?.message);
      throw new Error(error?.message || 'sin_acceso');
    }

    const resp = await fetch(data.signedUrl);
    if (!resp.ok) throw new Error(`HTTP ${resp.status} al bajar ${nivel}`);

    // 3) Guardar para la próxima visita y devolver
    try {
      const cache = await caches.open(GRAM_CACHE);
      await cache.put(clave, resp.clone());
      // Limpieza: se borran las versiones viejas del mismo nivel
      const viejas = await cache.keys();
      await Promise.all(viejas
        .filter(r => r.url.includes(`/${nivel}-`) && !r.url.endsWith(`${nivel}-${GRAM_CONTENIDO_VERSION}.json`))
        .map(r => cache.delete(r)));
    } catch { /* sin caché no pasa nada, solo se vuelve a bajar */ }

    return await resp.json();
  }

  async function gramCargarContenido() {
    if (gramContenidoListo) return true;

    const resultados = await Promise.allSettled(GRAM_ORDEN.map(gramLeerNivel));
    const fallidos = [];

    GRAM_ORDEN.forEach((n, i) => {
      const r = resultados[i];
      if (r.status !== 'fulfilled' || !Array.isArray(r.value)) { fallidos.push(n); return; }
      const temas = r.value;

      // Reenganchar los generadores de ejercicios por id de tema
      temas.forEach(t => { const g = GRAM_GEN[t.id]; if (g) t.gen = g; });

      GRAM_NIVELES[n].temas = temas;
      const byId = GRAM_NIVELES[n].byId;
      Object.keys(byId).forEach(k => delete byId[k]);
      temas.forEach(t => byId[t.id] = t);
    });

    if (fallidos.length === GRAM_ORDEN.length) return false;
    if (fallidos.length) console.warn('[gramática] niveles que no cargaron:', fallidos.join(', '));

    // Post-procesado que antes corría suelto al abrir la página
    try { gramPostA1(); } catch (e) { console.warn('[gramática] postA1', e); }
    try { gramPostA2(); } catch (e) { console.warn('[gramática] postA2', e); }
    try { gramPostB1(); } catch (e) { console.warn('[gramática] postB1', e); }

    // La fusión cruza niveles: por eso va aquí, con los cuatro ya cargados
    gramFusionarNiveles();

    // Totales reales para el "Progreso nivel" de las tres páginas
    if (flujo?.gram) {
      const totales = {};
      GRAM_ORDEN.forEach(n => { totales[n] = (GRAM_NIVELES[n]?.temas || []).length; });
      flujo.gram.totales = totales;
    }

    gramContenidoListo = true;
    return true;
  }

  /* ============================================================
     6-bis. FUSIÓN DE TEMAS REPETIDOS ENTRE NIVELES
     ------------------------------------------------------------
     Problema: el mismo punto gramatical (present simple, artículos,
     comparativos, preguntas…) se volvía a enseñar entero en A2, en B1
     y a veces en B2, cambiando solo unos matices. Estudiar tres veces
     lo mismo cansa y no enseña nada nuevo.

     Solución: esos temas duplicados SE ELIMINAN del nivel superior y su
     contenido pasa a ser una AMPLIACIÓN dentro del tema base (el del
     nivel donde el punto se aprende por primera vez). Así cada punto
     gramatical se estudia UNA sola vez y se profundiza siempre en el
     mismo sitio, con su estructura, sus ejemplos, sus errores y sus
     ejercicios acumulados por nivel.

     Qué se fusiona y qué NO:
       · SE FUSIONA lo que enseña LA MISMA estructura otra vez
         (present simple, present continuous, past simple, artículos,
          plurales, comparativos, preguntas, preposiciones…).
       · NO SE FUSIONA lo que añade una estructura NUEVA aunque sea
         pariente (present perfect, past continuous, be able to,
          ought to, segundo y tercer condicional, pasiva con modales,
          relativas reducidas…): ahí la repetición sí tiene sentido
         porque es progresión real de dificultad.
  ============================================================ */
  const GRAM_FUSIONAR = new Set([
    /* ── A2 que repetía A1 ── */
    'A2-01', // Contables e incontables      → A1 1.2
    'A2-02', // El plural                    → A1 1.1
    'A2-03', // Los artículos                → A1 1.3
    'A2-04', // Demostrativos                → A1 1.4
    'A2-05', // Cuantificadores              → A1 1.6
    'A2-06', // El posesivo                  → A1 1.5
    'A2-07', // Pronombres sujeto y objeto   → A1 2.1
    'A2-08', // Posesivos                    → A1 2.3
    'A2-11', // There is / there are         → A1 1.7
    'A2-12', // Adjetivos: posición y orden  → A1 4.1
    'A2-13', // Comparativos                 → A1 4.3
    'A2-18', // Adverbios de frecuencia      → A1 3.4
    'A2-19', // El verbo be                  → A1 3.1
    'A2-20', // Have / have got              → A1 3.2
    'A2-21', // Presente simple              → A1 3.3
    'A2-22', // Presente continuo            → A1 3.5
    'A2-23', // Simple o continuo            → A1 3.6
    'A2-24', // Pasado simple                → A1 3.11
    'A2-30', // Can / can't / could          → A1 3.7
    'A2-34', // Would like, ofrecer, sugerir → A1 3.9
    'A2-35', // Orden de la oración          → A1 0.4
    'A2-36', // Preguntas de sí o no         → A1 6.1
    'A2-37', // Preguntas abiertas           → A1 6.2
    'A2-41', // Conectores                   → A1 6.3
    'A2-47', // Preposiciones de tiempo      → A1 5.2
    'A2-48', // Preposiciones de lugar       → A1 5.1
    'A2-49', // Movimiento + verbos          → A1 5.3

    /* ── B1 que repetía A1 o A2 ── */
    'B1-1.1',  // Presente simple            → A1 3.3
    'B1-1.2',  // Presente continuo          → A1 3.5
    'B1-1.3',  // Simple o continuo          → A1 3.6
    'B1-1.4',  // Pasado simple              → A1 3.11
    'B1-1.5',  // Pasado continuo            → A2-25
    'B1-1.7',  // used to / would            → A2-28
    'B1-1.8',  // Present perfect            → A2-26
    'B1-1.9',  // Perfecto o pasado simple   → A2-27
    'B1-3.1',  // Condicional cero           → A2-43
    'B1-3.2',  // Primer condicional         → A2-43
    'B1-4.1',  // Pasiva: forma y uso        → A2-45
    'B1-6.1',  // Relativas especificativas  → A2-44
    'B1-7.1',  // Contables e incontables    → A1 1.2
    'B1-7.2',  // Los artículos              → A1 1.3
    'B1-8.2',  // Reflexivos                 → A2-09
    'B1-8.3',  // Pronombres indefinidos     → A2-10
    'B1-8.4',  // there o it                 → A1 1.7
    'B1-9.1',  // Posición del adjetivo      → A1 4.1
    'B1-9.3',  // Comparativos               → A1 4.3
    'B1-9.4',  // Superlativos               → A2-14
    'B1-9.5',  // as … as                    → A2-15
    'B1-9.8',  // Frecuencia y orden         → A1 3.4
    'B1-10.1', // Verbos con gerundio        → A2-39
    'B1-10.2', // Verbos con infinitivo      → A2-39
    'B1-11.1', // Preguntas básicas          → A1 6.1
    'B1-11.2', // Preguntas de sujeto        → A1 6.2
    'B1-11.3', // Coletillas                 → A2-46
    'B1-12.1', // Preposiciones de tiempo    → A1 5.2
    'B1-14.1', // Conectores básicos         → A1 6.3
    'B1-14.3', // Tiempo con valor de futuro → A2-42
    'B1-15.1', // Gramática americana        → A2-50

    /* ── B2 que repetía B1 ── */
    'B2-2.2',  // Modales en pasado          → B1 2.7
    'B2-4.3',  // Causativo have / get       → B1 4.4
    'B2-5.3',  // Preguntas y órdenes ind.   → B1 5.3
    'B2-6.1',  // Relativas: refinamientos   → A2-44 (vía B1 6.1)
    'B2-9.5',  // Preposiciones obligatorias → B1 12.4
    'B2-14.1'  // Gramática americana B2     → A2-50 (vía B1 15.1)
  ]);

  /* Ejecuta la fusión una sola vez, al cargar la página. */
  function gramFusionarNiveles() {
    const nivelDe = {}, todos = {};
    GRAM_ORDEN.forEach(n => (GRAM_NIVELES[n]?.temas || []).forEach(t => { nivelDe[t.id] = n; todos[t.id] = t; }));
    GRAM_ORDEN.forEach(n => { if (GRAM_NIVELES[n]) GRAM_NIVELES[n].amplia = []; });

    /* Tema base de un duplicado: el que indica su `prev`. Como se procesa de
       abajo arriba, si ese `prev` también se fusionó ya sabemos dónde acabó. */
    const raiz = (id) => {
      const t = todos[id];
      if (!t?.prev) return null;
      return GRAM_FUSION_DESTINO[t.prev.id] || { n: t.prev.n, id: t.prev.id };
    };

    // De abajo arriba: primero A2 sobre A1, luego B1, luego B2.
    const pendientes = [...GRAM_FUSIONAR].sort((a, b) => gramRank(nivelDe[a]) - gramRank(nivelDe[b]));

    pendientes.forEach(id => {
      const n = nivelDe[id];
      const t = GRAM_NIVELES[n]?.byId?.[id];
      if (!t) return;
      const r = raiz(id);
      const base = r && GRAM_NIVELES[r.n]?.byId?.[r.id];
      if (!base) { console.warn('[gramática] sin tema base para', id); return; }

      const rank = gramRank(n);
      base.amp   = base.amp   || [];
      base.marks = base.marks || { errs: [] };   // dónde empieza lo de cada nivel
      base.lvl   = base.lvl   || r.n;

      const amp = {
        n, id, rank, icon: t.icon, en: t.en, es: t.es, tag: t.tag,
        nuevo: t.prev?.nuevo || '', form: t.form, tip: t.tip, ex: t.ex || []
      };

      // Errores: se acumulan en el tema base (el índice guardado en "mis errores"
      // sigue siendo válido) pero se recuerda el tramo para pintarlos aparte.
      base.errs = base.errs || [];
      const e0 = base.errs.length;
      (t.errs || []).forEach(e => base.errs.push(e));
      if (base.errs.length > e0) base.marks.errs.push({ r: rank, i: e0 });
      amp.errRange = [e0, base.errs.length];

      // Preguntas escritas a mano.
      base.quiz = base.quiz || [];
      (t.quiz || []).forEach(q => base.quiz.push(q));

      // Frases: alimentan los ejercicios de ordenar, escribir y elegir palabra.
      base.extra = base.extra || [];
      (t.ex || []).forEach(e => base.extra.push([e.en, e.es]));
      (t.extra || []).forEach(x => base.extra.push(x));

      // Generadores automáticos de frases.
      if (!base.gens) base.gens = base.gen ? [{ r: gramRank(base.lvl), fn: base.gen }] : [];
      if (t.gen && !base.gens.some(g => g.fn === t.gen)) base.gens.push({ r: rank, fn: t.gen });

      base.amp.push(amp);

      // Fuera del temario de su nivel.
      const arr = GRAM_NIVELES[n].temas;
      const ix = arr.indexOf(t);
      if (ix >= 0) arr.splice(ix, 1);
      delete GRAM_NIVELES[n].byId[id];
      GRAM_FUSION_DESTINO[id] = { n: r.n, id: r.id };
      GRAM_NIVELES[n].amplia.push({ n, baseN: r.n, baseId: r.id, base, amp });
    });

    // Los temas que sobreviven y apuntaban a un tema fusionado ahora apuntan al base.
    GRAM_ORDEN.forEach(n => (GRAM_NIVELES[n]?.temas || []).forEach(t => {
      const d = t.prev && GRAM_FUSION_DESTINO[t.prev.id];
      if (d) t.prev = { ...t.prev, n: d.n, id: d.id };
    }));

    // Los "can-do" que citaban un tema fusionado pasan a citarlo con su nivel: "A1:3.3".
    GRAM_ORDEN.forEach(n => {
      const L = GRAM_NIVELES[n];
      if (!L?.canDo) return;
      L.canDo = L.canDo.map(c => {
        const ids = c[2].map(id => {
          const d = GRAM_FUSION_DESTINO[id];
          return d ? `${d.n}:${d.id}` : id;
        });
        return [c[0], c[1], [...new Set(ids)]];
      });
    });

    // Orden estable de las ampliaciones dentro de cada tema base.
    GRAM_ORDEN.forEach(n => (GRAM_NIVELES[n]?.temas || []).forEach(t => {
      if (t.amp) t.amp.sort((a, b) => a.rank - b.rank);
    }));
  }
  // gramFusionarNiveles() se llama desde gramCargarContenido(), cuando los
  // cuatro temarios ya están descargados (la fusión cruza niveles).

  const gramTemario = () => GRAM_NIVELES[gramNivel()] || null;
  const gramTemas   = () => gramTemario()?.temas || [];
  // Los temas fusionados viven en el nivel donde se aprenden, así que se busca
  // primero en el nivel activo y después en todos (por eso el fallback).
  function gramById(id) {
    const t = gramTemario()?.byId?.[id];
    if (t) return t;
    for (const n of GRAM_ORDEN) { const x = GRAM_NIVELES[n]?.byId?.[id]; if (x) return x; }
    return null;
  }
  function gramNivelDeTema(id) {
    for (const n of GRAM_ORDEN) if (GRAM_NIVELES[n]?.byId?.[id]) return n;
    return gramNivel();
  }

  /* ============================================================
     7. PANTALLA PRINCIPAL (temario del nivel)
  ============================================================ */
  function gramStarsTotal() {
    const N = ensureGram();
    return gramTemas().reduce((s, t) => s + (N.topics[t.id]?.stars || 0), 0);
  }

    appContainer.innerHTML = `

            </div>

              <p class="font-black text-slate-700 leading-none">${stars}<span class="text-slate-300">/${total * 3}</span></p>

            </div>
            <div class="flex-1 bg-slate-50 rounded-xl py-2">
              <p class="font-black text-slate-700 leading-none">${dominados}<span class="text-slate-300">/${total}</span></p>

            </div>
          </div>
          <div class="grid grid-cols-2 gap-2 mt-4">
            ${next
              ? `<button id="gram-next" class="btn-juice bg-[#FF7A00] text-white font-bold py-3 rounded-xl">${N.topics[next.id]?.seen ? 'Continuar' : 'Empezar'} ${next.icon}</button>`
              : `<button id="gram-next" class="btn-juice bg-green-500 text-white font-bold py-3 rounded-xl">¡Nivel completo! 🏆</button>`}

          ${nErr ? `<button id="gram-errs" class="w-full mt-2 btn-juice bg-amber-400 text-white font-bold py-2.5 rounded-xl text-sm">✏️ Repasar mis errores (${nErr})</button>` : ''}
        </div>

        ${favs.length ? `<div class="card-3d p-3 mb-4"><p class="px-2 pt-1 pb-2 text-[11px] font-black text-pink-400 uppercase">❤️ Mis favoritos</p>${favs.map(fila).join('')}</div>` : ''}

        ${temario.partes.map(P => {
          const ts = temas.filter(t => t.p === P.n);
          if (!ts.length) return '';
          const d = ts.filter(t => (N.topics[t.id]?.stars || 0) > 0).length;
          return `<div class="card-3d p-3 mb-4">
            <p class="px-2 pt-1 pb-2 text-[11px] font-black text-slate-400 uppercase">${P.icon} Parte ${P.n} · ${P.t} <span class="float-right ${d === ts.length ? 'text-green-500' : ''}">${d}/${ts.length}</span></p>
            ${ts.map(fila).join('')}
          </div>`;
        }).join('')}

        ${amplia.length ? `<div class="card-3d p-3 mb-4">
          <button id="gram-amp-h" class="w-full flex items-center gap-2 px-2 py-1 text-left">
            <span class="flex-1 text-[11px] font-black text-indigo-400 uppercase">🔁 Lo que ${nivel} añade a temas ya estudiados (${amplia.length})</span>
            <i id="gram-amp-i" class="fas fa-chevron-down text-indigo-300 text-xs"></i>
          </button>
          <div id="gram-amp-b" class="hidden">
            <p class="px-2 pt-1 pb-2 text-[11px] text-slate-400 leading-snug">Estos puntos ya <b>no son temas aparte</b>: no se vuelve a estudiar lo mismo. Viven dentro de su lección original, que ahora incluye lo que ${nivel} añade. Toca uno para ir directo a esa ampliación.</p>
            ${amplia.map((a, i) => `<button data-gamp="${i}" class="ga-row w-full flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-indigo-50 text-left transition">
              <span class="text-xl w-7 text-center shrink-0">${a.amp.icon}</span>
              <span class="flex-1 min-w-0">
                <span class="block text-[13px] font-bold text-slate-700 truncate">${a.amp.es}</span>
                <span class="block text-[11px] text-slate-400 truncate">en <b>${a.baseN} · ${a.base.es}</b></span>
              </span>
              <i class="fas fa-arrow-right text-indigo-300 text-xs shrink-0"></i>
            </button>`).join('')}
          </div>
        </div>` : ''}

        ${temario.canDo ? `<div class="card-3d p-4 mb-6">
          <p class="text-[11px] font-black text-slate-400 uppercase mb-2">🎓 Al terminar ${nivel} sabrás…</p>
          ${temario.canDo.map(c => {
            // Un can-do puede citar un tema de otro nivel ("A1:3.3") si se fusionó allí.
            const listo = c[2].every(id => {
              const [lv, tid] = id.includes(':') ? id.split(':') : [nivel, id];
              return (gramProg(lv).topics[tid]?.stars || 0) > 0;
            });
            return `<div class="flex items-center gap-2 py-1">
              <span class="w-5 text-center">${listo ? '✅' : '⬜'}</span>
              <span class="text-xl">${c[0]}</span>
              <span class="flex-1 text-[13px] ${listo ? 'text-slate-700 font-bold' : 'text-slate-400'}">${c[1]}</span>
            </div>`;
          }).join('')}
        </div>` : ''}
      </div>`;

    document.querySelectorAll('.gt-row').forEach(b => b.onclick = () => gramLesson(b.dataset.gt));
    const ah = document.getElementById('gram-amp-h');
    if (ah) ah.onclick = () => {
      const caja = document.getElementById('gram-amp-b'), ico = document.getElementById('gram-amp-i');
      caja.classList.toggle('hidden');
      ico.classList.toggle('fa-chevron-down'); ico.classList.toggle('fa-chevron-up');
      sfx('flip');
    };
    document.querySelectorAll('.ga-row').forEach(b => b.onclick = () => {
      const a = amplia[+b.dataset.gamp];
      if (!a) return;
      // Se abre la lección base y salta a lo que aporta este nivel, sin cambiar de nivel.
      gramAmpAbrir = a.amp.id;
      gramLesson(a.baseId, 'learn');
    });
    document.getElementById('gram-cfg').onclick = gramConfig;
    document.getElementById('gram-next').onclick = () => next ? gramLesson(next.id) : gramReto();
    document.getElementById('gram-reto').onclick = gramReto;
    const be = document.getElementById('gram-errs');
    if (be) be.onclick = gramRepasoErrores;
  }

  /* ============================================================
     8. LECCIÓN — 📖 Aprender (estructura + ejemplos) · 🎯 Practicar
  ============================================================ */
  function gramLesson(id, tab = 'learn') {
    const t = gramById(id);
    if (!t) return openGramatica();
    stopSpeaking(); window.scrollTo(0, 0);
    const st = gramT(id);
    if (!st.seen) { st.seen = true; updateUserFlow(); }
    const tabBtn = (k, label) => `<button data-tab="${k}" class="gl-tab flex-1 py-2 rounded-xl font-bold text-[13px] ${tab === k ? 'bg-[#FF7A00] text-white shadow' : 'text-slate-500 hover:bg-slate-100'}">${label}</button>`;

    appContainer.innerHTML = `
      <div class="animate-pop">
        <div class="flex items-center gap-2 mt-2 mb-3">
          <button id="gl-back" class="tool-btn bg-white border border-slate-200 rounded-xl w-10 h-10 text-slate-500 shrink-0"><i class="fas fa-arrow-left"></i></button>
          <div class="flex-1 min-w-0">
            <h1 class="font-heading font-bold text-lg text-slate-800 leading-tight truncate">${t.icon} ${t.en}</h1>
            <p class="text-[11px] text-slate-400 truncate">${t.es} · ${t.tag}</p>
          </div>
          <button id="gl-fav" class="tool-btn text-xl ${st.fav ? 'text-pink-500' : 'text-slate-300'} shrink-0" title="Favorito"><i class="fas fa-heart"></i></button>
          <span class="text-sm ${st.stars ? 'text-yellow-400' : 'text-slate-300'} shrink-0">${'★'.repeat(st.stars || 0)}${'☆'.repeat(3 - (st.stars || 0))}</span>
        </div>
        <div class="flex gap-1 bg-white border border-slate-200 rounded-2xl p-1 mb-4">
          ${tabBtn('learn', '📖 Aprender')}${tabBtn('quiz', '🎯 Practicar')}
        </div>
        <div id="gl-body"></div>
      </div>`;
    document.getElementById('gl-back').onclick = openGramatica;
    document.getElementById('gl-fav').onclick = () => { st.fav = !st.fav; updateUserFlow(); gramLesson(id, tab); };
    document.querySelectorAll('.gl-tab').forEach(b => b.onclick = () => gramLesson(id, b.dataset.tab));
    if (tab === 'learn') gramTabLearn(t); else gramStartTopicQuiz(t);
  }

  /* ── Ejemplos con audio y traducción que se descubre ──
     `nivel` marca de qué nivel viene la frase en un tema fusionado.  */
  function gramExRow(e, nivel) {
    const auto = flujo.gram.cfg.autoEs;
    return `<div class="gx-item bg-slate-50 rounded-xl px-3 py-2.5 mb-2 tip-in" data-en="${escapeHTML(e.en)}">
      <div class="flex items-center gap-2">
        <button class="gx-audio text-[#FF7A00] w-8 h-8 rounded-full bg-orange-100 shrink-0" title="Escuchar"><i class="fas fa-volume-up text-sm"></i></button>
        <p class="flex-1 font-bold text-slate-700">${e.en}</p>
        ${nivel ? `<span class="text-[9px] font-black text-indigo-500 bg-indigo-100 rounded-md px-1.5 py-0.5 shrink-0">+${nivel}</span>` : ''}
      </div>
      <p class="gx-es ${auto ? '' : 'hidden'} text-[12px] text-slate-400 mt-1 pl-10">${e.es}</p>
      ${auto ? '' : '<button class="gx-toggle text-[10px] font-bold text-slate-300 hover:text-slate-500 pl-10 mt-0.5">ver traducción</button>'}
    </div>`;
  }
  function gramWireEx(body) {
    body.addEventListener('click', (e) => {
      const a = e.target.closest('.gx-audio');
      if (a) { speak(a.closest('.gx-item').dataset.en); return; }
      const tg = e.target.closest('.gx-toggle');
      if (tg) { tg.closest('.gx-item').querySelector('.gx-es').classList.remove('hidden'); tg.remove(); sfx('flip'); }
    });
  }

  /* ── Generador infinito de ejemplos ── */
  const gramExSession = {};
  let gramAmpAbrir = null;   // ampliación que hay que desplegar al abrir la lección

  /* Generadores y frases del tema. En un tema fusionado entran TODAS las de
     todos los niveles: la lección es una sola y se aprovecha entera. */
  function gramFuentes(t) {
    return {
      gens: t.gens || (t.gen ? [{ r: 0, fn: t.gen }] : []),
      extra: t.extra || []
    };
  }

  function gramNewExamples(t, n = 3) {
    const { gens, extra } = gramFuentes(t);
    const seen = new Set((gramExSession[t.id] || []).map(e => e.en));
    (t.ex || []).forEach(e => seen.add(e.en));
    const out = [];
    let guard = 0;
    while (out.length < n && guard++ < 80) {
      let e = null;
      if (gens.length) e = gPick(gens).fn();
      if ((!e || seen.has(e.en)) && extra.length) { const x = gPick(extra); e = { en: x[0], es: x[1] }; }
      if (e && !seen.has(e.en)) { seen.add(e.en); out.push(e); }
    }
    if (!out.length) {
      const pool = [...extra.map(x => ({ en: x[0], es: x[1] })), ...(t.ex || [])];
      if (pool.length) out.push(gPick(pool));
    }
    return out;
  }

  /* ── Aviso de repaso: este tema ya se vio en un nivel anterior ──
     Evita que el alumno sienta que vuelve a estudiar lo mismo: le dice
     dónde lo aprendió y qué es EXACTAMENTE lo nuevo de este nivel.     */
  function gramPrevBanner(p) {
    const t = GRAM_NIVELES[p.n]?.byId?.[p.id];
    if (!t) return '';
    return `<div class="rounded-2xl border-2 border-sky-200 bg-sky-50 p-4 mb-4">
      <p class="text-[11px] font-black text-sky-500 uppercase mb-1">🔁 Esto ya lo viste</p>
      <p class="text-sm text-sky-900 leading-relaxed">La base la aprendiste en <b>${p.n} · ${t.icon} ${t.es}</b>. Aquí <b>no se repite</b>: esto es lo nuevo del nivel.</p>
      <p class="mt-2 text-sm text-sky-900 leading-relaxed">✨ <b>Lo nuevo:</b> ${p.nuevo}</p>
      <button id="gl-prev" class="mt-3 text-[12px] font-bold text-sky-600 hover:text-sky-800 underline">Repasar el tema de ${p.n} →</button>
    </div>`;
  }
  function gramWirePrev(p) {
    const b = document.getElementById('gl-prev');
    if (!b || !p) return;
    // Se abre la lección del nivel anterior tal cual: ya no hace falta cambiar
    // el nivel de la cuenta (que también manda en el flujo de palabras).
    b.onclick = () => { gramQuiz = null; gramLesson(p.id, 'learn'); };
  }

  /* ── Ampliaciones: lo que los niveles superiores añaden a este mismo tema ──
     Antes cada una era un tema aparte que repetía la lección entera. Ahora su
     contenido se integra dentro de las secciones del tema base: la estructura
     con la estructura, la clave con la clave y los errores con los errores,
     cada trozo etiquetado con el nivel del que viene.                      */

  /* Separador que abre el trozo de un nivel dentro de una sección.
     Solo el de la sección de estructura lleva id: es el ancla del salto. */
  function gramAmpSep(a, extraClase = '', conId = false) {
    return `<div ${conId ? `id="gl-amp-${a.id}"` : ''} class="gl-amp-sep flex items-start gap-2 mt-4 mb-2 pt-3 border-t-2 border-dashed border-indigo-200 ${extraClase}">
      <span class="text-[10px] font-black text-white bg-indigo-500 rounded-lg px-2 py-0.5 shrink-0 mt-0.5">+${a.n}</span>
      <span class="text-[11px] font-bold text-indigo-500 leading-snug">${a.nuevo || a.tag}</span>
    </div>`;
  }

  const gramErrFila = (e) => `
    <div class="mb-3 last:mb-0">
      <p class="text-sm text-red-400 font-bold">❌ <s>${e.b}</s></p>
      <p class="text-sm text-green-600 font-bold">✅ ${e.g}</p>
      <p class="text-[11px] text-slate-400 mt-0.5">${e.w}</p>
    </div>`;

  function gramTabLearn(t) {
    const body = document.getElementById('gl-body');
    if (!gramExSession[t.id]) gramExSession[t.id] = gramNewExamples(t, 3);
    const amps = t.amp || [];
    const niveles = [...new Set(amps.map(a => a.n))];
    // Los errores del tema base van primero; los de cada nivel, tras su separador.
    const errsBase = t.marks?.errs?.length ? (t.errs || []).slice(0, t.marks.errs[0].i) : (t.errs || []);

    body.innerHTML = `
      ${t.prev ? gramPrevBanner(t.prev) : ''}
      ${amps.length ? `<div class="rounded-2xl border-2 border-indigo-200 bg-indigo-50 p-4 mb-4">
        <p class="text-[11px] font-black text-indigo-500 uppercase mb-1">🧩 Tema completo</p>
        <p class="text-sm text-indigo-900 leading-relaxed">Aquí tienes <b>todo</b> lo de este punto: lo de ${t.lvl || gramNivelDeTema(t.id)} y lo que ${niveles.join(' y ')} le ${niveles.length > 1 ? 'añaden' : 'añade'}, integrado en cada sección y marcado con su etiqueta. Ya no se vuelve a estudiar en ningún otro nivel.</p>
      </div>` : ''}
      ${t.widget ? `<div class="card-3d p-4 mb-4" id="gl-widget"></div>` : ''}
      <div class="card-3d p-4 mb-4">
        <p class="text-[11px] font-black text-slate-400 uppercase mb-2">📐 Estructura · FORM</p>
        <div class="text-sm text-slate-700 leading-relaxed">${t.form}</div>
        ${amps.map(a => gramAmpSep(a, '', true) + `<div class="text-sm text-slate-700 leading-relaxed">${a.form}</div>`).join('')}
      </div>
      <div class="card-3d p-4 mb-4">
        <div class="flex items-center justify-between mb-1">
          <p class="text-[11px] font-black text-slate-400 uppercase">💬 Así se usa</p>
          <button id="gx-listen" class="text-[10px] font-bold text-[#FF7A00]"><i class="fas fa-volume-up"></i> escuchar todo</button>
        </div>
        <p class="text-[11px] text-slate-400 mb-3">Intenta traducir <b>antes</b> de mirar la traducción: así se fija mejor. 🧠</p>
        <div id="gx-list">${
          t.ex.map(e => gramExRow(e)).join('') +
          amps.map(a => (a.ex || []).map(e => gramExRow(e, a.n)).join('')).join('') +
          gramExSession[t.id].map(e => gramExRow(e)).join('')
        }</div>
        <button id="gx-more" class="w-full btn-juice bg-indigo-500 text-white font-bold py-3 rounded-xl mt-2">✨ Generar más ejemplos</button>
      </div>
      <div class="rounded-2xl border-2 border-amber-200 bg-amber-50 p-4 mb-4">
        <p class="text-[11px] font-black text-amber-500 uppercase mb-1">🔑 La clave (en español)</p>
        <p class="text-sm text-amber-900 leading-relaxed">${t.tip}</p>
        ${amps.map(a => `<p class="mt-3 pt-3 border-t border-amber-200 text-sm text-amber-900 leading-relaxed">
          <span class="text-[10px] font-black text-white bg-amber-500 rounded-lg px-2 py-0.5 mr-1 align-middle">+${a.n}</span> ${a.tip}
        </p>`).join('')}
      </div>
      ${(t.errs?.length) ? `<div class="card-3d p-4 mb-4">
        <p class="text-[11px] font-black text-slate-400 uppercase mb-2">⚠️ Errores típicos del hispanohablante</p>
        ${errsBase.map(gramErrFila).join('')}
        ${amps.map(a => {
          const errs = (t.errs || []).slice(a.errRange[0], a.errRange[1]);
          return errs.length ? gramAmpSep(a, 'border-slate-200') + errs.map(gramErrFila).join('') : '';
        }).join('')}
      </div>` : ''}
      <button id="gl-cta" class="w-full btn-juice bg-[#FF7A00] text-white font-black py-4 rounded-2xl text-lg mb-6">🎯 ¡Practicar este tema!</button>`;

    // Si se llegó desde "lo que X añade", se salta directo a ese trozo.
    if (gramAmpAbrir) {
      const destino = body.querySelector(`#gl-amp-${CSS.escape(gramAmpAbrir)}`);
      if (destino) setTimeout(() => destino.scrollIntoView({ behavior: 'smooth', block: 'center' }), 80);
      gramAmpAbrir = null;
    }
    if (t.prev) gramWirePrev(t.prev);
    if (t.widget) gramRenderWidget(t, document.getElementById('gl-widget'));

    document.getElementById('gx-more').onclick = () => {
      const nuevos = gramNewExamples(t, 3);
      gramExSession[t.id].push(...nuevos);
      const list = document.getElementById('gx-list');
      nuevos.forEach(e => list.insertAdjacentHTML('beforeend', gramExRow(e)));
      sfx('toast');
      list.lastElementChild?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
    document.getElementById('gx-listen').onclick = () => {
      const frases = [...document.querySelectorAll('#gx-list .gx-item')].map(i => i.dataset.en);
      gramSpeakList(frases);
    };
    document.getElementById('gl-cta').onclick = () => gramLesson(t.id, 'quiz');
    gramWireEx(body);
  }

  // Lee una lista de frases una tras otra (para "escuchar todo")
  function gramSpeakList(frases, i = 0) {
    if (!window.speechSynthesis || i >= frases.length) return;
    if (i === 0) window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(frases[i]);
    const v = pickEnglishVoice(); if (v) u.voice = v;
    u.lang = 'en-US'; u.rate = 0.95;
    u.onend = () => gramSpeakList(frases, i + 1);
    window.speechSynthesis.speak(u);
  }

  /* ============================================================
     9. WIDGETS INTERACTIVOS (abecedario, números, verbos irregulares)
  ============================================================ */
  function gramRenderWidget(t, box) {
    if (!box) return;
    if (t.widget === 'alphabet') return gramWidgetAlphabet(box);
    if (t.widget === 'numbers') return gramWidgetNumbers(box);
    if (t.widget === 'irregulars') return gramWidgetIrregulars(box);
    if (t.widget === 'irregulars2') return gramWidgetIrregulars(box, true, IRR60, IRR60_NUEVOS);
    if (t.widget === 'irregulars3') return gramWidgetIrregulars(box, true, IRR100, IRR100_NUEVOS);
    if (t.widget === 'phrasals') return gramWidgetPhrasals(box);
    box.remove();
  }

  // Suena la celda tocada y se ilumina
  function gramCellSpeak(cell, texto, rate = 0.85) {
    document.querySelectorAll('.letter-cell.ringing').forEach(c => c.classList.remove('ringing'));
    cell.classList.add('ringing');
    speak(texto, rate);
    setTimeout(() => cell.classList.remove('ringing'), 700);
  }

  function gramWidgetAlphabet(box) {
    box.innerHTML = `
      <div class="flex items-center justify-between mb-1">
        <p class="text-[11px] font-black text-slate-400 uppercase">🔤 Toca cada letra para oírla</p>
        <button id="ab-all" class="text-[10px] font-bold text-[#FF7A00]"><i class="fas fa-volume-up"></i> A → Z</button>
      </div>
      <p class="text-[11px] text-slate-400 mb-3">Las 26 letras del inglés americano, con su sonido y una palabra de ejemplo.</p>
      <div class="grid grid-cols-4 sm:grid-cols-5 gap-1.5">
        ${ALPHABET.map(l => `
          <button class="letter-cell bg-slate-50 border-2 border-slate-200 rounded-xl py-2 text-center" data-say="${escapeHTML(l[0])}" data-word="${escapeHTML(l[2])}">
            <span class="block font-heading font-bold text-lg text-slate-800 leading-none">${l[0]}</span>
            <span class="lc-sub block text-[9px] text-[#FF7A00] font-bold mt-0.5">${l[1]}</span>
            <span class="lc-sub block text-[9px] text-slate-400 truncate px-1">${l[2]}</span>
          </button>`).join('')}
      </div>
      <div class="mt-3 bg-orange-50 border-2 border-orange-100 rounded-xl p-3">
        <p class="text-[11px] font-black text-[#FF7A00] uppercase mb-1">✋ Las 6 que más cuestan</p>
        <p class="text-[12px] text-slate-600 leading-relaxed">
          <b>A</b> /eɪ/ no "a" · <b>E</b> /iː/ no "e" · <b>I</b> /aɪ/ no "i" ·
          <b>G</b> /dʒiː/ vs <b>J</b> /dʒeɪ/ · <b>H</b> /eɪtʃ/ no "hache" · <b>Z</b> /ziː/ (americano), no "zed".
        </p>
      </div>
      <div class="mt-2 bg-slate-50 rounded-xl p-3">
        <p class="text-[11px] font-black text-slate-400 uppercase mb-1">🗣️ Deletrear de verdad</p>
        <p class="text-[12px] text-slate-600">Letra repetida = <b>double</b>: <i>Jennifer → J-E-double N-I-F-E-R</i>.<br>
        Y en un correo: <b>@</b> = <i>at</i> · <b>.</b> = <i>dot</i> · <b>_</b> = <i>underscore</i>.</p>
      </div>`;
    box.querySelectorAll('.letter-cell').forEach(c => {
      c.onclick = () => gramCellSpeak(c, `${c.dataset.say}. ${c.dataset.word}`, 0.8);
    });
    document.getElementById('ab-all').onclick = () => gramSpeakList(ALPHABET.map(l => l[0]));
  }

  function gramWidgetNumbers(box) {
    const grupo = (titulo, arr, cols) => `
      <p class="text-[10px] font-black text-slate-400 uppercase mt-3 mb-1">${titulo}</p>
      <div class="grid ${cols} gap-1.5">
        ${arr.map(n => `<button class="letter-cell bg-slate-50 border-2 border-slate-200 rounded-xl py-1.5 text-center" data-say="${escapeHTML(n[1])}">
          <span class="block font-black text-slate-800 leading-none text-[15px]">${n[0]}</span>
          <span class="lc-sub block text-[9px] text-slate-400 truncate px-0.5">${n[1]}</span>
        </button>`).join('')}
      </div>`;
    box.innerHTML = `
      <p class="text-[11px] font-black text-slate-400 uppercase mb-1">🔢 Toca cualquier número para oírlo</p>
      ${grupo('0 – 20', NUM_0_20, 'grid-cols-4 sm:grid-cols-5')}
      ${grupo('Decenas y grandes', NUM_TENS, 'grid-cols-3 sm:grid-cols-4')}
      ${grupo('Ordinales (fechas, pisos, orden)', NUM_ORD, 'grid-cols-3 sm:grid-cols-4')}
      <div class="mt-3 bg-orange-50 border-2 border-orange-100 rounded-xl p-3">
        <p class="text-[11px] font-black text-[#FF7A00] uppercase mb-1">⚠️ 13 vs 30 (el par mortal)</p>

  /* Buscador de phrasal verbs (B1): filtra por inglés o español y los pronuncia */

  /* ============================================================
     10. PRÁCTICA — 4 tipos de ejercicio
        mc    → completar eligiendo
        pick  → ¿cuál frase es correcta?
        order → ordenar las palabras
        type  → escribir la palabra que falta
  ============================================================ */
  let gramQuiz = null;

  // Palabras "gramaticales" que vale la pena hacer escribir
  const FILL_WORDS = ['am','is','are','was','were','do','does','did',"don't","doesn't","didn't",'have','has','had',
    'can',"can't",'a','an','the','some','any','much','many','there','this','that','these','those','my','your','his',
    'her','their','our','its','me','him','us','them','mine','yours','hers','theirs','in','on','at','to','from','by',
    'going','always','usually','sometimes','never','often','than','because','so','but','and','or','too','very',
    'once','twice','how','what','where','when','who','why','which','whose',"let's",'would','like','want','need',
    // B2: palabras funcionales del nivel intermedio alto
    'been','being','will','should','must','might','may','could','ought','used','get','got','make','made','let',
    'despite','although','though','however','whereas','unless','whether','since','until','while','once',
    'therefore','moreover','nevertheless','otherwise','instead','rather','hardly','barely','nearly','lately',
    'as','of','for','with','into','about','against','over','under','through','without','among','between',
    'each','every','both','neither','either','none','few','little','several','enough','most','such'];

  function gramFillFrom(e) {
    const limpio = e.en.replace(/[.!?]$/, '');
    if (/[—→:]/.test(limpio)) return null;                    // frases con formato especial
    const palabras = limpio.split(' ');
    if (palabras.length < 3 || palabras.length > 12) return null;
    const candidatos = palabras
      .map((w, i) => ({ w, i, k: w.toLowerCase().replace(/[’´`]/g, "'").replace(/[.,!?]/g, '') }))
      .filter(x => FILL_WORDS.includes(x.k));
    if (!candidatos.length) return null;
    const elegido = gPick(candidatos);
    const hueco = palabras.map((w, i) => i === elegido.i ? '___' : w).join(' ') + (e.en.match(/[.!?]$/) || [''])[0];
    return { frase: hueco, resp: elegido.w.replace(/[.,!?]$/, ''), es: e.es, full: e.en };
  }

  /* Familias de palabras que se confunden entre sí: sirven para fabricar
     opciones creíbles en los ejercicios generados (nada de opciones absurdas). */
  const MC_FAMILIES = [
    ['am', 'is', 'are'], ['was', 'were', 'are'], ['do', 'does', 'did'],
    ["don't", "doesn't", "didn't"], ['have', 'has', 'had'], ['a', 'an', 'the'],
    ['some', 'any', 'much', 'many'], ['this', 'that', 'these', 'those'],
    ['my', 'your', 'his', 'her', 'their', 'our', 'its'],
    ['me', 'him', 'her', 'us', 'them'], ['mine', 'yours', 'hers', 'theirs', 'ours'],
    ['in', 'on', 'at'], ['to', 'from', 'by', 'for'],
    ['always', 'usually', 'sometimes', 'never', 'often'],
    ['than', 'as', 'that'], ['because', 'so', 'but', 'although'],
    ['can', "can't", 'could'], ['will', 'would', "won't"],
    ['should', 'must', 'might', 'may'], ['who', 'which', 'where', 'when'],
    ['too', 'very', 'enough'], ['ago', 'for', 'since'],
    ['already', 'yet', 'just', 'still'], ['been', 'being', 'be'],
    ['there', 'it', 'they'], ['going', 'go', 'goes'],
    ['ever', 'never', 'yet'], ['myself', 'yourself', 'himself', 'herself', 'themselves'],
    /* ── Familias del B2: se confunden entre sí en el nivel intermedio alto ── */
    ['been', 'being', 'be'], ['must', 'should', 'might', 'could', 'may'],
    ['despite', 'although', 'though', 'whereas'], ['however', 'therefore', 'moreover', 'nevertheless'],
    ['unless', 'whether', 'if'], ['since', 'until', 'while', 'once'],
    ['hardly', 'barely', 'nearly', 'lately'], ['hard', 'hardly', 'harder'],
    ['late', 'lately', 'later'], ['near', 'nearly', 'nearby'], ['most', 'mostly', 'almost'],
    ['fair', 'fairly', 'fairness'], ['free', 'freely', 'freedom'], ['short', 'shortly', 'shorter'],
    ['good', 'well', 'better'],
    ['make', 'do', 'take', 'have'], ['made', 'did', 'took', 'had'],
    ['very', 'absolutely', 'completely', 'totally'], ['much', 'far', 'slightly', 'significantly'],
    ['as', 'like', 'than'], ['of', 'for', 'with', 'about'], ['on', 'in', 'at', 'to'],
    ['into', 'onto', 'through', 'across'], ['among', 'between', 'within', 'beyond'],
    ['each', 'every', 'both', 'either'], ['neither', 'none', 'either', 'both'],
    ['few', 'little', 'several', 'many'], ['such', 'so', 'very', 'too'],
    ['rather', 'instead', 'otherwise', 'therefore'], ['used', 'use', 'using'],
    ['get', 'got', 'gotten'], ['said', 'told', 'asked', 'explained'],
    ['seems', 'appears', 'tends', 'looks'], ['whom', 'whose', 'which', 'who']
  ];

  /* Ejercicio generado "elige la palabra": toma una frase, tapa una palabra
     gramatical y ofrece dos alternativas de su misma familia. */
  function gramGenMC(e, topicId) {
    const f = gramFillFrom(e);
    if (!f) return null;
    const clave = f.resp.toLowerCase().replace(/[’´`]/g, "'").replace(/[.,!?]/g, '');
    const fam = MC_FAMILIES.find(g => g.includes(clave));
    if (!fam) return null;
    const otras = gShuffle(fam.filter(x => x !== clave)).slice(0, 2);
    if (otras.length < 2) return null;
    const mayus = /^[A-Z]/.test(f.resp);
    const pinta = (w) => mayus ? w.charAt(0).toUpperCase() + w.slice(1) : w;
    const opciones = gShuffle([f.resp, ...otras.map(pinta)]);
    return { k: 'gmc', t: topicId, q: f.frase, o: opciones, a: opciones.indexOf(f.resp), full: f.full, w: f.es };
  }

  /* Dueño de cada frase fija: los generadores comparten listas entre temas, así
     que sin esto un tema puede sacar al vuelo la frase de ejemplo de OTRO tema
     (rompe la regla de no repetir nada ya estudiado). Se calcula una sola vez. */
  let GRAM_DUENNO = null;
  const gramNormFrase = (s) => String(s).toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9' ]/g, ' ').replace(/\s+/g, ' ').trim();
  function gramDuenno() {
    if (GRAM_DUENNO) return GRAM_DUENNO;
    GRAM_DUENNO = new Map();
    GRAM_ORDEN.forEach(n => (GRAM_NIVELES[n]?.temas || []).forEach(t => {
      const fijas = [...(t.ex || []).map(e => e.en), ...(t.extra || []).map(x => Array.isArray(x) ? x[0] : x.en)];
      fijas.forEach(f => { if (f) GRAM_DUENNO.set(gramNormFrase(f), t.id); });
    }));
    return GRAM_DUENNO;
  }

  /* Banco de ejercicios de un tema: se mezclan los escritos a mano con los
     generados, de modo que cada tema tenga siempre 15 o más y que repetir la
     práctica no signifique repetir las mismas preguntas. */
  function gramQsOfTopic(t) {
    const { gens, extra } = gramFuentes(t);
    const duenno = gramDuenno();
    const qs = [];
    // En un tema fusionado, quiz y errores están acumulados de todos los
    // niveles y entran enteros: no se aparta nada del material.
    (t.quiz || []).forEach((q, i) => qs.push({ k: 'mc', t: t.id, i, q: q.q, o: q.o, a: q.a, w: q.w }));
    (t.errs || []).forEach((e, i) => qs.push({ k: 'pick', t: t.id, i, b: e.b, g: e.g, w: e.w }));

    // Frases base: ejemplos fijos + extras + muchas generadas al vuelo (sin repetir)
    const vistas = new Set();
    const base = [];
    const meter = (e) => { if (e && e.en && !vistas.has(e.en)) { vistas.add(e.en); base.push(e); } };
    (t.ex || []).forEach(meter);
    extra.forEach(x => meter({ en: x[0], es: x[1] }));
    // Lo generado se descarta si es la frase fija de otro tema (más intentos
    // para compensar los descartes y no quedarse corto de ejercicios).
    const ajeno = (e) => { const d = duenno.get(gramNormFrase(e.en)); return d && d !== t.id; };
    gens.forEach(g => { for (let j = 0, n = 0; j < 40 && n < 16; j++) { const e = g.fn(); if (e && e.en && !ajeno(e)) { meter(e); n++; } } });

    // Ordenar la frase
    if (!t.noOrder) {
      gShuffle(base.filter(e => { const n = e.en.split(' ').length; return n >= 3 && n <= 8 && !/[—→:]/.test(e.en); }))
        .slice(0, 5).forEach(e => qs.push({ k: 'order', t: t.id, en: e.en, es: e.es }));
    }
    // Escribir la palabra que falta
    const usadas = new Set();
    let nType = 0;
    gShuffle(base).forEach(e => {
      if (nType >= 4) return;
      const f = gramFillFrom(e);
      if (!f || usadas.has(f.frase)) return;
      usadas.add(f.frase); nType++;
      qs.push({ k: 'type', t: t.id, q: f.frase, a: f.resp, es: f.es, full: f.full });
    });
    // Elegir la palabra correcta entre su misma familia
    let nGmc = 0;
    gShuffle(base).forEach(e => {
      if (nGmc >= 6) return;
      const g = gramGenMC(e, t.id);
      if (!g || usadas.has(g.q)) return;
      usadas.add(g.q); nGmc++;
      qs.push(g);
    });
    return qs;
  }

  function gramStartTopicQuiz(t) {
    const n = flujo.gram.cfg.quizLen || 15;
    gramQuiz = { list: gShuffle(gramQsOfTopic(t)).slice(0, n), i: 0, ok: 0, streak: 0, pts: 0, mode: 'topic', topic: t.id };
    gramRenderQ();
  }
  /* Temas que entran en la práctica de un nivel: los suyos + los temas base de
     otro nivel a los que este nivel aporta una ampliación (sin duplicar). */
  function gramTemasPractica() {
    const vistos = new Set();
    const out = [];
    const add = (t) => { if (t && !vistos.has(t.id)) { vistos.add(t.id); out.push(t); } };
    gramTemas().forEach(add);
    (gramTemario()?.amplia || []).forEach(a => add(a.base));
    return out;
  }

  function gramReto() {
    const pool = [];
    gramTemasPractica().forEach(t => gramQsOfTopic(t).forEach(q => pool.push(q)));
    if (!pool.length) return showToast('Este nivel todavía no tiene práctica. 🚧');
    gramQuiz = { list: gShuffle(pool).slice(0, 10), i: 0, ok: 0, streak: 0, pts: 0, mode: 'reto' };
    gramRenderQ();
    showToast('⚡ Reto rápido: 10 preguntas de todo el nivel. ¡A por ellas!');
  }
  function gramQuizExit() {
    stopSpeaking();
    const m = gramQuiz?.mode, tp = gramQuiz?.topic;
    gramQuiz = null;
    if (m === 'topic') gramLesson(tp, 'learn'); else openGramatica();
  }

  function gramRenderQ() {
    const S = gramQuiz;
    if (!S) return;
    if (S.i >= S.list.length) return gramQuizEnd();
    const q = S.list[S.i];
    window.scrollTo(0, 0);
    const tt = gramById(q.t);
    let bodyHTML = '', titulo = '';

    if (q.k === 'mc' || q.k === 'gmc') {
      titulo = q.k === 'gmc' ? 'Elige la palabra correcta' : 'Completa la frase';
      S.opts = gShuffle(q.o.map((o, i) => ({ o, i })));
      bodyHTML = `
        <p class="text-lg font-bold text-slate-800 text-center my-5 leading-relaxed">${q.q.replace('___', '<span class="inline-block min-w-[64px] border-b-4 border-[#FF7A00] text-[#FF7A00]">&nbsp;___&nbsp;</span>')}</p>
        <div class="space-y-2">${S.opts.map((x, j) => `<button data-j="${j}" class="gq-opt w-full btn-juice bg-white border-2 border-slate-200 font-bold text-slate-700 py-3.5 rounded-xl text-base">${x.o}</button>`).join('')}</div>`;
    } else if (q.k === 'pick') {
      titulo = '¿Cuál es la frase correcta?';
      S.opts = gShuffle([{ o: q.g, ok: true }, { o: q.b, ok: false }]);
      bodyHTML = `<div class="space-y-3 mt-5">${S.opts.map((x, j) => `<button data-j="${j}" class="gq-opt w-full btn-juice bg-white border-2 border-slate-200 font-bold text-slate-700 py-4 px-3 rounded-xl text-base leading-snug">${x.o}</button>`).join('')}</div>`;
    } else if (q.k === 'order') {
      titulo = 'Ordena la frase';
      const punct = (q.en.match(/[.!?]$/) || ['.'])[0];
      const words = q.en.replace(/[.!?]$/, '').split(' ');
      S.order = { words, sel: [], punct };
      bodyHTML = `
        <p class="text-center text-slate-400 text-sm mt-4 mb-1">Pista: <i>${q.es}</i></p>
        <div id="gq-built" class="min-h-[52px] bg-white border-2 border-dashed border-slate-300 rounded-xl p-2 flex flex-wrap gap-1.5 my-3"></div>
        <div id="gq-pool" class="flex flex-wrap gap-1.5 justify-center mb-4">
          ${gShuffle(words.map((w, i) => ({ w, i }))).map(x => `<button data-i="${x.i}" class="gq-chip btn-juice bg-white border-2 border-slate-200 font-bold text-slate-700 px-3 py-2 rounded-xl">${x.w}</button>`).join('')}
        </div>
        <button id="gq-check" disabled class="w-full btn-juice bg-slate-300 text-white font-bold py-3 rounded-xl">Comprobar</button>`;
    } else {
      titulo = 'Escribe la palabra que falta';
      bodyHTML = `
        <p class="text-lg font-bold text-slate-800 text-center my-4 leading-relaxed">${q.q.replace('___', '<span class="inline-block min-w-[70px] border-b-4 border-[#FF7A00] text-[#FF7A00]">&nbsp;?&nbsp;</span>')}</p>
        <p class="text-center text-slate-400 text-sm mb-3"><i>${q.es}</i></p>
        <input id="gq-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
          placeholder="escribe aquí…" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-3 text-center font-bold text-lg text-slate-700 focus:outline-none focus:border-[#FF7A00]">
        <button id="gq-check" class="w-full btn-juice bg-[#FF7A00] text-white font-bold py-3 rounded-xl mt-3">Comprobar</button>`;
    }

    appContainer.innerHTML = `
      <div class="animate-pop mt-2">
        <div class="flex items-center gap-2 mb-1">
          <button id="gq-exit" class="tool-btn text-slate-400 text-xl px-2"><i class="fas fa-xmark"></i></button>
          <div class="flex-1 progress-track"><div class="progress-fill" style="width:${Math.round(100 * S.i / S.list.length)}%"></div></div>
          <span class="text-xs font-black text-slate-400">${S.i + 1}/${S.list.length}</span>
          ${S.streak >= 3 ? `<span class="text-xs font-black text-orange-500">🔥${S.streak}</span>` : ''}
        </div>
        <p class="text-center text-[11px] font-black uppercase text-slate-400 mt-3">${tt ? tt.icon + ' ' : ''}${titulo}</p>
        <div class="card-3d p-4 mt-2">${bodyHTML}<div id="gq-fb"></div></div>
      </div>`;
    document.getElementById('gq-exit').onclick = gramQuizExit;
    sfx('flip');

    if (q.k === 'order') gramWireOrder();
    else if (q.k === 'type') gramWireType(q);
    else document.querySelectorAll('.gq-opt').forEach(b => b.onclick = () => gramAnswer(parseInt(b.dataset.j)));
  }

  function gramWireOrder() {
    const S = gramQuiz, st = S.order;
    const built = document.getElementById('gq-built'), pool = document.getElementById('gq-pool'), check = document.getElementById('gq-check');
    const paint = () => {
      built.innerHTML = st.sel.map((i, pos) => `<button data-pos="${pos}" class="gb-chip bg-orange-100 border-2 border-orange-200 text-[#FF7A00] font-bold px-3 py-2 rounded-xl">${st.words[i]}</button>`).join('');
      pool.querySelectorAll('.gq-chip').forEach(c => {
        const usado = st.sel.includes(parseInt(c.dataset.i));
        c.classList.toggle('opacity-30', usado);
        c.disabled = usado;
      });
      const listo = st.sel.length === st.words.length;
      check.disabled = !listo;
      check.className = `w-full btn-juice ${listo ? 'bg-[#FF7A00]' : 'bg-slate-300'} text-white font-bold py-3 rounded-xl`;
    };
    pool.onclick = (e) => { const c = e.target.closest('.gq-chip'); if (!c || c.disabled) return; st.sel.push(parseInt(c.dataset.i)); sfx('click'); paint(); };
    built.onclick = (e) => { const c = e.target.closest('.gb-chip'); if (!c) return; st.sel.splice(parseInt(c.dataset.pos), 1); paint(); };
    check.onclick = () => {
      if (st.sel.length !== st.words.length) return;
      const frase = st.sel.map(i => st.words[i]).join(' ');
      gramResolve(frase === st.words.join(' '), { correcta: st.words.join(' ') + st.punct });
    };
    paint();
  }

  function gramWireType(q) {
    const input = document.getElementById('gq-input'), check = document.getElementById('gq-check');

    const enviar = () => {
      const val = input.value;
      if (!val.trim()) return input.focus();
      input.disabled = true;
      const ok = normEsc(val) === normEsc(q.a);
      if (!ok) input.classList.add('!border-red-300', 'text-red-500', 'wrong-shake');
      else input.classList.add('!border-green-400', 'text-green-600');
      gramResolve(ok, { correcta: q.full });
    };

    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); enviar(); } });
  }

    const S = gramQuiz, q = S.list[S.i], x = S.opts[j];

  function gramResolve(ok, info) {
    const S = gramQuiz, q = S.list[S.i];
    const fb = document.getElementById('gq-fb');
    document.getElementById('gq-check')?.remove();
    const pool = document.getElementById('gq-pool'); if (pool) pool.style.pointerEvents = 'none';

    const frase = info.correcta || (q.k === 'pick' ? q.g : (q.k === 'gmc' ? q.full : null));

      fb.innerHTML = `<div class="mt-4 rounded-xl bg-green-50 border-2 border-green-200 p-3 animate-pop">

  async function gramQuizEnd() {

  /* ── Mis errores (se guardan por nivel en Supabase) ── */
  function gramErrKey(q) {
    const marca = q.k === 'order' ? q.en : ((q.k === 'type' || q.k === 'gmc') ? q.q : q.i);
    return q.k + '|' + q.t + '|' + marca;
  }
  function gramGuardarError(q) {
    const N = ensureGram();
    const key = gramErrKey(q);
    if (N.errores.some(d => gramErrKey(d) === key)) return;
    const d = { k: q.k, t: q.t };
    if (q.k === 'order') { d.en = q.en; d.es = q.es; }
    else if (q.k === 'type') { d.q = q.q; d.a = q.a; d.es = q.es; d.full = q.full; }
    else if (q.k === 'gmc') { d.q = q.q; d.o = q.o; d.a = q.a; d.full = q.full; d.w = q.w; }
    else d.i = q.i;
    N.errores.push(d);
    if (N.errores.length > 40) N.errores.shift();
    updateUserFlow();
  }
  function gramBorrarError(q) {
    const N = ensureGram();
    const key = gramErrKey(q);
    const ix = N.errores.findIndex(d => gramErrKey(d) === key);
    if (ix >= 0) { N.errores.splice(ix, 1); updateUserFlow(); }
  }
  function gramQFromDesc(d) {
    const t = gramById(d.t);
    if (!t) return null;
    if (d.k === 'mc') { const q = t.quiz?.[d.i]; return q ? { k: 'mc', t: d.t, i: d.i, q: q.q, o: q.o, a: q.a, w: q.w } : null; }
    if (d.k === 'pick') { const e = t.errs?.[d.i]; return e ? { k: 'pick', t: d.t, i: d.i, b: e.b, g: e.g, w: e.w } : null; }
    if (d.k === 'order') return { k: 'order', t: d.t, en: d.en, es: d.es };
    if (d.k === 'type') return { k: 'type', t: d.t, q: d.q, a: d.a, es: d.es, full: d.full };
    if (d.k === 'gmc') return { k: 'gmc', t: d.t, q: d.q, o: d.o, a: d.a, full: d.full, w: d.w };
    return null;
  }
  function gramRepasoErrores() {
    const N = ensureGram();
    const list = gShuffle(N.errores.map(gramQFromDesc).filter(Boolean)).slice(0, 10);
    if (!list.length) return showToast('🎉 No tienes errores pendientes. ¡Sigue así!');
    gramQuiz = { list, i: 0, ok: 0, streak: 0, pts: 0, mode: 'err' };
    gramRenderQ();
  }
