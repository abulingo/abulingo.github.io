    engancharVolver();
    panel().querySelectorAll('[data-dict]').forEach(b => b.onclick = () => abrirDictado(lista.find(d => d.id === b.dataset.dict)));
  }

  function abrirDictado(d) {
    dict = { d, respuestas: d.frases.map(() => ''), resultados: d.frases.map(() => null), clasif: {}, escuchas: d.frases.map(() => 0) };
    pintarDictado();
  }

  function pintarDictado() {
    const { d } = dict;
    panel().innerHTML = cabecera(escapeHTML(d.titulo), `${escapeHTML(d.es)} · Escucha el clip completo una vez sin escribir. Luego ve frase por frase: puedes repetir cada una las veces que necesites.`, {
      extra: `<div class="flex flex-wrap items-center gap-2 mt-3">
        <button id="dict-todo" class="btn-juice bg-slate-800 text-white font-bold py-2.5 px-4 rounded-xl text-sm"><i class="fas fa-play mr-2"></i>Escuchar todo</button>
        ${velocidadesHTML()}
      </div>` }) + `
      <div class="space-y-3" id="dict-frases">
        ${d.frases.map((f, i) => `
          <div class="card-3d p-4" data-fila="${i}">
            <div class="flex items-center gap-2 mb-2">
              <button class="play-btn" data-play="${i}" title="Escuchar la frase"><i class="fas fa-play text-xs"></i></button>
              <button class="play-btn lento" data-lento="${i}" title="Escuchar más despacio"><span class="text-sm">🐢</span></button>
              <span class="text-[10px] font-black text-slate-300">FRASE ${i + 1} DE ${d.frases.length}</span>
              <span class="flex-1"></span>
              <span class="text-[10px] font-bold text-slate-400" data-esc="${i}"></span>
            </div>
            <input class="dict-input" data-in="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe lo que oyes…" value="${escapeHTML(dict.respuestas[i])}">
            <div class="flex justify-end mt-2"><button class="btn-juice bg-[#FF7A00] text-white font-bold py-2 px-4 rounded-xl text-sm" data-check="${i}">Comprobar</button></div>
            <div class="dict-res mt-2" data-res="${i}"></div>
          </div>`).join('')}
      </div>
      <div id="dict-final" class="mt-4"></div>`;
    engancharVolver(renderDictados);
    document.getElementById('dict-todo').onclick = async (e) => {
      const b = e.currentTarget;
      if (b.dataset.on) { stopSpeaking(); b.dataset.on = ''; b.innerHTML = '<i class="fas fa-play mr-2"></i>Escuchar todo'; return; }
      b.dataset.on = '1'; b.innerHTML = '<i class="fas fa-stop mr-2"></i>Detener';
      await tocarLista(d.frases.map((f, i) => ({ archivo: `${d.id}-${i}`, texto: f[0] })), { pausa: 350 });
      b.dataset.on = ''; b.innerHTML = '<i class="fas fa-play mr-2"></i>Escuchar todo';
    };
    panel().querySelectorAll('[data-play]').forEach(b => b.onclick = () => tocarFraseDictado(Number(b.dataset.play), b));
    panel().querySelectorAll('[data-lento]').forEach(b => b.onclick = () => tocarFraseDictado(Number(b.dataset.lento), b, 0.75));
    panel().querySelectorAll('[data-in]').forEach(inp => {
      inp.oninput = () => { dict.respuestas[Number(inp.dataset.in)] = inp.value; };
      inp.onkeydown = (e) => { if (e.key === 'Enter') comprobarFrase(Number(inp.dataset.in)); };
    });
    panel().querySelectorAll('[data-check]').forEach(b => b.onclick = () => comprobarFrase(Number(b.dataset.check)));
    dict.resultados.forEach((r, i) => { if (r) pintarResultadoFrase(i); });
    pintarFinalDictado();
  }

  async function tocarFraseDictado(i, btn, vel) {
    stopSpeaking();
    dict.escuchas[i]++;
    const esc = panel().querySelector(`[data-esc="${i}"]`);
    if (esc) esc.textContent = `${dict.escuchas[i]} ${dict.escuchas[i] === 1 ? 'escucha' : 'escuchas'}`;
    btn.classList.add('sonando');
    await tocar(`${dict.d.id}-${i}`, { vel: vel ? Math.min(vel, velocidad) : velocidad, texto: dict.d.frases[i][0] });
    btn.classList.remove('sonando');
    panel().querySelector(`[data-in="${i}"]`)?.focus();
  }

  function comprobarFrase(i) {
    const inp = panel().querySelector(`[data-in="${i}"]`);
    const escrito = (inp?.value || '').trim();
    if (!escrito) { showToast('✍️ Escribe primero lo que oíste.'); return; }
    dict.respuestas[i] = escrito;
    const ops = alinear(tokens(dict.d.frases[i][0]), tokens(escrito));
    const total = ops.filter(o => o.tipo !== 'sobra').length;
    const buenas = ops.filter(o => o.tipo === 'ok').length + ops.filter(o => o.tipo === 'casi').length * 0.75;
    const sobran = ops.filter(o => o.tipo === 'sobra').length;
    const pct = Math.max(0, Math.round((buenas - sobran * 0.5) / Math.max(1, total) * 100));
    dict.resultados[i] = { ops, pct };
    if (pct === 100) sonidoBien(); else if (pct < 60) sonidoMal();
    pintarResultadoFrase(i);
    pintarFinalDictado();
  }

  function pintarResultadoFrase(i) {
    const box = panel().querySelector(`[data-res="${i}"]`);
    const r = dict.resultados[i];
    if (!box || !r) return;
    const errores = r.ops.map((o, k) => ({ ...o, k })).filter(o => o.tipo === 'mal' || o.tipo === 'falta');
    box.innerHTML = `
      <div class="bg-slate-50 rounded-xl p-3">
        <div class="flex items-center justify-between mb-1">
          <span class="text-[10px] font-black uppercase tracking-wide text-slate-400">Corrección</span>
          <span class="text-xs font-black ${r.pct === 100 ? 'text-green-600' : r.pct >= 70 ? 'text-amber-600' : 'text-red-500'}">${r.pct}%</span>
        </div>
        <div class="leading-loose">${r.ops.map(o => {
          if (o.tipo === 'ok') return `<span class="tok ok">${escapeHTML(o.esp)}</span>`;
          if (o.tipo === 'casi') return `<span class="tok casi" title="Casi: revisa la ortografía">${escapeHTML(o.esp)}<small>escribiste «${escapeHTML(o.escr)}»</small></span>`;
          if (o.tipo === 'mal') return `<span class="tok mal">${escapeHTML(o.esp)}<small>escribiste «${escapeHTML(o.escr)}»</small></span>`;
          if (o.tipo === 'falta') return `<span class="tok falta">${escapeHTML(o.esp)}<small>faltó</small></span>`;
          return `<span class="tok sobra">${escapeHTML(o.escr)}</span>`;
        }).join(' ')}</div>
        <p class="text-sm font-bold text-slate-700 mt-2">${escapeHTML(dict.d.frases[i][0])}</p>
        <p class="text-[12px] text-slate-400">${escapeHTML(dict.d.frases[i][1])}</p>
        ${errores.length ? `
          <p class="text-[11px] font-black text-slate-500 mt-3 mb-1.5">¿Por qué fallaste cada palabra?</p>
          <div class="space-y-1.5">
            ${errores.map(o => {
              const c = dict.clasif[`${i}:${o.k}`];
              return `<div class="flex items-center gap-2 flex-wrap clasif">
                <span class="tok mal" style="margin:0">${escapeHTML(o.esp)}</span>
                <button class="${c === 'd' ? 'on-d' : ''}" data-clasif="${i}:${o.k}:d">No la conocía</button>
                <button class="${c === 'r' ? 'on-r' : ''}" data-clasif="${i}:${o.k}:r">La conocía, no la reconocí</button>
              </div>`;
            }).join('')}
          </div>` : ''}
      </div>`;
    box.querySelectorAll('[data-clasif]').forEach(b => b.onclick = () => {
      const [fi, k, tipo] = b.dataset.clasif.split(':');
      dict.clasif[`${fi}:${k}`] = tipo;
      pintarResultadoFrase(Number(fi));
      pintarFinalDictado();
    });
  }

  function pintarFinalDictado() {
    const cont = document.getElementById('dict-final');
    if (!cont) return;
    const hechos = dict.resultados.filter(Boolean);
    if (hechos.length < dict.d.frases.length) { cont.innerHTML = ''; return; }
    const pct = Math.round(hechos.reduce((s, r) => s + r.pct, 0) / hechos.length);
    const vals = Object.values(dict.clasif);
    const nD = vals.filter(v => v === 'd').length, nR = vals.filter(v => v === 'r').length;
    cont.innerHTML = `
      <div class="card-3d p-5 text-center animate-pop">
        <div class="text-5xl mb-2">${pct >= 90 ? '🏆' : pct >= 70 ? '👏' : '💪'}</div>
        <h3 class="font-heading font-black text-2xl text-slate-800">${pct}% del dictado</h3>
        <p class="text-sm text-slate-500 mt-1">${nD + nR ? `Errores clasificados: <b class="text-[#0D47A1]">${nD} de vocabulario</b> · <b class="text-[#FF7A00]">${nR} de oído</b>` : 'Clasifica tus errores arriba para ver tu diagnóstico.'}</p>
        ${nR > nD ? '<p class="text-xs text-slate-500 mt-2">👂 Conocías la mayoría: practica <b>Habla conectada</b> para reconocerlas en el habla rápida.</p>' : nD > 0 ? '<p class="text-xs text-slate-500 mt-2">📚 Te faltó vocabulario: prueba <b>Vocabulario por el oído</b>.</p>' : ''}
        <button id="dict-guardar" class="w-full btn-juice bg-[#FF7A00] text-white font-bold py-3 rounded-xl mt-4">Terminar y guardar</button>
        <button id="dict-repetir" class="w-full btn-juice bg-slate-100 text-slate-600 font-bold py-3 rounded-xl mt-2">Repetir este dictado</button>
      </div>`;
    document.getElementById('dict-guardar').onclick = () => {
      const prev = P.dictado[dict.d.id] || { mejor: 0, veces: 0 };
      P.dictado[dict.d.id] = { mejor: Math.max(prev.mejor || 0, pct), veces: (prev.veces || 0) + 1, fecha: hoy() };
      P.errores.desconocida = (P.errores.desconocida || 0) + nD;
      P.errores.noReconocida = (P.errores.noReconocida || 0) + nR;
      guardar();
      marcarRutina('dictado');
      if (pct >= 90) confeti();
      showToast(`✍️ Dictado guardado: ${pct}%`);
      renderDictados();
    };
    document.getElementById('dict-repetir').onclick = () => { abrirDictado(dict.d); window.scrollTo({ top: 0 }); };
  }

  /* ============================================================
     7. HABLA CONECTADA
     Cada patrón: explicación, ejemplos lento (palabra por palabra) vs.
     natural (como suena de verdad) y una práctica en la que suena la
     versión natural y hay que elegir qué frase completa se dijo.
  ============================================================ */
  function renderConectadaLista() {
    const lista = D.conectada[nivel];
    panel().innerHTML = cabecera('Habla conectada', 'Estudia un patrón al día (5 min). Primero lento, luego natural, y al final practica reconocerlo.') + `
      <div class="space-y-2">
        ${lista.map(c => {
          const p = P.conectada[c.id];
          const ok = (p?.mejor || 0) >= 80;
          return `<button class="act-card w-full" data-con="${c.id}">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl ${ok ? 'bg-green-500' : 'bg-blue-50'} flex items-center justify-center shrink-0">
                <i class="fas ${ok ? 'fa-check text-white' : 'fa-link text-[#0D47A1]'} text-sm"></i></div>
              <div class="flex-1 min-w-0">
                <p class="font-heading font-black text-slate-800 leading-tight">${escapeHTML(c.titulo)}</p>
                <p class="text-[11px] text-slate-400 truncate">${escapeHTML(c.patron)}</p>
              </div>
              ${p ? `<span class="text-xs font-black ${ok ? 'text-green-600' : 'text-slate-400'}">${p.mejor}%</span>` : ''}
            </div>
          </button>`;
        }).join('')}
      </div>`;
    engancharVolver();
    panel().querySelectorAll('[data-con]').forEach(b => b.onclick = () => abrirPatron(lista.find(c => c.id === b.dataset.con)));
  }

  function abrirPatron(c) {
    panel().innerHTML = cabecera(escapeHTML(c.titulo), '', {
      extra: `<p class="inline-block mt-2 bg-blue-50 text-[#0D47A1] font-black text-sm rounded-xl px-3 py-1.5">${escapeHTML(c.patron)}</p>
        <p class="text-sm text-slate-600 mt-3 leading-relaxed">${escapeHTML(c.explica)}</p>
        <div class="mt-3">${velocidadesHTML()}</div>` }) + `
      <div class="card-3d p-4 sm:p-5 mb-4">
        <p class="text-[10px] font-black uppercase tracking-wide text-slate-400 mb-2">Escucha la diferencia</p>
        <div class="space-y-3">
          ${c.ejemplos.map((e, i) => `
            <div class="border-2 border-slate-100 rounded-2xl p-3">
              <div class="flex items-center gap-2">
                <button class="play-btn lento" data-l="${i}" title="Lento, palabra por palabra"><span class="text-sm">🐢</span></button>
                <div class="min-w-0 flex-1"><p class="text-[10px] font-black text-[#0D47A1] uppercase">Lento</p><p class="text-sm font-bold text-slate-700">${escapeHTML(e.lento)}</p></div>
              </div>
              <div class="flex items-center gap-2 mt-2">
                <button class="play-btn" data-n="${i}" title="Natural, como se dice de verdad"><i class="fas fa-bolt text-xs"></i></button>
                <div class="min-w-0 flex-1"><p class="text-[10px] font-black text-[#FF7A00] uppercase">Natural</p><p class="text-sm font-bold text-slate-700">${escapeHTML(e.natural)}</p></div>
              </div>
              <p class="text-[11px] text-slate-400 mt-1.5 pl-12">${escapeHTML(e.es)}</p>
            </div>`).join('')}
        </div>
        <button id="con-practicar" class="w-full btn-juice bg-[#0D47A1] text-white font-bold py-3 rounded-xl mt-4"><i class="fas fa-dumbbell mr-2"></i>Practicar (${c.ejemplos.length} preguntas)</button>
      </div>`;
    engancharVolver(renderConectadaLista);
    const tocarBtn = async (b, archivo, texto) => { stopSpeaking(); b.classList.add('sonando'); await tocar(archivo, { texto }); b.classList.remove('sonando'); };
    panel().querySelectorAll('[data-l]').forEach(b => b.onclick = () => { const i = Number(b.dataset.l); tocarBtn(b, `${c.id}-${i}-l`, c.ejemplos[i].lento); });
    panel().querySelectorAll('[data-n]').forEach(b => b.onclick = () => { const i = Number(b.dataset.n); tocarBtn(b, `${c.id}-${i}-n`, c.ejemplos[i].natural); });
    document.getElementById('con-practicar').onclick = () => practicarPatron(c);
  }

  function practicarPatron(c) {
    const orden = barajar(c.ejemplos.map((e, i) => i));
    let k = 0, aciertos = 0;
    const paso = () => {
      if (k >= orden.length) return finPatron();
      const i = orden[k], e = c.ejemplos[i];
      const opciones = barajar([e.lento, ...e.trampas]);
      panel().innerHTML = cabecera(escapeHTML(c.titulo), `Pregunta ${k + 1} de ${orden.length} · Suena la versión <b>natural</b>. ¿Qué frase completa se dijo?`, { extra: `<div class="mt-3">${velocidadesHTML()}</div>` }) + `
        <div class="card-3d p-5">
          <div class="flex justify-center mb-4">
            <button id="con-oir" class="btn-juice bg-[#FF7A00] text-white font-bold py-3 px-6 rounded-2xl"><i class="fas fa-volume-high mr-2"></i>Escuchar otra vez</button>
          </div>
          <div class="space-y-2">${opciones.map((o, j) => `<button class="opcion" data-op="${j}">${escapeHTML(o)}</button>`).join('')}</div>
          <div id="con-fb" class="mt-4"></div>
        </div>`;
      engancharVolver(() => abrirPatron(c));
      const oir = () => tocar(`${c.id}-${i}-n`, { texto: e.natural });
      document.getElementById('con-oir').onclick = oir;
      setTimeout(oir, 300);
      panel().querySelectorAll('[data-op]').forEach(b => b.onclick = async () => {
        const elegido = opciones[Number(b.dataset.op)];
        const bien = elegido === e.lento;
        panel().querySelectorAll('[data-op]').forEach(x => {
          x.disabled = true;
          if (opciones[Number(x.dataset.op)] === e.lento) x.classList.add('bien');
        });
        if (!bien) b.classList.add('malo');
        if (bien) { aciertos++; sonidoBien(); } else sonidoMal();
        document.getElementById('con-fb').innerHTML = `
          <div class="rounded-2xl ${bien ? 'bg-green-50' : 'bg-orange-50'} p-3 text-sm">
            <p class="font-black ${bien ? 'text-green-700' : 'text-[#c2570a]'}">${bien ? '✅ ¡Bien!' : 'Casi…'} Sonaba: «${escapeHTML(e.natural)}»</p>
            <p class="text-slate-500 text-xs mt-0.5">${escapeHTML(e.es)}</p>
            <div class="flex gap-2 mt-2">
              <button class="play-btn lento" id="fb-l"><span class="text-sm">🐢</span></button>
              <button class="play-btn" id="fb-n"><i class="fas fa-bolt text-xs"></i></button>
              <span class="flex-1"></span>
              <button id="con-sig" class="btn-juice bg-[#FF7A00] text-white font-bold py-2 px-4 rounded-xl text-sm">Siguiente</button>
            </div>
          </div>`;
        document.getElementById('fb-l').onclick = () => tocar(`${c.id}-${i}-l`, { texto: e.lento });
        document.getElementById('fb-n').onclick = () => tocar(`${c.id}-${i}-n`, { texto: e.natural });
        document.getElementById('con-sig').onclick = () => { stopSpeaking(); k++; paso(); };
        if (!bien) setTimeout(() => tocar(`${c.id}-${i}-l`, { texto: e.lento }), 350);
      });
    };
    const finPatron = () => {
      const pct = Math.round(aciertos / orden.length * 100);
      const prev = P.conectada[c.id]?.mejor || 0;
      P.conectada[c.id] = { mejor: Math.max(prev, pct), fecha: hoy() };
      guardar();
      marcarRutina('conectada');
      if (pct >= 80) confeti();
      panel().innerHTML = cabecera(escapeHTML(c.titulo), '') + `
        <div class="card-3d p-6 text-center animate-pop">
          <div class="text-5xl mb-2">${pct === 100 ? '🏆' : pct >= 80 ? '👏' : '💪'}</div>
          <h3 class="font-heading font-black text-2xl text-slate-800">${aciertos} de ${orden.length}</h3>
          <p class="text-sm text-slate-500 mt-1">${pct >= 80 ? '¡Tu oído ya reconoce este patrón!' : 'Vuelve a escuchar los ejemplos lento y natural, y repite la práctica.'}</p>
          <button id="con-otra" class="w-full btn-juice bg-[#0D47A1] text-white font-bold py-3 rounded-xl mt-4">Practicar otra vez</button>
          <button id="con-lista" class="w-full btn-juice bg-slate-100 text-slate-600 font-bold py-3 rounded-xl mt-2">Ver todos los patrones</button>
        </div>`;
      engancharVolver(renderConectadaLista);
      document.getElementById('con-otra').onclick = () => practicarPatron(c);
      document.getElementById('con-lista').onclick = renderConectadaLista;
    };
    paso();
  }

  /* ============================================================
     8. VOCABULARIO POR EL OÍDO
     Rondas de 10: suena una frase y hay que elegir la palabra que se
     oyó entre otras que suenan parecido. Primero salen las que nunca
     has acertado y las que más fallas.
  ============================================================ */
  function iniciarVocab() {
    const lista = D.vocab[nivel];
    const reg = P.vocab[nivel] || (P.vocab[nivel] = {});
    const peso = (w) => { const r = reg[w[0]]; if (!r) return 0; return (r.ok || 0) - (r.bad || 0) * 2; };
    const ronda = barajar(lista).sort((a, b) => peso(a) - peso(b)).slice(0, 10);
    let k = 0, aciertos = 0;
    const paso = () => {
      if (k >= ronda.length) return fin();
      const [w, distractores, frase, fraseEs, wEs] = ronda[k];
      const i = lista.indexOf(ronda[k]);
      const base = `v-${nivel.toLowerCase()}-${slug(w)}`;
      const opciones = barajar([w, ...distractores]);
      panel().innerHTML = cabecera('Vocabulario por el oído', `Palabra ${k + 1} de ${ronda.length} · Escucha la frase. ¿Qué palabra oíste?`, { extra: `<div class="mt-3">${velocidadesHTML()}</div>` }) + `
        <div class="card-3d p-5">
          <div class="flex justify-center mb-4">
            <button id="voc-oir" class="btn-juice bg-emerald-500 text-white font-bold py-3 px-6 rounded-2xl"><i class="fas fa-volume-high mr-2"></i>Escuchar la frase</button>
          </div>
          <div class="grid grid-cols-2 gap-2">${opciones.map((o, j) => `<button class="opcion text-center" data-op="${j}">${escapeHTML(o)}</button>`).join('')}</div>
          <div id="voc-fb" class="mt-4"></div>
        </div>`;
      engancharVolver();
      const oir = () => tocar(base, { texto: frase.replace(/\*/g, '') });
      document.getElementById('voc-oir').onclick = oir;
      setTimeout(oir, 300);
      panel().querySelectorAll('[data-op]').forEach(b => b.onclick = () => {
        const bien = opciones[Number(b.dataset.op)] === w;
        panel().querySelectorAll('[data-op]').forEach(x => { x.disabled = true; if (opciones[Number(x.dataset.op)] === w) x.classList.add('bien'); });
        if (!bien) b.classList.add('malo');
        const r = reg[w] || (reg[w] = { ok: 0, bad: 0 });
        if (bien) { r.ok++; aciertos++; sonidoBien(); } else { r.bad++; sonidoMal(); }
        guardar();
        const fraseHTML = escapeHTML(frase).replace(/\*(.+?)\*/g, '<mark class="obj">$1</mark>');
        document.getElementById('voc-fb').innerHTML = `
          <div class="rounded-2xl ${bien ? 'bg-green-50' : 'bg-orange-50'} p-3">
            <p class="text-base font-bold text-slate-700">${fraseHTML}</p>
            <p class="text-xs text-slate-500">${escapeHTML(fraseEs)}</p>
            <p class="text-xs mt-2"><b class="text-slate-700">${escapeHTML(w)}</b> <span class="text-slate-400">= ${escapeHTML(wEs)}</span></p>
            <div class="flex gap-2 mt-2 items-center">
              <button class="play-btn" id="voc-palabra" title="La palabra sola"><i class="fas fa-volume-low text-xs"></i></button>
              <button class="play-btn" id="voc-frase" title="La frase otra vez"><i class="fas fa-rotate-right text-xs"></i></button>
              <span class="flex-1"></span>
              <button id="voc-sig" class="btn-juice bg-[#FF7A00] text-white font-bold py-2 px-4 rounded-xl text-sm">Siguiente</button>
            </div>
          </div>`;
        document.getElementById('voc-palabra').onclick = () => tocar(`${base}-w`, { texto: w });
        document.getElementById('voc-frase').onclick = oir;
        document.getElementById('voc-sig').onclick = () => { stopSpeaking(); k++; paso(); };
        setTimeout(() => tocar(`${base}-w`, { texto: w }), 300);
        void i;
      });
    };
    const fin = () => {
      marcarRutina('vocab');
      if (aciertos >= 9) confeti();
      panel().innerHTML = cabecera('Vocabulario por el oído', '') + `
        <div class="card-3d p-6 text-center animate-pop">
          <div class="text-5xl mb-2">${aciertos >= 9 ? '🏆' : aciertos >= 7 ? '👏' : '💪'}</div>
          <h3 class="font-heading font-black text-2xl text-slate-800">${aciertos} de ${ronda.length}</h3>
          <p class="text-sm text-slate-500 mt-1">Aprende cada palabra nueva escuchándola siempre dentro de una frase, nunca sola.</p>
          <button id="voc-otra" class="w-full btn-juice bg-emerald-500 text-white font-bold py-3 rounded-xl mt-4">Otra ronda</button>
          <button id="voc-ini" class="w-full btn-juice bg-slate-100 text-slate-600 font-bold py-3 rounded-xl mt-2">Volver al inicio</button>
        </div>`;
      engancharVolver();
      document.getElementById('voc-otra').onclick = iniciarVocab;
      document.getElementById('voc-ini').onclick = renderInicio;
    };
    paso();
  }

  /* ============================================================
     9. PREDICE Y ESCUCHA
     1) leer el contexto y predecir palabras, 2) escuchar sin texto
     (máximo dos veces antes de responder), 3) responder, 4) revisar
     con la transcripción y ver qué predicciones acertaste.
  ============================================================ */
  const COLOR_VOZ = { leda: '#e11d48', aoede: '#db2777', kore: '#9333ea', charon: '#0D47A1', puck: '#0891b2', fenrir: '#15803d' };
  const NOMBRE_VOZ = { leda: 'A', aoede: 'A', kore: 'A', charon: 'B', puck: 'B', fenrir: 'B' };

  function renderPrediccionLista() {
    const lista = D.prediccion[nivel];
    panel().innerHTML = cabecera('Predice y escucha', 'Antes de escuchar, piensa qué vas a oír. Predecir prepara al oído y hace que entiendas mucho más.') + `
      <div class="space-y-2">
        ${lista.map(p => {
          const r = P.prediccion[p.id];
          return `<button class="act-card w-full" data-pred="${p.id}">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl ${r ? 'bg-green-500' : 'bg-purple-50'} flex items-center justify-center shrink-0">
                <i class="fas ${r ? 'fa-check text-white' : 'fa-wand-magic-sparkles text-purple-600'} text-sm"></i></div>
              <div class="flex-1 min-w-0">
                <p class="font-heading font-black text-slate-800 leading-tight">${escapeHTML(p.titulo)}</p>
                <p class="text-[11px] text-slate-400 truncate">${escapeHTML(p.contexto)}</p>
              </div>
              ${r ? `<span class="text-xs font-black text-green-600">${r.mejor}/${p.preguntas.length}</span>` : ''}
            </div>
          </button>`;
        }).join('')}
      </div>`;
    engancharVolver();
    panel().querySelectorAll('[data-pred]').forEach(b => b.onclick = () => abrirPrediccion(lista.find(p => p.id === b.dataset.pred)));
  }

  function abrirPrediccion(p) {
    const st = { elegidas: new Set(), escuchas: 0, respuestas: [] };
    const clips = p.lineas.map((l, i) => ({ archivo: `${p.id}-${i}`, texto: l[1] }));

    // Paso 1: predecir
    const paso1 = () => {
      panel().innerHTML = cabecera(escapeHTML(p.titulo), '<b>Paso 1 de 3 · Predice.</b> Lee la situación y marca las palabras que crees que vas a oír.') + `
        <div class="card-3d p-5">
          <p class="text-base font-bold text-slate-700 mb-4">📍 ${escapeHTML(p.contexto)}</p>
          <div class="flex flex-wrap gap-2">${p.predice.opciones.map(o => `<button class="pred-chip ${st.elegidas.has(o) ? 'on' : ''}" data-pc="${escapeHTML(o)}">${escapeHTML(o)}</button>`).join('')}</div>
          <button id="pred-ok" class="w-full btn-juice bg-purple-600 text-white font-bold py-3 rounded-xl mt-5">Listo, quiero escuchar</button>
        </div>`;
      engancharVolver(renderPrediccionLista);
      panel().querySelectorAll('[data-pc]').forEach(b => b.onclick = () => {
        const o = b.dataset.pc;
        if (st.elegidas.has(o)) st.elegidas.delete(o); else st.elegidas.add(o);
        b.classList.toggle('on');
      });
      document.getElementById('pred-ok').onclick = () => {
        if (!st.elegidas.size) { showToast('🔮 Marca al menos una palabra.'); return; }
        paso2();
      };
    };

    // Paso 2: escuchar sin texto y responder
    const paso2 = () => {
      panel().innerHTML = cabecera(escapeHTML(p.titulo), '<b>Paso 2 de 3 · Escucha y responde.</b> Sin texto. Puedes escuchar dos veces antes de responder.', { extra: `<div class="mt-3">${velocidadesHTML()}</div>` }) + `
        <div class="card-3d p-5">
          <div class="flex flex-col items-center gap-2 mb-5">
            <button id="pred-oir" class="btn-juice bg-purple-600 text-white font-bold py-3 px-6 rounded-2xl"><i class="fas fa-play mr-2"></i>Escuchar</button>
            <span id="pred-esc" class="text-[11px] font-bold text-slate-400">Te quedan 2 escuchas</span>
          </div>
          <div class="space-y-4">
            ${p.preguntas.map(([q, qEs, ops], i) => `
              <div>
                <p class="text-sm font-black text-slate-700">${i + 1}. ${escapeHTML(q)}</p>
                <p class="text-[11px] text-slate-400 mb-1.5">${escapeHTML(qEs)}</p>
                <div class="space-y-1.5">${ops.map((o, j) => `<button class="opcion text-sm py-2.5" data-q="${i}" data-o="${j}">${escapeHTML(o)}</button>`).join('')}</div>
              </div>`).join('')}
          </div>
          <button id="pred-rev" class="w-full btn-juice bg-[#FF7A00] text-white font-bold py-3 rounded-xl mt-5">Ver respuestas y transcripción</button>
        </div>`;
      engancharVolver(renderPrediccionLista);
      const btn = document.getElementById('pred-oir');
      btn.onclick = async () => {
        if (btn.dataset.on) { stopSpeaking(); return; }
        if (st.escuchas >= 2) { showToast('🎧 Responde primero; luego podrás escuchar todo lo que quieras.'); return; }
        st.escuchas++;
        document.getElementById('pred-esc').textContent = st.escuchas >= 2 ? 'Ya no quedan escuchas' : 'Te queda 1 escucha';
        btn.dataset.on = '1'; btn.innerHTML = '<i class="fas fa-stop mr-2"></i>Detener';
        await tocarLista(clips, { pausa: 380 });
        btn.dataset.on = ''; btn.innerHTML = '<i class="fas fa-play mr-2"></i>Escuchar';
      };
      panel().querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
        const i = Number(b.dataset.q);
        st.respuestas[i] = Number(b.dataset.o);
        panel().querySelectorAll(`[data-q="${i}"]`).forEach(x => x.classList.toggle('bg-purple-50', x === b));
        panel().querySelectorAll(`[data-q="${i}"]`).forEach(x => x.classList.toggle('border-purple-400', x === b));
      });
      document.getElementById('pred-rev').onclick = () => {
        if (st.respuestas.filter(x => x !== undefined).length < p.preguntas.length) { showToast('Responde todas las preguntas 🙂'); return; }
        stopSpeaking();
        paso3();
      };
    };

    // Paso 3: revisar
    const paso3 = () => {
      const buenas = p.preguntas.filter((q, i) => st.respuestas[i] === q[3]).length;
      const correctas = new Set(p.predice.correctas);
      const aciertosPred = [...st.elegidas].filter(o => correctas.has(o)).length;
      const prev = P.prediccion[p.id]?.mejor || 0;
      P.prediccion[p.id] = { mejor: Math.max(prev, buenas), fecha: hoy() };
      guardar();
      if (buenas === p.preguntas.length) { confeti(); sonidoBien(); }
      panel().innerHTML = cabecera(escapeHTML(p.titulo), '<b>Paso 3 de 3 · Revisa.</b> Escucha otra vez leyendo la transcripción: así cada sonido se une a su palabra.', { extra: `<div class="mt-3">${velocidadesHTML()}</div>` }) + `
        <div class="card-3d p-5 mb-4 text-center">
          <p class="text-4xl mb-1">${buenas === p.preguntas.length ? '🏆' : buenas >= p.preguntas.length - 1 ? '👏' : '💪'}</p>
          <p class="font-heading font-black text-xl text-slate-800">${buenas} de ${p.preguntas.length} respuestas</p>
          <p class="text-xs text-slate-500 mt-1">Acertaste ${aciertosPred} de tus ${st.elegidas.size} predicciones.</p>
          <div class="flex flex-wrap justify-center gap-1.5 mt-3">${p.predice.opciones.map(o => {
            const elegida = st.elegidas.has(o), esta = correctas.has(o);
            const cls = elegida && esta ? 'acierto' : elegida ? 'fallo' : esta ? 'perdida' : '';
            return cls ? `<span class="pred-chip ${cls} text-xs py-1">${escapeHTML(o)}</span>` : '';
          }).join('')}</div>
          <p class="text-[10px] text-slate-400 mt-2">verde = acertaste · punteado = sí salió y no la marcaste · tachado = no salió</p>
        </div>
        <div class="card-3d p-5 mb-4">
          <p class="text-[10px] font-black uppercase tracking-wide text-slate-400 mb-2">Tus respuestas</p>
          ${p.preguntas.map(([q, qEs, ops, ok], i) => `
            <div class="mb-2 text-sm">
              <p class="font-bold text-slate-700">${escapeHTML(q)}</p>
              <p class="${st.respuestas[i] === ok ? 'text-green-600' : 'text-red-500'} font-bold text-xs">${st.respuestas[i] === ok ? '✅' : '❌'} ${escapeHTML(ops[st.respuestas[i]])}${st.respuestas[i] === ok ? '' : ` → <span class="text-green-600">${escapeHTML(ops[ok])}</span>`}</p>
            </div>`).join('')}
        </div>
        <div class="card-3d p-5">
          <div class="flex items-center justify-between mb-2">
            <p class="text-[10px] font-black uppercase tracking-wide text-slate-400">Transcripción</p>
            <button id="pred-todo" class="text-xs font-black text-purple-600"><i class="fas fa-play mr-1"></i>Escuchar todo</button>
          </div>
          <div class="space-y-1">
            ${p.lineas.map(([voz, en, es], i) => `
              <div class="linea-dialogo" data-ld="${i}">
                <span class="voz-dot" style="background:${COLOR_VOZ[voz]}">${NOMBRE_VOZ[voz]}</span>
                <div class="flex-1 min-w-0">
                  <p class="text-sm font-bold text-slate-700 leading-snug">${escapeHTML(en)}</p>
                  <p class="text-[11px] text-slate-400">${escapeHTML(es)}</p>
                </div>
                <button class="play-btn" data-lp="${i}" style="width:32px;height:32px"><i class="fas fa-play text-[10px]"></i></button>
              </div>`).join('')}
          </div>
          <button id="pred-otra" class="w-full btn-juice bg-purple-600 text-white font-bold py-3 rounded-xl mt-4">Siguiente situación</button>
        </div>`;
      engancharVolver(renderPrediccionLista);
      const marcar = (i) => panel().querySelectorAll('[data-ld]').forEach(x => x.classList.toggle('sonando', Number(x.dataset.ld) === i));
      document.getElementById('pred-todo').onclick = () => tocarLista(clips, { pausa: 380, alPaso: marcar });
      panel().querySelectorAll('[data-lp]').forEach(b => b.onclick = async () => {
        const i = Number(b.dataset.lp);
        marcar(i);
        await tocar(clips[i].archivo, { texto: clips[i].texto });
        marcar(-1);
      });
      document.getElementById('pred-otra').onclick = () => {
        const lista = D.prediccion[nivel];
        const sig = lista.find(x => !P.prediccion[x.id] && x.id !== p.id) || lista[(lista.indexOf(p) + 1) % lista.length];
        abrirPrediccion(sig);
      };
    };
    paso1();
  }

  /* ============================================================
     10. CUENTA LAS PALABRAS
     Suena una frase rápida con contracciones y reducciones; hay que
     decir cuántas palabras tiene su forma completa (I'm = I am = 2).
  ============================================================ */
  const contarPalabras = (s) => s.replace(/[^A-Za-z' ]+/g, ' ').trim().split(/\s+/).filter(Boolean).length;

  function iniciarContar() {
    const lista = D.contar[nivel];
    const orden = barajar(lista.map((x, i) => i));
    let k = 0, aciertos = 0;
    const paso = () => {
      if (k >= orden.length) return fin();
      const i = orden[k], [natural, completa] = lista[i];
      const n = contarPalabras(completa);
      const archivo = `k-${nivel.toLowerCase()}-${i}`;
      const opciones = Array.from({ length: 6 }, (_, j) => j + Math.max(2, n - 2));
      panel().innerHTML = cabecera('Cuenta las palabras', `Frase ${k + 1} de ${orden.length} · ¿Cuántas palabras hay en la forma completa? (Ojo: <b>I'm</b> = <b>I am</b> = 2)`, { extra: `<div class="mt-3">${velocidadesHTML()}</div>` }) + `
        <div class="card-3d p-5">
          <div class="flex justify-center mb-5">
            <button id="k-oir" class="btn-juice bg-amber-500 text-white font-bold py-3 px-6 rounded-2xl"><i class="fas fa-volume-high mr-2"></i>Escuchar</button>
          </div>
          <div class="flex flex-wrap justify-center gap-2">${opciones.map(o => `<button class="num-btn" data-num="${o}">${o}</button>`).join('')}</div>
          <div id="k-fb" class="mt-5"></div>
        </div>`;
      engancharVolver();
      const oir = () => tocar(archivo, { texto: natural });
      document.getElementById('k-oir').onclick = oir;
      setTimeout(oir, 300);
      panel().querySelectorAll('[data-num]').forEach(b => b.onclick = () => {
        const bien = Number(b.dataset.num) === n;
        panel().querySelectorAll('[data-num]').forEach(x => { x.disabled = true; if (Number(x.dataset.num) === n) x.classList.add('bien'); });
        if (!bien) b.classList.add('malo');
        if (bien) { aciertos++; sonidoBien(); } else sonidoMal();
        const palabras = completa.replace(/[^A-Za-z' ]+/g, ' ').trim().split(/\s+/);
        document.getElementById('k-fb').innerHTML = `
          <div class="rounded-2xl ${bien ? 'bg-green-50' : 'bg-orange-50'} p-3 text-center">
            <p class="text-xs font-black text-slate-400 uppercase">Sonaba</p>
            <p class="text-lg font-black text-slate-700">${escapeHTML(natural)}</p>
            <p class="text-xs font-black text-slate-400 uppercase mt-2">Forma completa · ${n} palabras</p>
            <div class="flex flex-wrap justify-center gap-1 mt-1">${palabras.map((w, j) => `<span class="tok ok">${escapeHTML(w)}<small>${j + 1}</small></span>`).join('')}</div>
            <button id="k-sig" class="btn-juice bg-[#FF7A00] text-white font-bold py-2 px-5 rounded-xl text-sm mt-3">Siguiente</button>
          </div>`;
        document.getElementById('k-sig').onclick = () => { stopSpeaking(); k++; paso(); };
      });
    };
    const fin = () => {
      const reg = P.contar[nivel] || { mejor: 0, veces: 0 };
      P.contar[nivel] = { mejor: Math.max(reg.mejor || 0, aciertos), veces: (reg.veces || 0) + 1 };
      guardar();
      if (aciertos >= orden.length - 1) confeti();
      panel().innerHTML = cabecera('Cuenta las palabras', '') + `
        <div class="card-3d p-6 text-center animate-pop">
          <div class="text-5xl mb-2">${aciertos === orden.length ? '🏆' : aciertos >= 7 ? '👏' : '💪'}</div>
          <h3 class="font-heading font-black text-2xl text-slate-800">${aciertos} de ${orden.length}</h3>
          <p class="text-sm text-slate-500 mt-1">Contar palabras obliga al oído a separar lo que en el habla rápida suena como una sola.</p>
          <button id="k-otra" class="w-full btn-juice bg-amber-500 text-white font-bold py-3 rounded-xl mt-4">Otra vez</button>
          <button id="k-ini" class="w-full btn-juice bg-slate-100 text-slate-600 font-bold py-3 rounded-xl mt-2">Volver al inicio</button>
        </div>`;
      engancharVolver();
      document.getElementById('k-otra').onclick = iniciarContar;
      document.getElementById('k-ini').onclick = renderInicio;
    };
    paso();
  }

  /* ============================================================
     11. SHADOWING DE TEXTOS (traído de pronunciacion.html)
  ============================================================ */
  /* Mismo motor de voz v4 que pronunciacion.html y abulingo.html: el corte
     del navegador por una pausa no envía; se sigue escuchando y se envía con
     el silencio real, el segundo toque o el tope. */
  const pzVivoEsMovil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const PZ_VOZ_SILENCIO_MS = 4000;
  const PZ_VOZ_TOPE_MS = 60000;
  const PZ_VOZ_REINICIOS = 3;

  function limpiarRepeticionesVoz(texto) {
    let p = (texto || '').trim().split(/\s+/).filter(Boolean);
    if (p.length < 2) return (texto || '').trim();
    let cambio = true;
    while (cambio) {
      cambio = false;
      for (let n = Math.floor(p.length / 2); n >= 2; n--) {
        const fin = p.slice(-n).join(' ').toLowerCase();
        const antes = p.slice(-2 * n, -n).join(' ').toLowerCase();
        if (fin && fin === antes) { p = p.slice(0, -n); cambio = true; break; }
      }
    }
    const salida = [];
    for (const w of p) {
      const n = salida.length;
      if (n >= 2 && salida[n - 1].toLowerCase() === w.toLowerCase() && salida[n - 2].toLowerCase() === w.toLowerCase()) continue;
      salida.push(w);
    }
    return salida.join(' ');
  }
  function unirSesionesVoz(previo, nuevo) {
    const a = (previo || '').trim().split(/\s+/).filter(Boolean);
    const b = (nuevo || '').trim().split(/\s+/).filter(Boolean);
    if (!a.length) return b.join(' ');
    if (!b.length) return a.join(' ');
    const lim = (w) => w.toLowerCase().replace(/[.,!?;:"]/g, '');
    for (let n = Math.min(a.length, b.length); n >= 1; n--) {
      if (n < 2 && n < a.length) break;
      if (a.slice(-n).map(lim).join(' ') === b.slice(0, n).map(lim).join(' ')) return [...a, ...b.slice(n)].join(' ');
    }
    return [...a, ...b].join(' ');
  }
  function pzEscuchar(btn, msg, { lang = 'en-US', onFin, textoEscuchando = 'Escuchando... habla y se enviará solo 🎙️' }) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { if (msg) msg.textContent = 'Tu navegador no reconoce voz 😉'; return null; }
    const rec = new SR();
    rec.lang = lang;
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    rec.continuous = !pzVivoEsMovil;
    let dicho = '', previo = '', cerrado = false, errorDuro = null;
    let paradoManual = false, reinicios = 0, silencio = null, tope = null;
    const t0 = Date.now();
    if (btn) btn.classList.add('recording');
    if (msg) msg.textContent = textoEscuchando;
    const limpiarSilencio = () => { if (silencio) { clearTimeout(silencio); silencio = null; } };
    const terminar = () => { paradoManual = true; try { rec.stop(); } catch { cerrar(dicho.trim()); } };
    const rearmarSilencio = () => { limpiarSilencio(); if (!dicho.trim()) return; silencio = setTimeout(terminar, PZ_VOZ_SILENCIO_MS); };
    const cerrar = (texto) => {
      if (cerrado) return;
      cerrado = true;
      limpiarSilencio();
      if (tope) { clearTimeout(tope); tope = null; }
      if (btn) btn.classList.remove('recording');
      onFin && onFin(texto, errorDuro);
    };
    rec.onresult = (e) => {
      let texto = '';
      for (let i = 0; i < e.results.length; i++) texto += e.results[i][0].transcript + ' ';
      dicho = limpiarRepeticionesVoz(unirSesionesVoz(previo, texto.trim()));
      if (msg) msg.textContent = dicho ? `"${dicho}"` : 'Escuchando...';
      rearmarSilencio();
    };
    rec.onerror = (e) => {
      const err = e.error || 'error';
      if (err === 'no-speech' || err === 'aborted') return;
      if (err === 'not-allowed' || err === 'service-not-allowed') errorDuro = 'sin-permiso';
      else if (err === 'audio-capture') errorDuro = 'microfono-ocupado';
      else errorDuro = err;
    };
    rec.onend = () => {
      if (cerrado) return;
      if (errorDuro || paradoManual) return cerrar(dicho.trim());
      previo = dicho;
      const conTexto = !!dicho.trim();
      if (Date.now() - t0 < PZ_VOZ_TOPE_MS && (conTexto || reinicios < PZ_VOZ_REINICIOS)) {
        if (!conTexto) reinicios++;
        try { rec.start(); return; } catch {}
      }
      cerrar(dicho.trim());
    };
    rec.detenerYa = () => { limpiarSilencio(); terminar(); };
    try { rec.start(); } catch (err) {
      console.warn('[voz] no se pudo iniciar:', err);
      errorDuro = 'no-inicio';
      cerrar('');
      return null;
    }
    tope = setTimeout(terminar, PZ_VOZ_TOPE_MS);
    return rec;
  }
  function pzTextoErrorVoz(err) {
    if (err === 'sin-permiso') return 'Bloqueaste el micrófono 🔒 — actívalo en el candado de la barra de direcciones';
    if (err === 'microfono-ocupado') return 'Otra app está usando el micrófono. Ciérrala e intenta de nuevo.';
    if (err === 'no-inicio') return 'El micrófono está ocupado — espera un segundo e inténtalo otra vez';
    return 'No te escuché, inténtalo otra vez 🎙️';
  }

  /* ============================================================
     SHADOWING DE TEXTOS — "Shadowing + Audio + transcript" (antes el modo 7 de pronunciacion.html)
     ------------------------------------------------------------
     El método, en tres pasos, es el que usan los intérpretes:

       1. ESCUCHAR el texto entero sin leer nada, para acostumbrar el
          oído al ritmo real.
       2. LEER el transcript mientras vuelve a sonar, así cada sonido
          se ata a su palabra escrita.
       3. SHADOWING frase por frase: se reproduce UNA frase, se baja la
          velocidad si hace falta y se repite encima hasta que sale.

     Por eso la pantalla está partida igual que el método: arriba el
     texto completo con su reproductor, y abajo una tarjeta por frase
     con SUS palabras sueltas, su propio botón de play, su control de
     velocidad y su micrófono.

     Los audios viven en el bucket público "listening" de Supabase
     (un mp3 por texto + un mp3 por frase, voz en-US-Chirp3-HD-Leda —
     la misma de Abu). Se generaron con scripts/generar_audios_listening.py (fuera del repo).
     Se guardan a velocidad 1.0 y el navegador los ralentiza con
     `playbackRate`: así un solo archivo sirve para todas las
     velocidades y no hay que descargar cuatro versiones.
  ============================================================ */
  const LISTENING_BUCKET = `${SUPABASE_URL}/storage/v1/object/public/listening/`;
  const LS_VELOCIDADES = [0.5, 0.75, 1, 1.25];

  let lsNivelElegido = null;
  let lsTextosNivel = [];
  let lsTextoActual = null;     // el texto abierto en la vista de práctica
  let lsProgreso = {};          // { [textoId]: { "0": 5, "1": 4 } }
  let lsVelocidad = 1;          // velocidad global elegida por la persona
  let lsAudio = null;           // <audio> en curso (uno a la vez)
  let lsFraseSonando = null;    // índice de la frase que está sonando
  let lsTextoAbierto = false;   // ¿está desplegado el transcript completo?
  let lsOrden = {};             // { [frase]: { puestas: [], banco: [] } } del ejercicio de ordenar
  let lsRec = null;             // reconocimiento de voz del shadowing

  const lsUrl = (ruta) => (ruta ? LISTENING_BUCKET + ruta : null);

  function lsDetenerAudio() {
    if (lsAudio) { try { lsAudio.pause(); } catch {} lsAudio = null; }
    lsFraseSonando = null;
  }

  /* Reproduce una pista a la velocidad elegida. `playbackRate` se aplica
     DESPUÉS de play() en algunos navegadores móviles, por eso se pone en
     los dos sitios. */
  function lsTocar(url, { onFin } = {}) {
    lsDetenerAudio();
    stopSpeaking();
    const a = new Audio(url);
    a.playbackRate = lsVelocidad;
    a.preservesPitch = true;          // que no suene a ardilla al bajarla
    a.mozPreservesPitch = true;
    a.webkitPreservesPitch = true;
    lsAudio = a;
    const fin = () => {
      if (lsAudio === a) { lsAudio = null; lsFraseSonando = null; }
      lsPintarEstadoBotones();
      if (onFin) onFin();
    };
    a.onended = fin;
    a.onerror = fin;
    a.onplay = () => { a.playbackRate = lsVelocidad; };
    a.play().catch(fin);
    return a;
  }

  /* ---------- Pantalla 1: textos del nivel elegido ---------- */
  function renderListening() {
    lsDetenerAudio();
    lsTextoActual = null;
    const cambio = lsNivelElegido !== nivel;
    panel().innerHTML = cabecera('Shadowing de textos', 'Escucha el texto, léelo mientras suena y repite frase por frase encima del audio. Puedes bajar la velocidad cuando quieras.') + `
      <div class="card-3d p-4 sm:p-5">
        <div id="ls-lista-wrap">${!cambio && lsTextosNivel.length ? lsListaHTML() : '<p class="text-center text-slate-300 text-lg py-6"><i class="fas fa-circle-notch fa-spin"></i></p>'}</div>
      </div>`;
    engancharVolver();
    if (cambio || !lsTextosNivel.length) lsElegirNivel(nivel); else lsBindLista();
  }

  async function lsElegirNivel(nivelX) {
    lsNivelElegido = nivelX;
    const { data, error } = await dbClient.from('textos_listening')
      .select('id,nivel,titulo,tema,texto,traduccion,frases,audio_url,palabras')
      .eq('nivel', nivelX)
      .order('orden', { ascending: true });

    // El usuario pudo cambiar de pantalla mientras cargaba.
    if (!document.getElementById('ls-lista-wrap') || lsNivelElegido !== nivelX) return;
    if (error) {
      document.getElementById('ls-lista-wrap').innerHTML =
        `<p class="text-center text-red-400 text-sm py-6">No se pudieron cargar los textos.<br><span class="text-[11px] text-slate-400">${escapeHTML(error.message)}</span></p>`;
      return;
    }
    lsTextosNivel = data || [];
    if (!lsTextosNivel.length) {
      document.getElementById('ls-lista-wrap').innerHTML = '<p class="text-center text-slate-400 text-sm py-6">Todavía no hay textos cargados para este nivel.</p>';
      return;
    }
    await lsCargarProgreso(lsTextosNivel.map(t => t.id));
    lsPintarLista();
  }

  // Cuántas frases lleva dominadas (4-5 estrellas) en cada texto.
  async function lsCargarProgreso(ids) {
    if (!ids.length || !currentUser) return;
    const { data, error } = await dbClient.from('listening_progreso')
      .select('texto_id,frases_ok,completado')
      .eq('user_id', currentUser.id).in('texto_id', ids);
    if (error) { console.warn('[listening] progreso:', error.message); return; }
    (data || []).forEach(r => { lsProgreso[r.texto_id] = r.frases_ok || {}; });
  }

  const lsFrasesOk = (textoId) =>
    Object.values(lsProgreso[textoId] || {}).filter(p => Number(p) >= 4).length;

  function lsListaHTML() {
    if (!lsTextosNivel.length) return '';
    return `
      <p class="text-xs font-black uppercase tracking-wide text-slate-400 mb-2">Toca un texto para practicarlo</p>
      <div class="space-y-2">
        ${lsTextosNivel.map(t => {
          const total = (t.frases || []).length;
          const ok = lsFrasesOk(t.id);
          const pct = total ? Math.round((ok / total) * 100) : 0;
          return `
          <button class="ls-abrir w-full text-left btn-juice bg-slate-50 border-2 ${pct === 100 ? 'border-green-300' : 'border-slate-100'} hover:border-[#FF7A00] rounded-xl p-3" data-id="${t.id}">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl ${pct === 100 ? 'bg-green-500' : 'bg-white border-2 border-slate-200'} flex items-center justify-center shrink-0">
                <i class="fas ${pct === 100 ? 'fa-check text-white' : 'fa-play text-[#FF7A00] text-xs'}"></i>
              </div>
              <div class="flex-1 min-w-0">
                <p class="font-heading font-black text-slate-800 leading-tight truncate">${escapeHTML(t.titulo)}</p>
                <p class="text-[11px] text-slate-400 truncate">${escapeHTML(t.tema || '')} · ${t.palabras || 0} palabras · ${total} frases</p>
              </div>
              <span class="shrink-0 text-[10px] font-black ${pct === 100 ? 'text-green-600' : 'text-slate-400'}">${ok}/${total}</span>
            </div>
            <div class="h-1.5 bg-slate-200 rounded-full mt-2 overflow-hidden">
              <div class="h-full ${pct === 100 ? 'bg-green-500' : 'bg-[#FF7A00]'} rounded-full transition-all" style="width:${pct}%"></div>
            </div>
          </button>`;
        }).join('')}
      </div>`;
  }

  function lsPintarLista() {
    const wrap = document.getElementById('ls-lista-wrap');
    if (!wrap) return;
    wrap.innerHTML = lsListaHTML();
    lsBindLista();
  }

  function lsBindLista() {
    document.querySelectorAll('.ls-abrir').forEach(b => {
      b.onclick = () => {
        const t = lsTextosNivel.find(x => String(x.id) === b.dataset.id);
        if (t) lsAbrirTexto(t);
      };
    });
  }

  /* ---------- Pantalla 2: practicar un texto ----------
     Al tocar un texto se entra DIRECTO al shadowing frase por frase: esa
     es la práctica, no un paso posterior. El texto completo y su
     traducción quedan plegados arriba, a un toque, para quien quiera
     leerlos; pero lo primero que ves es la lista de frases.

     La práctica de cada frase es ORDENAR SUS PALABRAS:
       1. suena el audio de la frase (a la velocidad que tengas puesta),
       2. las palabras aparecen desordenadas abajo,
       3. las vas tocando en el orden que creas y se van colocando arriba,
       4. al completarlas se corrige sola y se guarda la nota.
     Tocar una palabra ya colocada la devuelve al montón, así se puede
     rectificar sin empezar de cero. */
  function lsAbrirTexto(t) {
    lsDetenerAudio();
    lsTextoActual = t;
    lsVelocidad = 1;
    lsOrden = {};              // { [indiceFrase]: [palabras colocadas] }
    lsTextoAbierto = false;
    lsPintarPractica();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function lsChipsVelocidadHTML(tam = '') {
    return LS_VELOCIDADES.map(v => `
      <button class="ls-vel btn-juice px-2.5 py-1.5 rounded-lg text-[11px] font-black ${v === lsVelocidad ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-500'}" data-v="${v}">${v}×</button>
    `).join('');
  }

  function lsPintarPractica() {
    const t = lsTextoActual;
    if (!t) return;
    const frases = t.frases || [];
    const ok = lsFrasesOk(t.id);

    document.getElementById('mode-panel').innerHTML = `
      <!-- ── Cabecera compacta: título, velocidad y el texto plegado ──── -->
      <div class="card-3d p-4 sm:p-5 mb-3">
        <button id="ls-volver" class="text-[11px] font-black text-slate-400 hover:text-[#FF7A00] mb-3"><i class="fas fa-arrow-left mr-1"></i>Volver a los textos</button>

        <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Nivel ${escapeHTML(t.nivel)} · ${t.palabras || 0} palabras</p>
        <h2 class="font-heading font-black text-2xl text-[#FF7A00] leading-tight mb-1">${escapeHTML(t.titulo)}</h2>
        <p class="text-slate-400 text-xs mb-3">${escapeHTML(t.tema || '')} · <span id="ls-contador">${ok}/${frases.length}</span> frases dominadas</p>

        <div class="flex flex-wrap items-center gap-2 mb-3">
          <button id="ls-play-full" class="btn-juice bg-slate-800 text-white font-bold py-2.5 px-4 rounded-xl text-sm">
            <i class="fas fa-play mr-2"></i>Escuchar el texto
          </button>
          <button id="ls-ver-texto" class="btn-juice bg-slate-100 text-slate-600 font-bold py-2.5 px-3 rounded-xl text-xs">
            <i class="fas fa-file-lines mr-1"></i>${lsTextoAbierto ? 'Ocultar' : 'Ver'} transcript
          </button>
        </div>

        <!-- El transcript arranca PLEGADO: si se ve el texto entero, ordenar
             las palabras deja de tener gracia. Quien lo necesite lo abre. -->
        <div id="ls-caja-texto" class="${lsTextoAbierto ? '' : 'hidden'} bg-slate-50 border border-slate-100 rounded-xl p-3 mb-3">
          <p class="text-slate-700 text-[15px] leading-relaxed font-medium">${escapeHTML(t.texto)}</p>
          <p class="text-slate-400 text-[13px] leading-relaxed mt-2">${escapeHTML(t.traduccion || '')}</p>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-[10px] font-black uppercase tracking-wide text-slate-400">Velocidad</span>
          <div id="ls-velocidades" class="flex gap-1.5">${lsChipsVelocidadHTML()}</div>
        </div>
        <p class="text-[10px] text-slate-300 mt-2">Vale para el texto completo y para cada frase. Empieza en 0.5× y sube cuando te salga natural. 🐢→🐇</p>
      </div>

      <!-- ── La práctica: escuchar y ordenar, frase por frase ─────────── -->
      <div class="card-3d p-4 sm:p-5">
        <p class="text-xs font-black uppercase tracking-wide text-slate-400 mb-1">Shadowing · frase por frase</p>
        <p class="text-[11px] text-slate-400 mb-3">Escucha la frase y ordena sus palabras tocándolas. Luego repítela en voz alta con el micrófono 🎙️</p>
        <div id="ls-frases" class="space-y-2">${frases.map((f, i) => lsFraseHTML(f, i)).join('')}</div>

        <button id="ls-play-todo" class="w-full btn-juice bg-[#FF7A00] text-white font-bold py-3 rounded-xl mt-4 text-sm">
          <i class="fas fa-list-ol mr-2"></i>Reproducir frase por frase, en orden
        </button>
      </div>`;

    document.getElementById('ls-volver').onclick = () => { lsDetenerAudio(); renderListening(); };
    document.getElementById('ls-play-full').onclick = () => lsPlayFull();
    document.getElementById('ls-play-todo').onclick = () => lsPlaySecuencia(0);
    document.getElementById('ls-ver-texto').onclick = () => {
      lsTextoAbierto = !lsTextoAbierto;
      document.getElementById('ls-caja-texto').classList.toggle('hidden', !lsTextoAbierto);
      document.getElementById('ls-ver-texto').innerHTML =
        `<i class="fas fa-file-lines mr-1"></i>${lsTextoAbierto ? 'Ocultar' : 'Ver'} transcript`;
    };
    lsBindVelocidades();
    lsBindFrases();
  }

  /* Baraja las palabras de la frase. Se evita que salgan ya en su sitio
     (sería un ejercicio regalado) reintentando unas cuantas veces; en
     frases de una o dos palabras eso es imposible y da igual. */
  function lsBarajar(palabras) {
    const original = palabras.join(' ');
    for (let intento = 0; intento < 8; intento++) {
      const a = [...palabras];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      if (a.join(' ') !== original || palabras.length < 3) return a;
    }
    return [...palabras].reverse();
  }

  const lsPalabrasDe = (f) => String(f.en || '').split(/\s+/).filter(Boolean);

  function lsFraseHTML(f, i) {
    const puntaje = Number((lsProgreso[lsTextoActual?.id] || {})[String(i)] || 0);
    const estrellas = puntaje
      ? Array.from({ length: 5 }, (_, k) => `<i class="fas fa-star text-[9px] ${k < puntaje ? 'text-yellow-400' : 'text-slate-200'}"></i>`).join('')
      : '';
    return `
      <div class="ls-frase rounded-xl border-2 ${puntaje >= 4 ? 'border-green-200 bg-green-50/40' : 'border-slate-100 bg-slate-50'} p-3" data-i="${i}">
        <div class="flex items-center gap-2 mb-2">
          <button class="ls-play-frase shrink-0 w-9 h-9 rounded-full bg-white border-2 border-slate-200 text-[#FF7A00] hover:border-[#FF7A00] flex items-center justify-center" data-i="${i}" title="Escuchar esta frase">
            <i class="fas fa-play text-xs"></i>
          </button>
          <span class="text-[10px] font-black text-slate-300">FRASE ${i + 1}</span>
          <span class="ls-estrellas">${estrellas}</span>
          <span class="flex-1"></span>
          <button class="ls-mic shrink-0 w-9 h-9 rounded-full bg-[#FF7A00] text-white flex items-center justify-center" data-i="${i}" title="Repetir esta frase en voz alta">
            <i class="fas fa-microphone text-xs"></i>
          </button>
        </div>

        <!-- Renglón donde se van colocando las palabras elegidas -->
        <div class="ls-linea min-h-[38px] rounded-lg border-2 border-dashed border-slate-200 bg-white p-1.5 flex flex-wrap gap-1 items-start mb-1.5" data-i="${i}"></div>
        <!-- Montón de palabras desordenadas -->
        <div class="ls-banco flex flex-wrap gap-1" data-i="${i}"></div>

        <p class="ls-frase-es text-[11px] text-slate-400 mt-1.5 hidden"></p>
        <p class="ls-msg text-[11px] font-bold text-slate-400 mt-1.5 hidden"></p>
      </div>`;
  }

  /* Pinta el estado del ejercicio de una frase: lo colocado arriba y lo
     que queda en el banco abajo. Se repinta solo esta frase (no el panel
     entero) para no cortar el audio ni hacer saltar el scroll. */
  function lsPintarOrden(i, { corregido = null } = {}) {
    const fila = document.querySelector(`.ls-frase[data-i="${i}"]`);
    if (!fila) return;
    const f = (lsTextoActual?.frases || [])[i];
    const palabras = lsPalabrasDe(f);
    const puestas = lsOrden[i]?.puestas || [];
    const banco = lsOrden[i]?.banco || [];

    const linea = fila.querySelector('.ls-linea');
    const cajaBanco = fila.querySelector('.ls-banco');

    linea.innerHTML = puestas.length
      ? puestas.map((w, k) => {
          let color = 'bg-white border-slate-200 text-slate-700';
          if (corregido) color = (w === palabras[k])
            ? 'bg-green-100 border-green-300 text-green-700'
            : 'bg-red-100 border-red-300 text-red-700';
          return `<button class="ls-quitar border rounded-md px-1.5 py-0.5 text-[13px] font-semibold ${color}" data-i="${i}" data-k="${k}">${escapeHTML(w)}</button>`;
        }).join('')
      : `<span class="text-[11px] text-slate-300 px-1 py-0.5">Toca las palabras en orden…</span>`;

    cajaBanco.innerHTML = banco.map((w, k) =>
      `<button class="ls-poner bg-white border border-slate-300 hover:border-[#FF7A00] rounded-md px-1.5 py-0.5 text-[13px] font-semibold text-slate-700" data-i="${i}" data-k="${k}">${escapeHTML(w)}</button>`
    ).join('');
    cajaBanco.classList.toggle('hidden', banco.length === 0);

    fila.querySelectorAll('.ls-poner').forEach(b => {
      b.onclick = () => lsPonerPalabra(Number(b.dataset.i), Number(b.dataset.k));
    });
    fila.querySelectorAll('.ls-quitar').forEach(b => {
      b.onclick = () => lsQuitarPalabra(Number(b.dataset.i), Number(b.dataset.k));
    });
  }

  function lsPrepararOrden(i, { rebarajar = true } = {}) {
    const f = (lsTextoActual?.frases || [])[i];
    if (!f) return;
    const palabras = lsPalabrasDe(f);
    if (rebarajar || !lsOrden[i]) lsOrden[i] = { puestas: [], banco: lsBarajar(palabras) };
    lsPintarOrden(i);
  }

  function lsPonerPalabra(i, k) {
    const st = lsOrden[i];
    if (!st) return;
    st.puestas.push(st.banco.splice(k, 1)[0]);
    lsPintarOrden(i);
    if (!st.banco.length) lsCorregirOrden(i);
  }

  function lsQuitarPalabra(i, k) {
    const st = lsOrden[i];
    if (!st) return;
    st.banco.push(st.puestas.splice(k, 1)[0]);
    lsPintarOrden(i);
    const fila = document.querySelector(`.ls-frase[data-i="${i}"]`);
    const msg = fila?.querySelector('.ls-msg');
    if (msg) { msg.classList.add('hidden'); msg.textContent = ''; }
  }

  /* Corrige el orden. La nota se calcula por posiciones acertadas, no es
     todo-o-nada: así una frase larga con una palabra fuera de sitio no
     puntúa lo mismo que una hecha al azar. */
  async function lsCorregirOrden(i) {
    const f = (lsTextoActual?.frases || [])[i];
    const st = lsOrden[i];
    if (!f || !st) return;
    const correcto = lsPalabrasDe(f);
    const aciertos = st.puestas.filter((w, k) => w === correcto[k]).length;
    const perfecto = aciertos === correcto.length;
    const ratio = correcto.length ? aciertos / correcto.length : 0;
    const puntaje = perfecto ? 5 : (ratio >= 0.8 ? 4 : ratio >= 0.6 ? 3 : ratio >= 0.4 ? 2 : 1);

    lsPintarOrden(i, { corregido: true });

    const fila = document.querySelector(`.ls-frase[data-i="${i}"]`);
    const msg = fila?.querySelector('.ls-msg');
    const es = fila?.querySelector('.ls-frase-es');
    if (msg) {
      msg.classList.remove('hidden');
      msg.innerHTML = perfecto
        ? '<span class="text-green-600">✅ ¡Perfecto! Ahora repítela en voz alta 🎙️</span>'
        : `<span class="text-slate-500">${aciertos} de ${correcto.length} en su sitio. Toca una palabra para moverla, o <button class="ls-reintentar underline font-black text-[#FF7A00]" data-i="${i}">empezar de nuevo</button>.</span>`;
      const re = msg.querySelector('.ls-reintentar');
      if (re) re.onclick = () => { lsPrepararOrden(i); msg.classList.add('hidden'); lsPlayFrase(i); };
    }
    // La traducción solo se revela DESPUÉS de intentarlo: antes sería un chivatazo.
    if (es && f.es) { es.textContent = f.es; es.classList.remove('hidden'); }

    await lsGuardarPuntaje(i, puntaje);
    lsRefrescarFrase(i, puntaje);
    if (perfecto && window.confetti) {
      confetti({ particleCount: 55, spread: 55, origin: { y: 0.7 }, colors: ['#FF7A00', '#fbbf24'] });
    }
    if (!perfecto) setTimeout(() => lsPlayFrase(i), 400);   // vuelve a sonar el modelo
  }

  function lsBindVelocidades() {
    document.querySelectorAll('.ls-vel').forEach(b => {
      b.onclick = () => {
        lsVelocidad = Number(b.dataset.v);
        // Si algo está sonando, el cambio se nota al instante.
        if (lsAudio) lsAudio.playbackRate = lsVelocidad;
        document.querySelectorAll('.ls-vel').forEach(x => {
          const activo = Number(x.dataset.v) === lsVelocidad;
          x.className = `ls-vel btn-juice px-2.5 py-1.5 rounded-lg text-[11px] font-black ${activo ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-500'}`;
        });
      };
    });
  }

  function lsBindFrases() {
    (lsTextoActual?.frases || []).forEach((f, i) => lsPrepararOrden(i, { rebarajar: !lsOrden[i] }));
    document.querySelectorAll('.ls-play-frase').forEach(b => {
      b.onclick = () => lsPlayFrase(Number(b.dataset.i));
    });
    document.querySelectorAll('.ls-mic').forEach(b => {
      b.onclick = () => lsShadow(Number(b.dataset.i), b);
    });
  }

  function lsPlayFull() {
    const t = lsTextoActual;
    const btn = document.getElementById('ls-play-full');
    if (!t?.audio_url) { showToast('⚠️ Este texto todavía no tiene audio generado.'); return; }
    if (lsAudio && lsFraseSonando === null) {   // segundo toque = parar
      lsDetenerAudio();
      if (btn) btn.innerHTML = '<i class="fas fa-play mr-2"></i>Escuchar el texto';
      return;
    }
    lsTocar(lsUrl(t.audio_url), {
      onFin: () => { const b = document.getElementById('ls-play-full'); if (b) b.innerHTML = '<i class="fas fa-play mr-2"></i>Escuchar el texto'; }
    });
    if (btn) btn.innerHTML = '<i class="fas fa-stop mr-2"></i>Detener';
  }

  function lsPlayFrase(i, onFin) {
    const f = (lsTextoActual?.frases || [])[i];
    if (!f) return;
    if (!f.audio) { showToast('⚠️ Esta frase todavía no tiene audio generado.'); return; }
    // Segundo toque en la misma frase = parar.
    if (lsFraseSonando === i && lsAudio) { lsDetenerAudio(); lsPintarEstadoBotones(); return; }
    lsTocar(lsUrl(f.audio), { onFin });
    lsFraseSonando = i;
    lsPintarEstadoBotones();
  }

  // Encadena todas las frases con una pausa para repetir en medio.
  function lsPlaySecuencia(i) {
    const frases = lsTextoActual?.frases || [];
    if (i >= frases.length) { lsPintarEstadoBotones(); return; }
    const fila = document.querySelector(`.ls-frase[data-i="${i}"]`);
    if (fila) fila.scrollIntoView({ behavior: 'smooth', block: 'center' });
    lsPlayFrase(i, () => setTimeout(() => {
      // Si el usuario tocó otra cosa mientras tanto, la cadena se corta.
      if (lsFraseSonando === null && lsTextoActual) lsPlaySecuencia(i + 1);
    }, 900));
  }

  function lsPintarEstadoBotones() {
    document.querySelectorAll('.ls-play-frase').forEach(b => {
      const activa = Number(b.dataset.i) === lsFraseSonando;
      b.innerHTML = `<i class="fas ${activa ? 'fa-stop' : 'fa-play'} text-xs"></i>`;
      b.classList.toggle('border-[#FF7A00]', activa);
    });
  }

  /* ---------- Shadowing: repetir una frase y que te califique ----------
     Usa el MISMO motor de voz que el modal de práctica (pzEscuchar), así
     el micrófono se comporta igual en toda la app. */
  function lsShadow(i, btn) {
    const f = (lsTextoActual?.frases || [])[i];
    if (!f) return;
    const fila = document.querySelector(`.ls-frase[data-i="${i}"]`);
    const msg = fila?.querySelector('.ls-msg');
    if (msg) msg.classList.remove('hidden');

    if (lsRec) { try { lsRec.detenerYa(); } catch {} return; }   // segundo toque = cortar

    lsDetenerAudio();
    btn.innerHTML = '<i class="fas fa-stop text-xs"></i>';
    lsRec = pzEscuchar(btn, msg, {
      textoEscuchando: 'Repite la frase… 🎙️',
      onFin: async (dicho, err) => {
        lsRec = null;
        btn.innerHTML = '<i class="fas fa-microphone text-xs"></i>';
        if (!dicho) { if (msg) msg.textContent = pzTextoErrorVoz(err); return; }
        const puntaje = pzCalificarLocal(f.en, dicho);
        if (msg) {
          msg.innerHTML = puntaje >= 4
            ? `<span class="text-green-600">✅ ¡Bien dicho!</span> <span class="text-slate-400 font-normal">"${escapeHTML(dicho)}"</span>`
            : `<span class="text-slate-500">Casi. Escucha el modelo y repite 👇</span> <span class="text-slate-400 font-normal">"${escapeHTML(dicho)}"</span>`;
        }
        await lsGuardarPuntaje(i, puntaje);
        lsRefrescarFrase(i, puntaje);
        if (puntaje >= 5 && window.confetti) {
          confetti({ particleCount: 60, spread: 55, origin: { y: 0.7 }, colors: ['#FF7A00', '#fbbf24'] });
        }
        if (puntaje < 4) setTimeout(() => lsPlayFrase(i), 500);   // vuelve a sonar el modelo
      }
    });
    if (!lsRec) btn.innerHTML = '<i class="fas fa-microphone text-xs"></i>';
  }

  // Repinta solo esa tarjeta: repintar el panel entero cortaría el audio y
  // haría saltar el scroll justo cuando la persona está repitiendo.
  function lsRefrescarFrase(i, puntaje) {
    const fila = document.querySelector(`.ls-frase[data-i="${i}"]`);
    if (!fila) return;
    const est = fila.querySelector('.ls-estrellas');
    if (est) {
      est.innerHTML = Array.from({ length: 5 }, (_, k) =>
        `<i class="fas fa-star text-[9px] ${k < puntaje ? 'text-yellow-400' : 'text-slate-200'}"></i>`).join('');
    }
    fila.classList.toggle('border-green-200', puntaje >= 4);
    fila.classList.toggle('bg-green-50/40', puntaje >= 4);
    fila.classList.toggle('border-slate-100', puntaje < 4);
    fila.classList.toggle('bg-slate-50', puntaje < 4);
  }

  /* Solo se guarda si MEJORA la marca anterior: así una repetición mala
     no borra una buena (mismo criterio que frases_puntuaciones). */
  async function lsGuardarPuntaje(i, puntaje) {
    const t = lsTextoActual;
    if (!t || !currentUser) return;
    const previo = lsProgreso[t.id] || (lsProgreso[t.id] = {});
    if (Number(previo[String(i)] || 0) >= puntaje) return;
    previo[String(i)] = puntaje;

    const total = (t.frases || []).length;
    const ok = lsFrasesOk(t.id);
    const { error } = await dbClient.from('listening_progreso').upsert({
      user_id: currentUser.id,
      texto_id: t.id,
      frases_ok: previo,
      mejor_puntaje: Math.max(...Object.values(previo).map(Number), 0),
      completado: total > 0 && ok >= total,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id,texto_id' });
    if (error) console.warn('[listening] no se pudo guardar el avance:', error.message);

    const cont = document.getElementById('ls-contador');
    if (cont) cont.textContent = `${ok}/${total}`;

    if (total > 0 && ok >= total) {
      showToast('🎧 ¡Texto completo! Dominaste todas sus frases.', 3200);
      if (window.confetti) confetti({ particleCount: 110, spread: 70, origin: { y: 0.6 }, colors: ['#FF7A00', '#3b82f6', '#fbbf24'] });
    }
  }


  /* ============================================================
     12. BARRA SUPERIOR Y MENÚ
  ============================================================ */
  document.querySelectorAll('#top-bar button[data-tool]').forEach(btn => {
    btn.onclick = () => {
      const tool = btn.dataset.tool;
      if (tool === 'gramatica') window.location.href = 'gramatica.html';
      else if (tool === 'pronunciacion') window.location.href = 'pronunciacion.html';
      else if (tool === 'listening') { stopSpeaking(); renderInicio(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
      else window.location.href = `abulingo.html?tool=${tool}`;   // traductor y tutor viven en abulingo.html
    };
  });
  const profileBtn = document.getElementById('profile-menu-button');
  const profileDropdown = document.getElementById('profile-menu-dropdown');
  profileBtn.onclick = (e) => { e.stopPropagation(); profileDropdown.classList.toggle('hidden'); };
  document.addEventListener('click', (e) => {
    if (!profileDropdown.contains(e.target) && !profileBtn.contains(e.target)) profileDropdown.classList.add('hidden');
  });
  document.getElementById('logout-btn').onclick = async () => {
    AbuProgreso.guardarYa();
    await dbClient.auth.signOut();
    window.location.href = 'index.html';
  };
  const setTxt = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  const setSrc = (id, val) => { const el = document.getElementById(id); if (el && val) el.src = val; };
  const PLAN_LABEL = { gratis: 'Gratis', plus: 'Plus', pro: 'Pro', super_pro: 'Super Pro' };
  function fillProfileMenu() {
    setTxt('user-name-dropdown', (userProfile.full_name || '').split(' ')[0] || 'Mi Perfil');
    setTxt('user-lingots', userProfile.lingots || 0);
    setSrc('user-avatar', userProfile.avatar_url);
    setTxt('user-nivel-dropdown', `Nivel ${userProfile.nivel || 'A1'}`);
    setTxt('user-plan-dropdown', PLAN_LABEL[userProfile.plan || 'gratis'] || 'Gratis');
    const menuTutor = document.getElementById('menu-solicitar-tutor');
    if (menuTutor) menuTutor.classList.toggle('hidden', userProfile.plan !== 'super_pro');
  }

  /* ============================================================
     13. ARRANQUE
  ============================================================ */
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const r = await AbuProgreso.iniciar({ app: 'listening', dbClient });
      if (!r) return;   // sin sesión: ya se redirigió al login
      currentUser = r.user;
      P = Object.assign(baseProgreso(), r.datos || {});
      P.errores = Object.assign({ desconocida: 0, noReconocida: 0 }, P.errores || {});

      const { data: profile } = await dbClient.from('profiles').select('points, lingots, nivel, plan, role, full_name, avatar_url, flujo').eq('id', currentUser.id).maybeSingle();
      userProfile = profile || {};
      flujo = userProfile.flujo || {};
      ensureDaily();
      fillProfileMenu();

      const nivelPerfil = NIVELES_FIJOS.includes(userProfile.nivel) ? userProfile.nivel : (/^C/.test(userProfile.nivel || '') ? 'B2' : 'A1');
      nivel = NIVELES_FIJOS.includes(P.nivel) ? P.nivel : nivelPerfil;

      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('app-container').classList.remove('hidden');

      // Listening es parte de las herramientas de pago (como Pronunciación, de
      // donde viene); el equipo (admin) entra siempre para revisar el contenido.
      if ((userProfile.plan || 'gratis') === 'gratis' && !['admin', 'super_admin'].includes(userProfile.role)) {
        panel().innerHTML = `
          <div class="card-3d p-7 text-center animate-pop mt-6">
            <div class="text-5xl mb-3">🔒</div>
            <h2 class="text-2xl font-heading font-bold text-slate-800 mb-2">Función Pro</h2>
            <p class="text-slate-500 mb-6">Listening (dictado, habla conectada, vocabulario por el oído y shadowing) es parte de los planes de pago: Plus, Pro y Super Pro.</p>
            <button id="ls-volver-app" class="w-full btn-juice bg-[#FF7A00] text-white font-bold py-3 rounded-xl text-lg">Volver a Abulingo</button>
          </div>`;
        document.getElementById('ls-volver-app').onclick = () => { window.location.href = 'abulingo.html'; };
      } else {
        renderInicio();
      }

      window.AbuMenu?.init({
        dbClient, currentUser, userProfile, flujo,
        showModal, closeModal, showToast, escapeHTML,
        guardarFlujo: updateUserFlow,
        pagina: 'listening',
        config: { WHATSAPP_COMUNIDAD_URL, NIVELES_FIJOS, MISION_PALABRAS_DIA, MISION_FRASES_DIA, MISION_RECOMPENSA_LINGOTS }
      });
      window.AbuMenu?.bind({ perfil: false });
      window.AbuMenu?.refreshBadges();
      window.AbuAnuncio?.mostrarSiToca({ dbClient, userId: currentUser.id, pagina: 'listening', plan: userProfile.plan || 'gratis' });
    } catch (e) {
      console.error(e);
      document.getElementById('loading-screen').innerHTML =
        '<div class="text-center"><h1 class="text-2xl font-heading font-bold text-slate-600">😵 Algo salió mal</h1><p class="text-slate-400 text-sm mt-2">Recarga la página.</p></div>';
    }
  });
</script>
