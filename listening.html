  let currentUser = null;

  /* ============================================================
     2. UTILIDADES (las mismas de pronunciacion.html)
  ============================================================ */
  const escapeHTML = (s) => (s || '').toString()
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  const pzSinPuntuacion = (s) => (s || '').toString()
    .replace(/[.,!?;:¡¿'"“”‘’`´()\[\]{}\-–—_/\\]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();

  function pzLevenshtein(a, b) {
    const m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const curr = [i];
      for (let j = 1; j <= n; j++) {
        const costo = a[i - 1] === b[j - 1] ? 0 : 1;
        curr[j] = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + costo);
      }
      prev = curr;
    }
    return prev[n];
  }

  function pzCalificarLocal(objetivo, dicho) {
    const t = pzSinPuntuacion(objetivo).toLowerCase();
    const d = pzSinPuntuacion(dicho).toLowerCase();
    if (!t || !d) return 0;
    if (t === d) return 5;
    const distancia = pzLevenshtein(t, d);
    const similitud = 1 - distancia / Math.max(t.length, d.length);
    if (similitud >= 0.85) return 4;
    if (similitud >= 0.65) return 3;
    if (similitud >= 0.4) return 2;
    return 1;
  }

  let toastTimer = null;
  function showToast(msg, ms = 2600) {
    let t = document.getElementById('app-toast');
    if (!t) { t = document.createElement('div'); t.id = 'app-toast'; t.className = 'toast'; document.body.appendChild(t); }
    t.innerHTML = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms);
  }

  const barajar = (a) => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const dormir = (ms) => new Promise(r => setTimeout(r, ms));
  const hoy = () => new Date().toISOString().slice(0, 10);
  const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const confeti = (n = 70) => { if (window.confetti) confetti({ particleCount: n, spread: 60, origin: { y: 0.7 }, colors: ['#FF7A00', '#fbbf24', '#0D47A1'] }); };

  /* ---------- Flujo compartido (lo necesita el menú de perfil) ---------- */
  const todayStr = () => new Date().toISOString().slice(0, 10);
  function ensureDaily() {
    if (!flujo.daily) flujo.daily = { date: todayStr(), newWords: 0, reviewed: 0, points: 0, goalShown: false, unlockAt: null, misionPalabras: 0, misionFrases: 0, misionCumplida: false };
    if (flujo.daily.date !== todayStr()) {
      Object.assign(flujo.daily, { date: todayStr(), points: 0, reviewed: 0, goalShown: false, club: { msgs: 0, joins: 0 }, misionPalabras: 0, misionFrases: 0, misionCumplida: false });
    }
    if (!flujo.daily.club) flujo.daily.club = { msgs: 0, joins: 0 };
  }
  async function updateUserFlow() {
    flujo.savedAt = new Date().toISOString();
    userProfile.flujo = flujo;
    const { error } = await dbClient.from('profiles').update({ flujo }).eq('id', currentUser.id);
    if (error) console.error('Error guardando flujo:', error.message);
  }

  /* ---------- Modal genérico (mismo patrón que las otras páginas) ---------- */
  const modalRoot = document.getElementById('modal-root');
  function closeModal() { modalRoot.innerHTML = ''; }
  function showModal({ icon, title, body, actions = [], dismissable = true, size = 'md' }) {
    const maxW = size === 'lg' ? 'max-w-lg' : 'max-w-sm';
    const actionsHTML = actions.map((a, i) =>
      `<button data-idx="${i}" class="modal-action w-full btn-juice ${a.style || 'bg-[#FF7A00] text-white'} font-bold py-3 rounded-xl text-lg">${a.label}</button>`
    ).join('');
    modalRoot.innerHTML = `
      <div class="modal-overlay">
        <div class="card-3d ${maxW} w-full p-7 text-center animate-pop relative max-h-[90vh] flex flex-col">

          ${icon ? `<div class="text-6xl mb-3 shrink-0">${icon}</div>` : ''}
          ${title ? `<h2 class="text-2xl font-heading font-bold text-slate-800 mb-2 shrink-0">${title}</h2>` : ''}
          <div class="text-slate-500 mb-6 overflow-y-auto flex-1 min-h-0">${body || ''}</div>
          <div class="space-y-3 shrink-0">${actionsHTML}</div>
        </div>
      </div>`;
    if (dismissable) {
      document.getElementById('modal-close').onclick = closeModal;
      modalRoot.querySelector('.modal-overlay').addEventListener('click', (e) => { if (e.target.classList.contains('modal-overlay')) closeModal(); });
    }
    actions.forEach((a, i) => {
      const btn = modalRoot.querySelector(`.modal-action[data-idx="${i}"]`);
      if (btn) btn.onclick = () => { if (a.onClick) a.onClick(); };
    });
  }

  // Sonido de tap (idéntico al de las otras páginas)
  let audioCtx = null;
  function getAudioCtx() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      return audioCtx;
    } catch { return null; }
  }
  function tono(f1, f2, dur, vol = 0.08, tipo = 'triangle', retraso = 0) {
    const ctx = getAudioCtx();
    if (!ctx) return;
    try {
      const t0 = ctx.currentTime + retraso;
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = tipo;
      osc.frequency.setValueAtTime(f1, t0);
      osc.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
      gain.gain.setValueAtTime(vol, t0);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    } catch {}
  }
  document.addEventListener('pointerdown', (e) => { if (e.target.closest('button')) tono(880, 660, 0.05); }, { passive: true });
  const sonidoBien = () => { tono(660, 880, 0.12, 0.1); tono(880, 1175, 0.14, 0.1, 'triangle', 0.1); };
  const sonidoMal = () => tono(220, 150, 0.25, 0.07, 'sawtooth');

  /* ============================================================
     3. AUDIO
     Cada clip es un mp3 del bucket "listening" (carpeta actividades/),
     generado con voces Chirp3-HD. Se guardan a velocidad normal y el
     navegador los ralentiza con playbackRate, sin cambiar el tono. Si un
     archivo no carga, se lee con la voz del dispositivo para no dejar a
     nadie sin práctica.
  ============================================================ */
  const AUDIO_BASE = `${SUPABASE_URL}/storage/v1/object/public/listening/actividades/`;
  const audioUrl = (archivo) => `${AUDIO_BASE}${archivo}.mp3`;
  const VELOCIDADES = [0.5, 0.75, 1, 1.25];
  let velocidad = 1;
  try { const v = parseFloat(localStorage.getItem('abu-vel-listening')); if (VELOCIDADES.includes(v)) velocidad = v; } catch {}
  let audioActual = null;
  let colaId = 0;

  let ttsVoces = [];
  const cargarVoces = () => { ttsVoces = window.speechSynthesis ? speechSynthesis.getVoices() : []; };
  if (window.speechSynthesis) { cargarVoces(); speechSynthesis.onvoiceschanged = cargarVoces; }
  function hablarRespaldo(texto, vel) {
    return new Promise(resolve => {
      if (!window.speechSynthesis || !texto) return resolve();
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texto);
      const v = ttsVoces.find(x => /en[-_]US/i.test(x.lang)) || ttsVoces.find(x => /^en/i.test(x.lang));
      if (v) u.voice = v;
      u.lang = 'en-US';
      u.rate = 0.95 * vel;
      u.onend = resolve; u.onerror = resolve;
      speechSynthesis.speak(u);
    });
  }

  function stopSpeaking() {
    colaId++;
    if (audioActual) { try { audioActual.pause(); } catch {} audioActual = null; }
    lsDetenerAudio();   // el audio del shadowing de textos va por su lado
    if (window.speechSynthesis) speechSynthesis.cancel();
    document.querySelectorAll('.sonando').forEach(el => el.classList.remove('sonando'));
  }

  // Reproduce un clip y resuelve al terminar. `texto` es el respaldo.
  function tocarClip(archivo, { vel = velocidad, texto = '' } = {}) {
    return new Promise(resolve => {
      if (audioActual) { try { audioActual.pause(); } catch {} }
      const a = new Audio(audioUrl(archivo));
      a.preservesPitch = true; a.mozPreservesPitch = true; a.webkitPreservesPitch = true;
      a.defaultPlaybackRate = vel;
      a.playbackRate = vel;
      audioActual = a;
      let hecho = false;
      const fin = () => { if (hecho) return; hecho = true; if (audioActual === a) audioActual = null; resolve(); };
      a.onended = fin;
      a.onplay = () => { a.playbackRate = vel; };
      a.onerror = () => { if (hecho) return; hecho = true; hablarRespaldo(texto, vel).then(resolve); };
      a.play().catch(() => { if (!hecho) { hecho = true; hablarRespaldo(texto, vel).then(resolve); } });
    });
  }

  // Un solo clip (corta lo que suene). Devuelve true si terminó sin interrupción.
  async function tocar(archivo, opciones = {}) {
    const id = ++colaId;
    await tocarClip(archivo, opciones);
    return id === colaId;
  }

  // Varios clips seguidos, con pausa entre uno y otro. `alPaso(i)` avisa cuál suena.
  async function tocarLista(items, { pausa = 450, alPaso } = {}) {
    const id = ++colaId;
    for (let i = 0; i < items.length; i++) {
      if (id !== colaId) return false;
      if (alPaso) alPaso(i);
      await tocarClip(items[i].archivo, { texto: items[i].texto });
      if (id !== colaId) return false;
      await dormir(pausa);
    }
    if (alPaso) alPaso(-1);
    return id === colaId;
  }

  function velocidadesHTML() {
    return `<div class="flex items-center gap-1.5 flex-wrap">
      <span class="text-[10px] font-black uppercase tracking-wide text-slate-400 mr-0.5"><i class="fas fa-gauge-high"></i> Velocidad</span>
      ${VELOCIDADES.map(v => `<button class="vel-chip ${v === velocidad ? 'on' : ''}" data-vel="${v}">${v}×</button>`).join('')}
    </div>`;
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-vel]');
    if (!b) return;
    velocidad = parseFloat(b.dataset.vel);
    try { localStorage.setItem('abu-vel-listening', String(velocidad)); } catch {}
    document.querySelectorAll('[data-vel]').forEach(x => x.classList.toggle('on', parseFloat(x.dataset.vel) === velocidad));
    if (audioActual) audioActual.playbackRate = velocidad;
  });

  }
  // Minutos de práctica (aproximados): se suma uno por cada minuto con la página visible.
  setInterval(() => { if (P && !document.hidden) { P.minutos = (P.minutos || 0) + 1; guardar(); } }, 60000);

  let nivel = 'A1';

  /* ============================================================
     5. INICIO: nivel, consejos, rutina y actividades
  ============================================================ */

    { id: 'conectada', icon: 'fa-link', color: 'from-[#0D47A1] to-blue-500', titulo: 'Habla conectada', desc: 'Formas débiles, enlaces, elisiones y reducciones como gonna o wanna.', tiempo: '5 min' },
    { id: 'vocab', icon: 'fa-ear-listen', color: 'from-emerald-500 to-green-600', titulo: 'Vocabulario por el oído', desc: 'Palabras frecuentes que conoces escritas pero no reconoces al oírlas.', tiempo: '5 min' },
    { id: 'prediccion', icon: 'fa-wand-magic-sparkles', color: 'from-purple-500 to-fuchsia-600', titulo: 'Predice y escucha', desc: 'Anticipa lo que vas a oír, escucha sin texto y revisa después.', tiempo: '8 min' },
    { id: 'contar', icon: 'fa-hashtag', color: 'from-amber-500 to-orange-500', titulo: 'Cuenta las palabras', desc: 'Frases rápidas: ¿cuántas palabras hay de verdad en lo que oíste?', tiempo: '3 min' },
    { id: 'shadowing', icon: 'fa-headphones', color: 'from-slate-700 to-slate-900', titulo: 'Shadowing de textos', desc: 'Escucha un texto, ordena sus frases y repítelas encima del audio.', tiempo: '10 min' }
  ];

  function progresoActividad(id) {
    if (id === 'dictado') { const l = D.dictados[nivel]; return [l.filter(d => P.dictado[d.id]).length, l.length]; }
    if (id === 'conectada') { const l = D.conectada[nivel]; return [l.filter(c => (P.conectada[c.id]?.mejor || 0) >= 80).length, l.length]; }
    if (id === 'vocab') { const l = D.vocab[nivel], v = P.vocab[nivel] || {}; return [l.filter(w => (v[w[0]]?.ok || 0) > 0).length, l.length]; }
    if (id === 'prediccion') { const l = D.prediccion[nivel]; return [l.filter(p => P.prediccion[p.id]).length, l.length]; }
    if (id === 'contar') { const m = P.contar[nivel]?.mejor || 0; return [m, D.contar[nivel].length]; }

  }

  /* ============================================================
     6. DICTADO
     Se escucha el clip completo, luego cada frase (las veces que haga
     falta) y se escribe. Al comprobar se alinean las palabras con lo
     que se dijo de verdad y cada error se clasifica: ¿no conocías la
     palabra, o la conocías pero no la reconociste? Esa diferencia dice
     qué practicar después.
  ============================================================ */
  const CONTRACCIONES = {
    "i'm": 'i am', "you're": 'you are', "we're": 'we are', "they're": 'they are', "he's": 'he is', "she's": 'she is',
    "it's": 'it is', "that's": 'that is', "what's": 'what is', "where's": 'where is', "who's": 'who is', "how's": 'how is',
    "there's": 'there is', "here's": 'here is', "let's": 'let us', "i've": 'i have', "you've": 'you have', "we've": 'we have',
    "they've": 'they have', "i'll": 'i will', "you'll": 'you will', "he'll": 'he will', "she'll": 'she will', "it'll": 'it will',
    "we'll": 'we will', "they'll": 'they will', "i'd": 'i would', "you'd": 'you would', "he'd": 'he would', "she'd": 'she would',
    "we'd": 'we would', "they'd": 'they would', "it'd": 'it would', "don't": 'do not', "doesn't": 'does not', "didn't": 'did not',
    "isn't": 'is not', "aren't": 'are not', "wasn't": 'was not', "weren't": 'were not', "can't": 'can not', "cannot": 'can not',
    "won't": 'will not', "wouldn't": 'would not', "shouldn't": 'should not', "couldn't": 'could not', "haven't": 'have not',
    "hasn't": 'has not', "hadn't": 'had not', "ok": 'okay'
  };
  function tokens(texto) {
    const t = (texto || '').toLowerCase().replace(/[’‘`´]/g, "'")
      .replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
    if (!t) return [];
    return t.split(' ').flatMap(w => (CONTRACCIONES[w] || w.replace(/^'+|'+$/g, '')).split(' ')).filter(Boolean);
  }
  // Tokens "de pantalla": las palabras tal como se dijeron, para mostrarlas.
  // Alinea lo esperado con lo escrito (distancia de edición por palabras).
  function alinear(esperado, escrito) {
    const a = esperado, b = escrito, m = a.length, n = b.length;
    const dp = Array.from({ length: m + 1 }, (_, i) => Array.from({ length: n + 1 }, (_, j) => i === 0 ? j : j === 0 ? i : 0));
    const cercana = (x, y) => x.length >= 4 && pzLevenshtein(x, y) <= 1;
    const coste = (x, y) => x === y ? 0 : cercana(x, y) ? 0.4 : 1;
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + coste(a[i - 1], b[j - 1]));
    const ops = [];
    let i = m, j = n;
    while (i > 0 || j > 0) {
      if (i > 0 && j > 0 && dp[i][j] === dp[i - 1][j - 1] + coste(a[i - 1], b[j - 1])) {
        const x = a[i - 1], y = b[j - 1];
        ops.push({ tipo: x === y ? 'ok' : cercana(x, y) ? 'casi' : 'mal', esp: x, escr: y });
        i--; j--;
      } else if (i > 0 && dp[i][j] === dp[i - 1][j] + 1) { ops.push({ tipo: 'falta', esp: a[i - 1] }); i--; }
      else { ops.push({ tipo: 'sobra', escr: b[j - 1] }); j--; }
    }
    return ops.reverse();
  }

  let dict = null;   // { d, respuestas: [], resultados: [], clasif: {} }

  function renderDictados() {
    const lista = D.dictados[nivel];
    panel().innerHTML = cabecera('Dictado', 'Toma un clip de 20–30 segundos, escríbelo frase por frase y compáralo con la transcripción. Luego clasifica cada error.') + `
      <div class="space-y-2">
        ${lista.map(d => {
          const p = P.dictado[d.id];
          return `<button class="act-card w-full" data-dict="${d.id}">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl ${p ? 'bg-green-500' : 'bg-slate-100'} flex items-center justify-center shrink-0">
                <i class="fas ${p ? 'fa-check text-white' : 'fa-pen text-[#FF7A00]'} text-sm"></i></div>
              <div class="flex-1 min-w-0">
                <p class="font-heading font-black text-slate-800 leading-tight">${escapeHTML(d.titulo)}</p>
                <p class="text-[11px] text-slate-400">${escapeHTML(d.es)} · ${d.frases.length} frases</p>
              </div>
              ${p ? `<span class="text-xs font-black text-green-600">${p.mejor}%</span>` : ''}
            </div>

        }).join('')}
