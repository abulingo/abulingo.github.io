  /* ============================================================
     6. ENTORNO DE PRÁCTICA (modal): escuchar modelo, grabarse y
        corregir con IA
  ============================================================ */
  let pzCurrentTarget = null;
  let pzMediaRecorder = null;
  let pzChunks = [];
  let pzRecordingBlob = null;
  let pzRecognition = null;
  let pzTranscriptFinal = '';
  let pzRecording = false;
  let pzAutoStopTimer = null;

  function abrirPractica(target) {
    pzCurrentTarget = target;
    pzTranscriptFinal = '';
    pzRecordingBlob = null;
    pzRecording = false;
    stopSpeaking();

    document.getElementById('modal-root').innerHTML = `
      <div class="modal-overlay" id="practica-modal">
        <div class="card-3d max-w-md w-full p-6 relative animate-pop" style="max-height:90vh; overflow-y:auto;">
          <button id="pz-cerrar" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-slate-100 text-slate-400 hover:bg-slate-200 flex items-center justify-center"><i class="fas fa-times"></i></button>

          ${target.nivel ? `<p class="text-center text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1">Nivel ${escapeHTML(target.nivel)}</p>` : '<div class="h-3"></div>'}
          <h2 class="text-center font-heading font-black text-2xl sm:text-3xl text-[#FF7A00] leading-tight mb-1 px-5">${escapeHTML(target.text)}</h2>
          ${target.fonetica ? `<p class="text-center font-mono text-slate-400 text-sm mb-1">/${escapeHTML(target.fonetica)}/</p>` : ''}
          ${target.es ? `<p class="text-center text-slate-500 text-sm mb-4">${escapeHTML(target.es)}</p>` : '<div class="mb-4"></div>'}

          <button id="pz-escuchar" class="btn-juice bg-slate-800 text-white font-bold py-2.5 rounded-xl w-full mb-4">
            <i class="fas fa-volume-up mr-2"></i>Escuchar modelo
          </button>

          <div class="flex flex-col items-center gap-2 py-1">
            <button id="pz-mic" class="mic-btn"><i class="fas fa-microphone text-2xl"></i></button>
            <p id="pz-estado" class="text-xs font-bold text-slate-400 text-center px-4 min-h-[2.5em]">Toca para grabarte</p>
            <div id="pz-ondas" class="hidden items-end gap-1 h-7">
              <span class="wave-bar" style="animation-delay:0s"></span>
              <span class="wave-bar" style="animation-delay:.1s"></span>
              <span class="wave-bar" style="animation-delay:.2s"></span>
              <span class="wave-bar" style="animation-delay:.3s"></span>
              <span class="wave-bar" style="animation-delay:.4s"></span>
            </div>
            <div id="pz-calificacion-local" class="hidden text-xl tracking-wider"></div>
          </div>

          <div id="pz-post-grabacion" class="mt-2"></div>
          <div id="pz-resultado"></div>
        </div>
      </div>`;

    document.getElementById('pz-cerrar').onclick = cerrarPractica;
    document.getElementById('pz-escuchar').onclick = async () => {
      if (target.audioUrl) { new Audio(target.audioUrl).play().catch(() => speak(target.text)); return; }
      // Línea de una conversación creada con IA: se pide su audio real.
      if (target.conversacion?.creada) {
        const b = document.getElementById('pz-escuchar');
        const previo = b.innerHTML;
        b.disabled = true; b.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i>Preparando el audio...';
        const b64 = await pzAudioAbu(target.text, target.rol);
        b.disabled = false; b.innerHTML = previo;
        if (b64) {
          target.audioUrl = `data:audio/mp3;base64,${b64}`;
          const linea = target.conversacion.mensajes?.[target.msgIndex];
          if (linea) linea.audio_url = target.audioUrl;
          new Audio(target.audioUrl).play().catch(() => speak(target.text));
          return;
        }
      }
      speak(target.text);
    };
    document.getElementById('pz-mic').onclick = () => { pzRecording ? pzDetenerGrabacion() : pzIniciarGrabacion(); };
  }

  function cerrarPractica() {
    if (pzRecording) pzDetenerGrabacion();
    stopSpeaking();
    // Si esta práctica se abrió desde una línea de una conversación
    // (modo "Conversar"), al cerrar volvemos a esa conversación en vez
    // de cerrar todo.
    if (pzVolverA) { const volver = pzVolverA; pzVolverA = null; volver(); return; }
    document.getElementById('modal-root').innerHTML = '';
  }

  function pzMostrarCalificacionLocal(puntaje) {
    const cont = document.getElementById('pz-calificacion-local');
    if (!cont) return;
    if (!puntaje) { cont.classList.add('hidden'); cont.innerHTML = ''; return; }
    const estrellas = Array.from({ length: 5 }, (_, i) =>
      `<i class="fas fa-star ${i < puntaje ? 'text-yellow-400' : 'text-slate-200'}"></i>`).join('');
    cont.classList.remove('hidden');
    cont.innerHTML = estrellas;
    if (puntaje >= 5 && window.confetti) {
      confetti({ particleCount: 90, spread: 65, origin: { y: 0.6 }, colors: ['#FF7A00', '#3b82f6', '#fbbf24'] });
    }
  }

  async function pzIniciarGrabacion() {
    if (pzRecording) return;
    pzTranscriptFinal = '';
    pzRecordingBlob = null;
    const resDiv = document.getElementById('pz-resultado');
    if (resDiv) resDiv.innerHTML = '';
    const postDiv = document.getElementById('pz-post-grabacion');
    if (postDiv) postDiv.innerHTML = '';
    pzMostrarCalificacionLocal(0);

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    /* ⚠️ EN CELULAR EL MICRÓFONO ES EXCLUSIVO.
       Antes se abría getUserMedia + MediaRecorder Y ADEMÁS el
       reconocimiento de voz. En Android eso hace que el reconocimiento
       muera con 'audio-capture': el texto quedaba vacío y salía siempre
       "No detecté audio claro". En el PC los dos conviven, por eso allá
       sí funcionaba.
       Ahora, en celular, manda el reconocimiento (es lo que la IA
       necesita para corregirte) y se renuncia a la grabación cruda —
       el botón "Escuchar mi grabación" simplemente no aparece ahí. */
    const grabarAudio = !(esMovilVoz && SR);

    let stream = null;
    if (grabarAudio) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        showToast('⚠️ No pude acceder al micrófono. Revisa los permisos del navegador.');
        return;
      }

      // Grabación cruda (para que el estudiante se escuche a sí mismo)
      pzChunks = [];
      const mimeCandidatos = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
      const mime = window.MediaRecorder && MediaRecorder.isTypeSupported
        ? mimeCandidatos.find(t => MediaRecorder.isTypeSupported(t))
        : null;
      try {
        pzMediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
        pzMediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size) pzChunks.push(e.data); };
        pzMediaRecorder.onstop = () => {
          pzRecordingBlob = new Blob(pzChunks, { type: pzMediaRecorder.mimeType || 'audio/webm' });
          stream.getTracks().forEach(t => t.stop());
          pzActualizarBotonesPostGrabacion();
        };
        pzMediaRecorder.start();
      } catch (err) {
        console.warn('[pronunciación] MediaRecorder no disponible:', err);
        stream.getTracks().forEach(t => t.stop());
      }
    } else {
      pzMediaRecorder = null;
    }

    // Reconocimiento de voz (da el texto que se envía a la IA para la corrección)
    if (SR) {
      pzRecognition = new SR();
      pzRecognition.lang = 'en-US';
      pzRecognition.interimResults = true;
      pzRecognition.maxAlternatives = 1;
      let dicho = '';
      pzRecognition.onresult = (e) => {
        // Se rearma con TODOS los resultados en cada evento. Ir acumulando
        // desde e.resultIndex duplicaba palabras en Chrome de Android.
        let texto = '';
        for (let i = 0; i < e.results.length; i++) texto += e.results[i][0].transcript + ' ';
        dicho = limpiarRepeticionesVoz(texto.trim());
        const estado = document.getElementById('pz-estado');
        if (estado) estado.textContent = dicho ? `"${dicho}"` : 'Escuchando...';
      };
      pzRecognition.onerror = (e) => {
        console.warn('[pronunciación] reconocimiento:', e.error);
        const estado = document.getElementById('pz-estado');
        if (!estado) return;
        // Mensajes que el usuario SÍ puede accionar (antes solo iba a consola).
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed')
          estado.textContent = 'Bloqueaste el micrófono 🔒 — actívalo en el candado de la barra de direcciones';
        else if (e.error === 'audio-capture')
          estado.textContent = 'Otra app está usando el micrófono. Ciérrala e intenta de nuevo.';
      };
      pzRecognition.onend = () => {
        pzTranscriptFinal = dicho.trim();
        pzRecording = false;
        pzTerminarUI();
      };
      try { pzRecognition.start(); } catch (err) { console.warn('[pronunciación] no se pudo iniciar el reconocimiento:', err); }
    } else {
      const estado = document.getElementById('pz-estado');
      if (estado) estado.textContent = 'Grabando... toca de nuevo para detener';
    }

    pzRecording = true;
    const micBtn = document.getElementById('pz-mic');
    const ondas = document.getElementById('pz-ondas');
    if (micBtn) { micBtn.classList.add('recording'); micBtn.innerHTML = '<i class="fas fa-stop text-2xl"></i>'; }
    if (ondas) { ondas.classList.remove('hidden'); ondas.classList.add('flex'); }

    clearTimeout(pzAutoStopTimer);
    pzAutoStopTimer = setTimeout(() => { if (pzRecording) pzDetenerGrabacion(); }, 15000); // tope de seguridad
  }

  function pzDetenerGrabacion() {
    clearTimeout(pzAutoStopTimer);
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (pzRecognition) { try { pzRecognition.stop(); } catch {} }
    if (pzMediaRecorder && pzMediaRecorder.state !== 'inactive') { try { pzMediaRecorder.stop(); } catch {} }
    if (!SR) { pzRecording = false; pzTerminarUI(); } // sin reconocimiento, el fin lo marca aquí mismo
  }

  function pzTerminarUI() {
    const micBtn = document.getElementById('pz-mic');
    if (!micBtn) return; // el modal ya se cerró
    micBtn.classList.remove('recording');
    micBtn.innerHTML = '<i class="fas fa-microphone text-2xl"></i>';
    const ondas = document.getElementById('pz-ondas');
    if (ondas) { ondas.classList.add('hidden'); ondas.classList.remove('flex'); }
    const estado = document.getElementById('pz-estado');
    if (estado) estado.textContent = pzTranscriptFinal ? `Entendí: "${pzTranscriptFinal}"` : 'No detecté audio claro. Intenta de nuevo.';

    // La calificación (1-5) se calcula aquí mismo, comparando lo dicho
    // contra la frase modelo (sin signos de puntuación) — ya no depende
    // de la IA. Se muestra de inmediato y se guarda automáticamente.
    if (pzTranscriptFinal && pzCurrentTarget) {
      const puntajeLocal = pzCalificarLocal(pzCurrentTarget.text, pzTranscriptFinal);
      pzMostrarCalificacionLocal(puntajeLocal);
      pzGuardarPuntuacion(puntajeLocal);
    } else {
      pzMostrarCalificacionLocal(0);
    }

    pzActualizarBotonesPostGrabacion();
  }

  function pzActualizarBotonesPostGrabacion() {
    const cont = document.getElementById('pz-post-grabacion');
    if (!cont) return;
    const puedeIA = !!(window.SpeechRecognition || window.webkitSpeechRecognition) && !!pzTranscriptFinal;
    cont.innerHTML = `
      ${pzRecordingBlob ? `<button id="pz-escuchar-yo" class="btn-juice bg-slate-100 text-slate-600 font-bold py-2.5 rounded-xl w-full mb-2"><i class="fas fa-play mr-2"></i>Escuchar mi grabación</button>` : ''}
      ${(!pzRecordingBlob && esMovilVoz && puedeIA) ? '<p class="text-[10px] text-slate-300 text-center mb-2">En el celular el micrófono es exclusivo del reconocimiento de voz, así que aquí no se guarda tu audio.</p>' : ''}
      <button id="pz-continuar" class="btn-juice bg-green-500 text-white font-bold py-2.5 rounded-xl w-full mb-2">
        <i class="fas fa-check mr-2"></i>Continuar
      </button>
      <button id="pz-corregir" class="btn-juice bg-gradient-to-br from-[#FF7A00] to-orange-600 text-white font-bold py-2.5 rounded-xl w-full" ${puedeIA ? '' : 'disabled'}>
        <i class="fas fa-wand-magic-sparkles mr-2"></i>Corregir con IA
      </button>
      ${!puedeIA ? '<p class="text-[11px] text-slate-400 text-center mt-2">Necesito escucharte con claridad (o un navegador con reconocimiento de voz, como Chrome) para poder corregirte.</p>' : ''}
    `;
    document.getElementById('pz-escuchar-yo')?.addEventListener('click', () => {
      if (pzRecordingBlob) new Audio(URL.createObjectURL(pzRecordingBlob)).play().catch(() => {});
    });
    document.getElementById('pz-corregir')?.addEventListener('click', pzCorregirConIA);
    // "Continuar": cierra la práctica para elegir otra frase, palabra o
    // línea de conversación sin tener que pedir la corrección con IA.
    // La calificación en estrellas ya se guardó al terminar de grabar.
    document.getElementById('pz-continuar')?.addEventListener('click', cerrarPractica);
  }

  /* ---------- Llamadas a Edge Functions con IA ----------
     El servidor exige sesión real + plan pro/super_pro y lleva el cupo
     diario (50 usos). Antes se mandaba la anon key como respaldo, que es
     un JWT válido del proyecto: con eso cualquiera podía llamar a la
     función sin siquiera tener cuenta. Ya no hay respaldo: sin sesión,
     no se llama.
  ---------------------------------------------------------- */
  async function cabecerasIA() {
    const { data: { session } } = await dbClient.auth.getSession();
    const token = session?.access_token;
    if (!token) return null;
    return {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${token}`
    };
  }

  // Traduce el rechazo del portero a algo que el usuario entienda.
  // Devuelve true si ya se avisó (así no se muestra además el toast genérico).
  function pzManejarRechazoIA(payload) {
    switch (payload?.codigo) {
      case 'plan_requerido':
        showModal({
          icon: '🔒',
          title: 'Función Pro',
          body: 'La corrección de pronunciación con IA está reservada para los planes <b>Pro</b> y <b>Super Pro</b>. Mejora tu plan para desbloquearla.',
          actions: [
            { label: 'Ver planes ✨', onClick: () => { window.location.href = 'abulingo.html'; } },
            { label: 'Ahora no', style: 'bg-slate-100 text-slate-500', onClick: closeModal }
          ]
        });
        return true;
      case 'limite_diario':
        showToast(`🌙 Llegaste a tus ${payload.limite} correcciones de hoy. ¡Vuelve mañana!`, 3600);
        return true;
      case 'sin_sesion':
        showToast('Tu sesión expiró — vuelve a iniciar sesión 🔑', 3600);
        return true;
      default:
        return false;
    }
  }

  /* ---------- Corrección escrita con IA (Edge Function) ---------- */
  async function pzCorregirConIA() {
    const btn = document.getElementById('pz-corregir');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i>Analizando tu pronunciación...'; }
    try {
      const headers = await cabecerasIA();
      if (!headers) { pzManejarRechazoIA({ codigo: 'sin_sesion' }); throw new Error('sin sesión'); }
      const resp = await fetch(`${SUPABASE_URL}/functions/v1/corregir-pronunciacion`, {
        method: 'POST',
        headers,
        body: JSON.stringify({
          target: pzSinPuntuacion(pzCurrentTarget.text),
          transcript: pzSinPuntuacion(pzTranscriptFinal),
          nivel: pzCurrentTarget.nivel || userProfile?.nivel || '',
          es: pzCurrentTarget.es || ''
        })
      });
      let payload = null;
      try { payload = await resp.json(); } catch {}
      // Plan insuficiente, cupo agotado o sesión vencida: se avisa con un
      // modal/toast claro, no con el mensaje genérico de "no pude conectar".
      if (!resp.ok && payload?.codigo && pzManejarRechazoIA(payload)) {
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-wand-magic-sparkles mr-2"></i>Corregir con IA'; }
        return;
      }
      if (!resp.ok || !payload?.feedback) throw new Error(payload?.error || `HTTP ${resp.status}`);
      pzRenderFeedback(payload.feedback);
    } catch (err) {
      console.warn('[pronunciación] corrección IA:', err?.message || err);
      if (err?.message !== 'sin sesión') showToast('⚠️ No pude conectar con el profesor de IA. Intenta de nuevo.');
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-wand-magic-sparkles mr-2"></i>Corregir con IA'; }
    }
  }

  // Muestra los CONSEJOS del profesor de IA (aciertos, qué mejorar,
  // siguiente paso). La calificación en estrellas ya se calculó y se
  // guardó al terminar de grabar (pzCalificarLocal / pzTerminarUI), así
  // que este botón/función ya no la toca — solo trae la retroalimentación.
  function pzRenderFeedback(fb) {
    const aciertos = (fb.aciertos || []).slice(0, 3).map(a =>
      `<li class="flex items-start gap-2"><i class="fas fa-check text-green-500 mt-0.5"></i><span>${escapeHTML(a)}</span></li>`).join('');
    const mejorar = (fb.mejorar || []).slice(0, 4).map(m => `
      <div class="bg-orange-50 border border-orange-100 rounded-xl p-2.5 mb-2">
        <p class="font-heading font-black text-[#FF7A00] text-sm">${escapeHTML(m.sonido_o_palabra || '')}</p>
        <p class="text-xs text-slate-600 mt-0.5">${escapeHTML(m.consejo || '')}</p>
      </div>`).join('');

    const cont = document.getElementById('pz-resultado');
    if (!cont) return;
    cont.innerHTML = `
      <div class="border-t border-slate-100 pt-4 mt-2 animate-pop">
        <p class="text-center font-bold text-slate-700 text-sm mb-3">${escapeHTML(fb.resumen || '')}</p>
        ${aciertos ? `<ul class="space-y-1 text-sm text-slate-600 mb-3">${aciertos}</ul>` : ''}
        ${mejorar ? `<p class="text-xs font-black uppercase tracking-wide text-slate-400 mb-2">Para mejorar</p>${mejorar}` : ''}
        ${fb.siguiente_paso ? `<p class="text-xs text-slate-500 italic mt-2">💡 ${escapeHTML(fb.siguiente_paso)}</p>` : ''}
        <button id="pz-otra-vez" class="btn-juice bg-slate-800 text-white font-bold py-2.5 rounded-xl w-full mt-4">

  /* ---------- Guarda la puntuación (1-5), ya calculada localmente ----------
     Si la práctica venía de una frase de la lista ("frases por nivel" o
     su buscador), se guarda en `frases_puntuaciones`. Si venía de una
     línea dentro de una conversación (modo "Conversar"), se guarda en
     `conversaciones_puntuaciones` (promedio de las líneas ya
     practicadas de esa conversación). En "Buscar palabra" y "Mi texto"
     no hay un id fijo que guardar, así que no se registra nada ahí —
     igual se ve la calificación en pantalla. */
  function pzGuardarPuntuacion(puntajeCrudo) {
    const puntaje = Math.max(0, Math.min(5, parseInt(puntajeCrudo, 10) || 0));
    if (!puntaje || !pzCurrentTarget) return;
    if (pzCurrentTarget.id) {
      pzGuardarPuntajeFrase(pzCurrentTarget.id, puntaje);
    } else if (pzCurrentTarget.conversacion) {
      pzConvPuntajes[pzCurrentTarget.msgIndex] = puntaje;
      if (pzCurrentTarget.conversacion.creada) {
        // Conversación creada por el usuario: se guarda en su perfil.
        const bolsa = pzConvCreadasPuntajes();
        if (!bolsa[pzCurrentTarget.conversacion.id]) bolsa[pzCurrentTarget.conversacion.id] = {};
        bolsa[pzCurrentTarget.conversacion.id][pzCurrentTarget.msgIndex] = puntaje;
        updateUserFlow();
      } else {
        pzGuardarPuntajeLineaConversacion(pzCurrentTarget.conversacion.id, pzCurrentTarget.msgIndex, puntaje);
      }
    }
  }

  // Caché en memoria de las puntuaciones ya guardadas por el usuario,
  // para pintar las estrellitas en la lista sin tener que recalcular.
  let pzPuntajesFrases = {}; // { fraseId: puntaje }

  async function pzGuardarPuntajeFrase(fraseId, puntaje) {
    try {
      const { data: existente } = await dbClient.from('frases_puntuaciones')
        .select('id,puntaje,mejor_puntaje,intentos')
        .eq('user_id', currentUser.id).eq('frase_id', fraseId).maybeSingle();
      const mejor = Math.max(puntaje, existente?.mejor_puntaje || 0);
      const intentos = (existente?.intentos || 0) + 1;
      const { error } = await dbClient.from('frases_puntuaciones').upsert({
        user_id: currentUser.id, frase_id: fraseId, puntaje, mejor_puntaje: mejor, intentos, updated_at: new Date().toISOString()
      }, { onConflict: 'user_id,frase_id' });
      if (error) { console.warn('[pronunciación] no se pudo guardar la puntuación de la frase:', error.message); return; }
      pzPuntajesFrases[fraseId] = mejor;
      pintarFraseLista();
    } catch (e) { console.warn('[pronunciación] puntuación de frase:', e); }
  }

  async function pzGuardarPuntajeConversacion(conversacionId) {
    try {
      const valores = Object.values(pzConvPuntajes);
      if (!valores.length) return;
      const promedio = Math.round(valores.reduce((a, b) => a + b, 0) / valores.length);
      const { data: existente } = await dbClient.from('conversaciones_puntuaciones')
        .select('id,intentos').eq('user_id', currentUser.id).eq('conversacion_id', conversacionId).maybeSingle();
      const intentos = (existente?.intentos || 0) + 1;
      const { error } = await dbClient.from('conversaciones_puntuaciones').upsert({
        user_id: currentUser.id, conversacion_id: conversacionId, puntaje: promedio, intentos, updated_at: new Date().toISOString()
      }, { onConflict: 'user_id,conversacion_id' });
      if (error) { console.warn('[pronunciación] no se pudo guardar la puntuación de la conversación:', error.message); return; }
      // Refresca el resumen de progreso: una conversación pasa a "dominada"
      // en cuanto su promedio global llega a 5.
      cargarYPintarProgreso();
    } catch (e) { console.warn('[pronunciación] puntuación de conversación:', e); }
  }

  // Guarda la calificación (1-5) de UNA línea concreta dentro de una
  // conversación (persiste entre sesiones) y recalcula/guarda el promedio
  // global de esa conversación con TODAS las líneas ya practicadas.
  async function pzGuardarPuntajeLineaConversacion(conversacionId, lineaIndice, puntaje) {
    try {
      const { data: existente } = await dbClient.from('conversaciones_pronunciacion_lineas')
        .select('id,intentos').eq('user_id', currentUser.id).eq('conversacion_id', conversacionId).eq('linea_indice', lineaIndice).maybeSingle();
      const intentos = (existente?.intentos || 0) + 1;
      const { error } = await dbClient.from('conversaciones_pronunciacion_lineas').upsert({
        user_id: currentUser.id, conversacion_id: conversacionId, linea_indice: lineaIndice, puntaje, intentos, updated_at: new Date().toISOString()
      }, { onConflict: 'user_id,conversacion_id,linea_indice' });
      if (error) { console.warn('[pronunciación] no se pudo guardar la línea de la conversación:', error.message); return; }
      await pzGuardarPuntajeConversacion(conversacionId);
    } catch (e) { console.warn('[pronunciación] línea de conversación:', e); }
  }

  /* ============================================================
     6.5 TRADUCTOR (funciona aquí mismo, no redirige a abulingo.html)
  ============================================================ */
  const TR_MAX_LOCAL = 8000;   // tope para cargar el diccionario en memoria
  const TR_MAX_RESULTS = 40;
  let trIndice = null;         // entradas preparadas (modo local)
  let trCarga = null;          // promesa de carga en curso
  let trModo = 'local';        // 'local' (todo en memoria) | 'remoto' (consulta por consulta)
  let trDir = 'auto';          // 'auto' | 'es' (escribo español) | 'en' (escribo inglés)
  let trUltimaBusqueda = 0;

  // Quita acentos SIN cambiar la longitud del texto (1 carácter → 1 carácter),
  // para poder resaltar la coincidencia sobre el texto original.
  const TR_MARCAS = new RegExp('[\\u0300-\\u036f]', 'g');   // tildes/diéresis ya separadas por NFD
  const trSinAcentos = (s) => (s || '').toString().normalize('NFD').replace(TR_MARCAS, '');
  const trHKey = (s) => trSinAcentos(s).toLowerCase();                  // conserva longitud
  const trKey = (s) => trHKey(s).replace(/[.,;:!?¡¿"'()[\]/|]/g, ' ').replace(/\s+/g, ' ').trim();

  // "ese, esa, eso; aquel / aquella" → ["ese","esa","eso","aquel","aquella"]
  const trPartes = (txt) => (txt || '').toString().split(/[,;/|]|\s+o\s+/i)
    .map(s => s.trim()).filter(Boolean);

  // Deja cada fila de "palabras" lista para buscar (se calcula UNA vez).
  function trPreparar(w) {
    const esPartes = trPartes(w.espanol);
    const enPartes = trPartes(w.ingles);
    return {
      w,
      esPartes: esPartes.length ? esPartes : [(w.espanol || '').trim()],
      enPartes: enPartes.length ? enPartes : [(w.ingles || '').trim()],
      esKeys: [...new Set([...esPartes.map(trKey), trKey(w.espanol)])].filter(Boolean),
      enKeys: [...new Set([...enPartes.map(trKey), trKey(w.ingles)])].filter(Boolean)
    };
  }

  // Puntuación de un término contra lo que escribió la persona.
  // Exacta > empieza por > palabra completa dentro de la frase > contiene.
  function trPuntajeTermino(termino, qk) {
    if (!termino || !qk) return 0;
    if (termino === qk) return 100;
    if (termino.startsWith(qk + ' ')) return 84;
    if (termino.startsWith(qk)) return 78;
    if (termino.includes(' ' + qk + ' ') || termino.endsWith(' ' + qk)) return 66;
    if (termino.includes(qk)) return 46;
    return 0;
  }

  function trEvaluar(e, qk) {
    let puntaje = 0, lado = null, largo = 0;
    const revisar = (keys, cual) => keys.forEach(t => {
      const p = trPuntajeTermino(t, qk);
      if (p > puntaje || (p === puntaje && p > 0 && t.length < largo)) {
        puntaje = p; lado = cual; largo = t.length;
      }
    });
    if (trDir === 'auto' || trDir === 'en') revisar(e.enKeys, 'en');
    if (trDir === 'auto' || trDir === 'es') revisar(e.esKeys, 'es');
    return { puntaje, lado, largo };
  }

  // Distancia de edición acotada: solo para sugerir "¿quisiste decir...?"
  function trDistancia(a, b, tope = 2) {
    if (Math.abs(a.length - b.length) > tope) return tope + 1;
    let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const fila = [i];
      let minFila = i;
      for (let j = 1; j <= b.length; j++) {
        const costo = a[i - 1] === b[j - 1] ? 0 : 1;
        fila[j] = Math.min(prev[j] + 1, fila[j - 1] + 1, prev[j - 1] + costo);
        if (fila[j] < minFila) minFila = fila[j];
      }
      if (minFila > tope) return tope + 1;   // corte temprano
      prev = fila;
    }
    return prev[b.length];
  }

  // ---------- Carga del diccionario ----------
  // PostgREST corta en 1000 filas, así que se pagina. Si la tabla es enorme
  // no se descarga: se pasa a modo "remoto" y cada búsqueda va al servidor.
  function trCargarDiccionario() {
    if (trIndice) return Promise.resolve(trIndice);
    if (trCarga) return trCarga;
    trCarga = (async () => {
      const { count, error: cErr } = await dbClient.from('palabras').select('id', { count: 'exact', head: true });
      if (cErr) { console.warn('[traductor] no se pudo contar "palabras":', cErr.message); trModo = 'remoto'; return null; }
      if ((count || 0) > TR_MAX_LOCAL) { trModo = 'remoto'; return null; }

      const COLS = 'id,ingles,espanol,fonetica,imagen,audio,nivel,grupo';
      const PAGINA = 1000;
      const filas = [];
      for (let desde = 0; ; desde += PAGINA) {
        let { data, error } = await dbClient.from('palabras').select(COLS).order('id').range(desde, desde + PAGINA - 1);
        if (error) {   // por si alguna columna no existe en este proyecto
          ({ data, error } = await dbClient.from('palabras').select('*').order('id').range(desde, desde + PAGINA - 1));
        }
        if (error) { console.warn('[traductor] carga:', error.message); trModo = 'remoto'; return null; }
        filas.push(...(data || []));
        if ((data || []).length < PAGINA) break;
      }
      trModo = 'local';
      trIndice = filas.map(trPreparar);
      console.log('[traductor] diccionario en memoria:', trIndice.length, 'palabras');
      return trIndice;
    })().catch(err => { console.warn('[traductor]', err); trModo = 'remoto'; return null; })
      .finally(() => { trCarga = null; });
    return trCarga;
  }

  // Búsqueda contra el servidor (tablas grandes o si falló la carga local).
  async function trBuscarRemoto(q) {
    const variantes = [...new Set([q, trSinAcentos(q)])]
      .map(s => s.replace(/[%,()*]/g, ' ').trim()).filter(Boolean);
    if (!variantes.length) return [];
    const campos = trDir === 'es' ? ['espanol'] : trDir === 'en' ? ['ingles'] : ['ingles', 'espanol'];
    const vistos = new Set(); const out = [];
    for (const v of variantes) {
      const filtro = campos.map(c => `${c}.ilike.%${v}%`).join(',');
      const { data, error } = await dbClient.from('palabras').select('*').or(filtro).limit(80);
      if (error) { console.warn('[traductor] búsqueda remota:', error.message); continue; }
      (data || []).forEach(w => { if (!vistos.has(w.id)) { vistos.add(w.id); out.push(trPreparar(w)); } });
    }
    return out;
  }

  // ---------- Resaltado ----------
  function trResaltar(texto, q) {
    const original = (texto || '').toString();
    const qh = trHKey(q).trim();
    if (!qh) return escapeHTML(original);
    const i = trHKey(original).indexOf(qh);
    if (i < 0) return escapeHTML(original);
    return escapeHTML(original.slice(0, i)) +
      `<mark class="bg-orange-100 text-[#FF7A00] rounded px-0.5">${escapeHTML(original.slice(i, i + qh.length))}</mark>` +
      escapeHTML(original.slice(i + qh.length));
  }

  // ---------- Modal ----------
  function openTraductor() {
    trDir = 'auto';
    const chip = (dir, txt) => `<button data-dir="${dir}" class="tr-chip btn-juice ${dir === 'auto' ? 'bg-[#FF7A00] text-white' : 'bg-slate-100 text-slate-500'} font-bold text-[11px] px-3 py-1.5 rounded-xl">${txt}</button>`;

    showModal({
      icon: '🔤', title: 'Traductor', size: 'lg',
      body: `
        <div class="text-left">
          <p class="text-slate-400 text-xs text-center mb-3">Escribe en <b>español</b> o en <b>inglés</b>: encuentro la palabra en cualquiera de los dos sentidos.</p>
          <div class="relative mb-3">
            <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-300 text-sm"></i>
            <input id="tr-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
              placeholder="ej: aquella, house, correr…"
              class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl pl-10 pr-10 py-3 font-bold text-slate-700 focus:outline-none focus:border-[#FF7A00]">
            <button id="tr-clear" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-300 hover:text-slate-500 text-xl leading-none" title="Limpiar">&times;</button>
          </div>
          <div class="flex justify-center gap-1.5 mb-3">
            ${chip('auto', '🔎 Ambos')}
            ${chip('es', '🇪🇸 → 🇬🇧')}
            ${chip('en', '🇬🇧 → 🇪🇸')}
          </div>
          <div id="tr-results" class="min-h-[8rem] max-h-[46vh] overflow-y-auto"></div>
        </div>`,
      actions: []
    });

    const input = document.getElementById('tr-input');
    const cajaRes = document.getElementById('tr-results');
    const btnClear = document.getElementById('tr-clear');
    if (!input || !cajaRes) return;

    trPintarVacio(cajaRes, 'inicio');
    setTimeout(() => input.focus(), 120);
    // El diccionario se carga en segundo plano: al terminar se repinta el estado inicial
    // (para mostrar cuántas palabras hay) o se repite la búsqueda que ya haya escrito.
    trCargarDiccionario().then(() => {
      if (!document.getElementById('tr-input')) return;   // cerró el modal antes de terminar
      if (input.value.trim()) trBuscar(input.value);
      else trPintarVacio(cajaRes, 'inicio');
    });

    let temporizador = null;
    const lanzar = () => {
      btnClear.classList.toggle('hidden', !input.value);
      clearTimeout(temporizador);
      temporizador = setTimeout(() => trBuscar(input.value), 170);
    };
    input.addEventListener('input', lanzar);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); clearTimeout(temporizador); trBuscar(input.value); }
      if (e.key === 'Escape') closeModal();
    });
    btnClear.onclick = () => { input.value = ''; btnClear.classList.add('hidden'); input.focus(); trPintarVacio(cajaRes, 'inicio'); };

    // Cambio de sentido de búsqueda
    document.querySelectorAll('.tr-chip').forEach(b => {
      b.onclick = () => {
        trDir = b.dataset.dir;
        document.querySelectorAll('.tr-chip').forEach(o => {
          const activo = o.dataset.dir === trDir;
          o.className = `tr-chip btn-juice ${activo ? 'bg-[#FF7A00] text-white' : 'bg-slate-100 text-slate-500'} font-bold text-[11px] px-3 py-1.5 rounded-xl`;
        });
        if (input.value.trim()) trBuscar(input.value); else trPintarVacio(cajaRes, 'inicio');
        input.focus();
      };
    });

    // Acciones de cada resultado (delegación: la lista se repinta constantemente)
    cajaRes.addEventListener('click', async (e) => {
      const bAudio = e.target.closest('.tr-audio');
      if (bAudio) { playWordAudio({ ingles: bAudio.dataset.en, audio: bAudio.dataset.audio || null }); return; }

      const bSug = e.target.closest('.tr-sug');
      if (bSug) { input.value = bSug.dataset.q; btnClear.classList.remove('hidden'); trBuscar(input.value); input.focus(); return; }

      const bMazo = e.target.closest('.tr-mazo');
      if (bMazo) {
        bMazo.disabled = true;
        await trAgregarAlMazo(bMazo.dataset.id, bMazo.dataset.en, bMazo.dataset.es, bMazo);
      }
    });
  }

  function trPintarVacio(caja, tipo, q = '') {
    if (tipo === 'inicio') {
      caja.innerHTML = `
        <div class="text-center py-6 text-slate-400">
          <div class="text-4xl mb-2">📖</div>
          <p class="text-sm font-bold text-slate-500">Empieza a escribir</p>
          <p class="text-xs mt-1">${trIndice ? `Busco entre <b>${trIndice.length}</b> palabras del curso` : 'Busco en las palabras del curso'}, con o sin acentos.</p>
        </div>`;
    } else if (tipo === 'cargando') {
      caja.innerHTML = spinnerHTML();
    } else {
      caja.innerHTML = `
        <div class="text-center py-6 text-slate-400">
          <div class="text-4xl mb-2">🤔</div>
          <p class="text-sm font-bold text-slate-500">Sin resultados para “${escapeHTML(q)}”</p>
          <p class="text-xs mt-1">Puede que esa palabra aún no esté en el curso.</p>
        </div>`;
    }
  }

  async function trBuscar(texto) {
    const caja = document.getElementById('tr-results');
    if (!caja) return;
    const q = (texto || '').trim();
    const qk = trKey(q);
    if (!qk) return trPintarVacio(caja, 'inicio');

    const turno = ++trUltimaBusqueda;
    if (!trIndice && trModo === 'local') {
      trPintarVacio(caja, 'cargando');
      await trCargarDiccionario();
      if (turno !== trUltimaBusqueda || !document.getElementById('tr-results')) return;
    }

    let candidatos;
    if (trIndice) {
      candidatos = trIndice;
    } else {
      trPintarVacio(caja, 'cargando');
      candidatos = await trBuscarRemoto(q);
      if (turno !== trUltimaBusqueda || !document.getElementById('tr-results')) return;
    }

    const hallados = [];
    candidatos.forEach(e => {
      const r = trEvaluar(e, qk);
      if (r.puntaje > 0) hallados.push({ e, ...r });
    });

    hallados.sort((a, b) =>
      b.puntaje - a.puntaje ||
      a.largo - b.largo ||
      (a.e.w.ingles || '').localeCompare(b.e.w.ingles || ''));

    if (!hallados.length) {
      trPintarVacio(caja, 'vacio', q);
      // ¿Quisiste decir...? (solo con el diccionario en memoria)
      if (trIndice && qk.length >= 4) {
        const cercanas = [];
        trIndice.forEach(e => {
          const keys = trDir === 'es' ? e.esKeys : trDir === 'en' ? e.enKeys : [...e.enKeys, ...e.esKeys];
          let d = 3;
          keys.forEach(t => { if (Math.abs(t.length - qk.length) <= 2) d = Math.min(d, trDistancia(t, qk)); });
          if (d <= 2) cercanas.push({ e, d });
        });
        cercanas.sort((a, b) => a.d - b.d);
        const top = cercanas.slice(0, 5);
        if (top.length) {
          caja.insertAdjacentHTML('beforeend', `
            <div class="text-center pb-2">
              <p class="text-xs font-bold text-slate-400 mb-2">¿Quisiste decir...?</p>
              <div class="flex flex-wrap justify-center gap-1.5">
                ${top.map(c => `<button class="tr-sug btn-juice bg-orange-50 text-[#FF7A00] border border-orange-200 font-bold text-xs px-3 py-1.5 rounded-xl" data-q="${escapeHTML(c.e.w.ingles)}">${escapeHTML(c.e.w.ingles)}</button>`).join('')}
              </div>
            </div>`);
        }
      }
      return;
    }

    const visibles = hallados.slice(0, TR_MAX_RESULTS);
    caja.innerHTML = `
      <p class="text-[11px] font-bold text-slate-400 mb-2 px-1">
        ${hallados.length} resultado(s)${hallados.length > visibles.length ? ` · mostrando ${visibles.length}` : ''}
      </p>
      ${visibles.map(h => trItemHTML(h, q)).join('')}`;
    caja.scrollTop = 0;
  }

  function trItemHTML({ e, lado }, q) {
    const w = e.w;
    const fon = w.fonetica ? `/${escapeHTML(w.fonetica)}/` : '';
    const img = w.imagen
      ? `<img src="${escapeHTML(w.imagen)}" alt="" loading="lazy" class="w-12 h-12 rounded-xl object-contain bg-slate-50 border border-slate-100 shrink-0">`
      : `<div class="w-12 h-12 rounded-xl bg-slate-50 border border-slate-100 shrink-0 flex items-center justify-center text-slate-300"><i class="fas fa-image"></i></div>`;

    // Los significados que coinciden se muestran primero y resaltados.
    const coincide = (s) => trHKey(s).includes(trHKey(q).trim());
    const partes = [...e.esPartes].sort((a, b) => (coincide(b) ? 1 : 0) - (coincide(a) ? 1 : 0));
    const significados = partes.map(s =>
      `<span class="inline-block text-[11px] font-bold px-2 py-0.5 rounded-full mr-1 mb-1 ${coincide(s) ? 'bg-orange-50 text-[#FF7A00] border border-orange-200' : 'bg-slate-100 text-slate-500'}">${trResaltar(s, q)}</span>`
    ).join('');

    const etiquetas = [w.nivel, w.grupo].filter(Boolean)
      .map(t => `<span class="text-[9px] font-black uppercase tracking-wide text-slate-400">${escapeHTML(t)}</span>`).join('<span class="text-slate-200">·</span>');

    return `
      <div class="bg-white border-2 ${lado === 'es' ? 'border-orange-100' : 'border-slate-100'} rounded-2xl p-2.5 mb-2 flex items-center gap-2.5">
        ${img}
        <div class="flex-1 min-w-0">
          <div class="flex items-baseline gap-2 flex-wrap">
            <span class="font-heading font-black text-lg text-[#FF7A00] leading-tight">${trResaltar(w.ingles, q)}</span>
            ${fon ? `<span class="font-mono text-[11px] text-slate-400">${fon}</span>` : ''}
          </div>
          <div class="mt-1">${significados}</div>
          ${etiquetas ? `<div class="flex items-center gap-1.5 mt-0.5">${etiquetas}</div>` : ''}
        </div>
        <div class="flex flex-col gap-1 shrink-0">
          <button class="tr-audio w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 transition flex items-center justify-center"
            title="Escuchar" data-en="${escapeHTML(w.ingles)}" data-audio="${escapeHTML(w.audio || '')}"><i class="fas fa-volume-up text-xs"></i></button>
          <button class="tr-mazo w-9 h-9 rounded-full bg-orange-50 hover:bg-orange-100 text-[#FF7A00] transition flex items-center justify-center"
            title="Añadir a mi mazo" data-id="${w.id}" data-en="${escapeHTML(w.ingles)}" data-es="${escapeHTML(w.espanol || '')}"><i class="fas fa-plus text-xs"></i></button>
        </div>
      </div>`;
  }

  // Guarda la palabra en el mazo del usuario (sin duplicar).
  async function trAgregarAlMazo(wordId, ingles, espanol, btn) {
    const marcarOk = () => { btn.innerHTML = '<i class="fas fa-check text-xs"></i>'; btn.className = btn.className.replace('bg-orange-50', 'bg-green-100').replace('text-[#FF7A00]', 'text-green-600'); };
    const { data: ya } = await dbClient.from('mazo').select('id')
      .eq('user_id', currentUser.id).ilike('ingles', ingles).limit(1);
    if ((ya || []).length) { marcarOk(); return showToast(`🃏 “${escapeHTML(ingles)}” ya estaba en tu mazo.`, 1800); }

    const { error } = await dbClient.from('mazo').insert({
      user_id: currentUser.id, ingles, espanol, word_id: parseInt(wordId) || null
    });
    if (error) { btn.disabled = false; console.warn('[traductor] mazo:', error.message); return showToast('⚠️ No se pudo añadir al mazo.', 2200); }
    marcarOk();
    showToast(`🃏 “${escapeHTML(ingles)}” añadida a tu mazo.`, 2000);
  }

  /* ============================================================
     7. ARRANQUE
  ============================================================ */
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const { data: { session } } = await dbClient.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      currentUser = session.user;

      const { data: profile } = await dbClient.from('profiles').select('points, lingots, nivel, plan, role, full_name, flujo').eq('id', currentUser.id).maybeSingle();
      userProfile = profile || {};
      flujo = userProfile.flujo || {};
      ensureDaily();

      // Pronunciación es función de pago (Plus, Pro, Super Pro) — los
      // admins también entran, para poder revisar el contenido.
      if ((userProfile.plan || 'gratis') === 'gratis' && !['admin', 'super_admin'].includes(userProfile.role)) {
        document.getElementById('loading-screen').classList.add('hidden');
        document.getElementById('app-container').classList.remove('hidden');
        fillProfileMenu();
        document.getElementById('app-container').innerHTML = `
          <div class="card-3d p-7 text-center animate-pop mt-10">
            <div class="text-5xl mb-3">🔒</div>
            <h2 class="text-2xl font-heading font-bold text-slate-800 mb-2">Función Pro</h2>
            <p class="text-slate-500 mb-6">El análisis de pronunciación con IA es parte de los planes de pago (Plus, Pro y Super Pro). Mejora tu plan para desbloquearlo.</p>
            <button id="pz-volver" class="w-full btn-juice bg-[#FF7A00] text-white font-bold py-3 rounded-xl text-lg">Volver a Abulingo</button>
          </div>`;
        document.getElementById('pz-volver').onclick = () => { window.location.href = 'abulingo.html'; };
        return;
      }

      fillProfileMenu();

      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('app-container').classList.remove('hidden');

      renderTabs();
      renderPanel();

      // Menú de perfil compartido: rankings, progreso completo, certificados,
      // mazo, soporte, tutor y misión del día, todo SIN salir de esta página.
      window.AbuMenu?.init({
        dbClient, currentUser, userProfile, flujo,
        showModal, closeModal, showToast, escapeHTML,
        guardarFlujo: updateUserFlow,
        pagina: 'pronunciacion',
        config: { WHATSAPP_COMUNIDAD_URL, NIVELES_FIJOS, MISION_PALABRAS_DIA, MISION_FRASES_DIA, MISION_RECOMPENSA_LINGOTS }
      });
      window.AbuMenu?.bind({ perfil: false });   // el toggle del avatar ya está enganchado arriba
      window.AbuMenu?.refreshBadges();

      // Aviso del día (publicidad / invitaciones). Se controla desde la
      // tabla `anuncios_diarios` de Supabase y solo se abre una vez al día.
      window.AbuAnuncio?.mostrarSiToca({
        dbClient, userId: currentUser.id,
        pagina: 'pronunciacion', plan: userProfile.plan || 'gratis'
      });
    } catch (e) {
      console.error(e);
      document.getElementById('loading-screen').innerHTML =
        '<div class="text-center"><h1 class="text-2xl font-heading font-bold text-slate-600">😵 Algo salió mal</h1><p class="text-slate-400 text-sm mt-2">Recarga la página.</p></div>';
    }
  });
</script>
