  /* ---------- Pantalla 2: practicar un texto ----------
     Al tocar un texto se entra DIRECTO al shadowing frase por frase: esa
     es la práctica, no un paso posterior. El texto completo y su
     traducción quedan plegados arriba, a un toque, para quien quiera
     leerlos; pero lo primero que ves es la lista de frases.

     La práctica de cada frase es ORDENAR SUS PALABRAS:
       1. suena el audio de la frase (a la velocidad que tengas puesta),
       2. las palabras aparecen desordenadas abajo,
       3. las vas tocando en el orden que creas y se van colocando arriba,
       4. al completarlas se corrige sola y se guarda la nota.
     Tocar una palabra ya colocada la devuelve al montón, así se puede
     rectificar sin empezar de cero. */
  function lsAbrirTexto(t) {
    lsDetenerAudio();
    lsTextoActual = t;
    lsVelocidad = 1;
    lsOrden = {};              // { [indiceFrase]: [palabras colocadas] }
    lsTextoAbierto = false;
    lsPintarPractica();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function lsChipsVelocidadHTML(tam = '') {
    return LS_VELOCIDADES.map(v => `
      <button class="ls-vel btn-juice px-2.5 py-1.5 rounded-lg text-[11px] font-black ${v === lsVelocidad ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-500'}" data-v="${v}">${v}×</button>
    `).join('');
  }

  function lsPintarPractica() {
    const t = lsTextoActual;
    if (!t) return;
    const frases = t.frases || [];
    const ok = lsFrasesOk(t.id);

    document.getElementById('mode-panel').innerHTML = `
      <!-- ── Cabecera compacta: título, velocidad y el texto plegado ──── -->
      <div class="card-3d p-4 sm:p-5 mb-3">
        <button id="ls-volver" class="text-[11px] font-black text-slate-400 hover:text-[#FF7A00] mb-3"><i class="fas fa-arrow-left mr-1"></i>Volver a los textos</button>

        <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Nivel ${escapeHTML(t.nivel)} · ${t.palabras || 0} palabras</p>
        <h2 class="font-heading font-black text-2xl text-[#FF7A00] leading-tight mb-1">${escapeHTML(t.titulo)}</h2>
        <p class="text-slate-400 text-xs mb-3">${escapeHTML(t.tema || '')} · <span id="ls-contador">${ok}/${frases.length}</span> frases dominadas</p>

        <div class="flex flex-wrap items-center gap-2 mb-3">
          <button id="ls-play-full" class="btn-juice bg-slate-800 text-white font-bold py-2.5 px-4 rounded-xl text-sm">
            <i class="fas fa-play mr-2"></i>Escuchar el texto
          </button>
          <button id="ls-ver-texto" class="btn-juice bg-slate-100 text-slate-600 font-bold py-2.5 px-3 rounded-xl text-xs">
            <i class="fas fa-file-lines mr-1"></i>${lsTextoAbierto ? 'Ocultar' : 'Ver'} transcript
          </button>
        </div>

        <!-- El transcript arranca PLEGADO: si se ve el texto entero, ordenar
             las palabras deja de tener gracia. Quien lo necesite lo abre. -->
        <div id="ls-caja-texto" class="${lsTextoAbierto ? '' : 'hidden'} bg-slate-50 border border-slate-100 rounded-xl p-3 mb-3">
          <p class="text-slate-700 text-[15px] leading-relaxed font-medium">${escapeHTML(t.texto)}</p>
          <p class="text-slate-400 text-[13px] leading-relaxed mt-2">${escapeHTML(t.traduccion || '')}</p>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-[10px] font-black uppercase tracking-wide text-slate-400">Velocidad</span>
          <div id="ls-velocidades" class="flex gap-1.5">${lsChipsVelocidadHTML()}</div>
        </div>
        <p class="text-[10px] text-slate-300 mt-2">Vale para el texto completo y para cada frase. Empieza en 0.5× y sube cuando te salga natural. 🐢→🐇</p>
      </div>

      <!-- ── La práctica: escuchar y ordenar, frase por frase ─────────── -->
      <div class="card-3d p-4 sm:p-5">
        <p class="text-xs font-black uppercase tracking-wide text-slate-400 mb-1">Shadowing · frase por frase</p>
        <p class="text-[11px] text-slate-400 mb-3">Escucha la frase y ordena sus palabras tocándolas. Luego repítela en voz alta con el micrófono 🎙️</p>
        <div id="ls-frases" class="space-y-2">${frases.map((f, i) => lsFraseHTML(f, i)).join('')}</div>

        <button id="ls-play-todo" class="w-full btn-juice bg-[#FF7A00] text-white font-bold py-3 rounded-xl mt-4 text-sm">
          <i class="fas fa-list-ol mr-2"></i>Reproducir frase por frase, en orden
        </button>
      </div>`;

    document.getElementById('ls-volver').onclick = () => { lsDetenerAudio(); renderListening(); };
    document.getElementById('ls-play-full').onclick = () => lsPlayFull();
    document.getElementById('ls-play-todo').onclick = () => lsPlaySecuencia(0);
    document.getElementById('ls-ver-texto').onclick = () => {
      lsTextoAbierto = !lsTextoAbierto;
      document.getElementById('ls-caja-texto').classList.toggle('hidden', !lsTextoAbierto);
      document.getElementById('ls-ver-texto').innerHTML =
        `<i class="fas fa-file-lines mr-1"></i>${lsTextoAbierto ? 'Ocultar' : 'Ver'} transcript`;
    };
    lsBindVelocidades();
    lsBindFrases();
  }

  /* Baraja las palabras de la frase. Se evita que salgan ya en su sitio
     (sería un ejercicio regalado) reintentando unas cuantas veces; en
     frases de una o dos palabras eso es imposible y da igual. */
  function lsBarajar(palabras) {
    const original = palabras.join(' ');
    for (let intento = 0; intento < 8; intento++) {
      const a = [...palabras];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      if (a.join(' ') !== original || palabras.length < 3) return a;
    }
    return [...palabras].reverse();
  }

  const lsPalabrasDe = (f) => String(f.en || '').split(/\s+/).filter(Boolean);

  function lsFraseHTML(f, i) {
    const puntaje = Number((lsProgreso[lsTextoActual?.id] || {})[String(i)] || 0);
    const estrellas = puntaje
      ? Array.from({ length: 5 }, (_, k) => `<i class="fas fa-star text-[9px] ${k < puntaje ? 'text-yellow-400' : 'text-slate-200'}"></i>`).join('')
      : '';
    return `
      <div class="ls-frase rounded-xl border-2 ${puntaje >= 4 ? 'border-green-200 bg-green-50/40' : 'border-slate-100 bg-slate-50'} p-3" data-i="${i}">
        <div class="flex items-center gap-2 mb-2">
          <button class="ls-play-frase shrink-0 w-9 h-9 rounded-full bg-white border-2 border-slate-200 text-[#FF7A00] hover:border-[#FF7A00] flex items-center justify-center" data-i="${i}" title="Escuchar esta frase">
            <i class="fas fa-play text-xs"></i>
          </button>
          <span class="text-[10px] font-black text-slate-300">FRASE ${i + 1}</span>
          <span class="ls-estrellas">${estrellas}</span>
          <span class="flex-1"></span>
          <button class="ls-mic shrink-0 w-9 h-9 rounded-full bg-[#FF7A00] text-white flex items-center justify-center" data-i="${i}" title="Repetir esta frase en voz alta">
            <i class="fas fa-microphone text-xs"></i>
          </button>
        </div>

        <!-- Renglón donde se van colocando las palabras elegidas -->
        <div class="ls-linea min-h-[38px] rounded-lg border-2 border-dashed border-slate-200 bg-white p-1.5 flex flex-wrap gap-1 items-start mb-1.5" data-i="${i}"></div>
        <!-- Montón de palabras desordenadas -->
        <div class="ls-banco flex flex-wrap gap-1" data-i="${i}"></div>

        <p class="ls-frase-es text-[11px] text-slate-400 mt-1.5 hidden"></p>
        <p class="ls-msg text-[11px] font-bold text-slate-400 mt-1.5 hidden"></p>
      </div>`;
  }

  /* Pinta el estado del ejercicio de una frase: lo colocado arriba y lo
     que queda en el banco abajo. Se repinta solo esta frase (no el panel
     entero) para no cortar el audio ni hacer saltar el scroll. */
  function lsPintarOrden(i, { corregido = null } = {}) {
    const fila = document.querySelector(`.ls-frase[data-i="${i}"]`);
    if (!fila) return;
    const f = (lsTextoActual?.frases || [])[i];
    const palabras = lsPalabrasDe(f);
    const puestas = lsOrden[i]?.puestas || [];
    const banco = lsOrden[i]?.banco || [];

    const linea = fila.querySelector('.ls-linea');
    const cajaBanco = fila.querySelector('.ls-banco');

    linea.innerHTML = puestas.length
      ? puestas.map((w, k) => {
          let color = 'bg-white border-slate-200 text-slate-700';
          if (corregido) color = (w === palabras[k])
            ? 'bg-green-100 border-green-300 text-green-700'
            : 'bg-red-100 border-red-300 text-red-700';
          return `<button class="ls-quitar border rounded-md px-1.5 py-0.5 text-[13px] font-semibold ${color}" data-i="${i}" data-k="${k}">${escapeHTML(w)}</button>`;
        }).join('')
      : `<span class="text-[11px] text-slate-300 px-1 py-0.5">Toca las palabras en orden…</span>`;

    cajaBanco.innerHTML = banco.map((w, k) =>
      `<button class="ls-poner bg-white border border-slate-300 hover:border-[#FF7A00] rounded-md px-1.5 py-0.5 text-[13px] font-semibold text-slate-700" data-i="${i}" data-k="${k}">${escapeHTML(w)}</button>`
    ).join('');
    cajaBanco.classList.toggle('hidden', banco.length === 0);

    fila.querySelectorAll('.ls-poner').forEach(b => {
      b.onclick = () => lsPonerPalabra(Number(b.dataset.i), Number(b.dataset.k));
    });
    fila.querySelectorAll('.ls-quitar').forEach(b => {
      b.onclick = () => lsQuitarPalabra(Number(b.dataset.i), Number(b.dataset.k));
    });
  }

  function lsPrepararOrden(i, { rebarajar = true } = {}) {
    const f = (lsTextoActual?.frases || [])[i];
    if (!f) return;
    const palabras = lsPalabrasDe(f);
    if (rebarajar || !lsOrden[i]) lsOrden[i] = { puestas: [], banco: lsBarajar(palabras) };
    lsPintarOrden(i);
  }

  function lsPonerPalabra(i, k) {
    const st = lsOrden[i];
    if (!st) return;
    st.puestas.push(st.banco.splice(k, 1)[0]);
    lsPintarOrden(i);
    if (!st.banco.length) lsCorregirOrden(i);
  }

  function lsQuitarPalabra(i, k) {
    const st = lsOrden[i];
    if (!st) return;
    st.banco.push(st.puestas.splice(k, 1)[0]);
    lsPintarOrden(i);
    const fila = document.querySelector(`.ls-frase[data-i="${i}"]`);
    const msg = fila?.querySelector('.ls-msg');
    if (msg) { msg.classList.add('hidden'); msg.textContent = ''; }
  }

  /* Corrige el orden. La nota se calcula por posiciones acertadas, no es
     todo-o-nada: así una frase larga con una palabra fuera de sitio no
     puntúa lo mismo que una hecha al azar. */
  async function lsCorregirOrden(i) {
    const f = (lsTextoActual?.frases || [])[i];
    const st = lsOrden[i];
    if (!f || !st) return;
    const correcto = lsPalabrasDe(f);
    const aciertos = st.puestas.filter((w, k) => w === correcto[k]).length;
    const perfecto = aciertos === correcto.length;
    const ratio = correcto.length ? aciertos / correcto.length : 0;
    const puntaje = perfecto ? 5 : (ratio >= 0.8 ? 4 : ratio >= 0.6 ? 3 : ratio >= 0.4 ? 2 : 1);

    lsPintarOrden(i, { corregido: true });

    const fila = document.querySelector(`.ls-frase[data-i="${i}"]`);
    const msg = fila?.querySelector('.ls-msg');
    const es = fila?.querySelector('.ls-frase-es');
    if (msg) {
      msg.classList.remove('hidden');
      msg.innerHTML = perfecto
        ? '<span class="text-green-600">✅ ¡Perfecto! Ahora repítela en voz alta 🎙️</span>'
        : `<span class="text-slate-500">${aciertos} de ${correcto.length} en su sitio. Toca una palabra para moverla, o <button class="ls-reintentar underline font-black text-[#FF7A00]" data-i="${i}">empezar de nuevo</button>.</span>`;
      const re = msg.querySelector('.ls-reintentar');
      if (re) re.onclick = () => { lsPrepararOrden(i); msg.classList.add('hidden'); lsPlayFrase(i); };
    }
    // La traducción solo se revela DESPUÉS de intentarlo: antes sería un chivatazo.
    if (es && f.es) { es.textContent = f.es; es.classList.remove('hidden'); }

    await lsGuardarPuntaje(i, puntaje);
    lsRefrescarFrase(i, puntaje);
    if (perfecto && window.confetti) {
      confetti({ particleCount: 55, spread: 55, origin: { y: 0.7 }, colors: ['#FF7A00', '#fbbf24'] });
    }
    if (!perfecto) setTimeout(() => lsPlayFrase(i), 400);   // vuelve a sonar el modelo
  }

  function lsBindVelocidades() {
    document.querySelectorAll('.ls-vel').forEach(b => {
      b.onclick = () => {
        lsVelocidad = Number(b.dataset.v);
        // Si algo está sonando, el cambio se nota al instante.
        if (lsAudio) lsAudio.playbackRate = lsVelocidad;
        document.querySelectorAll('.ls-vel').forEach(x => {
          const activo = Number(x.dataset.v) === lsVelocidad;
          x.className = `ls-vel btn-juice px-2.5 py-1.5 rounded-lg text-[11px] font-black ${activo ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-500'}`;
        });
      };
    });
  }

  function lsBindFrases() {
    (lsTextoActual?.frases || []).forEach((f, i) => lsPrepararOrden(i, { rebarajar: !lsOrden[i] }));
    document.querySelectorAll('.ls-play-frase').forEach(b => {
      b.onclick = () => lsPlayFrase(Number(b.dataset.i));
    });
    document.querySelectorAll('.ls-mic').forEach(b => {
      b.onclick = () => lsShadow(Number(b.dataset.i), b);
    });
  }

  function lsPlayFull() {
    const t = lsTextoActual;
    const btn = document.getElementById('ls-play-full');
    if (!t?.audio_url) { showToast('⚠️ Este texto todavía no tiene audio generado.'); return; }
    if (lsAudio && lsFraseSonando === null) {   // segundo toque = parar
      lsDetenerAudio();
      if (btn) btn.innerHTML = '<i class="fas fa-play mr-2"></i>Escuchar el texto';
      return;
    }
    lsTocar(lsUrl(t.audio_url), {
      onFin: () => { const b = document.getElementById('ls-play-full'); if (b) b.innerHTML = '<i class="fas fa-play mr-2"></i>Escuchar el texto'; }
    });
    if (btn) btn.innerHTML = '<i class="fas fa-stop mr-2"></i>Detener';
  }

  function lsPlayFrase(i, onFin) {
    const f = (lsTextoActual?.frases || [])[i];
    if (!f) return;
    if (!f.audio) { showToast('⚠️ Esta frase todavía no tiene audio generado.'); return; }
    // Segundo toque en la misma frase = parar.
    if (lsFraseSonando === i && lsAudio) { lsDetenerAudio(); lsPintarEstadoBotones(); return; }
    lsTocar(lsUrl(f.audio), { onFin });
    lsFraseSonando = i;
    lsPintarEstadoBotones();
  }

  // Encadena todas las frases con una pausa para repetir en medio.
  function lsPlaySecuencia(i) {
    const frases = lsTextoActual?.frases || [];
    if (i >= frases.length) { lsPintarEstadoBotones(); return; }
    const fila = document.querySelector(`.ls-frase[data-i="${i}"]`);
    if (fila) fila.scrollIntoView({ behavior: 'smooth', block: 'center' });
    lsPlayFrase(i, () => setTimeout(() => {
      // Si el usuario tocó otra cosa mientras tanto, la cadena se corta.
      if (lsFraseSonando === null && lsTextoActual) lsPlaySecuencia(i + 1);
    }, 900));
  }

  function lsPintarEstadoBotones() {
    document.querySelectorAll('.ls-play-frase').forEach(b => {
      const activa = Number(b.dataset.i) === lsFraseSonando;
      b.innerHTML = `<i class="fas ${activa ? 'fa-stop' : 'fa-play'} text-xs"></i>`;
      b.classList.toggle('border-[#FF7A00]', activa);
    });
  }

  /* ---------- Shadowing: repetir una frase y que te califique ----------
     Usa el MISMO motor de voz que el modal de práctica (pzEscuchar), así
     el micrófono se comporta igual en toda la app. */
  function lsShadow(i, btn) {
    const f = (lsTextoActual?.frases || [])[i];
    if (!f) return;
    const fila = document.querySelector(`.ls-frase[data-i="${i}"]`);
    const msg = fila?.querySelector('.ls-msg');
    if (msg) msg.classList.remove('hidden');

    if (lsRec) { try { lsRec.detenerYa(); } catch {} return; }   // segundo toque = cortar

    lsDetenerAudio();
    btn.innerHTML = '<i class="fas fa-stop text-xs"></i>';
    lsRec = pzEscuchar(btn, msg, {
      textoEscuchando: 'Repite la frase… 🎙️',
      onFin: async (dicho, err) => {
        lsRec = null;
        btn.innerHTML = '<i class="fas fa-microphone text-xs"></i>';
        if (!dicho) { if (msg) msg.textContent = pzTextoErrorVoz(err); return; }
        const puntaje = pzCalificarLocal(f.en, dicho);
        if (msg) {
          msg.innerHTML = puntaje >= 4
            ? `<span class="text-green-600">✅ ¡Bien dicho!</span> <span class="text-slate-400 font-normal">"${escapeHTML(dicho)}"</span>`
            : `<span class="text-slate-500">Casi. Escucha el modelo y repite 👇</span> <span class="text-slate-400 font-normal">"${escapeHTML(dicho)}"</span>`;
        }
        await lsGuardarPuntaje(i, puntaje);
        lsRefrescarFrase(i, puntaje);
        if (puntaje >= 5 && window.confetti) {
          confetti({ particleCount: 60, spread: 55, origin: { y: 0.7 }, colors: ['#FF7A00', '#fbbf24'] });
        }
        if (puntaje < 4) setTimeout(() => lsPlayFrase(i), 500);   // vuelve a sonar el modelo
      }
    });
    if (!lsRec) btn.innerHTML = '<i class="fas fa-microphone text-xs"></i>';
  }

  // Repinta solo esa tarjeta: repintar el panel entero cortaría el audio y
  // haría saltar el scroll justo cuando la persona está repitiendo.
  function lsRefrescarFrase(i, puntaje) {
    const fila = document.querySelector(`.ls-frase[data-i="${i}"]`);
    if (!fila) return;
    const est = fila.querySelector('.ls-estrellas');
    if (est) {
      est.innerHTML = Array.from({ length: 5 }, (_, k) =>
        `<i class="fas fa-star text-[9px] ${k < puntaje ? 'text-yellow-400' : 'text-slate-200'}"></i>`).join('');
    }
    fila.classList.toggle('border-green-200', puntaje >= 4);
    fila.classList.toggle('bg-green-50/40', puntaje >= 4);
    fila.classList.toggle('border-slate-100', puntaje < 4);
    fila.classList.toggle('bg-slate-50', puntaje < 4);
  }

  /* Solo se guarda si MEJORA la marca anterior: así una repetición mala
     no borra una buena (mismo criterio que frases_puntuaciones). */
  async function lsGuardarPuntaje(i, puntaje) {
    const t = lsTextoActual;
    if (!t || !currentUser) return;
    const previo = lsProgreso[t.id] || (lsProgreso[t.id] = {});
    if (Number(previo[String(i)] || 0) >= puntaje) return;
    previo[String(i)] = puntaje;

    const total = (t.frases || []).length;
    const ok = lsFrasesOk(t.id);
    const { error } = await dbClient.from('listening_progreso').upsert({
      user_id: currentUser.id,
      texto_id: t.id,
      frases_ok: previo,
      mejor_puntaje: Math.max(...Object.values(previo).map(Number), 0),
      completado: total > 0 && ok >= total,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id,texto_id' });
    if (error) console.warn('[listening] no se pudo guardar el avance:', error.message);

    const cont = document.getElementById('ls-contador');
    if (cont) cont.textContent = `${ok}/${total}`;

    if (total > 0 && ok >= total) {
      showToast('🎧 ¡Texto completo! Dominaste todas sus frases.', 3200);
      if (window.confetti) confetti({ particleCount: 110, spread: 70, origin: { y: 0.6 }, colors: ['#FF7A00', '#3b82f6', '#fbbf24'] });
    }
  }
