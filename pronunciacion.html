  <style>
    /* ============================================================
       RENDIMIENTO · dos reglas que valen mucho en páginas largas
       ------------------------------------------------------------
       content-visibility: auto le dice al navegador que NO calcule
       el diseño ni pinte lo que está fuera de la pantalla hasta que
       te acerques. En listas de cientos de palabras, frases o temas
       de gramática es la diferencia entre pintar todo de golpe o
       pintar solo lo visible. contain-intrinsic-size le da una
       altura estimada para que la barra de scroll no salte.
    ============================================================ */
    .lista-larga > * {
      content-visibility: auto;
      contain-intrinsic-size: auto 72px;
    }
    /* Evita el "salto" de las imágenes mientras cargan */
    img { max-width: 100%; height: auto; }
    /* Respeta a quien tiene activado "reducir movimiento" en su sistema:
       menos animaciones = menos trabajo de pintado en equipos lentos. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

<script type="module">
  /* ============================================================

  const SUPABASE_URL = 'https://eylwewhqeaaqkgcxhgyv.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5bHdld2hxZWFhcWtnY3hoZ3l2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMzAxODgsImV4cCI6MjA5OTkwNjE4OH0.Ji8huj-ny2VcMT5UQSjOuwUKz4k23quNS0fLk-gZr7A';

  // Misión del día (debe coincidir con abulingo.html): 30 palabras + 5 frases nuevas.
  const MISION_FRASES_DIA = 5;
  const MISION_PALABRAS_DIA = 30;
  const MISION_RECOMPENSA_LINGOTS = 2;

  const { createClient } = supabase;
  const dbClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let userProfile = null;
  let flujo = null; // atajo a userProfile.flujo (frases dominadas + misión del día)

  /* ============================================================
     2. UTILIDADES (copiadas de abulingo.html para mantener
        exactamente el mismo comportamiento)
  ============================================================ */
  const escapeHTML = (s) => (s || '').toString()
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  // Quita puntuación (puntos, comas, signos de interrogación/exclamación,
  // comillas, etc.) antes de comparar lo dicho contra la frase modelo, para
  // que un "Hello" sin punto no le reste estrellas a "Hello.".
  const pzSinPuntuacion = (s) => (s || '').toString()
    .replace(/[.,!?;:¡¿'"""''`´()\[\]{}\-–—_/\\]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();

  // Distancia de Levenshtein (número mínimo de ediciones para pasar de
  // una cadena a otra), usada para calificar la pronunciación localmente.
  function pzLevenshtein(a, b) {
    const m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const curr = [i];
      for (let j = 1; j <= n; j++) {
        const costo = a[i - 1] === b[j - 1] ? 0 : 1;
        curr[j] = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + costo);
      }
      prev = curr;
    }
    return prev[n];
  }

  // Calificación 1-5 comparando lo que dijo el usuario contra la frase
  // modelo — sin tomar en cuenta mayúsculas/minúsculas ni signos de
  // puntuación. Solo una coincidencia EXACTA (tras esa limpieza) da 5
  // estrellas; mientras más distinta esté la pronunciación, menos estrellas.
  function pzCalificarLocal(objetivo, dicho) {
    const t = pzSinPuntuacion(objetivo).toLowerCase();
    const d = pzSinPuntuacion(dicho).toLowerCase();
    if (!t || !d) return 0;
    if (t === d) return 5;
    const distancia = pzLevenshtein(t, d);
    const similitud = 1 - distancia / Math.max(t.length, d.length);
    if (similitud >= 0.85) return 4;
    if (similitud >= 0.65) return 3;
    if (similitud >= 0.4) return 2;
    return 1;
  }

  let toastTimer = null;
  function showToast(msg, ms = 2600) {
    let t = document.getElementById('app-toast');
    if (!t) { t = document.createElement('div'); t.id = 'app-toast'; t.className = 'toast'; document.body.appendChild(t); }
    t.innerHTML = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms);
  }

  /* ---------- Flujo compartido + Misión del día (mismo formato que abulingo.html) ----------
     Esta página solo lee/toca flujo.frasesDominadas y flujo.daily.misionFrases/misionCumplida;
     el resto de "flujo" (srs, racha, dominar, etc.) se conserva tal cual venía de la nube. */
  const todayStr = () => new Date().toISOString().slice(0, 10);

  function ensureDaily() {
    if (!flujo.daily) flujo.daily = { date: todayStr(), newWords: 0, reviewed: 0, points: 0, goalShown: false, unlockAt: null, misionPalabras: 0, misionFrases: 0, misionCumplida: false };
    if (flujo.daily.unlockAt === undefined) flujo.daily.unlockAt = null;
    if (flujo.daily.misionPalabras === undefined) flujo.daily.misionPalabras = 0;
    if (flujo.daily.misionFrases === undefined) flujo.daily.misionFrases = 0;
    if (flujo.daily.misionCumplida === undefined) flujo.daily.misionCumplida = false;
    if (flujo.daily.date !== todayStr()) {
      flujo.daily.date = todayStr();
      flujo.daily.points = 0;
      flujo.daily.reviewed = 0;
      flujo.daily.goalShown = false;
      flujo.daily.club = { msgs: 0, joins: 0 };
      flujo.daily.misionPalabras = 0;
      flujo.daily.misionFrases = 0;
      flujo.daily.misionCumplida = false;
    }
    if (!flujo.daily.club) flujo.daily.club = { msgs: 0, joins: 0 };
    if (!flujo.frasesDominadas) flujo.frasesDominadas = {};
  }

  async function updateUserFlow() {
    flujo.savedAt = new Date().toISOString();
    userProfile.flujo = flujo;
    for (let intento = 0; intento < 2; intento++) {
      const { error } = await dbClient.from('profiles').update({ flujo }).eq('id', currentUser.id);
      if (!error) return;
      console.error(`Error guardando flujo (intento ${intento + 1}):`, error.message);
      if (intento === 0) await new Promise(r => setTimeout(r, 600));
      else showToast('⚠️ No se pudo guardar tu avance en la nube.', 3000);
    }
  }

  // Se llama cuando el usuario domina una frase POR PRIMERA VEZ. Suma a la
  // misión del día y, si ya completó también las 30 palabras nuevas en
  // abulingo.html, entrega la recompensa (mismo criterio que allá).
  // No guarda en Supabase: quien llama a esta función se encarga de eso.
  function registrarFraseNuevaMision() {
    ensureDaily();
    flujo.daily.misionFrases = (flujo.daily.misionFrases || 0) + 1;
    if (!flujo.daily.misionCumplida &&
        (flujo.daily.misionPalabras || 0) >= MISION_PALABRAS_DIA &&
        (flujo.daily.misionFrases || 0) >= MISION_FRASES_DIA) {
      flujo.daily.misionCumplida = true;
      const lingots = (parseFloat(userProfile.lingots) || 0) + MISION_RECOMPENSA_LINGOTS;
      userProfile.lingots = lingots;
      const dl = document.getElementById('user-lingots'); if (dl) dl.textContent = lingots;
      dbClient.from('profiles').update({ lingots }).eq('id', currentUser.id).then(() => {});
      if (window.confetti) confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#FF7A00', '#3b82f6', '#fbbf24'] });
      showToast(`🎯 ¡Misión del día cumplida! <span class="text-yellow-400">+${MISION_RECOMPENSA_LINGOTS} 💎 Lingots</span>`, 3800);
    }
  }

  /* ---------- Modal genérico (mismo patrón que abulingo.html/gramatica.html) ---------- */
  const modalRoot = document.getElementById('modal-root');
  function closeModal() { modalRoot.innerHTML = ''; }
  function showModal({ icon, title, body, actions = [], dismissable = true, size = 'md' }) {
    const maxW = size === 'lg' ? 'max-w-lg' : 'max-w-sm';
    const actionsHTML = actions.map((a, i) =>
      `<button data-idx="${i}" class="modal-action w-full btn-juice ${a.style || 'bg-[#FF7A00] text-white'} font-bold py-3 rounded-xl text-lg">${a.label}</button>`
    ).join('');
    modalRoot.innerHTML = `
      <div class="modal-overlay">
        <div class="card-3d ${maxW} w-full p-7 text-center animate-pop relative max-h-[90vh] flex flex-col">
          ${dismissable ? '<button id="modal-close" class="absolute top-3 right-4 text-slate-300 hover:text-slate-500 text-2xl z-10">&times;</button>' : ''}
          ${icon ? `<div class="text-6xl mb-3 shrink-0">${icon}</div>` : ''}
          ${title ? `<h2 class="text-2xl font-heading font-bold text-slate-800 mb-2 shrink-0">${title}</h2>` : ''}
          <div class="text-slate-500 mb-6 overflow-y-auto flex-1 min-h-0">${body || ''}</div>
          <div class="space-y-3 shrink-0">${actionsHTML}</div>
        </div>
      </div>`;
    if (dismissable) {
      document.getElementById('modal-close').onclick = closeModal;
      modalRoot.querySelector('.modal-overlay').addEventListener('click', (e) => { if (e.target.classList.contains('modal-overlay')) closeModal(); });
    }
    actions.forEach((a, i) => {
      const btn = modalRoot.querySelector(`.modal-action[data-idx="${i}"]`);
      if (btn) btn.onclick = () => { if (a.onClick) a.onClick(); };
    });
  }

  // Sonido de tap (idéntico al de abulingo.html, sin archivos externos)
  let audioCtx = null;
  function getAudioCtx() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      return audioCtx;
    } catch { return null; }
  }
  document.addEventListener('pointerdown', (e) => {
    if (!e.target.closest('button')) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    try {
      const t0 = ctx.currentTime;
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(880, t0);
      osc.frequency.exponentialRampToValueAtTime(660, t0 + 0.05);
      gain.gain.setValueAtTime(0.08, t0);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.05);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + 0.07);
    } catch {}
  }, { passive: true });

  // Síntesis de voz en inglés (mismo criterio que abulingo.html: voz en-US si existe)
  // VOZ_VELOCIDAD manda igual en la voz REAL de Google Cloud (se manda a
  // la Edge Function) y en la del navegador, que es solo el respaldo.
  // 0.85 ≈ 15 % más lento que el ritmo normal: es el que un principiante
  // alcanza a seguir.
  const VOZ_VELOCIDAD = 0.85;
  let ttsVoices = [];
  function loadVoices() { ttsVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
  if (window.speechSynthesis) { loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; }
  function pickEnglishVoice() {
    if (!ttsVoices.length) loadVoices();
    return ttsVoices.find(v => /en[-_]US/i.test(v.lang)) || ttsVoices.find(v => /^en/i.test(v.lang)) || null;
  }
  function speak(text, vel = 1) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickEnglishVoice();
    if (v) u.voice = v;
    u.lang = 'en-US'; u.rate = VOZ_VELOCIDAD * vel;
    window.speechSynthesis.speak(u);
  }

  // Velocidad de escucha de las conversaciones (0.5× / 0.75× / 1×). Misma
  // clave que abulingo.html, así la elección vale en las dos páginas.
  const VELOCIDADES_CONV = [0.5, 0.75, 1];
  let pzVelConv = 1;
  try {
    const v = parseFloat(localStorage.getItem('abu-vel-conv'));
    if (VELOCIDADES_CONV.includes(v)) pzVelConv = v;
  } catch {}
  let pzAudioConv = null;
  function pzAplicarVel(audio, vel) {
    audio.defaultPlaybackRate = vel;
    audio.playbackRate = vel;
    audio.preservesPitch = true;
    pzAudioConv = audio;
    return audio;
  }
  function velSelectorHTML() {
    return `<div class="vel-selector" role="group" aria-label="Velocidad de reproducción">
      <span class="vel-label"><i class="fas fa-gauge-high"></i> Velocidad</span>
      ${VELOCIDADES_CONV.map(v => `<button type="button" data-vel="${v}" class="vel-btn${v === pzVelConv ? ' activa' : ''}" aria-pressed="${v === pzVelConv}">${v}×</button>`).join('')}
    </div>`;
  }
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-vel]');
    if (!btn) return;
    const v = parseFloat(btn.dataset.vel);
    if (!VELOCIDADES_CONV.includes(v)) return;
    pzVelConv = v;
    try { localStorage.setItem('abu-vel-conv', String(v)); } catch {}
    document.querySelectorAll('[data-vel]').forEach(b => {
      const activa = parseFloat(b.dataset.vel) === v;
      b.classList.toggle('activa', activa);
      b.setAttribute('aria-pressed', String(activa));
    });
    if (pzAudioConv && !pzAudioConv.paused) {
      pzAudioConv.defaultPlaybackRate = v;
      pzAudioConv.playbackRate = v;
    }
  });
  // Audio real (mp3 de Google Cloud) que esté sonando ahora mismo, para
  // poder cortarlo: antes stopSpeaking() solo callaba la voz del
  // navegador y el mp3 seguía sonando encima de la línea siguiente.
  let pzAudioActual = null;
  function pzDetenerAudio() {
    if (pzAudioActual) { try { pzAudioActual.pause(); } catch {} pzAudioActual = null; }
  }
  function pzTocarUrl(url, onend, vel) {
    pzDetenerAudio();
    const a = new Audio(url);
    if (vel) pzAplicarVel(a, vel);
    pzAudioActual = a;
    const fin = () => { if (pzAudioActual === a) pzAudioActual = null; if (onend) onend(); };
    a.onended = fin;
    a.onerror = fin;
    a.play().catch(fin);
    return a;
  }
  function stopSpeaking() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    pzDetenerAudio();
  }

  const TUTOR_MSG_DAILY_MAX = 50;

  // como si fuera algo que dijo Abu: ensucia el historial.

  const TUTOR_ABU_SIN_RED  = 'No pude conectarme 📶 Revisa tu internet y vuelve a enviarme la pregunta.';
  let tutorAbuUsadosHoy = 0;


  // Esta página no maneja el JSON "flujo", así que la conversación vive en
  // memoria: se mantiene mientras no recargues, que es justo lo que hace
  // falta para abrir el tutor, resolver la duda y volver a lo tuyo.
  let tutorAbuMem = [];
  function tutorAbuCargar() { return tutorAbuMem; }
  async function tutorAbuGuardar() { /* sin persistencia en esta página */ }

    modalRoot.innerHTML = `

    actualizarLimiteTutorAbu();

    const box = document.getElementById('abu-tutor-messages');
    const typing = document.createElement('div');
    typing.className = 'flex justify-start items-center gap-1.5';
    typing.innerHTML = `<img src="icono.png" class="w-6 h-6 rounded-full object-cover shrink-0"><div class="bg-white border border-slate-200 text-slate-400 rounded-2xl rounded-bl-sm px-3.5 py-2 text-sm"><i class="fas fa-circle-notch fa-spin mr-1"></i> Abu escribe...</div>`;
    box?.appendChild(typing); if (box) box.scrollTop = box.scrollHeight;

    let respuesta = null;
    let rechazado = false;
    let fallaDeRed = false;
    {
      // Se manda TODO el hilo de esta sesión: es lo que hace que un
      // "¿y en plural?" tenga sentido. Fuera el saludo y los avisos de
      // error, que solo confunden al modelo.
      const historial = msgs
        .filter(m => m.content && m.content !== TUTOR_ABU_FALLBACK && m.content !== TUTOR_ABU_SIN_RED && !m.content.startsWith('¡Hola! Soy Abu'))
        .slice(-12);
      // fetchIA pone el tope de tiempo, el reintento y —lo importante— la
      // renovación del token cuando el gateway contesta 401.
      const { resp, payload, error } = await fetchIA('tutor-abu', { messages: historial, nivel: userProfile?.nivel || 'A1' });
      if (error === 'sin-sesion') {
        msgs.pop();
        showToast('Tu sesión expiró — vuelve a iniciar sesión 🔑', 3600);

        // La función devuelve { reply: { es, en, text } }.
        const r = payload?.reply;
        if (resp.ok && r) respuesta = (r.text || [r.es, r.en].filter(Boolean).join('\n\n') || '').trim();

        // El cupo real lo manda el servidor.
        if (typeof payload?.uso?.usados === 'number') tutorAbuUsadosHoy = payload.uso.usados;
        if (payload?.codigo === 'limite_diario') tutorAbuUsadosHoy = payload.limite || TUTOR_MSG_DAILY_MAX;
        actualizarLimiteTutorAbu();

        if (!respuesta) {
          // Plan insuficiente o cupo agotado: se avisa bonito y no se
          // pinta el "se me trabó la lengua".
          rechazado = pzManejarRechazoIA(payload);
          // Un 401 que llega hasta aquí viene del GATEWAY de Supabase (su
          // cuerpo no trae `codigo`), no de la función: es el token
          // vencido. fetchIA ya lo reintentó una vez tras renovar la
          // sesión, así que si sigue fallando toca volver a entrar.
          if (!rechazado && resp.status === 401) {
            showToast('Tu sesión expiró — vuelve a iniciar sesión 🔑', 3600);
            rechazado = true;
          }
          console.warn('[Tutor Abu] HTTP', resp.status, payload);
          if (payload?.diag) console.warn('[Tutor Abu] diag:', payload.diag);
          if (payload?.comoArreglarlo) console.warn('[Tutor Abu] ' + payload.comoArreglarlo);
        }
      }
    }
    typing.remove();

    if (rechazado) { msgs.pop(); return; }   // el modal / toast ya explicó qué pasó
    if (!respuesta) {
      // El aviso se pinta pero NO entra al historial que ve el modelo.
      tutorAbuBubble('assistant', fallaDeRed ? TUTOR_ABU_SIN_RED : TUTOR_ABU_FALLBACK);
      return;
    }
    msgs.push({ role: 'assistant', content: respuesta });
    tutorAbuBubble('assistant', respuesta);
  }

  /* ---------- Micrófono del tutor (inicio/parada manual) ----------
     Escucha en ESPAÑOL: aquí el estudiante pregunta su duda, no
     practica inglés. Con 'en-US' el navegador devolvía basura fonética. */

  /* ------------------------------------------------------------
     RECONOCIMIENTO DE VOZ EN CELULAR — dos problemas reales

     1) DUPLICADOS ("me repite palabras"). En Chrome de Android,
        e.resultIndex no siempre avanza: llega en 0 una y otra vez,
        así que ir ACUMULANDO desde resultIndex vuelve a pegar
        finales ya pegados. Solución: en cada evento se REARMA el
        texto leyendo TODOS los resultados de la sesión, en vez de
        ir sumando. Lo dicho en sesiones anteriores (cuando el
        navegador corta solo por silencio) se guarda aparte.

     2) El micrófono es EXCLUSIVO en el celular: si MediaRecorder
        ya tomó el stream, el reconocimiento de voz falla con
        'audio-capture'. En el PC sí se pueden compartir, por eso
        allá funcionaba y aquí no.
  ------------------------------------------------------------ */
  const esMovilVoz = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  // Red de seguridad: si aun así se cuela un bloque repetido
  // ("how are you how are you"), se colapsa. Solo bloques de 2+
  // palabras o una misma palabra 3+ veces seguidas, para no dañar
  // repeticiones legítimas como "very very good" o "bye bye".
  function limpiarRepeticionesVoz(texto) {
    let p = (texto || '').trim().split(/\s+/).filter(Boolean);
    if (p.length < 2) return (texto || '').trim();

    // Bloques repetidos al final: "a b c a b c" → "a b c"
    let cambio = true;
    while (cambio) {
      cambio = false;
      for (let n = Math.floor(p.length / 2); n >= 2; n--) {
        const fin = p.slice(-n).join(' ').toLowerCase();
        const antes = p.slice(-2 * n, -n).join(' ').toLowerCase();
        if (fin && fin === antes) { p = p.slice(0, -n); cambio = true; break; }
      }
    }
    // Una misma palabra repetida 3+ veces seguidas se recorta a dos:
    // así "hello hello hello" se arregla pero "bye bye" queda intacto.
    const salida = [];
    for (const w of p) {
      const n = salida.length;
      if (n >= 2 && salida[n - 1].toLowerCase() === w.toLowerCase()
                 && salida[n - 2].toLowerCase() === w.toLowerCase()) continue;
      salida.push(w);
    }
    return salida.join(' ');
  }

  let tutorRecActivo = null;

  /* Motor de voz v4 (el mismo de [[abulingo.html]]): el corte del navegador
     por una pausa no envía; se sigue escuchando y se envía con el silencio
     real, el botón o el tope. Sin nada dicho, los rearranques son acotados. */
  // Une lo dicho en sesiones sucesivas quitando el solape si el navegador repite el final.
  function unirSesionesVoz(previo, nuevo) {
    const a = (previo || '').trim().split(/\s+/).filter(Boolean);
    const b = (nuevo || '').trim().split(/\s+/).filter(Boolean);
    if (!a.length) return b.join(' ');
    if (!b.length) return a.join(' ');
    const lim = (w) => w.toLowerCase().replace(/[.,!?;:"]/g, '');
    for (let n = Math.min(a.length, b.length); n >= 1; n--) {
      if (n < 2 && n < a.length) break;
      if (a.slice(-n).map(lim).join(' ') === b.slice(0, n).map(lim).join(' ')) return [...a, ...b.slice(n)].join(' ');
    }
    return [...a, ...b].join(' ');
  }

  // El corte del navegador por una pausa no envía nada: solo el silencio real, el botón o el tope.
  const TUTOR_VOZ_SILENCIO_MS = 4000;
  const TUTOR_VOZ_TOPE_MS     = 60000;
  const TUTOR_VOZ_REINICIOS   = 3;

  function tutorIniciarVoz({ onFinal, onError, onParcial }) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { onError && onError('no-soportado'); return null; }
    if (tutorRecActivo) { try { tutorRecActivo.abort(); } catch {} tutorRecActivo = null; }

    const rec = new SR();
    rec.lang = 'es-MX';           // aquí se PREGUNTA en español
    rec.continuous = !esMovilVoz;
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    let dicho = '', previo = '', cerrado = false, errorDuro = null;
    let paradoManual = false, reinicios = 0, silencio = null, tope = null;
    const t0 = Date.now();

    const limpiarSilencio = () => { if (silencio) { clearTimeout(silencio); silencio = null; } };
    const terminar = () => {
      paradoManual = true;
      try { rec.stop(); } catch { cerrar(onFinal, dicho.trim()); }
    };
    const rearmarSilencio = () => {
      limpiarSilencio();
      if (!dicho.trim()) return;
      silencio = setTimeout(terminar, TUTOR_VOZ_SILENCIO_MS);
    };
    const cerrar = (fn, arg) => {
      if (cerrado) return;
      cerrado = true;
      limpiarSilencio();
      if (tope) { clearTimeout(tope); tope = null; }
      if (tutorRecActivo === rec) tutorRecActivo = null;
      fn && fn(arg);
    };

    rec.onresult = (e) => {
      // Se rearma entero: acumular desde resultIndex duplica en Android.
      let texto = '';
      for (let i = 0; i < e.results.length; i++) texto += e.results[i][0].transcript + ' ';
      dicho = limpiarRepeticionesVoz(unirSesionesVoz(previo, texto.trim()));
      if (onParcial) { try { onParcial(dicho); } catch {} }
      rearmarSilencio();
    };
    rec.onerror = (e) => {
      const err = e.error || 'error';
      if (err === 'no-speech' || err === 'aborted') return;   // que decida onend
      if (err === 'not-allowed' || err === 'service-not-allowed') errorDuro = 'sin-permiso';
      else if (err === 'audio-capture') errorDuro = 'microfono-ocupado';
      else errorDuro = err;
    };
    rec.onend = () => {
      if (cerrado) return;
      if (errorDuro) return dicho.trim() ? cerrar(onFinal, dicho.trim()) : cerrar(onError, errorDuro);
      if (paradoManual) return cerrar(onFinal, dicho.trim());
      // Corte del navegador por una pausa: se sigue escuchando.
      previo = dicho;
      const conTexto = !!dicho.trim();
      if (Date.now() - t0 < TUTOR_VOZ_TOPE_MS && (conTexto || reinicios < TUTOR_VOZ_REINICIOS)) {
        if (!conTexto) reinicios++;
        try { rec.start(); return; } catch {}
      }
      cerrar(onFinal, dicho.trim());
    };
    rec.detener = () => {
      limpiarSilencio();
      terminar();
    };

    try { rec.start(); } catch { cerrar(onError, 'no-inicio'); return null; }
    tutorRecActivo = rec;
    tope = setTimeout(terminar, TUTOR_VOZ_TOPE_MS);
    return rec;
  }

  function tutorBindMic(btn, msg) {
    if (!btn) return;
    let grabacion = null, watchdog = null;
    const WATCHDOG_MS = 6000;
    const decir = (t) => { if (msg) msg.textContent = t; };
    const limpiar = () => { if (watchdog) { clearTimeout(watchdog); watchdog = null; } };
    const reset = () => { btn.classList.remove('escuchando'); btn.innerHTML = '<i class="fas fa-microphone"></i>'; };
    const fallo = (err) => {
      if (err === 'no-soportado') decir('Tu navegador no reconoce voz — escribe tu duda 😉');
      else if (err === 'sin-permiso') decir('Bloqueaste el micrófono 🔒 — actívalo en el candado de la barra de direcciones');
      else if (err === 'no-inicio') decir('El micrófono está ocupado — intenta otra vez');
      else if (err === 'microfono-ocupado') decir('Otra app está usando el micrófono. Ciérrala e intenta de nuevo.');
      else decir('No te escuché, intenta de nuevo');
    };
    btn.onclick = () => {
      if (btn.disabled) return;
      if (grabacion) {
        decir('Enviando...');
        const g = grabacion;
        limpiar();
        // El watchdog se arma ANTES de detener: si onend llega instantáneo,
        // ya hay quien lo cancele (si no, el botón quedaba trabado).
        watchdog = setTimeout(() => {
          if (grabacion !== g) return;
          grabacion = null; reset();
          try { g.abort(); } catch {}
          fallo('atascado');
        }, WATCHDOG_MS);
        g.detener();
        return;
      }
      grabacion = tutorIniciarVoz({
        onParcial: (parcial) => { if (parcial) decir(`"${parcial}"`); },
        onFinal: (texto) => {
          limpiar(); grabacion = null; reset();
          if (texto) { decir(''); tutorAbuEnviar(texto); }
          else decir('No escuché nada, intenta de nuevo 🎙️');
        },
        onError: (err) => { limpiar(); grabacion = null; reset(); fallo(err); }
      });
      if (grabacion) {
        btn.classList.add('escuchando');
        btn.innerHTML = '<i class="fas fa-stop"></i>';
        decir('Escuchando… toca de nuevo para enviar');
      }
    };
  }

    if (!data || !data.length) { cont.innerHTML = '<p class="text-center text-slate-400 text-sm py-6">No encontré palabras con eso.</p>'; return; }

  async function cargarYPintarProgreso() {
    const cont = document.getElementById('pz-progreso-niveles');

    const dominadaIds = Object.keys(flujo.frasesDominadas || {});

    const filaHTML = (titulo, dominadasPorNivel, totales) => `

      <div class="grid grid-cols-4 gap-1.5 mb-3">

  /* ============================================================
     Modo 5: CREAR CONVERSACIÓN CON IA  (máximo 10 mensajes)
     ------------------------------------------------------------
     El usuario le describe a la IA de qué quiere que sea la
     conversación ("pedir comida en un restaurante", "una entrevista
     de trabajo"…), elige nivel, cuántos mensajes (tope 10) y cómo se
     llaman los dos personajes. La IA devuelve el guion y a partir de
     ahí se practica EXACTAMENTE igual que en "Conversar": eliges tu
     personaje, escuchas las líneas del otro y grabas las tuyas.

     · Texto del guion: Edge Function "generar-dialogo"; si esa no
       devuelve nada usable, se reintenta con "tutor-abu" pidiéndole
       un JSON. Así la función no depende de un solo endpoint.
     · Voz: Edge Function "generar-audio-abu" (voces Chirp3-HD), la
       misma que usa "Conversa con Abu" en abulingo.html. El audio se
       pide bajo demanda (al tocar 🔊) y se guarda en memoria mientras
       dure la sesión; si falla, se cae a la voz del navegador.
     · Las conversaciones creadas se guardan en tu perfil
       (profiles.flujo → flujo.convCreadas), así que no hace falta
       ninguna tabla nueva. Se conservan las últimas
       CREAR_MAX_GUARDADAS.
  ============================================================ */
  const CREAR_MAX_MENSAJES   = 20;   // tope duro de mensajes por conversación
  const CREAR_MIN_MENSAJES   = 4;
  const CREAR_MAX_GUARDADAS  = 12;   // cuántas conversaciones creadas se conservan
  const CREAR_TIMEOUT_MS     = 45000;

  let pzCrearForm = { tema: '', nivel: null, mensajes: 8, a: 'Alex', b: 'Sam' };
  let pzCrearGenerando = false;
  const pzAudioCache = new Map();    // "voz|texto" -> audioContent (base64 mp3)
  // Etiqueta de voz por personaje: A y B suenan distinto (la Edge
  // Function traduce estas etiquetas a voces Chirp 3: HD concretas).
  // "A"/"B" son los personajes de una conversación creada; cualquier otra
  // etiqueta ("mujer", "abu"...) se pasa tal cual a la Edge Function.
  const pzVozDe = (rol) => {
    const r = String(rol || '').trim();
    if (/^b$/i.test(r)) return 'b';
    if (/^a$/i.test(r)) return 'a';
    return r.toLowerCase() || 'a';
  };
  const pzClaveVoz = (voz, texto) => `${voz}|${texto}`;

  function pzConvCreadas() {
    if (!Array.isArray(flujo.convCreadas)) flujo.convCreadas = [];
    return flujo.convCreadas;
  }
  function pzConvCreadasPuntajes() {
    if (!flujo.convCreadasPuntajes || typeof flujo.convCreadasPuntajes !== 'object') flujo.convCreadasPuntajes = {};
    return flujo.convCreadasPuntajes;
  }
  // Promedio (1-5) de las líneas ya practicadas de una conversación creada.
  function pzPromedioCreada(id) {
    const v = Object.values(pzConvCreadasPuntajes()[id] || {}).map(Number).filter(Boolean);
    if (!v.length) return 0;
    return Math.round(v.reduce((a, b) => a + b, 0) / v.length);
  }

  /* ---------- Generación ---------- */
  async function pzCrearGenerar() {
    if (pzCrearGenerando) return;
    const tema = (pzCrearForm.tema || '').trim();
    if (tema.length < 6) { showToast('✍️ Cuéntame con un poco más de detalle de qué quieres que hablen.'); return; }

    const nivel = pzCrearForm.nivel || userProfile?.nivel || 'A1';
    const n = Math.max(CREAR_MIN_MENSAJES, Math.min(CREAR_MAX_MENSAJES, parseInt(pzCrearForm.mensajes, 10) || 8));
    const a = (pzCrearForm.a || '').trim() || 'Alex';
    const b = (pzCrearForm.b || '').trim() || 'Sam';

    pzCrearGenerando = true;
    const btn = document.getElementById('pz-crear-generar');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i>Escribiendo tu conversación...'; }
    const estado = document.getElementById('pz-crear-estado');
    if (estado) estado.innerHTML = '<p class="text-center text-xs font-bold text-slate-400">Esto tarda unos segundos ⏳</p>';

    let conv = null;
    try {
      conv = await pzGenerarConversacionIA({ tema, nivel, n, personajeA: a, personajeB: b });
    } catch (e) {
      console.warn('[crear conversación]', e?.message || e);
    }

    pzCrearGenerando = false;
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-wand-magic-sparkles mr-2"></i>Crear conversación'; }
    if (estado) estado.innerHTML = '';

    if (!conv) {
      showToast('⚠️ No pude escribir la conversación. Prueba con otro tema o inténtalo de nuevo.', 3400);
      return;
    }

    await pzGuardarConversacionCreada(conv);
    renderCrear();
    pzAbrirConversacionCreada(conv);
  }

  /* ---------- Generación con la Edge Function propia ----------
     Antes esto se apoyaba en "generar-dialogo" (pensada para diálogos con
     las palabras del grupo) y, si fallaba, en "tutor-abu". Ahora hay una
     función hecha para esto: "crear-conversacion". Recibe el tema tal cual
     lo escribió el usuario, el nivel, cuántos mensajes quiere (tope 20) y
     una lista de lo que ya vio, para no repetirle siempre la misma charla. */
  async function pzFetchIA(ruta, body, ms = CREAR_TIMEOUT_MS) {
    const headers = await cabecerasIA();
    if (!headers) { pzManejarRechazoIA({ codigo: 'sin_sesion' }); return { rechazado: true, payload: null }; }
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms);
    try {
      const resp = await fetch(`${SUPABASE_URL}/functions/v1/${ruta}`, {
        method: 'POST', headers, body: JSON.stringify(body), signal: controller.signal
      });
      let payload = null;
      try { payload = await resp.json(); } catch { /* respuesta no JSON */ }
      if (payload?.codigo && pzManejarRechazoIA(payload)) return { rechazado: true, payload };
      return { rechazado: false, payload: resp.ok ? payload : null, error: resp.ok ? null : (payload?.error || `HTTP ${resp.status}`) };
    } catch (err) {
      console.warn(`[crear conversación] ${ruta}:`, err?.name === 'AbortError' ? 'tardó demasiado' : (err?.message || err));
      return { rechazado: false, payload: null, error: 'red' };
    } finally { clearTimeout(timer); }
  }

  // Lo último que ya vio el usuario, para pedirle a la IA que no lo repita.
  function pzConversacionesAEvitar() {
    return pzConvCreadas().slice(0, 6).flatMap(c => [c.titulo, c.mensajes?.[0]?.en]).filter(Boolean);
  }

  async function pzGenerarConversacionIA({ tema, nivel, n, personajeA, personajeB }) {
    const r = await pzFetchIA('crear-conversacion', {
      tema, nivel,
      mensajes: Math.min(n, CREAR_MAX_MENSAJES),
      personajeA, personajeB,
      evitar: pzConversacionesAEvitar()
    });
    if (r.rechazado) return null;
    return pzNormalizarConversacionIA(r.payload, { tema, nivel, n, personajeA, personajeB });
  }

  /* Normaliza la respuesta al formato interno
     { id, titulo, nivel, tema, personajeA, personajeB, mensajes:[{rol,en,es}], creada:true }.
     Acepta también { title, lines:[{speaker,en,es}] } por si algún día se
     vuelve a apuntar a otra función. */
  function pzNormalizarConversacionIA(payload, ctx) {
    if (!payload || typeof payload !== 'object') return null;
    const crudas = Array.isArray(payload.mensajes) ? payload.mensajes
      : Array.isArray(payload.lines) ? payload.lines : null;
    if (!crudas || !crudas.length) return null;

    const hablantes = [];
    const rolDe = (m, i) => {
      const raw = (m.rol || m.role || m.speaker || '').toString().trim();
      if (/^a$/i.test(raw)) return 'A';
      if (/^b$/i.test(raw)) return 'B';
      if (raw) {
        if (!hablantes.includes(raw)) hablantes.push(raw);
        return hablantes.indexOf(raw) === 0 ? 'A' : 'B';
      }
      return i % 2 === 0 ? 'A' : 'B';
    };

    const mensajes = crudas.map((m, i) => ({
      rol: rolDe(m, i),
      en: (m.en || m.ingles || m.text || '').toString().replace(/<\/?[a-z][^>]*>/gi, '').trim(),
      es: (m.es || m.espanol || m['español'] || '').toString().replace(/<\/?[a-z][^>]*>/gi, '').trim(),
      audio_url: null
    })).filter(m => m.en).slice(0, CREAR_MAX_MENSAJES);   // ⛔ tope duro de 20

    if (mensajes.length < 2) return null;

    return {
      id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      titulo: (payload.titulo || payload.title || ctx.tema).toString().trim().slice(0, 70),
      nivel: ctx.nivel,
      tema: ctx.tema,
      personajeA: (payload.personajeA || ctx.personajeA).toString().trim().slice(0, 18),
      personajeB: (payload.personajeB || ctx.personajeB).toString().trim().slice(0, 18),
      mensajes,
      creada: true,
      creadaEn: new Date().toISOString()
    };
  }

  async function pzGuardarConversacionCreada(conv) {
    const lista = pzConvCreadas();
    // Solo texto: el audio no se guarda en el perfil (se vuelve a pedir a la Edge Function).
    lista.unshift({
      id: conv.id, titulo: conv.titulo, nivel: conv.nivel, tema: conv.tema,
      personajeA: conv.personajeA, personajeB: conv.personajeB, creadaEn: conv.creadaEn,
      mensajes: conv.mensajes.map(m => ({ rol: m.rol, en: m.en, es: m.es }))
    });
    if (lista.length > CREAR_MAX_GUARDADAS) {
      lista.splice(CREAR_MAX_GUARDADAS).forEach(c => { delete pzConvCreadasPuntajes()[c.id]; });
    }
    await updateUserFlow();
  }

  /* ============================================================
     CONVERSACIÓN EN VIVO (para las conversaciones creadas con IA)
     ------------------------------------------------------------
     Igual que "Ahora, a conversar" de abulingo.html: no es una lista de
     burbujas con botoncitos, sino una charla que AVANZA. El usuario elige
     personaje; las líneas del otro se reproducen solas con la voz de Abu
     (Edge Function "generar-audio-abu") y, cuando le toca a él, aparece el
     micrófono abajo. Al hablar se compara lo dicho con la línea modelo
     (pzCalificarLocal), se pinta su burbuja con lo que dijo y se sigue.
  ============================================================ */
  let pzVivo = null;   // { conv, rol, idx, puntajes:{}, verTrad }

  function pzAbrirConversacionCreada(c) {
    if (!c?.mensajes?.length) { showToast('⚠️ Esta conversación no tiene mensajes.'); return; }

            <span class="text-[11px] font-black text-slate-400 shrink-0"><span id="vivo-count">0</span>/${total}</span>
          </div>
          <div id="vivo-mensajes" class="flex-1 min-h-[180px] overflow-y-auto space-y-2.5 pr-1 bg-slate-50 rounded-xl border border-slate-100 p-2.5"></div>
          <div id="vivo-turno" class="flex flex-col items-center gap-1.5 pt-3 shrink-0"></div>
        </div>
      </div>`;
    document.getElementById('vivo-cerrar').onclick = cerrarVivo;
    document.getElementById('vivo-cambiar-rol').onclick = () => { pzVivoDetener(); pzVivoSelectorRol(); };
    document.getElementById('vivo-ver-trad').onclick = (e) => {
      pzVivo.verTrad = !pzVivo.verTrad;
      e.currentTarget.className = `shrink-0 text-[10px] font-black px-2 py-1.5 rounded-lg ${pzVivo.verTrad ? 'bg-[#FF7A00] text-white' : 'bg-slate-100 text-slate-500'}`;
      document.querySelectorAll('.vivo-trad').forEach(el => el.classList.toggle('hidden', !pzVivo.verTrad));
    };
    // Antes de la primera línea se traen TODAS las voces de una sola
    // vez: así la conversación fluye sin esperas entre turno y turno.
    if (pzVivo.conv?.creada) {
      const turno = document.getElementById('vivo-turno');
      if (turno) turno.innerHTML = `<p class="text-xs font-bold text-slate-400"><i class="fas fa-circle-notch fa-spin mr-1"></i>Preparando las voces…</p>`;
      pzPrecargarAudios(pzVivo.conv.mensajes).finally(() => { if (pzVivo) pzVivoPaso(); });
    } else {
      pzVivoPaso();
    }
  }

  function cerrarVivo() {
    pzVivoDetener();
    pzVivo = null;
    cerrarConversacion();
  }

  function pzVivoDetener() {
    stopSpeaking();
    if (pzVivoAudio) { try { pzVivoAudio.pause(); } catch {} pzVivoAudio = null; }
    if (pzVivoRec) { try { pzVivoRec.abort(); } catch {} pzVivoRec = null; }
  }

  let pzVivoAudio = null;
  let pzVivoRec = null;

  // Burbuja del chat en vivo. `dicho` solo viene en tus propias líneas.
  function pzVivoBurbuja(m, dicho, puntaje) {
    const box = document.getElementById('vivo-mensajes');
    if (!box) return;
    const mia = m.rol === pzVivo.rol;
    const nombre = m.rol === 'A' ? pzVivo.conv.personajeA : pzVivo.conv.personajeB;
    const idMsg = 'vivo-msg-' + Math.random().toString(36).slice(2, 9);
    const div = document.createElement('div');
    div.className = `flex ${mia ? 'justify-end' : 'justify-start'}`;
    div.innerHTML = `
      <div class="max-w-[85%] rounded-2xl p-2.5 ${mia ? 'bg-orange-50 border border-orange-100' : 'bg-white border border-slate-200'}">
        <p class="text-[10px] font-black uppercase ${mia ? 'text-[#FF7A00]' : 'text-slate-400'} mb-0.5">${escapeHTML(nombre)}</p>
        ${mia ? `<p class="text-sm font-semibold text-slate-700">${escapeHTML(m.en)}</p>` : `
        <p id="${idMsg}" class="hidden text-sm font-semibold text-slate-700">${escapeHTML(m.en)}</p>
        <button data-toggle-msg="${idMsg}" class="block text-[11px] font-bold text-slate-500 underline">Ver mensaje</button>`}
        <p class="vivo-trad text-xs text-slate-500 mt-0.5 ${pzVivo.verTrad ? '' : 'hidden'}">${escapeHTML(m.es || '')}</p>
        ${dicho ? `<p class="text-[11px] text-slate-500 mt-1.5 pt-1.5 border-t border-orange-200"><span class="font-black uppercase text-[9px] text-slate-400">Dijiste</span><br>${escapeHTML(dicho)}</p>` : ''}
        <div class="flex items-center gap-2 mt-1.5">
          <button class="vivo-repetir w-7 h-7 rounded-full bg-white border border-slate-200 text-slate-500 flex items-center justify-center" title="Escuchar"><i class="fas fa-volume-up text-[10px]"></i></button>
          ${mia ? pzMiniEstrellas(puntaje) : ''}
        </div>
      </div>`;
    div.querySelector('.vivo-repetir').onclick = (e) => pzReproducirLinea(pzVivo.conv, m, e.currentTarget);
    div.querySelector('[data-toggle-msg]')?.addEventListener('click', (e) => {
      const el = document.getElementById(e.currentTarget.dataset.toggleMsg);
      if (el) el.classList.remove('hidden');
      e.currentTarget.classList.add('hidden');
    });
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function pzVivoProgreso() {
    const total = pzVivo.conv.mensajes.length;
    const bar = document.getElementById('vivo-bar');
    const cnt = document.getElementById('vivo-count');
    if (bar) bar.style.width = `${Math.round((pzVivo.idx / total) * 100)}%`;
    if (cnt) cnt.textContent = pzVivo.idx;
  }

  async function pzVivoPaso() {
    if (!pzVivo) return;
    pzVivoProgreso();
    const { conv, idx, rol } = pzVivo;
    if (idx >= conv.mensajes.length) return pzVivoFin();

    const m = conv.mensajes[idx];
    const turno = document.getElementById('vivo-turno');
    if (!turno) return;

    // ---- Línea del OTRO personaje: se escucha y avanza sola ----
    if (m.rol !== rol) {
      turno.innerHTML = `<p class="text-xs font-bold text-slate-400"><i class="fas fa-volume-up mr-1"></i>Escucha a ${escapeHTML(m.rol === 'A' ? conv.personajeA : conv.personajeB)}...</p>`;
      pzVivoBurbuja(m, null, 0);
      let url = m.audio_url;
      if (!url) {
        const b64 = await pzAudioAbu(m.en, m.rol);
        if (b64) { m.audio_url = `data:audio/mp3;base64,${b64}`; url = m.audio_url; }
      }
      if (!pzVivo) return;
      const seguir = () => { if (pzVivo) { pzVivo.idx++; pzVivoPaso(); } };
      if (url) {
        pzVivoAudio = pzAplicarVel(new Audio(url), pzVelConv);
        pzVivoAudio.onended = () => setTimeout(seguir, 350);
        pzVivoAudio.onerror = () => setTimeout(seguir, 1200);
        pzVivoAudio.play().catch(() => setTimeout(seguir, 1200));
      } else {
        speak(m.en, pzVelConv);
        setTimeout(seguir, Math.max(1500, m.en.length * 60) / pzVelConv);
      }
      return;
    }

    // ---- TU línea: micrófono ----
    turno.innerHTML = `
      <p class="text-[11px] font-black text-[#FF7A00] uppercase text-center px-2">Te toca decir:</p>
      <p class="text-center text-sm font-bold text-slate-700 px-2">“${escapeHTML(m.en)}”</p>
      ${pzVivo.verTrad && m.es ? `<p class="text-center text-[11px] text-slate-400">${escapeHTML(m.es)}</p>` : ''}
      <button id="vivo-oir-modelo" class="text-[11px] font-black text-slate-400 hover:text-[#FF7A00]"><i class="fas fa-volume-up mr-1"></i>Escuchar el modelo</button>
      <button id="vivo-mic" class="mic-btn"><i class="fas fa-microphone text-2xl"></i></button>
      <p id="vivo-mic-msg" class="text-xs font-bold text-slate-400 min-h-[1.4em] text-center px-4">Toca el micrófono y dilo en voz alta</p>
      <button id="vivo-saltar" class="text-[11px] font-bold text-slate-300 hover:text-slate-500">Saltar esta línea</button>`;

    document.getElementById('vivo-oir-modelo').onclick = (e) => pzReproducirLinea(pzVivo.conv, m, e.currentTarget);
    document.getElementById('vivo-saltar').onclick = () => { pzVivo.idx++; pzVivoPaso(); };
    const btn = document.getElementById('vivo-mic');
    const msg = document.getElementById('vivo-mic-msg');
    btn.onclick = () => pzVivoGrabar(btn, msg, m);
  }

  /* Micrófono del modo en vivo: arranque manual, PARADA AUTOMÁTICA por
     silencio (igual que en Dominar). No graba audio, solo usa el
     reconocimiento de voz del navegador para saber qué dijo la persona.

     Mismo cuidado que en abulingo.html: en celular Chrome ignora
     "continuous" y eso duplicaba texto, así que ahí se usa continuous
     false + se reanuda sola en cada corte natural, acumulando lo dicho
     en sesiones separadas (limpiarRepeticionesVoz quita el eco que deja
     unir sesiones). En escritorio si se puede dejar continuous true y
     que decida el temporizador de silencio de abajo. */
  /* ════════════════════════════════════════════════════════════════
     UN SOLO MICRÓFONO PARA TODA LA PÁGINA — el del modal de práctica
     ────────────────────────────────────────────────────────────────
     Había tres reconocedores casi iguales (modo en vivo, conversar
     libre y el tutor) y los tres tenían el mismo defecto: dentro de
     onend volvían a llamar a rec.start() cuando el navegador cortaba
     por silencio. Eso hacía que:
       · con 'no-speech' se entrara en un bucle de arranques y el botón
         se quedara en rojo sin devolver nunca nada;
       · el auto-envío por silencio no se volviera a armar (la variable
         `sesion` quedaba vacía tras cada rearranque);
       · al pegar el texto de varias sesiones, el limpiador de
         repeticiones se comiera palabras buenas.

     El modal de práctica (pzIniciarGrabacion) nunca tuvo ese problema
     porque hace lo simple: una sola sesión, deja que el navegador
     corte por silencio y entrega lo que oyó. Esta función es eso
     mismo, reutilizable. `pzEscuchar` devuelve el reconocedor (o null)
     y siempre termina llamando a onFin, con texto o con cadena vacía.
     ════════════════════════════════════════════════════════════════ */
  /* Mismo motor de voz v4 que [[abulingo.html]]: el corte del navegador por
     una pausa no envía; se sigue escuchando y se envía con el silencio real,
     el segundo toque o el tope. */
  const pzVivoEsMovil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const PZ_VOZ_SILENCIO_MS = 4000;
  const PZ_VOZ_TOPE_MS     = 60000;
  const PZ_VOZ_REINICIOS   = 3;

  function pzEscuchar(btn, msg, { lang = 'en-US', onFin, textoEscuchando = 'Escuchando... habla y se enviará solo 🎙️' }) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { if (msg) msg.textContent = 'Tu navegador no reconoce voz — escribe tu respuesta 😉'; return null; }

    const rec = new SR();
    rec.lang = lang;
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    rec.continuous = !pzVivoEsMovil;   // Android lo ignora y duplica

    let dicho = '', previo = '', cerrado = false, errorDuro = null;
    let paradoManual = false, reinicios = 0, silencio = null, tope = null;
    const t0 = Date.now();

    if (btn) btn.classList.add('recording');
    if (msg) msg.textContent = textoEscuchando;

    const limpiarSilencio = () => { if (silencio) { clearTimeout(silencio); silencio = null; } };
    const terminar = () => {
      paradoManual = true;
      try { rec.stop(); } catch { cerrar(dicho.trim()); }
    };
    const rearmarSilencio = () => {
      limpiarSilencio();
      if (!dicho.trim()) return;
      silencio = setTimeout(terminar, PZ_VOZ_SILENCIO_MS);
    };
    const cerrar = (texto) => {
      if (cerrado) return;
      cerrado = true;
      limpiarSilencio();
      if (tope) { clearTimeout(tope); tope = null; }
      if (btn) btn.classList.remove('recording');
      onFin && onFin(texto, errorDuro);
    };

    rec.onresult = (e) => {
      let texto = '';
      for (let i = 0; i < e.results.length; i++) texto += e.results[i][0].transcript + ' ';
      dicho = limpiarRepeticionesVoz(unirSesionesVoz(previo, texto.trim()));
      if (msg) msg.textContent = dicho ? `"${dicho}"` : 'Escuchando...';
      rearmarSilencio();
    };
    rec.onerror = (e) => {
      const err = e.error || 'error';
      if (err === 'no-speech' || err === 'aborted') return;   // los resuelve onend
      if (err === 'not-allowed' || err === 'service-not-allowed') errorDuro = 'sin-permiso';
      else if (err === 'audio-capture') errorDuro = 'microfono-ocupado';
      else errorDuro = err;
    };
    rec.onend = () => {
      if (cerrado) return;
      if (errorDuro) return cerrar(dicho.trim());
      if (paradoManual) return cerrar(dicho.trim());
      // Corte del navegador por una pausa a mitad de frase: se sigue escuchando.
      previo = dicho;
      const conTexto = !!dicho.trim();
      if (Date.now() - t0 < PZ_VOZ_TOPE_MS && (conTexto || reinicios < PZ_VOZ_REINICIOS)) {
        if (!conTexto) reinicios++;
        try { rec.start(); return; } catch {}
      }
      cerrar(dicho.trim());
    };
    rec.detenerYa = () => {
      limpiarSilencio();
      terminar();
    };

    try { rec.start(); } catch (err) {
      console.warn('[voz] no se pudo iniciar:', err);
      errorDuro = 'no-inicio';
      cerrar('');
      return null;
    }
    tope = setTimeout(terminar, PZ_VOZ_TOPE_MS);
    return rec;
  }

  // Texto para los errores que el usuario SÍ puede resolver.
  function pzTextoErrorVoz(err) {
    if (err === 'sin-permiso') return 'Bloqueaste el micrófono 🔒 — actívalo en el candado de la barra de direcciones';
    if (err === 'microfono-ocupado') return 'Otra app está usando el micrófono. Ciérrala e intenta de nuevo.';
    if (err === 'no-inicio') return 'El micrófono está ocupado — espera un segundo e inténtalo otra vez';
    return 'No te escuché, inténtalo otra vez 🎙️';
  }

  function pzVivoGrabar(btn, msg, m) {
    // Segundo toque = cortar antes de que actúe el silencio automático.
    if (pzVivoRec) { try { pzVivoRec.detenerYa(); } catch {} return; }
    pzVivoRec = pzEscuchar(btn, msg, {
      onFin: (dicho, err) => {
        pzVivoRec = null;
        if (!dicho) { msg.textContent = pzTextoErrorVoz(err); return; }
        pzVivoResolverTurno(m, dicho, msg);
      }
    });
  }

  async function pzVivoResolverTurno(m, dicho, msg) {
    const puntaje = pzCalificarLocal(m.en, dicho);
    pzVivo.puntajes[pzVivo.idx] = puntaje;
    pzConvPuntajes[pzVivo.idx] = puntaje;

    // Se guarda en el perfil, igual que en la vista de lista.
    const bolsa = pzConvCreadasPuntajes();
    if (!bolsa[pzVivo.conv.id]) bolsa[pzVivo.conv.id] = {};
    bolsa[pzVivo.conv.id][pzVivo.idx] = puntaje;
    updateUserFlow();

    pzVivoBurbuja(m, dicho, puntaje);
    msg.innerHTML = puntaje >= 4
      ? '<span class="text-green-600">✅ ¡Bien dicho!</span>'
      : '<span class="text-slate-500">Escucha cómo suena y sigue 👇</span>';
    if (puntaje >= 5 && window.confetti) confetti({ particleCount: 60, spread: 55, origin: { y: 0.7 }, colors: ['#FF7A00', '#fbbf24'] });

    // Se reproduce la versión modelo para que compare, y luego sigue.
    setTimeout(async () => {
      if (!pzVivo) return;
      await pzReproducirLinea(pzVivo.conv, m, null);
      setTimeout(() => { if (pzVivo) { pzVivo.idx++; pzVivoPaso(); } }, 1400);
    }, 600);
  }

  function pzVivoFin() {
    pzVivoProgreso();
    const turno = document.getElementById('vivo-turno');
    if (!turno) return;
    if (window.confetti) confetti({ particleCount: 110, spread: 70, origin: { y: 0.6 }, colors: ['#FF7A00', '#3b82f6', '#fbbf24'] });
    turno.innerHTML = `
      <p class="text-center text-sm font-bold text-green-600">🎉 ¡Conversación terminada!</p>
      <div class="flex gap-2 w-full mt-1">
        <button id="vivo-otra" class="flex-1 btn-juice bg-white border-2 border-slate-200 text-slate-600 font-bold py-2.5 rounded-xl text-sm"><i class="fas fa-rotate-right mr-1"></i>Repetir</button>
        <button id="vivo-listo" class="flex-1 btn-juice bg-[#FF7A00] text-white font-bold py-2.5 rounded-xl text-sm">Listo 👍</button>
      </div>`;
    document.getElementById('vivo-otra').onclick = () => pzVivoIniciar(pzVivo.rol);
    document.getElementById('vivo-listo').onclick = () => { cerrarVivo(); renderCrear(); };
  }

  /* ---------- Voz real con la Edge Function "generar-audio-abu" ----------
     Devuelve el audio en base64 (mp3) o null si no se pudo. Se guarda en
     pzAudioCache por texto exacto, así reescuchar una línea no vuelve a
     gastar cupo de la función. */
  async function pzAudioAbu(texto, rol) {
    const t = String(texto || '').trim();
    if (!t) return null;
    const voz = pzVozDe(rol);
    const clave = pzClaveVoz(voz, t);
    if (pzAudioCache.has(clave)) return pzAudioCache.get(clave);
    const headers = await cabecerasIA();
    if (!headers) return null;
    try {
      const resp = await fetch(`${SUPABASE_URL}/functions/v1/generar-audio-abu`, {
        method: 'POST',
        headers,
        // `voz` da a cada personaje su propio timbre y `velocidad` deja el
        // audio más lento que el ritmo nativo, para principiantes.
        body: JSON.stringify({ texto: t, voz, velocidad: VOZ_VELOCIDAD })
      });
      const payload = await resp.json().catch(() => null);
      if (payload?.codigo && pzManejarRechazoIA(payload)) return null;
      if (!resp.ok || !payload?.audioContent) return null;
      pzAudioCache.set(clave, payload.audioContent);
      return payload.audioContent;
    } catch (err) {
      console.warn('[crear conversación] audio:', err?.message || err);
      return null;
    }
  }

  /* ---------- Precarga en LOTE ----------
     Pide en UNA sola llamada (un solo crédito) el audio de todas las
     líneas de una conversación creada, en vez de una llamada por línea.
     Devuelve cuántas quedaron listas. */
  async function pzPrecargarAudios(mensajes) {
    const pendientes = (mensajes || [])
      .map(m => ({ texto: String(m?.en || '').trim(), voz: pzVozDe(m?.rol), ref: m }))
      .filter(l => l.texto && !l.ref.audio_url && !pzAudioCache.has(pzClaveVoz(l.voz, l.texto)))
      .slice(0, 14);

    // Lo que ya estaba en caché se aprovecha aunque no haya red.
    (mensajes || []).forEach(m => {
      const t = String(m?.en || '').trim();
      const c = pzAudioCache.get(pzClaveVoz(pzVozDe(m?.rol), t));
      if (c && !m.audio_url) m.audio_url = `data:audio/mp3;base64,${c}`;
    });
    if (!pendientes.length) return 0;

    const headers = await cabecerasIA();
    if (!headers) return 0;
    try {
      const resp = await fetch(`${SUPABASE_URL}/functions/v1/generar-audio-abu`, {
        method: 'POST',
        headers,
        body: JSON.stringify({
          lineas: pendientes.map(l => ({ texto: l.texto, voz: l.voz })),
          velocidad: VOZ_VELOCIDAD
        })
      });
      const payload = await resp.json().catch(() => null);
      if (payload?.codigo && pzManejarRechazoIA(payload)) return 0;
      if (!resp.ok || !Array.isArray(payload?.audios)) return 0;

      // El servidor puede saltarse una línea que falle, así que se
      // emparejan por TEXTO y no por posición.
      const porTexto = new Map();
      pendientes.forEach(l => {
        if (!porTexto.has(l.texto)) porTexto.set(l.texto, []);
        porTexto.get(l.texto).push(l);
      });
      let ok = 0;
      payload.audios.forEach(a => {
        const lista = porTexto.get(String(a?.texto || ''));
        const l = lista && lista.shift();
        if (!l || !a?.audioContent) return;
        pzAudioCache.set(pzClaveVoz(l.voz, l.texto), a.audioContent);
        l.ref.audio_url = `data:audio/mp3;base64,${a.audioContent}`;
        ok++;
      });
      return ok;
    } catch (err) {
      console.warn('[crear conversación] precarga de audio:', err?.message || err);
      return 0;
    }
  }

  // Reproduce una línea: primero el audio real; si no existe todavía y la
  // conversación es creada, se pide a la Edge Function; si nada funciona,
  // se usa la voz del navegador para no dejar la línea muda.
  /* Última red: dice una línea con la voz REAL (mismo motor de Abu) y
     solo si eso no se puede, con la del navegador. Se usa donde antes
     se caía directo a speak(): líneas de conversaciones guardadas que no
     tienen mp3 en Supabase y frases sueltas sin audio grabado.
     (Las conversaciones guardadas SIGUEN usando primero su audio real de
     Supabase; esto es únicamente para cuando no existe). */
  async function pzDecir(texto, rol, btn, vel) {
    const t = String(texto || '').trim();
    if (!t) return;
    stopSpeaking();
    const previo = btn ? btn.innerHTML : null;
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin text-[10px]"></i>'; }
    const b64 = await pzAudioAbu(t, rol);
    if (btn) { btn.disabled = false; btn.innerHTML = previo; }
    if (b64) pzTocarUrl(`data:audio/mp3;base64,${b64}`, null, vel);
    else speak(t, vel || 1);
  }

  async function pzReproducirLinea(conv, m, btn) {
    stopSpeaking();
    if (m.audio_url) { pzTocarUrl(m.audio_url, null, pzVelConv); return; }
    if (!conv?.creada) { pzDecir(m.en, m.rol, btn, pzVelConv); return; }
    const previo = btn ? btn.innerHTML : null;
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin text-[10px]"></i>'; }
    const b64 = await pzAudioAbu(m.en, m.rol);
    if (btn) { btn.disabled = false; btn.innerHTML = previo; }
    if (b64) {
      m.audio_url = `data:audio/mp3;base64,${b64}`;
      pzTocarUrl(m.audio_url, null, pzVelConv);
    } else speak(m.en, pzVelConv);
  }

  // Genera de una vez el audio de TODAS las líneas de la conversación creada.
  async function pzGenerarAudiosConversacion() {
    const conv = pzConvActual;
    if (!conv?.creada) return;
    const btn = document.getElementById('conv-audios');
    const pendientes = conv.mensajes.filter(m => !m.audio_url);
    if (!pendientes.length) { showToast('🔊 Los audios ya están listos.'); return; }
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>'; }
    // Una sola llamada para toda la conversación (antes era una por
    // línea: 8 líneas = 8 llamadas y 8 créditos gastados).
    const ok = await pzPrecargarAudios(conv.mensajes);
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-volume-high"></i>'; }
    showToast(ok ? `🔊 ${ok} audio${ok === 1 ? '' : 's'} listo${ok === 1 ? '' : 's'}.` : '⚠️ No pude generar los audios ahora.');
  }

  // Reproduce la conversación entera de corrido (todas las líneas).
  async function pzEscucharConversacionCompleta() {
    const conv = pzConvActual;
    if (!conv) return;
    const btn = document.getElementById('conv-play-todo');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>'; }
    for (const m of conv.mensajes) {
      if (!pzConvActual || pzConvActual.id !== conv.id) break;   // el usuario cerró el modal
      await new Promise(async (resolve) => {
        let url = m.audio_url;
        if (!url && conv.creada) {
          const b64 = await pzAudioAbu(m.en, m.rol);
          if (b64) { m.audio_url = `data:audio/mp3;base64,${b64}`; url = m.audio_url; }
        }
        if (url) {
          const a = pzAplicarVel(new Audio(url), pzVelConv);
          a.onended = resolve; a.onerror = () => setTimeout(resolve, 1200);
          a.play().catch(() => setTimeout(resolve, 1200));
        } else {
          speak(m.en, pzVelConv);
          setTimeout(resolve, Math.max(1400, m.en.length * 55) / pzVelConv);
        }
      });
      await new Promise(r => setTimeout(r, 250));
    }
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-play"></i>'; }
  }

  function pzToggleDominada(fraseIdStr) {
    const fraseId = String(fraseIdStr);
    const yaEraDominada = pzEsDominada(fraseId);
    // Quitarla de "dominadas" es reversible al toque: no hace falta confirmar.
    if (yaEraDominada) { pzConfirmarQuitarDominada(fraseId); return; }
    // Marcarla como dominada SÍ requiere confirmación: deja de aparecer para
    // repasar y el usuario podría estar tocando el botón por accidente.
    showModal({
      icon: '🤔',
      title: '¿Ya la dominas?',
      body: '¿Estás seguro? Ya no volverá a aparecerte en tu lista para estudiar. Luego, si cambias de opinión, puedes volver a activarla desde "dominadas".',

        { label: 'Sí, ya la domino ✅', onClick: () => { closeModal(); pzMarcarDominada(fraseId); } },
        { label: 'Cancelar', style: 'bg-slate-100 text-slate-500', onClick: closeModal }

    cargarYPintarProgreso();

    ensureDaily();

    await updateUserFlow();

  async function pzBuscarFrases(q) {
    const cont = document.getElementById('pz-frase-search-results');
    if (!cont) return;
    const limpio = q.replace(/[%,()*]/g, ' ').trim();
    if (!limpio) { cont.innerHTML = ''; return; }
    const filtro = `fraseingles.ilike.%${limpio}%,fraseespañol.ilike.%${limpio}%`;
    const { data, error } = await dbClient.from('frases')
      .select('id,fraseingles,fraseespañol,audio_url,nivel')
      .or(filtro)
      .order('id', { ascending: true })
      .limit(15);
    if (!document.getElementById('pz-frase-search-results')) return;
    if (error) { cont.innerHTML = '<p class="text-center text-red-400 text-sm py-3">No se pudo buscar. Intenta de nuevo.</p>'; return; }
    if (!data || !data.length) { cont.innerHTML = '<p class="text-center text-slate-400 text-sm py-3">No encontré frases con eso.</p>'; return; }
    cont.innerHTML = `<div class="space-y-2 mb-3">` + data.map(f => `
      <button class="pz-frase-resultado w-full text-left flex items-center gap-2.5 bg-slate-50 border border-slate-100 hover:border-[#FF7A00] rounded-xl p-2.5" data-id="${f.id}">
        <div class="flex-1 min-w-0">
          <p class="font-heading font-black text-slate-700 text-sm truncate">${escapeHTML(f.fraseingles)}</p>
          <p class="text-xs text-slate-500 truncate">${escapeHTML(f.fraseespañol || '')}</p>
        </div>
        <span class="text-[10px] font-black text-[#FF7A00] bg-orange-50 px-2 py-1 rounded-full shrink-0">${escapeHTML(f.nivel || '')}</span>
      </button>`).join('') + `</div>`;
    cont.querySelectorAll('.pz-frase-resultado').forEach(btn => {
      btn.onclick = () => {
        const f = data.find(x => String(x.id) === btn.dataset.id);
        if (f) abrirPractica({ text: f.fraseingles, es: f.fraseespañol, audioUrl: f.audio_url || null, nivel: f.nivel, id: f.id });
      };
    });
  }

    pzConvNivelElegido = nivel;

  // La columna `conversacion` guarda un JSON con los dos personajes y los
  // mensajes: { personajeA, personajeB, mensajes: [{rol:'A'|'B', en, es}] }
  function pzParsearConversacion(c) {
    try {
      const j = typeof c.conversacion === 'string' ? JSON.parse(c.conversacion) : c.conversacion;
      return {
        id: c.id, titulo: c.titulo, nivel: c.nivel_ingles,
        personajeA: j.personajeA || 'Persona A', personajeB: j.personajeB || 'Persona B',
        mensajes: Array.isArray(j.mensajes) ? j.mensajes : []
      };
    } catch (e) {
      console.warn('[pronunciación] no se pudo leer la conversación:', e);
      return { id: c.id, titulo: c.titulo, nivel: c.nivel_ingles, personajeA: 'Persona A', personajeB: 'Persona B', mensajes: [] };
    }
  }

  // Trae de la nube las calificaciones (1-5) que el usuario ya tiene en
  // cada línea de ESTA conversación, para que al reabrirla se vea lo que
  // ya practicó (en vez de mostrar "Sin practicar" de nuevo).
  async function cargarPuntajesLineasConversacion(conversacionId) {
    pzConvPuntajes = {};
    // Las conversaciones creadas con IA no están en la base: su avance
    // vive en el perfil (flujo.convCreadasPuntajes).
    if (pzConvActual?.creada) { pzConvPuntajes = { ...(pzConvCreadasPuntajes()[conversacionId] || {}) }; return; }
    const { data, error } = await dbClient.from('conversaciones_pronunciacion_lineas')
      .select('linea_indice,puntaje').eq('user_id', currentUser.id).eq('conversacion_id', conversacionId);
    if (error) { console.warn('[pronunciación] no se pudieron cargar las líneas practicadas:', error.message); return; }
    (data || []).forEach(row => { pzConvPuntajes[row.linea_indice] = row.puntaje; });
  }

  function abrirConversacion(c) {
    const conv = pzParsearConversacion(c);
    if (!conv.mensajes.length) { showToast('⚠️ Esta conversación no tiene mensajes cargados.'); return; }
    pzConvActual = conv;
    pzConvRol = null;
    pzConvPuntajes = {};
    pzConvVerTrad = false;
    pzConvRevelados = new Set();
    pintarConversacionModal();
  }

  function cerrarConversacion() {
    stopSpeaking();
    pzVolverA = null;
    pzConvActual = null;
    document.getElementById('modal-root').innerHTML = '';
  }

  function pintarConversacionModal() {
    if (!pzConvActual) return;
    if (!pzConvRol) { pintarSelectorRol(); return; }
    pintarChatConversacion();
  }

  // Al cerrar la conversación también se corta el modo en vivo.
  function pzCerrarTodoConversacion() { if (pzVivo) return cerrarVivo(); cerrarConversacion(); }

      ? Math.round(Object.values(pzConvPuntajes).reduce((a, b) => a + b, 0) / Object.values(pzConvPuntajes).length) : 0;

            ${conv.creada ? `<button id="conv-audios" title="Generar todos los audios con la voz de Abu" class="shrink-0 w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center"><i class="fas fa-volume-high text-[11px]"></i></button>` : ''}

      btn.onclick = () => {

        abrirPractica({ text: m.en, es: m.es, nivel: conv.nivel, conversacion: conv, msgIndex: i, audioUrl: m.audio_url || null, rol: m.rol });
      };

    document.querySelectorAll('.pz-conv-ver-mensaje').forEach(btn => {

    if (mensajesNuevo && scrollPrevio != null) mensajesNuevo.scrollTop = scrollPrevio;
  }

          ${oculto ? `<button class="pz-conv-ver-mensaje text-[11px] font-bold text-slate-500 underline" data-i="${i}">Ver mensaje</button>` : ''}
          ${pzConvVerTrad ? `<p class="text-xs text-slate-500 mt-0.5">${escapeHTML(m.es || '')}</p>` : ''}
          <div class="flex items-center gap-2 mt-1.5">

  /* ---------- Modo 3: mi propio texto ---------- */
  let pzFrasesTexto = [];
  function renderTexto() {

  /* ============================================================
     Modo 7: LISTENING — "Shadowing + Audio + transcript"
     ------------------------------------------------------------
     El método, en tres pasos, es el que usan los intérpretes:

       1. ESCUCHAR el texto entero sin leer nada, para acostumbrar el
          oído al ritmo real.
       2. LEER el transcript mientras vuelve a sonar, así cada sonido
          se ata a su palabra escrita.
       3. SHADOWING frase por frase: se reproduce UNA frase, se baja la
          velocidad si hace falta y se repite encima hasta que sale.

     Por eso la pantalla está partida igual que el método: arriba el
     texto completo con su reproductor, y abajo una tarjeta por frase
     con SUS palabras sueltas, su propio botón de play, su control de
     velocidad y su micrófono.

     Los audios viven en el bucket público "listening" de Supabase
     (un mp3 por texto + un mp3 por frase, voz en-US-Chirp3-HD-Leda —
     la misma de Abu). Se generan con scripts/generar_audios_listening.py.
     Se guardan a velocidad 1.0 y el navegador los ralentiza con
     `playbackRate`: así un solo archivo sirve para todas las
     velocidades y no hay que descargar cuatro versiones.
  ============================================================ */
  const LISTENING_BUCKET = `${SUPABASE_URL}/storage/v1/object/public/listening/`;
  const LS_VELOCIDADES = [0.5, 0.75, 1, 1.25];

  let lsNivelElegido = null;
  let lsTextosNivel = [];
  let lsTextoActual = null;     // el texto abierto en la vista de práctica
  let lsProgreso = {};          // { [textoId]: { "0": 5, "1": 4 } }
  let lsVelocidad = 1;          // velocidad global elegida por la persona
  let lsAudio = null;           // <audio> en curso (uno a la vez)
  let lsFraseSonando = null;    // índice de la frase que está sonando
  let lsTextoAbierto = false;   // ¿está desplegado el transcript completo?
  let lsOrden = {};             // { [frase]: { puestas: [], banco: [] } } del ejercicio de ordenar
  let lsRec = null;             // reconocimiento de voz del shadowing

  const lsUrl = (ruta) => (ruta ? LISTENING_BUCKET + ruta : null);

  function lsDetenerAudio() {
    if (lsAudio) { try { lsAudio.pause(); } catch {} lsAudio = null; }
    lsFraseSonando = null;
  }

  /* Reproduce una pista a la velocidad elegida. `playbackRate` se aplica
     DESPUÉS de play() en algunos navegadores móviles, por eso se pone en
     los dos sitios. */
  function lsTocar(url, { onFin } = {}) {
    lsDetenerAudio();
    stopSpeaking();
    const a = new Audio(url);
    a.playbackRate = lsVelocidad;
    a.preservesPitch = true;          // que no suene a ardilla al bajarla
    a.mozPreservesPitch = true;
    a.webkitPreservesPitch = true;
    lsAudio = a;
    const fin = () => {
      if (lsAudio === a) { lsAudio = null; lsFraseSonando = null; }
      lsPintarEstadoBotones();
      if (onFin) onFin();
    };
    a.onended = fin;
    a.onerror = fin;
    a.onplay = () => { a.playbackRate = lsVelocidad; };
    a.play().catch(fin);
    return a;
  }

  /* ---------- Pantalla 1: elegir nivel y texto ---------- */
  function renderListening() {
    lsDetenerAudio();
    lsTextoActual = null;
    document.getElementById('mode-panel').innerHTML = `
      <div class="card-3d p-4 sm:p-5">
        <div class="flex items-start gap-3 mb-4">
          <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-[#FF7A00] to-orange-600 text-white flex items-center justify-center shrink-0 shadow">
            <i class="fas fa-headphones text-lg"></i>
          </div>
          <div class="min-w-0">
            <h2 class="font-heading font-black text-slate-800 leading-tight">Listening con Shadowing</h2>
            <p class="text-[11px] text-slate-400 leading-snug">Escucha el texto, léelo mientras suena y repite frase por frase encima del audio. Puedes bajar la velocidad cuando quieras.</p>
          </div>
        </div>

        <p class="text-xs font-black uppercase tracking-wide text-slate-400 mb-2">Elige un nivel</p>
        <div class="grid grid-cols-4 gap-2 mb-4">
          ${NIVELES_FIJOS.map(n => `
            <button class="ls-nivel-chip btn-juice ${n === lsNivelElegido ? 'bg-[#FF7A00] text-white' : 'bg-slate-100 text-slate-600'} font-black text-sm py-3 rounded-xl" data-nivel="${n}">${n}</button>
          `).join('')}
        </div>
        <div id="ls-lista-wrap">
          ${lsNivelElegido ? lsListaHTML() : '<p class="text-center text-slate-400 text-sm py-6">Elige un nivel para ver sus textos de escucha. 🎧</p>'}
        </div>

    document.querySelectorAll('.ls-nivel-chip').forEach(b => {

  async function lsElegirNivel(nivel) {
    lsNivelElegido = nivel;
    renderListening();
    const wrap = document.getElementById('ls-lista-wrap');
    if (wrap) wrap.innerHTML = '<p class="text-center text-slate-300 text-lg py-6"><i class="fas fa-circle-notch fa-spin"></i></p>';

    const { data, error } = await dbClient.from('textos_listening')
      .select('id,nivel,titulo,tema,texto,traduccion,frases,audio_url,palabras')
      .eq('nivel', nivel)
      .order('orden', { ascending: true });

    // El usuario pudo cambiar de nivel o de modo mientras cargaba.
    if (!document.getElementById('ls-lista-wrap') || lsNivelElegido !== nivel) return;
    if (error) {
      document.getElementById('ls-lista-wrap').innerHTML =
        `<p class="text-center text-red-400 text-sm py-6">No se pudieron cargar los textos.<br><span class="text-[11px] text-slate-400">${escapeHTML(error.message)}</span></p>`;
      return;

    lsTextosNivel = data || [];
    if (!lsTextosNivel.length) {
      document.getElementById('ls-lista-wrap').innerHTML = '<p class="text-center text-slate-400 text-sm py-6">Todavía no hay textos cargados para este nivel.</p>';
      return;
    }
    await lsCargarProgreso(lsTextosNivel.map(t => t.id));
    lsPintarLista();
  }

  // Cuántas frases lleva dominadas (4-5 estrellas) en cada texto.
  async function lsCargarProgreso(ids) {
    if (!ids.length || !currentUser) return;
    const { data, error } = await dbClient.from('listening_progreso')
      .select('texto_id,frases_ok,completado')
      .eq('user_id', currentUser.id).in('texto_id', ids);
    if (error) { console.warn('[listening] progreso:', error.message); return; }
    (data || []).forEach(r => { lsProgreso[r.texto_id] = r.frases_ok || {}; });
  }

  const lsFrasesOk = (textoId) =>
    Object.values(lsProgreso[textoId] || {}).filter(p => Number(p) >= 4).length;

  function lsListaHTML() {
    if (!lsTextosNivel.length) return '';
    return `

            <div class="flex items-center gap-3">

                <i class="fas ${pct === 100 ? 'fa-check text-white' : 'fa-play text-[#FF7A00] text-xs'}"></i>
              </div>

                <p class="font-heading font-black text-slate-800 leading-tight truncate">${escapeHTML(t.titulo)}</p>
                <p class="text-[11px] text-slate-400 truncate">${escapeHTML(t.tema || '')} · ${t.palabras || 0} palabras · ${total} frases</p>
              </div>
              <span class="shrink-0 text-[10px] font-black ${pct === 100 ? 'text-green-600' : 'text-slate-400'}">${ok}/${total}</span>
            </div>
            <div class="h-1.5 bg-slate-200 rounded-full mt-2 overflow-hidden">
              <div class="h-full ${pct === 100 ? 'bg-green-500' : 'bg-[#FF7A00]'} rounded-full transition-all" style="width:${pct}%"></div>
            </div>
          </button>`;
        }).join('')}
      </div>`;
  }

  function lsPintarLista() {
    const wrap = document.getElementById('ls-lista-wrap');
    if (!wrap) return;
    wrap.innerHTML = lsListaHTML();
    lsBindLista();
  }

  function lsBindLista() {
    document.querySelectorAll('.ls-abrir').forEach(b => {
      b.onclick = () => {
        const t = lsTextosNivel.find(x => String(x.id) === b.dataset.id);
