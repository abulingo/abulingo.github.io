  <style>
    /* ============================================================
       RENDIMIENTO · dos reglas que valen mucho en páginas largas
       ------------------------------------------------------------
       content-visibility: auto le dice al navegador que NO calcule
       el diseño ni pinte lo que está fuera de la pantalla hasta que
       te acerques. En listas de cientos de palabras, frases o temas
       de gramática es la diferencia entre pintar todo de golpe o
       pintar solo lo visible. contain-intrinsic-size le da una
       altura estimada para que la barra de scroll no salte.
    ============================================================ */
    .lista-larga > * {
      content-visibility: auto;
      contain-intrinsic-size: auto 72px;
    }
    /* Evita el "salto" de las imágenes mientras cargan */
    img { max-width: 100%; height: auto; }
    /* Respeta a quien tiene activado "reducir movimiento" en su sistema:
       menos animaciones = menos trabajo de pintado en equipos lentos. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

<script type="module">
  /* ============================================================
     1. CONFIGURACIÓN (mismo proyecto de Supabase que abulingo.html)
  ============================================================ */
  const SUPABASE_URL = 'https://eylwewhqeaaqkgcxhgyv.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5bHdld2hxZWFhcWtnY3hoZ3l2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMzAxODgsImV4cCI6MjA5OTkwNjE4OH0.Ji8huj-ny2VcMT5UQSjOuwUKz4k23quNS0fLk-gZr7A';
  const NIVELES_FIJOS = ['A1', 'A2', 'B1', 'B2'];

  // ⚠️ Reemplaza por el link real de tu grupo o canal de WhatsApp.
  const WHATSAPP_COMUNIDAD_URL = 'https://chat.whatsapp.com/TU_ENLACE_AQUI';

  // Misión del día (debe coincidir con abulingo.html): 30 palabras + 5 frases nuevas.
  const MISION_FRASES_DIA = 5;
  const MISION_PALABRAS_DIA = 30;
  const MISION_RECOMPENSA_LINGOTS = 2;

  const { createClient } = supabase;
  const dbClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let userProfile = null;
  let flujo = null; // atajo a userProfile.flujo (frases dominadas + misión del día)

  /* ============================================================
     2. UTILIDADES (copiadas de abulingo.html para mantener
        exactamente el mismo comportamiento)
  ============================================================ */
  const escapeHTML = (s) => (s || '').toString()
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  // Quita puntuación (puntos, comas, signos de interrogación/exclamación,
  // comillas, etc.) antes de comparar lo dicho contra la frase modelo, para
  // que un "Hello" sin punto no le reste estrellas a "Hello.".
  const pzSinPuntuacion = (s) => (s || '').toString()
    .replace(/[.,!?;:¡¿'"""''`´()\[\]{}\-–—_/\\]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();

  // Distancia de Levenshtein (número mínimo de ediciones para pasar de
  // una cadena a otra), usada para calificar la pronunciación localmente.
  function pzLevenshtein(a, b) {
    const m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const curr = [i];
      for (let j = 1; j <= n; j++) {
        const costo = a[i - 1] === b[j - 1] ? 0 : 1;
        curr[j] = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + costo);
      }
      prev = curr;
    }
    return prev[n];
  }

  // Calificación 1-5 comparando lo que dijo el usuario contra la frase
  // modelo — sin tomar en cuenta mayúsculas/minúsculas ni signos de
  // puntuación. Solo una coincidencia EXACTA (tras esa limpieza) da 5
  // estrellas; mientras más distinta esté la pronunciación, menos estrellas.
  function pzCalificarLocal(objetivo, dicho) {
    const t = pzSinPuntuacion(objetivo).toLowerCase();
    const d = pzSinPuntuacion(dicho).toLowerCase();
    if (!t || !d) return 0;
    if (t === d) return 5;
    const distancia = pzLevenshtein(t, d);
    const similitud = 1 - distancia / Math.max(t.length, d.length);
    if (similitud >= 0.85) return 4;
    if (similitud >= 0.65) return 3;
    if (similitud >= 0.4) return 2;
    return 1;
  }

  let toastTimer = null;
  function showToast(msg, ms = 2600) {
    let t = document.getElementById('app-toast');
    if (!t) { t = document.createElement('div'); t.id = 'app-toast'; t.className = 'toast'; document.body.appendChild(t); }
    t.innerHTML = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms);
  }

  /* ---------- Flujo compartido + Misión del día (mismo formato que abulingo.html) ----------
     Esta página solo lee/toca flujo.frasesDominadas y flujo.daily.misionFrases/misionCumplida;
     el resto de "flujo" (srs, racha, dominar, etc.) se conserva tal cual venía de la nube. */
  const todayStr = () => new Date().toISOString().slice(0, 10);

  function ensureDaily() {
    if (!flujo.daily) flujo.daily = { date: todayStr(), newWords: 0, reviewed: 0, points: 0, goalShown: false, unlockAt: null, misionPalabras: 0, misionFrases: 0, misionCumplida: false };
    if (flujo.daily.unlockAt === undefined) flujo.daily.unlockAt = null;
    if (flujo.daily.misionPalabras === undefined) flujo.daily.misionPalabras = 0;
    if (flujo.daily.misionFrases === undefined) flujo.daily.misionFrases = 0;
    if (flujo.daily.misionCumplida === undefined) flujo.daily.misionCumplida = false;
    if (flujo.daily.date !== todayStr()) {
      flujo.daily.date = todayStr();
      flujo.daily.points = 0;
      flujo.daily.reviewed = 0;
      flujo.daily.goalShown = false;
      flujo.daily.club = { msgs: 0, joins: 0 };
      flujo.daily.misionPalabras = 0;
      flujo.daily.misionFrases = 0;
      flujo.daily.misionCumplida = false;
    }
    if (!flujo.daily.club) flujo.daily.club = { msgs: 0, joins: 0 };
    if (!flujo.frasesDominadas) flujo.frasesDominadas = {};
  }

  async function updateUserFlow() {
    flujo.savedAt = new Date().toISOString();
    userProfile.flujo = flujo;
    for (let intento = 0; intento < 2; intento++) {
      const { error } = await dbClient.from('profiles').update({ flujo }).eq('id', currentUser.id);
      if (!error) return;
      console.error(`Error guardando flujo (intento ${intento + 1}):`, error.message);
      if (intento === 0) await new Promise(r => setTimeout(r, 600));
      else showToast('⚠️ No se pudo guardar tu avance en la nube.', 3000);
    }
  }

  // Se llama cuando el usuario domina una frase POR PRIMERA VEZ. Suma a la
  // misión del día y, si ya completó también las 30 palabras nuevas en
  // abulingo.html, entrega la recompensa (mismo criterio que allá).
  // No guarda en Supabase: quien llama a esta función se encarga de eso.
  function registrarFraseNuevaMision() {
    ensureDaily();
    flujo.daily.misionFrases = (flujo.daily.misionFrases || 0) + 1;
    if (!flujo.daily.misionCumplida &&
        (flujo.daily.misionPalabras || 0) >= MISION_PALABRAS_DIA &&
        (flujo.daily.misionFrases || 0) >= MISION_FRASES_DIA) {
      flujo.daily.misionCumplida = true;
      const lingots = (parseFloat(userProfile.lingots) || 0) + MISION_RECOMPENSA_LINGOTS;
      userProfile.lingots = lingots;
      const dl = document.getElementById('user-lingots'); if (dl) dl.textContent = lingots;
      dbClient.from('profiles').update({ lingots }).eq('id', currentUser.id).then(() => {});
      if (window.confetti) confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#FF7A00', '#3b82f6', '#fbbf24'] });
      showToast(`🎯 ¡Misión del día cumplida! <span class="text-yellow-400">+${MISION_RECOMPENSA_LINGOTS} 💎 Lingots</span>`, 3800);
    }
  }

  /* ---------- Modal genérico (mismo patrón que abulingo.html/gramatica.html) ---------- */
  const modalRoot = document.getElementById('modal-root');
  function closeModal() { modalRoot.innerHTML = ''; }
  function showModal({ icon, title, body, actions = [], dismissable = true, size = 'md' }) {
    const maxW = size === 'lg' ? 'max-w-lg' : 'max-w-sm';
    const actionsHTML = actions.map((a, i) =>
      `<button data-idx="${i}" class="modal-action w-full btn-juice ${a.style || 'bg-[#FF7A00] text-white'} font-bold py-3 rounded-xl text-lg">${a.label}</button>`
    ).join('');

  let audioCtx = null;
  function getAudioCtx() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      return audioCtx;
    } catch { return null; }
  }
  document.addEventListener('pointerdown', (e) => {
    if (!e.target.closest('button')) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    try {
      const t0 = ctx.currentTime;
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(880, t0);
      osc.frequency.exponentialRampToValueAtTime(660, t0 + 0.05);
      gain.gain.setValueAtTime(0.08, t0);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.05);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + 0.07);
    } catch {}
  }, { passive: true });

  /* ------------------------------------------------------------
     RECONOCIMIENTO DE VOZ EN CELULAR — dos problemas reales

     1) DUPLICADOS ("me repite palabras"). En Chrome de Android,
        e.resultIndex no siempre avanza: llega en 0 una y otra vez,
        así que ir ACUMULANDO desde resultIndex vuelve a pegar
        finales ya pegados. Solución: en cada evento se REARMA el
        texto leyendo TODOS los resultados de la sesión, en vez de
        ir sumando. Lo dicho en sesiones anteriores (cuando el
        navegador corta solo por silencio) se guarda aparte.

     2) El micrófono es EXCLUSIVO en el celular: si MediaRecorder
        ya tomó el stream, el reconocimiento de voz falla con
        'audio-capture'. En el PC sí se pueden compartir, por eso
        allá funcionaba y aquí no.
  ------------------------------------------------------------ */
  const esMovilVoz = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  // Red de seguridad: si aun así se cuela un bloque repetido
  // ("how are you how are you"), se colapsa. Solo bloques de 2+
  // palabras o una misma palabra 3+ veces seguidas, para no dañar
  // repeticiones legítimas como "very very good" o "bye bye".
  function limpiarRepeticionesVoz(texto) {
    let p = (texto || '').trim().split(/\s+/).filter(Boolean);
    if (p.length < 2) return (texto || '').trim();

    // Bloques repetidos al final: "a b c a b c" → "a b c"
    let cambio = true;
    while (cambio) {
      cambio = false;
      for (let n = Math.floor(p.length / 2); n >= 2; n--) {
        const fin = p.slice(-n).join(' ').toLowerCase();
        const antes = p.slice(-2 * n, -n).join(' ').toLowerCase();
        if (fin && fin === antes) { p = p.slice(0, -n); cambio = true; break; }
      }
    }
    // Una misma palabra repetida 3+ veces seguidas se recorta a dos:
    // así "hello hello hello" se arregla pero "bye bye" queda intacto.
    const salida = [];
    for (const w of p) {
      const n = salida.length;
      if (n >= 2 && salida[n - 1].toLowerCase() === w.toLowerCase()
                 && salida[n - 2].toLowerCase() === w.toLowerCase()) continue;
      salida.push(w);
    }
    return salida.join(' ');
  }

  let tutorRecActivo = null;

  function tutorIniciarVoz({ onFinal, onError }) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { onError && onError('no-soportado'); return null; }
    if (tutorRecActivo) { try { tutorRecActivo.abort(); } catch {} tutorRecActivo = null; }

    const rec = new SR();
    rec.lang = 'es-MX';
    rec.continuous = !esMovilVoz;   // Android lo ignora y duplica
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    let previo = '', sesion = '', detenidoManual = false, cerrado = false;
    const textoTotal = () => limpiarRepeticionesVoz((previo + ' ' + sesion).trim());
    const t0 = Date.now(), MAX_MS = 120000;
    const cerrar = (fn, arg) => {
      if (cerrado) return;
      cerrado = true;
      if (tutorRecActivo === rec) tutorRecActivo = null;
      fn && fn(arg);
    };

    rec.onresult = (e) => {
      // Se rearma entero: acumular desde resultIndex duplica en Android.
      let texto = '';
      for (let i = 0; i < e.results.length; i++) texto += e.results[i][0].transcript + ' ';
      sesion = texto.trim();
    };
    rec.onerror = (e) => {
      const err = e.error || 'error';
      if (err === 'no-speech' || err === 'aborted') return;   // que decida onend
      if (err === 'not-allowed' || err === 'service-not-allowed') cerrar(onError, 'sin-permiso');
      else if (!detenidoManual) cerrar(onError, err);
    };
    rec.onend = () => {
      if (cerrado) return;
      if (sesion) { previo = (previo + ' ' + sesion).trim(); sesion = ''; }
      if (detenidoManual) { cerrar(onFinal, textoTotal()); return; }
      // Chrome corta solo tras un silencio aunque continuous sea true: se
      // reanuda para que el botón no quede trabado ni se corte la frase.
      if (Date.now() - t0 < MAX_MS) { try { rec.start(); return; } catch {} }
      cerrar(onFinal, textoTotal());
    };
    rec.detener = () => {
      detenidoManual = true;
      try { rec.stop(); } catch { cerrar(onFinal, textoTotal()); }
    };
    try { rec.start(); } catch { cerrar(onError, 'no-inicio'); return null; }
    tutorRecActivo = rec;
    return rec;
  }

  function tutorBindMic(btn, msg) {
    if (!btn) return;
    let grabacion = null, watchdog = null;
    const WATCHDOG_MS = 6000;
    const decir = (t) => { if (msg) msg.textContent = t; };
    const limpiar = () => { if (watchdog) { clearTimeout(watchdog); watchdog = null; } };
    const reset = () => { btn.classList.remove('escuchando'); btn.innerHTML = '<i class="fas fa-microphone"></i>'; };
    const fallo = (err) => {
      if (err === 'no-soportado') decir('Tu navegador no reconoce voz — escribe tu duda 😉');
      else if (err === 'sin-permiso') decir('Bloqueaste el micrófono 🔒 — actívalo en el candado de la barra de direcciones');
      else if (err === 'no-inicio') decir('El micrófono está ocupado — intenta otra vez');
      else decir('No te escuché, intenta de nuevo');
    };
    btn.onclick = () => {
      if (btn.disabled) return;
      if (grabacion) {
        decir('Enviando...');
        const g = grabacion;
        limpiar();
        // El watchdog se arma ANTES de detener: si onend llega instantáneo,
        // ya hay quien lo cancele (si no, el botón quedaba trabado).
        watchdog = setTimeout(() => {
          if (grabacion !== g) return;
          grabacion = null; reset();
          try { g.abort(); } catch {}
          fallo('atascado');
        }, WATCHDOG_MS);
        g.detener();
        return;
      }
      grabacion = tutorIniciarVoz({
        onFinal: (texto) => {
          limpiar(); grabacion = null; reset();
          if (texto) { decir(''); tutorAbuEnviar(texto); }
          else decir('No escuché nada, intenta de nuevo 🎙️');
        },
        onError: (err) => { limpiar(); grabacion = null; reset(); fallo(err); }
      });
      if (grabacion) {
        btn.classList.add('escuchando');
        btn.innerHTML = '<i class="fas fa-stop"></i>';
        decir('Escuchando… toca de nuevo para enviar');
      }
    };
  }

  /* ============================================================
     HELPERS DE DOM A PRUEBA DE NULOS
     Cada pantalla (abulingo / gramatica / pronunciacion) arma su menu de
     perfil con renglones distintos, asi que un id puede existir en una y

  const setTxt = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };

  /* Si icono.png no esta en la carpeta (tipico al abrir el HTML suelto con
     doble clic), se sustituye por un avatar naranja en linea en vez de
     dejar la imagen rota. Se usa captura porque el evento 'error' de <img>

  const ICONO_FALLBACK = 'data:image/svg+xml;utf8,' + encodeURIComponent(

    '<text x="32" y="44" font-family="sans-serif" font-size="32" font-weight="bold" fill="#fff" text-anchor="middle">A</text></svg>'
  );
  document.addEventListener('error', (e) => {
    const el = e.target;
    if (el && el.tagName === 'IMG' && !el.dataset.fbDone && /icono\.png(\?.*)?$/.test(el.getAttribute('src') || '')) {

      el.src = ICONO_FALLBACK;
    }
  }, true);

  const PLAN_LABEL = { gratis: 'Gratis', plus: 'Plus', pro: 'Pro', super_pro: 'Super Pro' };
  function fillProfileMenu() {
    setTxt('user-name-dropdown', (userProfile.full_name || '').split(' ')[0] || 'Mi Perfil');

  /* ============================================================
     5. MODOS DE PRÁCTICA: buscar palabra · frases por nivel · mi texto
  ============================================================ */
  const MODOS = [
    { id: 'buscar', icon: 'fa-magnifying-glass', label: 'Buscar palabra' },
    { id: 'frases', icon: 'fa-list-ul', label: 'Frases por nivel' },
    { id: 'texto', icon: 'fa-file-lines', label: 'Mi texto' },
    { id: 'conversar', icon: 'fa-comments', label: 'Conversar' },
    { id: 'crear', icon: 'fa-wand-magic-sparkles', label: 'Crear conversación' },
    { id: 'progreso', icon: 'fa-chart-simple', label: 'Progreso' }
  ];
  let modoActual = 'buscar';

  function renderTabs() {
    document.getElementById('mode-tabs').innerHTML = MODOS.map(m => `
      <button data-modo="${m.id}" class="modo-tab btn-juice flex flex-col items-center gap-1 py-3 rounded-xl font-bold text-[11px] sm:text-xs ${modoActual === m.id ? 'bg-[#FF7A00] text-white' : 'bg-white text-slate-500 border-2 border-slate-200'}">

      b.onclick = () => { modoActual = b.dataset.modo; renderTabs(); renderPanel(); };
    });
  }

  function renderPanel() {
    if (modoActual === 'buscar') renderBuscar();
    else if (modoActual === 'frases') renderFrases();
    else if (modoActual === 'conversar') renderConversar();
    else if (modoActual === 'crear') renderCrear();
    else if (modoActual === 'progreso') renderProgreso();
    else renderTexto();

  /* ---------- Modo 1: buscar palabra (tabla `palabras`) ---------- */
  let pzBuscarTimer = null;
  function renderBuscar() {
    document.getElementById('mode-panel').innerHTML = `
      <div class="card-3d p-4 sm:p-5">
        <div class="relative mb-3">
          <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-300"></i>
          <input id="pz-search" type="text" placeholder="Escribe una palabra en inglés o español..." autocomplete="off"
            class="w-full pl-9 pr-3 py-2.5 rounded-xl border-2 border-slate-200 focus:border-[#FF7A00] outline-none text-sm font-semibold" />
        </div>
        <div id="pz-search-results" class="space-y-2">
          <p class="text-center text-slate-400 text-sm py-6">Busca una palabra para empezar a practicar.</p>
        </div>
      </div>`;
    const input = document.getElementById('pz-search');
    input.oninput = () => {
      clearTimeout(pzBuscarTimer);
      const q = input.value.trim();
      const cont = document.getElementById('pz-search-results');
      if (q.length < 2) { cont.innerHTML = '<p class="text-center text-slate-400 text-sm py-6">Escribe al menos 2 letras.</p>'; return; }
      cont.innerHTML = '<p class="text-center text-slate-300 text-lg py-6"><i class="fas fa-circle-notch fa-spin"></i></p>';
      pzBuscarTimer = setTimeout(() => pzBuscarPalabras(q), 400);
    };
  }

  async function pzBuscarPalabras(q) {
    const cont = document.getElementById('pz-search-results');
    if (!cont) return;
    const limpio = q.replace(/[%,()*]/g, ' ').trim();
    if (!limpio) return;
    const filtro = `ingles.ilike.%${limpio}%,espanol.ilike.%${limpio}%`;
    const { data, error } = await dbClient.from('palabras').select('id,ingles,espanol,fonetica,audio,nivel').or(filtro).limit(20);
    if (!document.getElementById('pz-search-results')) return; // el usuario cambió de modo mientras cargaba
    if (error) { cont.innerHTML = '<p class="text-center text-red-400 text-sm py-6">No se pudo buscar. Intenta de nuevo.</p>'; return; }
    if (!data || !data.length) { cont.innerHTML = '<p class="text-center text-slate-400 text-sm py-6">No encontré palabras con eso.</p>'; return; }
    cont.innerHTML = data.map(w => `
      <div class="flex items-center gap-2.5 bg-slate-50 border border-slate-100 rounded-xl p-2.5">
        <div class="flex-1 min-w-0">
          <p class="font-heading font-black text-[#FF7A00] leading-tight truncate">${escapeHTML(w.ingles)}</p>
          <p class="text-xs text-slate-500 truncate">${escapeHTML(w.espanol || '')}</p>
        </div>
        <button class="pz-practicar-palabra btn-juice bg-[#FF7A00] text-white text-xs font-bold px-3 py-2 rounded-xl shrink-0" data-id="${w.id}">
          <i class="fas fa-microphone-lines mr-1"></i>Practicar
        </button>
      </div>`).join('');
    cont.querySelectorAll('.pz-practicar-palabra').forEach(btn => {
      btn.onclick = () => {
        const w = data.find(x => String(x.id) === btn.dataset.id);
        if (w) abrirPractica({ text: w.ingles, es: w.espanol, fonetica: w.fonetica, audioUrl: w.audio, nivel: w.nivel });
      };
    });
  }

  /* ---------- Modo 2: frases por nivel (tabla `frases`) ----------
     Se cargan TODAS las frases del nivel elegido, ordenadas por id, y se
     muestran como una LISTA (no una a la vez): el usuario elige cuál
     repasar. Cada frase se puede marcar como "Dominada" ✅ — desaparece
     de la lista activa (queda en una sección aparte que se puede
     mostrar/ocultar) y, si es la primera vez que se domina, suma a la
     Misión del día (ver [[abulingo.html]]). El buscador salta directo a
     una frase concreta por su texto en inglés o español. */
  let pzNivelElegido = null;
  let pzFrasesNivel = [];
  let pzVerDominadas = false;
  let pzFraseBuscarTimer = null;

  /* ---------- Modo 4: conversar (tabla `conversaciones`) ----------
     El usuario elige un nivel, ve la lista de conversaciones de ese
     nivel (20 por nivel, 10 mensajes cada una, entre dos personajes) y
     su calificación (1-5), y puede abrir cualquiera para practicarla:
     elige qué personaje quiere ser, escucha/lee cada línea, ve la
     traducción y graba las líneas de su personaje. */
  let pzConvNivelElegido = null;
  let pzConversacionesNivel = [];
  let pzConvBuscarTimer = null;
  let pzConvActual = null;      // { id, titulo, nivel, personajeA, personajeB, mensajes: [{rol,en,es}] }
  let pzConvRol = null;         // 'A' | 'B'
  let pzConvPuntajes = {};      // { indiceMensaje: puntaje }
  let pzConvVerTrad = false;
  let pzVolverA = null;         // si está seteado, cerrarPractica() vuelve aquí en vez de cerrar el modal

  function renderFrases() {
    document.getElementById('mode-panel').innerHTML = `
      <div class="card-3d p-4 sm:p-5">
        <p class="text-xs font-black uppercase tracking-wide text-slate-400 mb-2">Elige un nivel</p>
        <div class="grid grid-cols-4 gap-2 mb-4">
          ${NIVELES_FIJOS.map(n => `
            <button class="pz-nivel-chip btn-juice ${n === pzNivelElegido ? 'bg-[#FF7A00] text-white' : 'bg-slate-100 text-slate-600'} font-black text-sm py-3 rounded-xl" data-nivel="${n}">${n}</button>
          `).join('')}
        </div>
        <div class="relative mb-3">
          <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-300"></i>
          <input id="pz-frase-search" type="text" placeholder="Buscar una frase en inglés o español..." autocomplete="off"
            class="w-full pl-9 pr-3 py-2.5 rounded-xl border-2 border-slate-200 focus:border-[#FF7A00] outline-none text-sm font-semibold" />
        </div>
        <div id="pz-frase-search-results"></div>
        <div id="pz-frase-lista-wrap">
          ${pzNivelElegido ? pzFraseListaHTML() : '<p class="text-center text-slate-400 text-sm py-6">Elige un nivel para ver sus frases, o búscala arriba.</p>'}
        </div>
      </div>`;

    document.querySelectorAll('.pz-nivel-chip').forEach(b => {
      b.onclick = () => pzElegirNivel(b.dataset.nivel);
    });
    bindFraseListaButtons();

    const input = document.getElementById('pz-frase-search');
    input.oninput = () => {
      clearTimeout(pzFraseBuscarTimer);
      const q = input.value.trim();
      const cont = document.getElementById('pz-frase-search-results');
      if (q.length < 2) { cont.innerHTML = ''; return; }
      cont.innerHTML = '<p class="text-center text-slate-300 text-lg py-3"><i class="fas fa-circle-notch fa-spin"></i></p>';
      pzFraseBuscarTimer = setTimeout(() => pzBuscarFrases(q), 400);
    };
  }

  async function pzElegirNivel(nivel) {
    pzNivelElegido = nivel;
    pzVerDominadas = false;
    renderFrases();
    const wrap = document.getElementById('pz-frase-lista-wrap');
    if (wrap) wrap.innerHTML = '<p class="text-center text-slate-300 text-lg py-6"><i class="fas fa-circle-notch fa-spin"></i></p>';
    const { data, error } = await dbClient.from('frases')
      .select('id,fraseingles,fraseespañol,audio_url,grupo')
      .eq('nivel', nivel)
      .order('id', { ascending: true });
    if (!document.getElementById('pz-frase-lista-wrap') || pzNivelElegido !== nivel) return; // cambió de nivel/modo mientras cargaba
    if (error || !data || !data.length) {
      document.getElementById('pz-frase-lista-wrap').innerHTML = '<p class="text-center text-slate-400 text-sm py-6">Todavía no hay frases cargadas para este nivel.</p>';
      pzFrasesNivel = [];
      return;
    }
    pzFrasesNivel = data;
    pintarFraseLista();
    cargarPuntajesFrases(data.map(f => f.id));
  }

  // Trae del servidor la mejor puntuación (1-5) que ya tiene el usuario
  // en cada frase del nivel, para pintarla junto a la frase en la lista.
  async function cargarPuntajesFrases(ids) {
    if (!ids || !ids.length) return;
    const { data, error } = await dbClient.from('frases_puntuaciones')
      .select('frase_id,mejor_puntaje').eq('user_id', currentUser.id).in('frase_id', ids);
    if (error) { console.warn('[pronunciación] no se pudieron cargar las puntuaciones:', error.message); return; }
    (data || []).forEach(row => { pzPuntajesFrases[row.frase_id] = row.mejor_puntaje; });
    pintarFraseLista();
  }

  function pintarFraseLista() {
    const wrap = document.getElementById('pz-frase-lista-wrap');
    if (!wrap) return;
    wrap.innerHTML = pzFraseListaHTML();
    bindFraseListaButtons();
  }

  // ¿Ya la dominó alguna vez este usuario? (se guarda en flujo.frasesDominadas)
  const pzEsDominada = (fraseId) => !!(flujo?.frasesDominadas && flujo.frasesDominadas[fraseId]);

  /* ---------- Modo 5: progreso (frases y conversaciones dominadas) ----------
     Vista rápida de esta pantalla: cuántas frases y cuántas conversaciones
     lleva dominadas por nivel. El PANORAMA COMPLETO (palabras, frases,
     conversaciones, gramática y subsecciones de "Dominar", con porcentajes)
     está en el menú de perfil → "Progreso nivel", que ahora funciona igual
     en las tres páginas (ver abu-menu.js). */
  function renderProgreso() {
    document.getElementById('mode-panel').innerHTML = `
      <div class="card-3d p-4 sm:p-5">
        <div id="pz-progreso-niveles"></div>
        <button id="pz-ver-progreso-total" class="btn-juice bg-slate-800 text-white font-bold py-2.5 rounded-xl w-full mt-2">
          <i class="fas fa-chart-line mr-2"></i>Ver mi progreso completo
        </button>
      </div>`;
    document.getElementById('pz-ver-progreso-total').onclick = () => window.AbuMenu?.progresoNivel();
    cargarYPintarProgreso();
  }

  /* ---------- Resumen "Frases dominadas" y "Conversaciones dominadas" por
     nivel (A1 · A2 · B1 · B2) ----------
     Una frase se cuenta como dominada si el usuario tocó el check
     (flujo.frasesDominadas). Una conversación se cuenta como dominada solo
     si su calificación GLOBAL (promedio de las líneas ya practicadas) es
     exactamente 5. */
  async function cargarYPintarProgreso() {
    const cont = document.getElementById('pz-progreso-niveles');
    if (!cont || !flujo) return;
    const dominadaIds = Object.keys(flujo.frasesDominadas || {});

    const [totalesFrases, nivelesFrasesDominadas, totalesConv, convPuntajes] = await Promise.all([
      Promise.all(NIVELES_FIJOS.map(n =>
        dbClient.from('frases').select('id', { count: 'exact', head: true }).eq('nivel', n)
          .then(({ count }) => count || 0)
      )),
      dominadaIds.length
        ? dbClient.from('frases').select('id,nivel').in('id', dominadaIds).then(({ data }) => data || [])
        : Promise.resolve([]),
      Promise.all(NIVELES_FIJOS.map(n =>
        dbClient.from('conversaciones_pronunciacion').select('id', { count: 'exact', head: true }).eq('nivel_ingles', n)
          .then(({ count }) => count || 0)
      )),
      dbClient.from('conversaciones_puntuaciones').select('conversacion_id,puntaje').eq('user_id', currentUser.id).eq('puntaje', 5)
        .then(({ data }) => data || [])
    ]);
    if (!document.getElementById('pz-progreso-niveles')) return;

    const frasesDominadasPorNivel = {};
    nivelesFrasesDominadas.forEach(f => { frasesDominadasPorNivel[f.nivel] = (frasesDominadasPorNivel[f.nivel] || 0) + 1; });

    let convDominadasPorNivel = {};
    if (convPuntajes.length) {
      const ids = convPuntajes.map(p => p.conversacion_id);
      const { data: convs } = await dbClient.from('conversaciones_pronunciacion').select('id,nivel_ingles').in('id', ids);
      (convs || []).forEach(c => { convDominadasPorNivel[c.nivel_ingles] = (convDominadasPorNivel[c.nivel_ingles] || 0) + 1; });
    }

    const filaHTML = (titulo, dominadasPorNivel, totales) => `
      <p class="text-[10px] font-black uppercase tracking-wide text-slate-400 mb-1.5 text-center">${titulo}</p>
      <div class="grid grid-cols-4 gap-1.5 mb-3">
        ${NIVELES_FIJOS.map((n, i) => {
          const total = totales[i] || 0;
          const dom = dominadasPorNivel[n] || 0;
          const pct = total ? Math.round((dom / total) * 100) : 0;
          return `
            <div class="bg-white border border-slate-200 rounded-xl py-1.5 text-center">
              <p class="text-[10px] font-black text-slate-400">${n}</p>
              <p class="text-xs font-heading font-black text-slate-700">${dom} <span class="text-[10px] font-bold text-slate-400">(${pct}%)</span></p>
            </div>`;
        }).join('')}
      </div>`;

    cont.innerHTML =
      filaHTML('Frases dominadas', frasesDominadasPorNivel, totalesFrases) +
      filaHTML('Conversaciones dominadas', convDominadasPorNivel, totalesConv);
  }

  /* ============================================================
     Modo 5: CREAR CONVERSACIÓN CON IA  (máximo 10 mensajes)
     ------------------------------------------------------------
     El usuario le describe a la IA de qué quiere que sea la
     conversación ("pedir comida en un restaurante", "una entrevista
     de trabajo"…), elige nivel, cuántos mensajes (tope 10) y cómo se
     llaman los dos personajes. La IA devuelve el guion y a partir de
     ahí se practica EXACTAMENTE igual que en "Conversar": eliges tu
     personaje, escuchas las líneas del otro y grabas las tuyas.

     · Texto del guion: Edge Function "generar-dialogo"; si esa no
       devuelve nada usable, se reintenta con "tutor-abu" pidiéndole
       un JSON. Así la función no depende de un solo endpoint.
     · Voz: Edge Function "generar-audio-abu" (voces Chirp3-HD), la
       misma que usa "Conversa con Abu" en abulingo.html. El audio se
       pide bajo demanda (al tocar 🔊) y se guarda en memoria mientras
       dure la sesión; si falla, se cae a la voz del navegador.
     · Las conversaciones creadas se guardan en tu perfil
       (profiles.flujo → flujo.convCreadas), así que no hace falta
       ninguna tabla nueva. Se conservan las últimas
       CREAR_MAX_GUARDADAS.
  ============================================================ */
  const CREAR_MAX_MENSAJES   = 20;   // tope duro de mensajes por conversación
  const CREAR_MIN_MENSAJES   = 4;
  const CREAR_MAX_GUARDADAS  = 12;   // cuántas conversaciones creadas se conservan
  const CREAR_TIMEOUT_MS     = 45000;

  let pzCrearForm = { tema: '', nivel: null, mensajes: 8, a: 'Alex', b: 'Sam' };
  let pzCrearGenerando = false;
  const pzAudioCache = new Map();    // texto en inglés -> audioContent (base64 mp3)

  function pzConvCreadas() {
    if (!Array.isArray(flujo.convCreadas)) flujo.convCreadas = [];
    return flujo.convCreadas;
  }
  function pzConvCreadasPuntajes() {
    if (!flujo.convCreadasPuntajes || typeof flujo.convCreadasPuntajes !== 'object') flujo.convCreadasPuntajes = {};
    return flujo.convCreadasPuntajes;
  }
  // Promedio (1-5) de las líneas ya practicadas de una conversación creada.
  function pzPromedioCreada(id) {
    const v = Object.values(pzConvCreadasPuntajes()[id] || {}).map(Number).filter(Boolean);
    if (!v.length) return 0;
    return Math.round(v.reduce((a, b) => a + b, 0) / v.length);
  }

  function renderCrear() {
    const nivel = pzCrearForm.nivel || userProfile?.nivel || 'A1';
    pzCrearForm.nivel = nivel;
    const guardadas = pzConvCreadas();

    document.getElementById('mode-panel').innerHTML = `
      <div class="card-3d p-4 sm:p-5">
        <p class="text-xs font-black uppercase tracking-wide text-slate-400 mb-2">¿De qué quieres que sea la conversación?</p>
        <textarea id="pz-crear-tema" rows="3" maxlength="300"
          placeholder="Ejemplo: pedir comida en un restaurante y preguntar por los ingredientes; o una entrevista de trabajo para cajero."
          class="w-full p-3 rounded-xl border-2 border-slate-200 focus:border-[#FF7A00] outline-none text-sm">${escapeHTML(pzCrearForm.tema)}</textarea>

        <p class="text-xs font-black uppercase tracking-wide text-slate-400 mt-4 mb-2">Nivel</p>
        <div class="grid grid-cols-4 gap-2 mb-4">
          ${NIVELES_FIJOS.map(n => `
            <button class="pz-crear-nivel btn-juice ${n === nivel ? 'bg-[#FF7A00] text-white' : 'bg-slate-100 text-slate-600'} font-black text-sm py-3 rounded-xl" data-nivel="${n}">${n}</button>
          `).join('')}
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
          <div>
            <p class="text-xs font-black uppercase tracking-wide text-slate-400 mb-2">Mensajes (máx. ${CREAR_MAX_MENSAJES})</p>
            <div class="flex items-center gap-2">
              <button id="pz-crear-menos" class="w-9 h-9 rounded-xl bg-slate-100 text-slate-600 font-black shrink-0">−</button>
              <span id="pz-crear-num" class="flex-1 text-center font-heading font-black text-xl text-slate-700">${pzCrearForm.mensajes}</span>
              <button id="pz-crear-mas" class="w-9 h-9 rounded-xl bg-slate-100 text-slate-600 font-black shrink-0">+</button>
            </div>
          </div>
          <div>
            <p class="text-xs font-black uppercase tracking-wide text-slate-400 mb-2">Personajes</p>
            <input id="pz-crear-a" value="${escapeHTML(pzCrearForm.a)}" maxlength="18" placeholder="Persona A"
              class="w-full mb-1.5 px-3 py-2 rounded-xl border-2 border-slate-200 focus:border-[#FF7A00] outline-none text-sm font-semibold" />
            <input id="pz-crear-b" value="${escapeHTML(pzCrearForm.b)}" maxlength="18" placeholder="Persona B"
              class="w-full px-3 py-2 rounded-xl border-2 border-slate-200 focus:border-[#FF7A00] outline-none text-sm font-semibold" />
          </div>
        </div>

        <button id="pz-crear-generar" class="btn-juice bg-gradient-to-br from-[#FF7A00] to-orange-600 text-white font-bold py-3 rounded-xl w-full">
          <i class="fas fa-wand-magic-sparkles mr-2"></i>Crear conversación
        </button>
        <p class="text-[11px] text-slate-400 text-center mt-2">La IA escribe el guion en inglés con su traducción. Luego lo practicas hablando, como en “Conversar”.</p>

        <div id="pz-crear-estado" class="mt-3"></div>

        <div class="mt-5 pt-4 border-t border-slate-100">
          <p class="text-xs font-black uppercase tracking-wide text-slate-400 mb-2">Tus conversaciones creadas (${guardadas.length})</p>
          <div id="pz-crear-lista">${pzCrearListaHTML()}</div>
        </div>
      </div>`;

    const ta = document.getElementById('pz-crear-tema');
    ta.oninput = () => { pzCrearForm.tema = ta.value; };
    document.getElementById('pz-crear-a').oninput = (e) => { pzCrearForm.a = e.target.value; };
    document.getElementById('pz-crear-b').oninput = (e) => { pzCrearForm.b = e.target.value; };
    document.querySelectorAll('.pz-crear-nivel').forEach(b => {
      b.onclick = () => { pzCrearForm.nivel = b.dataset.nivel; renderCrear(); };
    });
    const pintaNum = () => { const el = document.getElementById('pz-crear-num'); if (el) el.textContent = pzCrearForm.mensajes; };

  /* ---------- Generación ---------- */
  async function pzCrearGenerar() {
    if (pzCrearGenerando) return;
    const tema = (pzCrearForm.tema || '').trim();
    if (tema.length < 6) { showToast('✍️ Cuéntame con un poco más de detalle de qué quieres que hablen.'); return; }

    const nivel = pzCrearForm.nivel || userProfile?.nivel || 'A1';
    const n = Math.max(CREAR_MIN_MENSAJES, Math.min(CREAR_MAX_MENSAJES, parseInt(pzCrearForm.mensajes, 10) || 8));
    const a = (pzCrearForm.a || '').trim() || 'Alex';
    const b = (pzCrearForm.b || '').trim() || 'Sam';

    pzCrearGenerando = true;
    const btn = document.getElementById('pz-crear-generar');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i>Escribiendo tu conversación...'; }
    const estado = document.getElementById('pz-crear-estado');
    if (estado) estado.innerHTML = '<p class="text-center text-xs font-bold text-slate-400">Esto tarda unos segundos ⏳</p>';

    let conv = null;
    try {
      conv = await pzGenerarConversacionIA({ tema, nivel, n, personajeA: a, personajeB: b });
    } catch (e) {
      console.warn('[crear conversación]', e?.message || e);
    }

    pzCrearGenerando = false;
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-wand-magic-sparkles mr-2"></i>Crear conversación'; }
    if (estado) estado.innerHTML = '';

    if (!conv) {
      showToast('⚠️ No pude escribir la conversación. Prueba con otro tema o inténtalo de nuevo.', 3400);
      return;
    }

    await pzGuardarConversacionCreada(conv);
    renderCrear();
    pzAbrirConversacionCreada(conv);
  }

  /* ---------- Generación con la Edge Function propia ----------
     Antes esto se apoyaba en "generar-dialogo" (pensada para diálogos con
     las palabras del grupo) y, si fallaba, en "tutor-abu". Ahora hay una
     función hecha para esto: "crear-conversacion". Recibe el tema tal cual
     lo escribió el usuario, el nivel, cuántos mensajes quiere (tope 20) y
     una lista de lo que ya vio, para no repetirle siempre la misma charla. */
  async function pzFetchIA(ruta, body, ms = CREAR_TIMEOUT_MS) {
    const headers = await cabecerasIA();
    if (!headers) { pzManejarRechazoIA({ codigo: 'sin_sesion' }); return { rechazado: true, payload: null }; }
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms);
    try {
      const resp = await fetch(`${SUPABASE_URL}/functions/v1/${ruta}`, {
        method: 'POST', headers, body: JSON.stringify(body), signal: controller.signal
      });
      let payload = null;
      try { payload = await resp.json(); } catch { /* respuesta no JSON */ }
      if (payload?.codigo && pzManejarRechazoIA(payload)) return { rechazado: true, payload };
      return { rechazado: false, payload: resp.ok ? payload : null, error: resp.ok ? null : (payload?.error || `HTTP ${resp.status}`) };
    } catch (err) {
      console.warn(`[crear conversación] ${ruta}:`, err?.name === 'AbortError' ? 'tardó demasiado' : (err?.message || err));
      return { rechazado: false, payload: null, error: 'red' };
    } finally { clearTimeout(timer); }
  }

  // Lo último que ya vio el usuario, para pedirle a la IA que no lo repita.
  function pzConversacionesAEvitar() {
    return pzConvCreadas().slice(0, 6).flatMap(c => [c.titulo, c.mensajes?.[0]?.en]).filter(Boolean);
  }

  async function pzGenerarConversacionIA({ tema, nivel, n, personajeA, personajeB }) {
    const r = await pzFetchIA('crear-conversacion', {
      tema, nivel,
      mensajes: Math.min(n, CREAR_MAX_MENSAJES),
      personajeA, personajeB,
      evitar: pzConversacionesAEvitar()
    });
    if (r.rechazado) return null;
    return pzNormalizarConversacionIA(r.payload, { tema, nivel, n, personajeA, personajeB });
  }

  /* Normaliza la respuesta al formato interno
     { id, titulo, nivel, tema, personajeA, personajeB, mensajes:[{rol,en,es}], creada:true }.
     Acepta también { title, lines:[{speaker,en,es}] } por si algún día se
     vuelve a apuntar a otra función. */
  function pzNormalizarConversacionIA(payload, ctx) {
    if (!payload || typeof payload !== 'object') return null;
    const crudas = Array.isArray(payload.mensajes) ? payload.mensajes
      : Array.isArray(payload.lines) ? payload.lines : null;
    if (!crudas || !crudas.length) return null;

    const hablantes = [];
    const rolDe = (m, i) => {
      const raw = (m.rol || m.role || m.speaker || '').toString().trim();
      if (/^a$/i.test(raw)) return 'A';
      if (/^b$/i.test(raw)) return 'B';
      if (raw) {
        if (!hablantes.includes(raw)) hablantes.push(raw);
        return hablantes.indexOf(raw) === 0 ? 'A' : 'B';
      }
      return i % 2 === 0 ? 'A' : 'B';
    };

    const mensajes = crudas.map((m, i) => ({
      rol: rolDe(m, i),
      en: (m.en || m.ingles || m.text || '').toString().trim(),
      es: (m.es || m.espanol || m['español'] || '').toString().trim(),
      audio_url: null
    })).filter(m => m.en).slice(0, CREAR_MAX_MENSAJES);   // ⛔ tope duro de 20

    if (mensajes.length < 2) return null;

    return {
      id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      titulo: (payload.titulo || payload.title || ctx.tema).toString().trim().slice(0, 70),
      nivel: ctx.nivel,
      tema: ctx.tema,
      personajeA: (payload.personajeA || ctx.personajeA).toString().trim().slice(0, 18),
      personajeB: (payload.personajeB || ctx.personajeB).toString().trim().slice(0, 18),
      mensajes,
      creada: true,
      creadaEn: new Date().toISOString()
    };
  }

  async function pzGuardarConversacionCreada(conv) {
    const lista = pzConvCreadas();
    // Solo texto: el audio no se guarda en el perfil (se vuelve a pedir a la Edge Function).
    lista.unshift({
      id: conv.id, titulo: conv.titulo, nivel: conv.nivel, tema: conv.tema,
      personajeA: conv.personajeA, personajeB: conv.personajeB, creadaEn: conv.creadaEn,
      mensajes: conv.mensajes.map(m => ({ rol: m.rol, en: m.en, es: m.es }))
    });
    if (lista.length > CREAR_MAX_GUARDADAS) {
      lista.splice(CREAR_MAX_GUARDADAS).forEach(c => { delete pzConvCreadasPuntajes()[c.id]; });
    }
    await updateUserFlow();
  }

  /* ============================================================
     CONVERSACIÓN EN VIVO (para las conversaciones creadas con IA)
     ------------------------------------------------------------
     Igual que "Ahora, a conversar" de abulingo.html: no es una lista de
     burbujas con botoncitos, sino una charla que AVANZA. El usuario elige
     personaje; las líneas del otro se reproducen solas con la voz de Abu
     (Edge Function "generar-audio-abu") y, cuando le toca a él, aparece el
     micrófono abajo. Al hablar se compara lo dicho con la línea modelo
     (pzCalificarLocal), se pinta su burbuja con lo que dijo y se sigue.
  ============================================================ */
  let pzVivo = null;   // { conv, rol, idx, puntajes:{}, verTrad }

  function pzAbrirConversacionCreada(c) {
    if (!c?.mensajes?.length) { showToast('⚠️ Esta conversación no tiene mensajes.'); return; }
    pzConvActual = {
      id: c.id, titulo: c.titulo, nivel: c.nivel, tema: c.tema,
      personajeA: c.personajeA || 'Persona A', personajeB: c.personajeB || 'Persona B',
      mensajes: c.mensajes.map(m => ({ ...m })),
      creada: true
    };
    pzConvRol = null;
    pzConvPuntajes = { ...(pzConvCreadasPuntajes()[c.id] || {}) };
    pzConvVerTrad = false;
    pzVivoSelectorRol();
  }

  function pzVivoSelectorRol() {

    document.getElementById('modal-root').innerHTML = `
      <div class="modal-overlay">

            <button class="pz-vivo-rol btn-juice bg-slate-800 text-white font-bold py-3 rounded-xl w-full" data-rol="B"><i class="fas fa-user mr-2"></i>${escapeHTML(conv.personajeB)}</button>
          </div>
          <button id="vivo-modo-lista" class="w-full text-center text-[11px] font-black text-slate-400 hover:text-[#FF7A00] mt-4">

    document.getElementById('vivo-cerrar').onclick = cerrarConversacion;
    document.getElementById('vivo-modo-lista').onclick = () => { pintarConversacionModal(); };

  function pzVivoIniciar(rol) {
    stopSpeaking();
    pzVivo = { conv: pzConvActual, rol, idx: 0, puntajes: {}, verTrad: false };
    pzConvRol = rol;

    document.getElementById('modal-root').innerHTML = `
      <div class="modal-overlay">
        <div class="card-3d max-w-md w-full p-4 sm:p-5 relative animate-pop" style="max-height:92vh; display:flex; flex-direction:column;">
          <div class="flex items-center gap-2 mb-2 shrink-0">
            <button id="vivo-cambiar-rol" class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 hover:bg-slate-200 flex items-center justify-center shrink-0" title="Cambiar de personaje"><i class="fas fa-rotate-left"></i></button>
            <div class="flex-1 min-w-0">
              <p class="font-heading font-black text-slate-800 text-sm truncate">${escapeHTML(pzVivo.conv.titulo)}</p>
              <p class="text-[10px] text-slate-400">Hablas como ${escapeHTML(rol === 'A' ? pzVivo.conv.personajeA : pzVivo.conv.personajeB)}</p>
            </div>
            <button id="vivo-ver-trad" class="shrink-0 text-[10px] font-black px-2 py-1.5 rounded-lg bg-slate-100 text-slate-500"><i class="fas fa-language mr-1"></i>Traducción</button>
            <button id="vivo-cerrar" class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 hover:bg-slate-200 flex items-center justify-center shrink-0"><i class="fas fa-times"></i></button>
          </div>
          <div class="flex items-center gap-2 mb-2 shrink-0">
            <div class="flex-1 h-2 rounded-full bg-slate-100 overflow-hidden"><div id="vivo-bar" class="h-full bg-[#FF7A00] rounded-full transition-all" style="width:0%"></div></div>

          </div>
          <div id="vivo-mensajes" class="flex-1 min-h-[180px] overflow-y-auto space-y-2.5 pr-1 bg-slate-50 rounded-xl border border-slate-100 p-2.5"></div>
          <div id="vivo-turno" class="flex flex-col items-center gap-1.5 pt-3 shrink-0"></div>

      </div>`;
    document.getElementById('vivo-cerrar').onclick = cerrarVivo;
    document.getElementById('vivo-cambiar-rol').onclick = () => { pzVivoDetener(); pzVivoSelectorRol(); };
    document.getElementById('vivo-ver-trad').onclick = (e) => {
      pzVivo.verTrad = !pzVivo.verTrad;
      e.currentTarget.className = `shrink-0 text-[10px] font-black px-2 py-1.5 rounded-lg ${pzVivo.verTrad ? 'bg-[#FF7A00] text-white' : 'bg-slate-100 text-slate-500'}`;
      document.querySelectorAll('.vivo-trad').forEach(el => el.classList.toggle('hidden', !pzVivo.verTrad));
    };
    pzVivoPaso();
  }

  function cerrarVivo() {
    pzVivoDetener();
    pzVivo = null;
    cerrarConversacion();
  }

  function pzVivoDetener() {
    stopSpeaking();
    if (pzVivoAudio) { try { pzVivoAudio.pause(); } catch {} pzVivoAudio = null; }
    if (pzVivoRec) { try { pzVivoRec.abort(); } catch {} pzVivoRec = null; }
  }

  let pzVivoAudio = null;
  let pzVivoRec = null;

  // Burbuja del chat en vivo. `dicho` solo viene en tus propias líneas.
  function pzVivoBurbuja(m, dicho, puntaje) {
    const box = document.getElementById('vivo-mensajes');
    if (!box) return;
    const mia = m.rol === pzVivo.rol;
    const nombre = m.rol === 'A' ? pzVivo.conv.personajeA : pzVivo.conv.personajeB;
    const div = document.createElement('div');
    div.className = `flex ${mia ? 'justify-end' : 'justify-start'}`;
    div.innerHTML = `
      <div class="max-w-[85%] rounded-2xl p-2.5 ${mia ? 'bg-orange-50 border border-orange-100' : 'bg-white border border-slate-200'}">
        <p class="text-[10px] font-black uppercase ${mia ? 'text-[#FF7A00]' : 'text-slate-400'} mb-0.5">${escapeHTML(nombre)}</p>
        <p class="text-sm font-semibold text-slate-700">${escapeHTML(m.en)}</p>
        <p class="vivo-trad text-xs text-slate-500 mt-0.5 ${pzVivo.verTrad ? '' : 'hidden'}">${escapeHTML(m.es || '')}</p>
        ${dicho ? `<p class="text-[11px] text-slate-500 mt-1.5 pt-1.5 border-t border-orange-200"><span class="font-black uppercase text-[9px] text-slate-400">Dijiste</span><br>${escapeHTML(dicho)}</p>` : ''}
        <div class="flex items-center gap-2 mt-1.5">
          <button class="vivo-repetir w-7 h-7 rounded-full bg-white border border-slate-200 text-slate-500 flex items-center justify-center" title="Escuchar"><i class="fas fa-volume-up text-[10px]"></i></button>
          ${puntaje ? pzMiniEstrellas(puntaje) : ''}
        </div>
      </div>`;
    div.querySelector('.vivo-repetir').onclick = (e) => pzReproducirLinea(pzVivo.conv, m, e.currentTarget);
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function pzVivoProgreso() {
    const total = pzVivo.conv.mensajes.length;
    const bar = document.getElementById('vivo-bar');
    const cnt = document.getElementById('vivo-count');
    if (bar) bar.style.width = `${Math.round((pzVivo.idx / total) * 100)}%`;
    if (cnt) cnt.textContent = pzVivo.idx;
  }

  async function pzVivoPaso() {
    if (!pzVivo) return;
    pzVivoProgreso();
    const { conv, idx, rol } = pzVivo;
    if (idx >= conv.mensajes.length) return pzVivoFin();

    const m = conv.mensajes[idx];
    const turno = document.getElementById('vivo-turno');
    if (!turno) return;

    // ---- Línea del OTRO personaje: se escucha y avanza sola ----
    if (m.rol !== rol) {
      turno.innerHTML = `<p class="text-xs font-bold text-slate-400"><i class="fas fa-volume-up mr-1"></i>Escucha a ${escapeHTML(m.rol === 'A' ? conv.personajeA : conv.personajeB)}...</p>`;
      pzVivoBurbuja(m, null, 0);
      let url = m.audio_url;
      if (!url) {
        const b64 = await pzAudioAbu(m.en, m.rol);
        if (b64) { m.audio_url = `data:audio/mp3;base64,${b64}`; url = m.audio_url; }
      }
      if (!pzVivo) return;
      const seguir = () => { if (pzVivo) { pzVivo.idx++; pzVivoPaso(); } };
      if (url) {
        pzVivoAudio = new Audio(url);
        pzVivoAudio.onended = () => setTimeout(seguir, 350);
        pzVivoAudio.onerror = () => setTimeout(seguir, 1200);
        pzVivoAudio.play().catch(() => setTimeout(seguir, 1200));
      } else {
        speak(m.en);
        setTimeout(seguir, Math.max(1500, m.en.length * 60));
      }
      return;
    }

    // ---- TU línea: micrófono ----
    turno.innerHTML = `
      <p class="text-[11px] font-black text-[#FF7A00] uppercase text-center px-2">Te toca decir:</p>
      <p class="text-center text-sm font-bold text-slate-700 px-2">“${escapeHTML(m.en)}”</p>
      ${pzVivo.verTrad && m.es ? `<p class="text-center text-[11px] text-slate-400">${escapeHTML(m.es)}</p>` : ''}
      <button id="vivo-oir-modelo" class="text-[11px] font-black text-slate-400 hover:text-[#FF7A00]"><i class="fas fa-volume-up mr-1"></i>Escuchar el modelo</button>
      <button id="vivo-mic" class="mic-btn"><i class="fas fa-microphone text-2xl"></i></button>
      <p id="vivo-mic-msg" class="text-xs font-bold text-slate-400 min-h-[1.4em] text-center px-4">Toca el micrófono y dilo en voz alta</p>
      <button id="vivo-saltar" class="text-[11px] font-bold text-slate-300 hover:text-slate-500">Saltar esta línea</button>`;

    document.getElementById('vivo-oir-modelo').onclick = (e) => pzReproducirLinea(pzVivo.conv, m, e.currentTarget);
    document.getElementById('vivo-saltar').onclick = () => { pzVivo.idx++; pzVivoPaso(); };
    const btn = document.getElementById('vivo-mic');
    const msg = document.getElementById('vivo-mic-msg');
    btn.onclick = () => pzVivoGrabar(btn, msg, m);
  }

  /* Micrófono del modo en vivo: arranque y parada manual, igual que en
     "Ahora, a conversar". No graba audio, solo usa el reconocimiento de voz
     del navegador para saber qué dijo la persona. */
  function pzVivoGrabar(btn, msg, m) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      msg.innerHTML = 'Tu navegador no reconoce voz. <button id="vivo-continuar-sin" class="underline text-[#FF7A00] font-bold">Continuar</button>';
      document.getElementById('vivo-continuar-sin').onclick = () => { pzVivo.idx++; pzVivoPaso(); };
      return;
    }
    // Segundo toque = parar
    if (pzVivoRec) { try { pzVivoRec.stop(); } catch {} return; }

    let texto = '';
    const rec = new SR();
    pzVivoRec = rec;
    rec.lang = 'en-US';
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    rec.continuous = false;

    btn.classList.add('recording');
    msg.textContent = 'Escuchando... toca otra vez para terminar 🎙️';

    rec.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) texto += t + ' '; else interim += t;
      }
      msg.textContent = (texto + interim).trim() || 'Escuchando...';
    };
    rec.onerror = () => { /* onend se encarga */ };
    rec.onend = () => {
      pzVivoRec = null;
      btn.classList.remove('recording');
      const dicho = texto.trim();
      if (!dicho) { msg.textContent = 'No te escuché, inténtalo otra vez 🎙️'; return; }
      pzVivoResolverTurno(m, dicho, msg);
    };
    try { rec.start(); } catch (err) { pzVivoRec = null; btn.classList.remove('recording'); console.warn('[vivo] micrófono:', err); }
  }

  async function pzVivoResolverTurno(m, dicho, msg) {
    const puntaje = pzCalificarLocal(m.en, dicho);
    pzVivo.puntajes[pzVivo.idx] = puntaje;
    pzConvPuntajes[pzVivo.idx] = puntaje;

    // Se guarda en el perfil, igual que en la vista de lista.
    const bolsa = pzConvCreadasPuntajes();
    if (!bolsa[pzVivo.conv.id]) bolsa[pzVivo.conv.id] = {};
    bolsa[pzVivo.conv.id][pzVivo.idx] = puntaje;
    updateUserFlow();

    pzVivoBurbuja(m, dicho, puntaje);
    msg.innerHTML = puntaje >= 4
      ? '<span class="text-green-600">✅ ¡Bien dicho!</span>'
      : '<span class="text-slate-500">Escucha cómo suena y sigue 👇</span>';
    if (puntaje >= 5 && window.confetti) confetti({ particleCount: 60, spread: 55, origin: { y: 0.7 }, colors: ['#FF7A00', '#fbbf24'] });

    // Se reproduce la versión modelo para que compare, y luego sigue.
    setTimeout(async () => {
      if (!pzVivo) return;
      await pzReproducirLinea(pzVivo.conv, m, null);
      setTimeout(() => { if (pzVivo) { pzVivo.idx++; pzVivoPaso(); } }, 1400);
    }, 600);
  }

  function pzVivoFin() {
    pzVivoProgreso();
    const turno = document.getElementById('vivo-turno');
    if (!turno) return;
    const vals = Object.values(pzVivo.puntajes).map(Number).filter(Boolean);
    const prom = vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : 0;
    if (prom >= 4 && window.confetti) confetti({ particleCount: 110, spread: 70, origin: { y: 0.6 }, colors: ['#FF7A00', '#3b82f6', '#fbbf24'] });
    turno.innerHTML = `
      <p class="text-center text-sm font-bold text-green-600">🎉 ¡Conversación terminada!</p>
      ${prom ? `<div class="text-xl">${pzMiniEstrellas(prom)}</div>` : ''}
      <div class="flex gap-2 w-full mt-1">

    document.getElementById('vivo-listo').onclick = () => { cerrarVivo(); renderCrear(); };

  /* ---------- Voz real con la Edge Function "generar-audio-abu" ----------
     Devuelve el audio en base64 (mp3) o null si no se pudo. Se guarda en
     pzAudioCache por texto exacto, así reescuchar una línea no vuelve a
     gastar cupo de la función. */
  async function pzAudioAbu(texto, rol) {
    if (!texto) return null;
    if (pzAudioCache.has(texto)) return pzAudioCache.get(texto);
    const headers = await cabecerasIA();
    if (!headers) return null;
    try {
      const resp = await fetch(`${SUPABASE_URL}/functions/v1/generar-audio-abu`, {
        method: 'POST',
        headers,
        // `voz` es opcional: si tu Edge Function la soporta, cada personaje
        // suena distinto; si la ignora, el audio sale con la voz por defecto.
        body: JSON.stringify({ texto, voz: rol === 'B' ? 'b' : 'a' })
      });
      const payload = await resp.json().catch(() => null);
      if (payload?.codigo && pzManejarRechazoIA(payload)) return null;
      if (!resp.ok || !payload?.audioContent) return null;
      pzAudioCache.set(texto, payload.audioContent);
      return payload.audioContent;
    } catch (err) {
      console.warn('[crear conversación] audio:', err?.message || err);
      return null;
    }
  }

  // Reproduce una línea: primero el audio real; si no existe todavía y la
  // conversación es creada, se pide a la Edge Function; si nada funciona,
  // se usa la voz del navegador para no dejar la línea muda.
  async function pzReproducirLinea(conv, m, btn) {
    stopSpeaking();
    if (m.audio_url) { new Audio(m.audio_url).play().catch(() => speak(m.en)); return; }
    if (!conv?.creada) { speak(m.en); return; }
    const previo = btn ? btn.innerHTML : null;
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin text-[10px]"></i>'; }
    const b64 = await pzAudioAbu(m.en, m.rol);
    if (btn) { btn.disabled = false; btn.innerHTML = previo; }
    if (b64) {
      m.audio_url = `data:audio/mp3;base64,${b64}`;
      new Audio(m.audio_url).play().catch(() => speak(m.en));
    } else speak(m.en);
  }

  // Genera de una vez el audio de TODAS las líneas de la conversación creada.
  async function pzGenerarAudiosConversacion() {
    const conv = pzConvActual;
    if (!conv?.creada) return;
    const btn = document.getElementById('conv-audios');
    const pendientes = conv.mensajes.filter(m => !m.audio_url);
    if (!pendientes.length) { showToast('🔊 Los audios ya están listos.'); return; }
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>'; }
    let ok = 0;
    for (const m of conv.mensajes) {
      if (m.audio_url) continue;
      const b64 = await pzAudioAbu(m.en, m.rol);
      if (b64) { m.audio_url = `data:audio/mp3;base64,${b64}`; ok++; }
    }
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-volume-high"></i>'; }
    showToast(ok ? `🔊 ${ok} audio${ok === 1 ? '' : 's'} listo${ok === 1 ? '' : 's'}.` : '⚠️ No pude generar los audios ahora.');
  }

  // Reproduce la conversación entera de corrido (todas las líneas).
  async function pzEscucharConversacionCompleta() {
    const conv = pzConvActual;
    if (!conv) return;
    const btn = document.getElementById('conv-play-todo');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>'; }
    for (const m of conv.mensajes) {
      if (!pzConvActual || pzConvActual.id !== conv.id) break;   // el usuario cerró el modal
      await new Promise(async (resolve) => {
        let url = m.audio_url;
        if (!url && conv.creada) {
          const b64 = await pzAudioAbu(m.en, m.rol);
          if (b64) { m.audio_url = `data:audio/mp3;base64,${b64}`; url = m.audio_url; }
        }
        if (url) {
          const a = new Audio(url);
          a.onended = resolve; a.onerror = () => setTimeout(resolve, 1200);
          a.play().catch(() => setTimeout(resolve, 1200));
        } else {
          speak(m.en);
          setTimeout(resolve, Math.max(1400, m.en.length * 55));
        }
      });
      await new Promise(r => setTimeout(r, 250));
    }
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-play"></i>'; }
  }

      .select('id,fraseingles,fraseespañol,audio_url,nivel')

      .order('id', { ascending: true })

  // La columna `conversacion` guarda un JSON con los dos personajes y los
  // mensajes: { personajeA, personajeB, mensajes: [{rol:'A'|'B', en, es}] }
  function pzParsearConversacion(c) {
    try {
      const j = typeof c.conversacion === 'string' ? JSON.parse(c.conversacion) : c.conversacion;
      return {
        id: c.id, titulo: c.titulo, nivel: c.nivel_ingles,
        personajeA: j.personajeA || 'Persona A', personajeB: j.personajeB || 'Persona B',
        mensajes: Array.isArray(j.mensajes) ? j.mensajes : []
      };
    } catch (e) {
      console.warn('[pronunciación] no se pudo leer la conversación:', e);
      return { id: c.id, titulo: c.titulo, nivel: c.nivel_ingles, personajeA: 'Persona A', personajeB: 'Persona B', mensajes: [] };
    }
  }

  // Trae de la nube las calificaciones (1-5) que el usuario ya tiene en
  // cada línea de ESTA conversación, para que al reabrirla se vea lo que
  // ya practicó (en vez de mostrar "Sin practicar" de nuevo).
  async function cargarPuntajesLineasConversacion(conversacionId) {
    pzConvPuntajes = {};
    // Las conversaciones creadas con IA no están en la base: su avance
    // vive en el perfil (flujo.convCreadasPuntajes).
    if (pzConvActual?.creada) { pzConvPuntajes = { ...(pzConvCreadasPuntajes()[conversacionId] || {}) }; return; }
    const { data, error } = await dbClient.from('conversaciones_pronunciacion_lineas')
      .select('linea_indice,puntaje').eq('user_id', currentUser.id).eq('conversacion_id', conversacionId);
    if (error) { console.warn('[pronunciación] no se pudieron cargar las líneas practicadas:', error.message); return; }
    (data || []).forEach(row => { pzConvPuntajes[row.linea_indice] = row.puntaje; });
  }

  function abrirConversacion(c) {
    const conv = pzParsearConversacion(c);

    pzConvActual = conv;
    pzConvRol = null;
    pzConvPuntajes = {};
    pzConvVerTrad = false;
    pintarConversacionModal();
